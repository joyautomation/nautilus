page: website/src/content/docs/getting-started.md
title: Getting started
prefix: GS
claims:
  - id: GS-001
    claim: >-
      naut new scaffolds four templates: the tour (three tasks in three IEC
      languages and a simulated plant), minimal (one task, one program, one
      test file), sdk (a Go project) and sdk-demo (a Go project with plant
      physics in Go).
    source: "#2-scaffold-a-project"
    tests:
      - go ./cmd/naut TestScaffoldVariants
      - go ./cmd/naut TestScaffoldTourDeclaresThreeTasksInThreeLanguages
      - go ./cmd/naut TestScaffoldMinimalIsOneTaskOneProgramOneTestFile
  - id: GS-002
    claim: >-
      A freshly scaffolded project can be run, tested and shipped with the
      CLI alone: its programs compile and its acceptance tests pass.
    source: "#2-scaffold-a-project"
    tests:
      - go ./cmd/naut TestScaffoldedManifestProjectsPass
      - go ./cmd/naut TestScaffoldedManifestProjectsCheckTestAndBuild
      - go ./cmd/naut TestNautRunServesDashboardAndState
    note: >-
      naut check, naut test and naut build, through the CLI's own entry
      points, succeed on every manifest template; naut run is the built CLI
      serving the scaffolded tour.
  - id: GS-003
    claim: >-
      naut check is the CI gate: it compiles every program and cross-checks
      it against the manifest.
    source: "#1-install-the-cli"
    tests:
      - go ./cmd/naut TestCheckReportsIdentifierColumn
      - go ./cmd/naut TestCheckFailsOnUndeclaredRead
      - go ./cmd/naut TestCheckWarnsOnUndeclaredWrite
      - go ./cmd/naut TestCheckManifestAgreesWithPrograms
  - id: GS-004
    claim: >-
      naut build emits one self-contained, deployable controller binary from
      the project, with no Go toolchain anywhere.
    source: "#2-scaffold-a-project"
    tests:
      - go ./cmd/naut TestBuildEmbedRoundTrip
      - go ./cmd/naut TestBuildEmbedsHMIAndBuiltBinaryServesIt
      - go ./cmd/naut TestBuiltControllerActivatesWarm
    note: >-
      TestBuiltControllerActivatesWarm builds the naut CLI, has it naut build
      a project, and runs the emitted binary with an empty PATH (no Go
      toolchain, no git): it boots the embedded project and serves it.
  - id: GS-005
    claim: >-
      naut run starts the scan loop, dashboard and tag API on
      http://localhost:8080; GET /api/state returns the raw tag snapshot and
      the dashboard at / is served.
    source: "#2-scaffold-a-project"
    tests:
      - go ./server TestStateSnapshot
      - go ./server TestLandingPage
      - go ./cmd/naut TestProjectDefaultsToLocalhost8080
      - go ./cmd/naut TestNautRunServesDashboardAndState
  - id: GS-006
    claim: >-
      Acceptance tests run against a virtual clock, so a ten-second on-delay
      or a loop's settling time is asserted exactly and deterministically
      (the low-temp alarm waits its full 10 s).
    source: "#2-scaffold-a-project"
    tests:
      - go ./acceptance TestLowTempAlarmWaitsItsFullDelay
      - go ./acceptance TestPISettlesSetpointStep
      - go ./acceptance TestVirtualDtIsExact
      - go ./acceptance TestRunsAreReproducible
      - naut testdata/projects/heated-tank low-temp alarm waits its full 10 s
  - id: GS-007
    claim: >-
      The fixture for tests comes from nautilus.yaml, so a retuned manifest
      gain changes what the tests run against.
    source: "#4-make-it-yours"
    tests:
      - go ./acceptance TestAcceptanceFixtureComesFromTheManifest
      - go ./cmd/naut TestNautTestFixtureFollowsTheManifestGain
  - id: GS-008
    claim: >-
      In the dashboard setpoints are click-to-set (BOOLs by toggle) while
      inputs and outputs stay read-only, because the driver rewrites an
      input and the logic an output within a scan.
    source: "#2-scaffold-a-project"
    tests:
      - go ./server TestDashboardSetpointsEditableInputsAndOutputsReadOnly
  - id: GS-009
    claim: >-
      Swapping the simulated plant for real field I/O (delete the sim task,
      point driver: at the bus) leaves the control logic unchanged: it reads
      the same tags either way.
    source: "#4-make-it-yours"
    tests:
      - go ./internal/project TestControlLogicUnchangedWhenSimIsSwappedForDriverInputs
  - id: GS-010
    claim: >-
      An SDK project's go test runs the scaffolded Go tests, which scan the
      program one rt.Scan() at a time against the in-memory driver; a Go
      test can run on the same virtual clock as naut test
      (acceptance.NewClock and acceptance.NewScheduler), as the go-sdk
      example does.
    source: "#2-scaffold-a-project"
    tests:
      - go ./cmd/naut TestScaffoldedSDKProjectsGoTest
      - go ./examples/go-sdk TestPISettles
  - id: GS-011
    claim: >-
      The scaffolded CI gates on naut check, naut test and naut build; an SDK
      project's CI runs go vet, naut check (through go run), go test and go
      build instead.
    source: "#4-make-it-yours"
    tests:
      - go ./cmd/naut TestScaffoldVariants/demo manifest project
      - go ./cmd/naut TestScaffoldedManifestCIGatesOnCheckTestBuild
      - go ./cmd/naut TestScaffoldedSDKCIGatesOnGoVetCheckTestBuild
  - id: GS-012
    claim: >-
      One release build runs on macOS, Linux and Windows (amd64 and arm64)
      and on Linux ARMv7, with no runtime dependencies, and release archives ship a
      checksums.txt.
    source: "#getting-started"
    tests:
      - go ./cmd/naut TestReleaseTargetsBuildWithoutCgo
    partial: true
    note: >-
      Asserted: the release config builds ./cmd/naut for darwin, linux and
      windows on amd64 and arm64 with CGO_ENABLED=0 and names checksums.txt,
      and the CLI cross-compiles for all six targets. Not asserted: the
      binary running on macOS, Windows or arm64; CI runs naut on linux/amd64
      only.
  - id: GS-013
    claim: >-
      naut version answers once the CLI is on PATH.
    source: "#1-install-the-cli"
    tests:
      - go ./cmd/naut TestNautVersionAnswers
