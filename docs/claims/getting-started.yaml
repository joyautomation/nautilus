page: website/src/content/docs/getting-started.md
title: Getting started
prefix: GS
claims:
  - id: GS-001
    claim: >-
      naut new scaffolds a project from a template (the three-task tour,
      minimal, sdk, sdk-demo), and each variant renders without unrendered
      template syntax and includes or omits the right files.
    source: "#2-scaffold-a-project"
    tests:
      - go ./cmd/naut TestScaffoldVariants
  - id: GS-002
    claim: >-
      A scaffolded manifest project passes its own naut check and its
      acceptance tests out of the box.
    source: "#2-scaffold-a-project"
    tests:
      - go ./cmd/naut TestScaffoldedManifestProjectsPass
  - id: GS-003
    claim: >-
      naut check is the CI gate: it compiles every program and cross-checks
      it against the manifest (reading an undeclared tag fails, writing one
      warns).
    source: "#1-install-the-cli"
    tests:
      - go ./cmd/naut TestCheckFailsOnUndeclaredRead
      - go ./cmd/naut TestCheckWarnsOnUndeclaredWrite
      - go ./cmd/naut TestCheckManifestAgreesWithPrograms
  - id: GS-004
    claim: >-
      naut build emits one self-contained controller binary from the
      project, with no Go toolchain, and the project loads back from the
      embedded archive.
    source: "#2-scaffold-a-project"
    tests:
      - go ./cmd/naut TestBuildEmbedRoundTrip
      - go ./cmd/naut TestBuildEmbedsHMIAndBuiltBinaryServesIt
  - id: GS-005
    claim: >-
      naut run starts the scan loop, dashboard and tag API on
      http://localhost:8080; GET /api/state returns the raw tag snapshot and
      the dashboard at / is served.
    source: "#2-scaffold-a-project"
    tests:
      - go ./server TestStateSnapshot
      - go ./server TestLandingPage
      - go ./server TestDashboardAssetsResolve
    partial: true
    note: >-
      Server behaviour is asserted; the default :8080 bind of naut run itself is not.
  - id: GS-006
    claim: >-
      Acceptance tests run against a virtual clock, so a ten-second on-delay
      or a loop's settling time is asserted exactly and deterministically
      (the low-temp alarm waits its full 10 s).
    source: "#2-scaffold-a-project"
    tests:
      - go ./acceptance TestLowTempAlarmWaitsItsFullDelay
      - go ./acceptance TestVirtualDtIsExact
      - go ./acceptance TestRunsAreReproducible
      - naut testdata/projects/heated-tank low-temp alarm waits its full 10 s
  - id: GS-007
    claim: >-
      The fixture for tests comes from nautilus.yaml, so a retuned manifest
      gain changes what the tests run against.
    source: "#4-make-it-yours"
    tests:
      - go ./acceptance TestHeatedTankSuite
    partial: true
    note: >-
      The suite runs against the manifest; retuning a gain and watching the test follow is not asserted.
  - id: GS-008
    claim: >-
      In the dashboard setpoints are click-to-set (BOOLs by toggle) while
      inputs and outputs stay read-only, because the driver rewrites an
      input and the logic an output within a scan.
    source: "#2-scaffold-a-project"
    tests:
      - go ./server TestDashboardScriptParses
    partial: true
    note: >-
      Gap in substance: the dashboard script is only parse-checked; which
      roles are editable in the UI is not asserted.
  - id: GS-009
    claim: >-
      Swapping the simulated plant for a real driver leaves the control
      logic unchanged: it reads the same tags either way, and tests do not
      change when a tag moves from state to input.
    source: "#4-make-it-yours"
    tests:
      - go ./acceptance TestGivenAndExpectAddressFields
    partial: true
    note: >-
      Role-routed given: is covered under the testing page (TEST claims); the
      sim-to-driver swap itself is not tested end to end.
  - id: GS-010
    claim: >-
      An SDK project's go test runs the same acceptance suites on the same
      virtual clock.
    source: "#2-scaffold-a-project"
    tests:
      - go ./examples/go-sdk TestPISettles
    partial: true
    note: >-
      Verified by the SDK example; the scaffolded sdk template itself is not run.
  - id: GS-011
    claim: >-
      The scaffolded CI gates on naut check, naut test and naut build.
    source: "#4-make-it-yours"
    tests:
      - go ./cmd/naut TestScaffoldVariants/demo manifest project
    partial: true
    note: >-
      Asserts ci.yml is scaffolded; the gate commands inside are not asserted.
  - id: GS-012
    claim: >-
      One release build runs on macOS, Linux and Windows (amd64 and arm64)
      with no runtime dependencies, and release archives ship a
      checksums.txt.
    source: "#getting-started"
    tests: []
    note: >-
      Gap. A release-pipeline property; verified by the release workflow, not a Go test.
  - id: GS-013
    claim: >-
      naut version answers once the CLI is on PATH.
    source: "#1-install-the-cli"
    tests: []
    note: >-
      Gap. No test invokes `naut version`.
