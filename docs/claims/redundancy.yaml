page: website/src/content/docs/guides/redundancy.md
title: Redundancy and retained state
prefix: RED
claims:
  - id: RED-001
    claim: >-
      Retained values are applied before the first scan and win over the
      manifest's init seeds.
    source: "#retained-state"
    tests:
      - go ./runtime TestRetainedValueLoadsBeforeFirstScan
    partial: true
    note: >-
      Win-over-init is asserted. "Before the first scan" is not: the test reads
      SP after the first scan with a program that never reads SP, so a load
      that landed after the first scan's logic would pass too.

  - id: RED-002
    claim: >-
      Every `role: setpoint` tag is saved to the retain store, whatever its
      shape: a scalar, a struct, an array of scalars, an array of structs, or a
      multi-dimensional array.
    source: "#retained-state"
    tests:
      - go ./runtime TestRetainStateContents
      - go ./runtime TestRetainStatePersistsStructTag
      - go ./runtime TestRetainedArraySetpointsSurviveRestart
      - go ./runtime TestRetainedArraySetpointsSurviveFailover
      - go ./runtime TestRetainSkipsArrayOfFunctionBlocks
    note: >-
      The restart and failover tests save and reload one setpoint of every
      kind the store takes: BOOL, REAL, TIME, STRING and enumeration scalars,
      a struct, and arrays of REAL, DINT, BOOL, TIME, STRING, a struct with an
      enumerated member, and a two-dimensional INT array, through the file
      store (restart) and the ConfigMap store (failover). Each element comes
      back at its declared kind. The skip test asserts both manifest routes
      to an ARRAY OF TON setpoint are refused, then (writing the values into
      the store directly, as no project can) that an array of FB instances
      and a struct with an FB member are left out, the rest of the state
      still saves, and each is logged once across two saver ticks: defense
      in depth.

  - id: RED-003
    claim: An integer-typed setpoint tag is restored with its retained value.
    source: "#retained-state"
    tests:
      - go ./runtime TestLoadRestoresIntegerKind

  - id: RED-004
    claim: A struct-typed setpoint tag is saved and restored with its retained member values.
    source: "#retained-state"
    tests:
      - go ./runtime TestRetainStatePersistsStructTag
      - go ./runtime TestRetainedStructTagRestoresBeforeFirstScan

  - id: RED-005
    claim: >-
      The source of an online-edited program is retained and run after a
      restart, still shows as modified so naut pull sees it, and a never-edited
      program is not persisted.
    source: "#retained-state"
    tests:
      - go ./runtime TestRetainedProgramApplies
      - go ./runtime TestRetainStateContents

  - id: RED-029
    claim: >-
      A deploy wins: an online edit is reloaded only by the same build it was
      made on; a build whose program for that task differs replaces the edit
      and names it in retainDiscardedEdits, keeping the last replaced source
      per task under discardedPrograms (never applied), and a build that
      already contains the edit clears it from the store.
    source: "#retained-state"
    tests:
      - go ./runtime TestOnlineEditSurvivesARestartOfTheSameBuild
      - go ./runtime TestNewDeployReplacesARetainedOnlineEdit
      - go ./runtime TestBuildContainingTheEditClearsTheRetainedEntry
      - go ./runtime TestTakeoverAppliesOnlyASameBuildEdit

  - id: RED-006
    claim: >-
      Inputs, state and outputs are not retained, and the PID integral is not
      persisted (it warm-starts from live field values).
    source: "#retained-state"
    tests:
      - go ./runtime TestRetainStateContents
      - go ./runtime TestLoadIgnoresTagsOutsideTheRetainedSet
    partial: true
    note: >-
      A state tag is excluded from what is saved and ignored on load even if
      the store names it. Inputs, outputs and the PID warm start are not
      asserted.

  - id: RED-007
    claim: >-
      State is saved only when something changed, only by the leader, and a
      failed save is retried with the same content on the next tick; a
      standby never saves.
    source: "#retained-state"
    tests:
      - go ./runtime TestSaverWritesOnChangeAndRetriesOnFailure
      - go ./runtime TestStandbyNeverSaves
    partial: true
    note: The 2-second save interval and the 2-second worst-case loss bound are not asserted.

  - id: RED-008
    claim: Store failures surface in diagnostics as retainErrors and lastRetainError.
    source: "#retained-state"
    tests:
      - go ./runtime TestSaverWritesOnChangeAndRetriesOnFailure
    partial: true
    note: >-
      A failed save is asserted to bump retainErrors; lastRetainError after a
      store failure is not asserted, nor is a failed load. (The broken-program
      test, which does check lastRetainError, is not a store failure and was
      removed.)

  - id: RED-010
    claim: >-
      Outside a cluster, retained state is saved to the file named by
      retain.file and loads back from it.
    source: "#retained-state"
    tests:
      - go ./retain TestFileStoreSaveLoadRoundTrip
    partial: true
    note: >-
      The round trip is tested on a fileStore built directly; retain.New choosing the file store outside a cluster, and the retain.file wiring, are not exercised.

  - id: RED-011
    claim: >-
      In a cluster, retained state is saved to the named ConfigMap (created if
      absent) and loads back from it.
    source: "#retained-state"
    tests:
      - go ./retain TestConfigMapStoreSaveCreatesWhenAbsent
      - go ./retain TestConfigMapStoreSaveUpdatesWhenPresent
      - go ./retain TestConfigMapStoreRoundTrip
    partial: true
    note: >-
      Create-if-absent and the round trip are asserted on a ConfigMap store
      built directly; retain.New choosing the ConfigMap store in a cluster, and
      the retain.configmap wiring, are not exercised.

  - id: RED-012
    claim: >-
      The defaults hold: retain file retain.json outside a cluster and
      configmap named after the project with -retain suffix in a cluster; and
      redundancy lease defaults to the project name.
    source: "#retained-state"
    tests: []
    note: No test asserts the default names.

  - id: RED-013
    claim: >-
      The leader scans; a standby does nothing at all: no field I/O, no logic,
      no output writes.
    source: "#redundancy"
    tests:
      - go ./runtime TestStandbyDoesNotScan
      - go ./runtime TestTakeoverReloadsAndResetsFrames
    partial: true
    note: >-
      Asserted: a standby runs no scans (stats count 0) and no logic, and a
      leader scans. No field I/O and no output writes to a driver are not
      asserted (the test project has no drivers).

  - id: RED-014
    claim: >-
      Replicas elect exactly one leader through a Lease: the first replica
      acquires it, keeps it by renewing, and a standby takes it only once it
      expires; two replicas racing for an expired lease cannot both win.
    source: "#redundancy"
    tests:
      - go ./leader TestFreshClusterAcquire
      - go ./leader TestRenew
      - go ./leader TestFollowerThenSteal
      - go ./leader TestCASRace
    note: RED-015 (the racing case) merged here.

  - id: RED-016
    claim: >-
      Failover is bounded by the lease: a leader that cannot renew steps down
      once the lease duration elapses, not before.
    source: "#redundancy"
    tests:
      - go ./leader TestStepDown

  - id: RED-017
    claim: >-
      Failover takes at most 4 s worst case, and a standby ticks every 1 s.
    source: "#redundancy"
    tests: []
    note: Leader tests use a shortened lease duration with a synthetic clock; the 4 s bound and 1 s tick defaults are not asserted.

  - id: RED-018
    claim: >-
      A clean shutdown (SIGTERM) hands the lease over so a standby takes it on
      its next tick rather than waiting out the lease.
    source: "#redundancy"
    tests:
      - go ./leader TestRelease
    partial: true
    note: >-
      Release is asserted to drop leadership and let the follower acquire on
      its next tick; that a SIGTERM shutdown calls Release (cmd/naut defer) is
      not tested.

  - id: RED-019
    claim: >-
      On takeover the new leader re-reads the retain store (picking up
      retunes the old leader accepted) and resets program frames so
      warm-start logic runs against live values.
    source: "#redundancy"
    tests:
      - go ./runtime TestTakeoverReloadsAndResetsFrames

  - id: RED-032
    claim: >-
      Through the Modbus, OPC UA client, EtherNet/IP and OptoMMP drivers, a
      replica that takes over from standby sends every output once on its
      first scan as leader, with the program's value, changed or not: an
      output equal to what this replica sent when it last led goes out
      again, a replica that started as a standby has no start-up baseline,
      and a Modbus rewrite:
      keep-alive re-asserts nothing before that push. A replica that leads
      from its first scan keeps the drivers' baseline: `naut run` starts
      the drivers only after the elector's first decision, which Run makes
      at once rather than a tick in (a first Lease GET that fails is
      retried, not taken as standby), bounded by 5 s; a stop during that
      wait starts nothing (EtherNet/IP and OptoMMP have no baseline, so a
      plain start commands every output too). The hw drivers (SNMP,
      Redfish, Prometheus) do not do this: the first value after their gate
      opens is a baseline.
    source: "#redundancy"
    tests:
      - go ./runtime TestWriteOutputsTriggersFirstScanFailureAndTakeover
      - go ./modbus TestRegainingTheGateSendsEveryOutputAgain
      - go ./modbus TestStandbyTakeoverCommandsEveryOutput
      - go ./opcua TestRegainedGateSendsTheUnchangedValueAgain
      - go ./opcua TestStandbyFirstPushCommands
      - go ./eip TestRegainedGateSendsTheUnchangedOutputsAgain
      - go ./eip TestStandbyFirstTakeoverCommands
      - go ./optommp TestRegainedGateSendsTheUnchangedOutputsAgain
      - go ./optommp TestStandbyFirstTakeoverCommands
      - go ./modbus TestRestartAfterStandbyKeepsNoBaseline
      - go ./leader TestRunDecidesBeforeItsFirstTick
      - go ./leader TestRunRetriesAFirstTickThatMissedTheAPI
      - go ./cmd/naut TestAwaitDecisionWaitsForTheFirstDecision
      - go ./cmd/naut TestAwaitDecisionEndsOnAStop
      - go ./cmd/naut TestDriversStartAfterTheFirstDecision
    partial: true
    note: >-
      The Modbus, EtherNet/IP and OptoMMP tests run the driver under the
      runtime with a test coordinator and the same flag as its write gate,
      against the Logix emulator and the in-process groov fake for the
      latter two. The OPC UA tests call WriteOutputs directly. The hw
      drivers' baseline is not asserted here. The elector's first decision
      is asserted against a fake Lease API (acquire, standby, standalone, a
      first GET that fails), and runProject's driver start
      (startDriverWhenDecided)
      against a fake elector and driver: Start runs only after the
      decision, at once without redundancy, and not at all after a stop.
      A real cluster is not exercised. A leadership flip the drivers do not see
      (MB-046's window) is a known limit.

  - id: RED-020
    claim: On takeover the scan clock is zeroed so the first dt is one scan, not the time spent standing by.
    source: "#redundancy"
    tests: []
    note: No test asserts the first dt after a takeover.

  - id: RED-021
    claim: >-
      Outside a cluster redundancy degrades gracefully: the controller runs
      standalone and is always the leader.
    source: "#redundancy"
    tests:
      - go ./leader TestStandalone
    partial: true
    note: >-
      The standalone elector is tested; nothing shows the runtime scanning with a redundancy: section outside a cluster.

  - id: RED-022
    claim: >-
      A standby reverse-proxies API traffic to the leader, whose address rides
      inside the Lease.
    source: "#redundancy"
    tests:
      - go ./server TestStandbyProxiesToLeader
      - go ./server TestForceProxiedFromStandby
    partial: true
    note: >-
      Proxying is asserted for GET /api/state and POST /api/forces with a fake
      cluster status that hands the server the leader address; that a standby
      learns that address from the Lease is not asserted.

  - id: RED-023
    claim: >-
      Every replica serves the dashboard itself, and a standby answers
      /api/cluster with its own view rather than the leader's.
    source: "#redundancy"
    tests:
      - go ./server TestStandbyAnswersClusterAndIndexLocally
    note: >-
      TestStandbyWithNoLeaderServesLocally removed: serving locally with no
      known leader is not a promise of the page.

  - id: RED-024
    claim: >-
      GET /api/cluster reports each replica's own view: mode, leader and leader
      transitions.
    source: "#redundancy"
    tests:
      - go ./server TestClusterEndpointReportsStatus
      - go ./leader TestFreshClusterAcquire

  - id: RED-025
    claim: >-
      Identity in /api/cluster comes from POD_NAME and the proxy target from
      POD_IP.
    source: "#redundancy"
    tests: []
    note: No test sets POD_NAME or POD_IP.

  - id: RED-026
    claim: >-
      The Lease and ConfigMap are spoken to directly with only get, create and
      update verbs (no delete); a releasing leader expires its lease by writing
      an epoch renew time.
    source: "#rbac"
    tests:
      - go ./leader TestRelease
    partial: true
    note: >-
      Release makes the lease immediately takeable; neither the epoch renew
      time nor the verbs used (no delete) are asserted against a recorded
      request log.

  - id: RED-027
    claim: >-
      A different election scheme plugs in through runtime.Coordinator, which
      is the single method IsLeader.
    source: "#from-go"
    tests:
      - go ./runtime TestStandbyDoesNotScan
      - go ./runtime TestTakeoverReloadsAndResetsFrames
    note: Both tests drive the runtime with a hand-written flag Coordinator, which exercises the seam.

  - id: RED-028
    claim: >-
      A retained struct or array is restored onto the current tag: an array
      the project has since grown keeps its seeds for the new elements, and
      one it has shrunk keeps its seeds and reports the mismatch in
      lastRetainError.
    source: "#retained-state"
    tests:
      - go ./runtime TestRetainedArrayLengthChange
      - go ./runtime TestRetainedStructTagRestoresBeforeFirstScan

  - id: RED-030
    claim: >-
      Beside the setpoints, the retain store keeps every tag marked retain:
      true in the manifest or declared in a library's VAR_GLOBAL RETAIN (even
      when the manifest declares it too), and every program's VAR RETAIN
      variables (see ST-024 for function block instances). Other state is
      not carried between replicas and nothing re-seeds it at a takeover: a
      restart starts it from its seed, a failover leader keeps its own copy
      (its seed if it never led), and a plain VAR restarts from its
      declaration at every takeover. retain: true on an input or an output
      is refused. A runtime saves nothing until its own takeover has loaded
      the store.
    source: "#retained-state"
    tests:
      - go ./runtime TestVarRetainAndRetainedStateSurviveARestart
      - go ./runtime TestTakeoverKeepsUnretainedStateTags
      - go ./runtime TestRetainRefusedOnInputsAndOutputs
      - go ./internal/project TestRetainMarksTags
      - go ./internal/project TestRetainOnAnInputIsRefused
      - go ./internal/project TestGVLRetainHoldsForAManifestDeclaredGlobal
      - go ./runtime TestNoSaveBeforeTakeover
      - go ./runtime TestExplicitRetainTagsKeepsMarkedTags
    note: >-
      The restart goes through the file store, so values make the JSON round
      trip a controller's do. Black-box finding 2026-11-01-002 F-05 asked for
      this; its check assumes every state tag is kept and, by the decision
      to make retention opt-in, passes only on a project that marks the tag
      (it does, as a copy with retain: true on P1_Stats).

  - id: RED-031
    partial: true
    claim: >-
      An orderly stop (Ctrl+C, or SIGTERM from systemd or Kubernetes) saves
      the retain store once more after the last scan, so what was written
      before the stop is kept; only a hard kill can lose up to the 2-second
      save interval. A replica that is not leading, or has lost the lease,
      writes nothing on its way out.
    source: "#retained-state"
    tests:
      - go ./runtime TestRunSavesOnceMoreOnAnOrderlyStop
      - go ./runtime TestRunStandbyDoesNotSaveOnStop
      - go ./runtime TestRunLostLeaseDoesNotSaveOnStop
      - go ./runtime TestRunLogsAFailedLastSave
      - go ./tools/blackbox TestBlackbox/002-F19-retain-saved-on-orderly-stop
    note: >-
      The runtime tests stop Run well inside the first save interval. The
      black-box check (release; black-box finding 2026-11-03-002 F-19, #531)
      runs naut itself and writes a setpoint over HTTP 0.2 s before SIGTERM
      and before SIGINT, then restarts and reads it back. Not asserted: that
      the elector keeps renewing the lease until the final save and only
      then releases it (cmd/naut/runcmd.go), and the 5 s bound on the wait.
