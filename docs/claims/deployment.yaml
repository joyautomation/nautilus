page: website/src/content/docs/guides/deployment.md
title: Continuous deployment
prefix: DEP
claims:
  - id: DEP-001
    claim: >-
      naut new with the Kubernetes deploy feature (--deploy) scaffolds a
      Dockerfile, deploy/k8s.yaml and a deploy workflow, all rendered
      without leftover template syntax, and none of them without the
      feature.
    source: "#continuous-deployment"
    tests:
      - go ./cmd/naut TestScaffoldVariants/demo with deploy
      - go ./cmd/naut TestScaffoldVariants/demo manifest project
      - go ./cmd/naut TestDeployWorkflowRenders
    partial: true
    note: >-
      The no-feature cases assert Dockerfile and deploy/k8s.yaml are absent
      but never that .github/workflows/deploy.yml is absent.
  - id: DEP-002
    claim: >-
      The scaffolded deploy workflow runs check, test and build, builds the
      binary with naut build, and pushes an image to GHCR using the repo's
      own GITHUB_TOKEN.
    source: "#continuous-deployment"
    tests:
      - go ./cmd/naut TestDeployWorkflowRenders
    partial: true
    note: >-
      Asserts the workflow text contains naut build, naut test, ghcr.io and
      the repository variable; the naut check step and the GITHUB_TOKEN
      login are not asserted, and the workflow is never run.
  - id: DEP-003
    claim: >-
      Every merge that passes its acceptance suites becomes an image tagged
      with its sha, and a PR that fails its suites cannot merge.
    source: "#continuous-deployment"
    tests: []
    note: >-
      Gap. A CI-pipeline property of the scaffolded workflows; nothing in the test suite executes it.
  - id: DEP-004
    claim: >-
      naut build emits a self-contained controller: runtime plus project in
      one binary.
    source: "#the-image"
    tests:
      - go ./cmd/naut TestBuildEmbedRoundTrip
      - go ./cmd/naut TestBuildEmbedsHMIAndBuiltBinaryServesIt
    partial: true
    note: >-
      Asserts the output is the runner's bytes plus the project archive, that
      the startup reader finds it, and that project.Load over that archive
      builds a runtime. The runner is a fake byte string, so a real built
      binary starting and scanning its embedded project is never executed.
  - id: DEP-005
    claim: >-
      The Dockerfile is distroless/static with no shell, so the binary must
      be static; release CLIs are static builds and the workflow sets
      CGO_ENABLED=0.
    source: "#the-image"
    tests: []
    note: >-
      Gap. The Dockerfile content is only checked for unrendered template syntax.
  - id: DEP-006
    claim: >-
      A deploy scaffold adds the retain: {} and redundancy: {} sections to
      the manifest, which the two-replica Deployment depends on.
    source: "#the-cluster"
    tests:
      - go ./cmd/naut TestDeployWorkflowRenders
  - id: DEP-007
    claim: >-
      A Lease elects the scanning leader, and when the leader dies the
      standby acquires the lease on its next 1 s tick, 4 s at worst.
    source: "#the-cluster"
    tests:
      - go ./leader TestFreshClusterAcquire
      - go ./leader TestRenew
      - go ./leader TestFollowerThenSteal
      - go ./leader TestCASRace
      - go ./leader TestStepDown
      - go ./leader TestRelease
    partial: true
    note: >-
      Exercised against a fake Kubernetes API; the real lease and the 4 s worst-case takeover bound are not tested.
  - id: DEP-008
    claim: >-
      Setpoints and online edits ride a ConfigMap across restarts and
      failovers.
    source: "#the-cluster"
    tests:
      - go ./retain TestConfigMapStoreRoundTrip
      - go ./retain TestConfigMapStoreSaveUpdatesWhenPresent
      - go ./runtime TestRetainedProgramApplies
      - go ./runtime TestTakeoverReloadsAndResetsFrames
    partial: true
    note: >-
      Against a fake API server; a real cluster failover is not exercised.
  - id: DEP-009
    claim: >-
      Either replica answers the Service: a standby proxies API traffic to
      the leader.
    source: "#the-cluster"
    tests:
      - go ./server TestStandbyProxiesToLeader
      - go ./server TestLeaderNeverProxies
  - id: DEP-010
    claim: >-
      The scaffolded RBAC grants exactly the verbs the lease and ConfigMap
      need and not delete.
    source: "#the-cluster"
    tests: []
    note: >-
      Gap. The k8s manifest's RBAC rules are not asserted by any test.
  - id: DEP-011
    claim: >-
      The deployed binary embeds the project's git history and serves
      GET /api/program/history with no git, .git directory or network.
    source: "#the-artifact-carries-its-own-provenance"
    tests:
      - go ./cmd/naut TestBuildEmbedsHistory
    partial: true
    note: >-
      Asserts the history rides the built archive and decodes back; serving
      it over GET /api/program/history from the built binary, and the
      no-git runtime environment, are not exercised here (see PH-004).
  - id: DEP-012
    claim: >-
      naut build -runtime <naut> builds the controller on another naut
      binary, byte for byte, names the platform it targets on the build
      line, and refuses a file that is not an executable (a release
      archive included) without writing an output.
    source: "#the-image"
    tests:
      - go ./cmd/naut TestBuildOnAnotherRuntime
      - go ./cmd/naut TestBuildRuntimeRefusesNonExecutables
    partial: true
    note: >-
      The runtime in the test is a hand-made ELF header, not a real arm64
      naut, and the built controller is not run on an ARM64 machine here.
  - id: DEP-013
    claim: >-
      Under a Type=notify systemd unit the controller sends READY=1 after
      its first completed scan, a WATCHDOG=1 heartbeat at half of
      WatchdogSec while its scans are live, none once a scan hangs (with a
      "scans not live" status line), and STOPPING=1 on an orderly stop.
    source: "#without-a-cluster-systemd"
    tests:
      - go ./cmd/naut TestNautRunSystemdNotify
      - go ./cmd/naut TestLiveWatch
    partial: true
    note: >-
      Against a stand-in notification socket, not systemd. systemd killing
      and restarting the process on the missing heartbeat was observed by
      hand under a user unit (2026-11-17), not in a test. The standby case
      of READY=1 is not tested.
  - id: DEP-014
    claim: >-
      naut deploy asks the box its architecture, builds on naut's own
      release for it (downloaded, checked against checksums.txt, cached)
      or on -runtime, uploads the controller and unit, runs the box's
      install or update on a release named <project>-<git describe>-<sha256:8>,
      and exits with the box's status (3 when the update rolled back).
    source: "#to-a-box-over-ssh"
    tests:
      - go ./cmd/naut TestDeployUpdateBuildsForTheBox
      - go ./cmd/naut TestDeployUpdateExitStatusIsTheBoxs
      - go ./cmd/naut TestDeployRefusesARuntimeThatFailsItsChecksum
      - go ./cmd/naut TestDeployDevBuildNeedsARuntimeForAnotherArch
      - go ./cmd/naut TestReleaseID
      - go ./cmd/naut TestDeployBoxDoesNotMatchItself
    partial: true
    note: >-
      The tests use a stand-in ssh and release server. The box's half
      (links, rollback on a failed or hung start, retained values kept,
      backup and restore, the no-op redeploy) is proven by
      tools/deploy/check.sh, run by hand against an Ubuntu 24.04 systemd
      container as a sudo user, 2026-11-17, under Type=simple and
      Type=notify; not yet on ARM64 hardware. The CD workflow has not run
      in GitHub Actions.
