page: website/src/content/docs/guides/deployment.md
title: Continuous deployment
prefix: DEP
claims:
  - id: DEP-001
    claim: >-
      naut new with the Kubernetes deploy feature (--deploy) scaffolds a
      Dockerfile, deploy/k8s.yaml and a deploy workflow, all rendered
      without leftover template syntax, and none of them without the
      feature.
    source: "#continuous-deployment"
    tests:
      - go ./cmd/naut TestScaffoldVariants/demo with deploy
      - go ./cmd/naut TestScaffoldVariants/demo manifest project
      - go ./cmd/naut TestDeployWorkflowRenders
    partial: true
    note: >-
      The no-feature cases assert Dockerfile and deploy/k8s.yaml are absent
      but never that .github/workflows/deploy.yml is absent.
  - id: DEP-002
    claim: >-
      The scaffolded deploy workflow runs check, test and build, builds the
      binary with naut build, and pushes an image to GHCR using the repo's
      own GITHUB_TOKEN.
    source: "#continuous-deployment"
    tests:
      - go ./cmd/naut TestDeployWorkflowRenders
    partial: true
    note: >-
      Asserts the workflow text contains naut build, naut test, ghcr.io and
      the repository variable; the naut check step and the GITHUB_TOKEN
      login are not asserted, and the workflow is never run.
  - id: DEP-003
    claim: >-
      Every merge that passes its acceptance suites becomes an image tagged
      with its sha, and a PR that fails its suites cannot merge.
    source: "#continuous-deployment"
    tests: []
    note: >-
      Gap. A CI-pipeline property of the scaffolded workflows; nothing in the test suite executes it.
  - id: DEP-004
    claim: >-
      naut build emits a self-contained controller: runtime plus project in
      one binary.
    source: "#the-image"
    tests:
      - go ./cmd/naut TestBuildEmbedRoundTrip
      - go ./cmd/naut TestBuildEmbedsHMIAndBuiltBinaryServesIt
    partial: true
    note: >-
      Asserts the output is the runner's bytes plus the project archive, that
      the startup reader finds it, and that project.Load over that archive
      builds a runtime. The runner is a fake byte string, so a real built
      binary starting and scanning its embedded project is never executed.
  - id: DEP-005
    claim: >-
      The Dockerfile is distroless/static with no shell, so the binary must
      be static; release CLIs are static builds and the workflow sets
      CGO_ENABLED=0.
    source: "#the-image"
    tests: []
    note: >-
      Gap. The Dockerfile content is only checked for unrendered template syntax.
  - id: DEP-006
    claim: >-
      A deploy scaffold adds the retain: {} and redundancy: {} sections to
      the manifest, which the two-replica Deployment depends on.
    source: "#the-cluster"
    tests:
      - go ./cmd/naut TestDeployWorkflowRenders
  - id: DEP-007
    claim: >-
      A Lease elects the scanning leader, and when the leader dies the
      standby acquires the lease on its next 1 s tick, 4 s at worst.
    source: "#the-cluster"
    tests:
      - go ./leader TestFreshClusterAcquire
      - go ./leader TestRenew
      - go ./leader TestFollowerThenSteal
      - go ./leader TestCASRace
      - go ./leader TestStepDown
      - go ./leader TestRelease
    partial: true
    note: >-
      Exercised against a fake Kubernetes API; the real lease and the 4 s worst-case takeover bound are not tested.
  - id: DEP-008
    claim: >-
      Setpoints and online edits ride a ConfigMap across restarts and
      failovers.
    source: "#the-cluster"
    tests:
      - go ./retain TestConfigMapStoreRoundTrip
      - go ./retain TestConfigMapStoreSaveUpdatesWhenPresent
      - go ./runtime TestRetainedProgramApplies
      - go ./runtime TestTakeoverReloadsAndResetsFrames
    partial: true
    note: >-
      Against a fake API server; a real cluster failover is not exercised.
  - id: DEP-009
    claim: >-
      Either replica answers the Service: a standby proxies API traffic to
      the leader.
    source: "#the-cluster"
    tests:
      - go ./server TestStandbyProxiesToLeader
      - go ./server TestLeaderNeverProxies
  - id: DEP-010
    claim: >-
      The scaffolded RBAC grants exactly the verbs the lease and ConfigMap
      need and not delete.
    source: "#the-cluster"
    tests: []
    note: >-
      Gap. The k8s manifest's RBAC rules are not asserted by any test.
  - id: DEP-011
    claim: >-
      The deployed binary embeds the project's git history and serves
      GET /api/program/history with no git, .git directory or network.
    source: "#the-artifact-carries-its-own-provenance"
    tests:
      - go ./cmd/naut TestBuildEmbedsHistory
    partial: true
    note: >-
      Asserts the history rides the built archive and decodes back; serving
      it over GET /api/program/history from the built binary, and the
      no-git runtime environment, are not exercised here (see PH-004).
  - id: DEP-012
    claim: >-
      naut build -runtime <naut> builds the controller on another naut
      binary, byte for byte, names the platform it targets on the build
      line, and refuses a file that is not an executable (a release
      archive included) without writing an output.
    source: "#the-image"
    tests:
      - go ./cmd/naut TestBuildOnAnotherRuntime
      - go ./cmd/naut TestBuildRuntimeRefusesNonExecutables
    partial: true
    note: >-
      The runtime in the test is a hand-made ELF header, not a real arm64
      naut, and the built controller is not run on an ARM64 machine here.
  - id: DEP-013
    claim: >-
      Under a Type=notify systemd unit the controller sends READY=1 after
      its first completed scan, a WATCHDOG=1 heartbeat at half of
      WatchdogSec while its scans are live, none once a scan hangs or a task
      is starved past its slot (with a "scans not live" status line), and
      STOPPING=1 on an orderly stop.
    source: "#without-a-cluster-systemd"
    tests:
      - go ./cmd/naut TestNautRunSystemdNotify
      - go ./cmd/naut TestLiveWatch
      - go ./cmd/naut TestSystemdHeartbeatStopsForAStarvedTask
    partial: true
    note: >-
      Against a stand-in notification socket, not systemd. systemd killing
      and restarting the process on the missing heartbeat was observed by
      hand under a user unit (2026-11-17), not in a test. The standby case
      of READY=1 is not tested.
  - id: DEP-014
    claim: >-
      naut deploy asks the box its architecture, builds on naut's own
      release for it (downloaded, checked against checksums.txt, cached)
      or on -runtime, uploads the controller and unit, runs the box's
      install or update on a release named <project>-<git describe>-<sha256:8>,
      and exits with the box's status (3 when the update rolled back).
    source: "#to-a-box-over-ssh"
    tests:
      - go ./cmd/naut TestDeployUpdateBuildsForTheBox
      - go ./cmd/naut TestDeployUpdateExitStatusIsTheBoxs
      - go ./cmd/naut TestDeployRefusesARuntimeThatFailsItsChecksum
      - go ./cmd/naut TestDeployDevBuildNeedsARuntimeForAnotherArch
      - go ./cmd/naut TestReleaseID
      - go ./cmd/naut TestDeployBoxDoesNotMatchItself
      - go ./cmd/naut TestDeployRootMatchesBox
      - go ./cmd/naut TestDeployRefusesReservedIDs
      - go ./cmd/naut TestDeployRefusesUnquotableArgs
      - go ./cmd/naut TestDeployFetchesItsOwnReleaseForTheBox
      - go ./cmd/naut TestDeployBoxFailedInstallLeavesNothing
      - go ./cmd/naut TestDeployBoxFailedUpdateRestoresRetain
      - go ./cmd/naut TestDeployBoxRedeployWhileDown
    partial: true
    note: >-
      The Go tests use a stand-in ssh and release server, and run box.sh
      itself against a stand-in systemctl (Type=simple-like). The box's half
      (links, rollback on a failed or hung start with the retained values
      put back, a failed install leaving nothing installed, backup and
      restore, the redeploy that is a no-op while running and starts the
      controller while down) is proven by
      tools/deploy/check.sh, run by hand against an Ubuntu 24.04 systemd
      container as a sudo user, 2026-11-17, under Type=simple and
      Type=notify; and on a Toradex Verdin AM62 (ARM64) running Torizon
      OS 7.8.0, 2026-11-17, under Type=notify with an ARM64 runtime built
      on amd64. The CD workflow has not run in GitHub Actions.
  - id: DEP-015
    claim: >-
      naut deploy install -supervisor cron -root <dir> runs as the SSH user
      with no sudo, starts the controller from a keepalive in that user's
      crontab (at boot and every minute), and the box remembers the mode
      for later commands. Under it, update, an update that does not start
      (rolled back, exit 3), rollback, status and uninstall work, the
      keepalive restarts a dead controller but not while a deploy holds it,
      and uninstall leaves the root and naut-launch.
    source: "#without-systemd-or-root-cron"
    tests:
      - go ./cmd/naut TestDeployCronInstallRunsAsTheUser
      - go ./cmd/naut TestDeployCronModeIsDiscovered
      - go ./cmd/naut TestDeploySupervisorFlags
      - go ./cmd/naut TestDeployBoxCronMode
      - go ./cmd/naut TestDeploySSHAuth
      - go ./cmd/naut TestDeployAskpassReachesSSH
      - go ./cmd/naut TestDeployAskpassBitwarden
    partial: true
    note: >-
      TestDeployBoxCronMode runs box.sh's cron mode on the test machine
      with a stand-in crontab and controller. On a PLCnext AXC F 2152
      (sysvinit, admin with an allowlisted sudo), 2026-11-17, by hand:
      install, update, an update to a release that exits (rolled back,
      exit 3), rollback, backup, restore, a retained setpoint kept across
      restore and update, a controller killed with SIGKILL restarted by
      cron 25 s later, and uninstall -purge leaving the root, naut-launch
      and the user's other crontab lines; every start went through
      naut-launch at SCHED_FIFO 40 pinned to CPU 0, on a v0.21.0 armv7
      runtime. The controller's sshd refuses keys for admin (its home is
      group writable), so the same steps ran again signed in with the
      password through NAUT_SSH_ASKPASS=tools/deploy/askpass-bw.sh from a
      Bitwarden item, and with neither askpass nor a terminal naut deploy
      failed in under a second rather than waiting at a prompt.
  - id: DEP-016
    claim: >-
      With the release helper installed (naut deploy helper), naut deploy
      runs the box's side as sudo -n <helper> <command> and uploads through
      it, sends no unit, and refuses a helper of another version. The
      helper pins its settings, refuses any command or name it does not
      know, installs only its root-owned unit template, and does not run
      the uploaded controller for status. In every mode, box.sh reads and
      writes /var/lib/nautilus without following a link or reading a file
      that is not the controller's own, and restore reads the backup's
      members as data.
    source: "#with-sudo-for-one-command-only-the-release-helper"
    tests:
      - go ./cmd/naut TestHelperScriptIsBoxShWithAPinningPrologue
      - go ./cmd/naut TestDeployHelperRefusesWhatItIsNotFor
      - go ./cmd/naut TestDeployHelperInstallsWithItsOwnUnitAndNeverRunsTheController
      - go ./cmd/naut TestDeployUsesTheHelper
      - go ./cmd/naut TestDeployBoxNeverFollowsLinksInState
      - go ./cmd/naut TestDeployBoxFailedUpdateRestoresThroughNoLink
      - go ./cmd/naut TestDeployBoxRestoreTakesTheArchiveAsData
      - go ./cmd/naut TestDeployBoxReadsOnlyTheControllersOwnFiles
    partial: true
    note: >-
      box.sh runs under a stand-in systemctl as the test user, which is
      enough to see a link followed or a file outside read or written; the
      helper has not yet run as root on a real box through a sudoers
      drop-in (the groov EPIC, #771, is first).
  - id: DEP-017
    claim: >-
      naut new --deploy-ssh writes .github/workflows/deploy-ssh.yml on a
      manifest project: on a v* tag whose commit is on the default branch,
      in the plant environment, with a read-only token, a pinned checkout
      that keeps no credentials and one deploy at a time, it installs the
      pinned naut release (the scaffolding naut's version) into the
      runner's temp directory, checked against checksums.txt, runs naut
      check and naut test, and runs naut deploy update on the repository
      variable DEPLOY_TARGET, accepting only the given key and host key,
      both removed after; an unpinned naut, an empty DEPLOY_TARGET or a
      tag off the default branch fails the job, and so does an update the
      box rolled back.
    source: "#through-cd"
    tests:
      - go ./cmd/naut TestDeploySSHWorkflowRenders
      - go ./cmd/naut TestNewDeploySSHFlag
      - go ./cmd/naut TestDeploySSHPinsTheScaffoldingNaut
      - go ./cmd/naut TestDeploySSHInstallStep
      - go ./cmd/naut TestDeploySSHDeployStep
      - go ./cmd/naut TestDeploySSHTagMustBeOnTheDefaultBranch
    partial: true
    note: >-
      The install and deploy steps' shell is run by the tests, against a
      stand-in release server and a stand-in naut; the workflow itself has
      not run in GitHub Actions, and the steps skip where curl,
      sha256sum or bash are missing. Each guarantee was mutation-checked:
      removing it turns its test red.
  - id: DEP-018
    claim: >-
      A controller installed with naut deploy listens on server.addr, which a
      scaffold sets to loopback, so another machine cannot reach it until
      server.addr or NAUTILUS_ADDR names a reachable address; it then
      answers by IP address, and by a name only when that name is in
      NAUTILUS_ALLOWED_HOSTS or the request carries the token (else 403
      naming both settings); the unit reads NAUTILUS_ADDR, NAUTILUS_TOKEN and
      the other settings from /etc/nautilus/env, which the install does not
      create and update and rollback do not touch.
    source: "#letting-operators-open-the-screen"
    tests:
      - go ./server TestGuardHostRefusesEveryRouteOnARebindableHost
      - go ./server TestNewReadsAllowedHostsFromTheEnvironment
    partial: true
    note: >-
      The 403 and the allow-list are tested; the install and update on a
      real box (loopback by default, the env file absent after install and
      untouched by update) were observed by the independent tester (run
      2026-11-19-020, check 020-F02-docs-deploy-env-and-reach, manual) and
      are not yet a gate.
