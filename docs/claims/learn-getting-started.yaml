page: website/src/content/docs/learn/getting-started/install.md
title: "Learn: install the CLI and the editor"
prefix: LGS
claims:
  - id: LGS-001
    claim: >-
      naut version answers once the CLI is on PATH.
    source: "#check-it-works"
    tests:
      - go ./cmd/naut TestNautVersionAnswers
  - id: LGS-002
    claim: >-
      The macOS and Linux install commands download the release archive to a
      file with curl -f before extracting it, and name the archive the way
      the release names it.
    source: "#install-the-cli"
    tests:
      - go ./cmd/naut TestInstallDocsDownloadBeforeExtracting
    partial: true
    note: >-
      Asserted: neither README.md nor this page pipes curl into tar or into a
      reader that stops early (grep -m1, head), every archive download uses
      curl -fsSL -o, and the archive name matches the goreleaser template.
      Not asserted: the commands run against a real release; that was checked
      by hand against v0.19.0 on linux/amd64. (Moved here from GS-013 and
      GS-015 of getting-started.yaml when the install commands moved.)
