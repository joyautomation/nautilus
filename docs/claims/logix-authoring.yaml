page: website/src/content/docs/guides/logix-authoring.md
title: Authoring for Logix (experimental)
prefix: LGA
claims:
  - id: LGA-001
    claim: >-
      The manifest tags a program names become controller-scope Logix tags
      carrying their initial values and descriptions; a tag no program names
      is not written.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/writer TestManifestInitsAndDescriptionsLandOnControllerTags
      - go ./logix/writer TestImplicitTagsBecomeControllerTags

  - id: LGA-002
    claim: >-
      `VAR_EXTERNAL` is optional: a ladder or ST program that names a
      manifest tag it did not declare still gets its controller tag, typed
      from the manifest, and a declared one is not written twice.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/writer TestImplicitTagsBecomeControllerTags
      - go ./logix/writer TestImplicitTagsInST
      - go ./logix/writer TestImplicitTagsLadderMembersAndLiterals
      - go ./logix/writer TestDeclarationCaseFindsTheManifestEntry

  - id: LGA-003
    claim: >-
      The task becomes a periodic Logix task at the task's scan rate, the
      program a Logix program and its rungs the `MainRoutine`.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/writer TestTaskSchedulesTheProgram
      - go ./logix/writer TestDemoLineMatchesTheRealExport
    partial: true
    note: The `program`, `routine` and `task` rename keys and the program `VAR` becoming program tags are not asserted.

  - id: LGA-004
    claim: >-
      `side.heartbeat` adds a second Logix program, `Nautilus`, scheduled
      after the user's, that counts task scans in the named DINT and never
      touches the user's routine.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/writer TestSideCodeHeartbeat

  - id: LGA-005
    claim: >-
      The Logix target takes one task running one ladder or structured text
      program; a multi-task project and FBD or SFC programs are refused.
    source: "#what-the-target-accepts"
    tests:
      - go ./cmd/naut TestCheckTargetLogixRefusesOtherLanguages
    partial: true
    note: FBD is refused (tested); SFC and the multi-task refusal in loadLogixProject have no test.

  - id: LGA-006
    claim: >-
      Contacts `X` `/X`, branches (nesting kept) and coils `( X )`
      `( S X )` `( R X )` are written as `XIC` `XIO`, `[ , ]` and `OTE`
      `OTL` `OTU`, and the export reads back to the same rungs.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestNeutralTextSpelling
      - go ./logix/writer TestSubsetRoundTrips
      - go ./logix/writer TestDemoLineRoundTrips
      - go ./logix/writer TestRoundTripCatchesABrokenRung

  - id: LGA-007
    claim: >-
      Edge contacts and edge coils (`+X`, `-X`, `( P X )`, `( N X )`) are
      written as `ONS` and `OSF` with generated storage bits whose names are
      a pure function of rung and reference, so regenerating is never drift.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestEdgeCoils
      - go ./logix/writer TestEdgeAtBranchLegHead
      - go ./logix/writer TestWriteIsDeterministic

  - id: LGA-008
    claim: >-
      Compares become the Logix compare instructions (an expression operand
      becomes `CMP`), and `{ y := expr }` becomes `MOVE`, `ADD`, `SUB`,
      `MUL`, `DIV`, `MOD`, `NEG`, `ABS`, `SQR`, `XPY` or `CPT` according to
      its shape.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestAssignmentsAndExpressionCompares

  - id: LGA-009
    claim: >-
      `TON`, `TOF` and `CTU` blocks are written as the Logix instructions on
      `TIMER` / `COUNTER` tags, with the preset landing in the tag, `t.Q`
      written as `t.DN` and `t.ET` as `t.ACC`.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestNeutralTextSpelling
      - go ./logix/writer TestTimerPresetLandsInTheTag
      - go ./logix/writer TestCounterEndsItsRung
      - go ./logix/writer TestOutputCapturesAndResetConditions

  - id: LGA-010
    claim: >-
      `Word.3` passes through as bit 3 of the word, as Logix spells it, in
      contacts, coils, assignment targets and UDT members.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestBitAccessPassesThrough

  - id: LGA-011
    claim: >-
      An array of timers or counters becomes one Logix tag with dimensions,
      each element preset from the rung that runs it.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestArraysOfBlocks

  - id: LGA-012
    claim: >-
      TIME becomes a DINT of milliseconds where it feeds a preset, and the
      elementary types BOOL, SINT, INT, DINT, REAL, LREAL map to the same
      Logix types.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestTimerPresetLandsInTheTag
      - go ./logix/writer TestParseTime
    partial: true
    note: Type-by-type mapping of the elementary types has no dedicated test; TIME outside a preset is covered by the rejection claim.

  - id: LGA-013
    claim: STRUCT types in a library become UDTs, nested types first and members in order.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestUserDefinedTypes

  - id: LGA-014
    claim: >-
      Enumerations become `DINT` tags, and an initial value or a member the
      program names is the member's integer value.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestEnumerationsAreDINT

  - id: LGA-015
    claim: >-
      A user FUNCTION_BLOCK (ladder or ST) becomes an Add-On Instruction,
      with the inputs as parameters, outputs read from the instance and the
      call as the instruction.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestAddOnInstructionFromLadderBlock
      - go ./logix/writer TestAddOnInstructionPowerAndST
      - go ./logix/writer TestAOIOutputReadAsMember
      - go ./logix/importer TestAOIConformanceImportsAndWritesBack

  - id: LGA-016
    claim: >-
      An ST program is written as a Logix ST routine with its statements
      close to as written, TIME as milliseconds and booleans as 1 and 0.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestStructuredText
      - go ./logix/writer TestWriteRoutineForST

  - id: LGA-017
    claim: >-
      What the target cannot express is a `naut check` diagnostic that names
      the construct, carries a stable `logix/<rule>` ID and a line, and
      stops the writer from emitting any document.
    source: "#rejected-at-check-time-by-name"
    tests:
      - go ./logix/writer TestRejections
      - go ./logix/writer TestStructuredTextRejections
      - go ./logix/writer TestUserDefinedTypeRejections
    partial: true
    note: Most rules have a case. `logix/name` is only tested for length and consecutive underscores (not trailing), and the AOI-with-array `logix/type` case is not tested.

  - id: LGA-018
    claim: >-
      A project with a `target: logix` section gets the Logix rules from
      `naut check` without asking, and `naut check --target logix` applies
      them to any project, in located gcc-style lines; without the target
      the same file checks clean.
    source: "#rejected-at-check-time-by-name"
    tests:
      - go ./cmd/naut TestCheckRunsTheManifestTarget
      - go ./cmd/naut TestCheckTargetLogix
      - go ./cmd/naut TestCheckTargetLogixRefusesOtherLanguages

  - id: LGA-019
    claim: >-
      `dialect: logix` adds a `TONR` block to every program in the project,
      with `Reset` clearing it while TRUE, and a free-running pulse spelled
      `t:TONR(PT := T#1S, Reset := t.Q)`; the default dialect adds nothing.
    source: "#vendor-idioms-dialect-logix"
    tests:
      - go ./internal/dialect TestLogixLibraryParsesAndIsDeclarationsOnly
    partial: true
    note: Only that the library parses and declares. No test runs a TONR on the nautilus runtime to check the Reset semantics.

  - id: LGA-020
    claim: >-
      The writer emits a `TONR` as a `TON` with a `RES(t)` rung ahead of the
      timer's rung, in ladder and in ST.
    source: "#vendor-idioms-dialect-logix"
    tests:
      - go ./logix/writer TestTONR

  - id: LGA-021
    claim: >-
      A tag's `alias:` is written as a Logix alias tag (`AliasFor`) and the
      program names the tag, so one source runs in simulation and on
      hardware.
    source: "#io-tag-aliases"
    tests:
      - go ./logix/writer TestAliasTags
    partial: true
    note: The writer half is tested; that the nautilus runtime ignores the binding has no test.

  - id: LGA-022
    claim: >-
      `naut logix import --project` writes a nautilus project from a full
      export: the manifest with `target: logix` filled from the controller,
      tags with descriptions, UDTs as IEC types, every ladder routine as a
      PROGRAM and every AOI as a FUNCTION_BLOCK in `lib/`; the project
      checks clean for the Logix target.
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./cmd/naut TestLogixImportProject
      - go ./logix/importer TestDemoLineImportsAndWritesBack
      - go ./logix/importer TestUDTConformanceImportsAndWritesBack
      - go ./logix/importer TestAOIConformanceImportsAndWritesBack
      - go ./logix/importer TestDialectAndAliasImport

  - id: LGA-023
    claim: >-
      A rung with no nautilus form is kept as a comment and reported, never
      guessed at, and the partial program still parses and writes.
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./logix/importer TestRefusalsKeepTheProgramValid
      - go ./logix/importer TestVarietyReportsWhatItCannotCarry

  - id: LGA-024
    claim: >-
      Alias tags and rack points the logic names directly become tags with
      `alias:`, and a `RES` on a timer run by `TON` imports as `dialect:
      logix` `TONR`.
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./logix/importer TestDialectAndAliasImport

  - id: LGA-025
    claim: >-
      Imported programs write back to identical or equivalent rung text
      (the writer's whole v1 subset, DemoLine, implicit-ST programs).
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./logix/importer TestSubsetGoldenImportsAndWritesBack
      - go ./logix/importer TestDemoLineImportsAndWritesBack
      - go ./logix/importer TestImplicitSTGoldenImportsAndWritesBack
      - go ./logix/importer TestHumanIdiomsImport
      - go ./logix/importer TestBranchOutputsAndHoistedBlocks
      - go ./logix/importer TestDataInstructionsImportAndWriteBack

  - id: LGA-026
    claim: >-
      On a corpus of 52 real production exports, 97.2% of rungs import and
      most complete routines write back identically or equivalently.
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./logix/importer TestCorpus
    partial: true
    note: The corpus is private (NAUTILUS_L5X_CORPUS), so the test skips in CI; the figure is not independently checkable.

  - id: LGA-027
    claim: >-
      `naut logix deploy` with no flag writes the project, has logixd import
      and build it, and says whether the running controller could take the
      change as an online edit or needs a download.
    source: "#the-loop"
    tests:
      - go ./logix/deploy TestBuildOnlyReportsWhatTheControllerNeeds
      - go ./logix/deploy TestEmptyControllerNeedsADownload
      - go ./logix/deploy TestDeployBuildsAnAOIProjectInTwoSteps
    partial: true
    note: Run against a fake agent; no controller behind it in CI.

  - id: LGA-028
    claim: >-
      `naut logix deploy --online` replaces the routine's rungs in the
      running program and finalizes them, leaving the controller's mode, and
      is refused when the tag set changed because an online edit cannot
      create tags.
    source: "#the-loop"
    tests:
      - go ./logix/deploy TestOnlineEditReplacesTheRungsAndVerifies
      - go ./logix/deploy TestOnlineEditRefusesATagChange
      - go ./logix/deploy TestSessionEditsWithoutReopening
      - go ./logix/deploy TestSessionRefusesATagChange
    partial: true
    note: Run against a fake agent; real warm edits are verified on hardware only.

  - id: LGA-029
    claim: >-
      `naut logix deploy --download` refuses without `--yes`, and the
      controller must already be in Program mode or `--program-mode` passed;
      a download does not also import rungs.
    source: "#the-loop"
    tests:
      - go ./cmd/naut TestLogixDeployRefusals
      - go ./logix/deploy TestDownloadVerifies
    partial: true
    note: The "controller must be in Program mode" refusal is not asserted separately; real downloads are verified on hardware only.

  - id: LGA-030
    claim: >-
      Every deploy path ends by uploading the controller's program again and
      comparing its logic with what was sent.
    source: "#the-loop"
    tests:
      - go ./logix/deploy TestOnlineEditReplacesTheRungsAndVerifies
      - go ./logix/deploy TestDownloadVerifies
    partial: true
    note: Verified against a fake agent that returns the sent logic.

  - id: LGA-031
    claim: >-
      A project whose program has Logix-subset diagnostics is refused by
      `naut logix deploy` before the agent is called; a project with no
      `target: logix` section, or `--online` without a comm path, is refused.
    source: "#the-loop"
    tests:
      - go ./logix/deploy TestSubsetDiagnosticsStopEverything
      - go ./cmd/naut TestLogixDeployNeedsATargetSection
      - go ./cmd/naut TestLogixDeployRefusals

  - id: LGA-032
    claim: >-
      `naut logix mode` reads the mode, and changing it requires `--yes`, a
      known mode name and a comm path (or a project directory that has one).
    source: "#the-loop"
    tests:
      - go ./cmd/naut TestLogixModeRefusesAChangeWithoutConfirmation
      - go ./cmd/naut TestLogixModeTakesTheProjectDirectory
    partial: true
    note: Only the refusals are tested; reading the mode is not.

  - id: LGA-033
    claim: >-
      `naut logix write program.ld` writes an L5X without a project, and a
      program the target refuses produces no file.
    source: "#the-loop"
    tests:
      - go ./cmd/naut TestLogixWrite

  - id: LGA-034
    claim: >-
      `naut test --target logix` runs the project's acceptance tests against
      the controller over EtherNet/IP: `given` writes go to the controller,
      `until`, `hold` and `always` are checked on every poll, and `scans: n`
      waits on exactly n counts of the heartbeat.
    source: "#the-loop"
    tests:
      - go ./acceptance TestLiveSealInAndAlarm
      - go ./acceptance TestLiveUntilHoldAndAlways
      - go ./acceptance TestLiveScansWaitOnTheHeartbeat
      - go ./acceptance TestLiveReseedsInputsPerTest
    partial: true
    note: Run against a stand-in controller (mechanics only); no test drives a real or emulated Logix controller through `naut test --target logix`.

  - id: LGA-035
    claim: >-
      The logixd agent URL comes from `target.logix.agent` and
      `NAUTILUS_LOGIXD_URL` overrides it; the token comes only from
      `NAUTILUS_LOGIXD_TOKEN`.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/logixd TestClientDefaultsFromEnvironment
    partial: true
    note: The client's env defaults are tested; the manifest `agent:` precedence is not.

  - id: LGA-036
    claim: >-
      Anything outside the subset is refused, not approximated: the writer
      returns no document alongside a diagnostic.
    source: "#what-it-does-not-do-yet"
    tests:
      - go ./logix/writer TestRejections
      - go ./logix/writer TestStructuredTextRejections

  - id: LGA-037
    claim: >-
      A download resets tag values to the project's values; an online edit
      keeps them.
    source: "#what-it-does-not-do-yet"
    tests: []
    note: Controller behaviour; verified on hardware only and no env-gated test asserts it.
