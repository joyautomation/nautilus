page: website/src/content/docs/languages/structured-text.mdx
title: Structured Text
prefix: ST
claims:
  - id: ST-001
    claim: >-
      Statements evaluate top to bottom, so a value assigned on one line is
      what the next line reads in the same scan.
    source: "#a-program-top-to-bottom"
    tests:
      - go ./lang/st TestLowerUDTFieldAccess
      - go ./lang/st TestVarTempResetsEveryScan
    note: >-
      Both run one scan whose later lines read values assigned on earlier
      lines (sum := pt.x + pt.y after the field writes; Out := n after
      n := n + 1), so a reordering would change the asserted result. The
      earlier refs (TestLowerRealArithmetic, ir TestIfElse, ir TestForSum)
      were single-statement or IR-level and asserted nothing of ordering.

  - id: ST-002
    claim: >-
      Program-local VAR keeps its value from scan to scan.
    source: "#a-program-top-to-bottom"
    tests:
      - go ./lang/st TestVarTempResetsEveryScan
      - go ./lang/conformance TestConformance/st-var-temp
    note: >-
      TestVarTempResetsEveryScan's plain VAR kept counts to 5 over 5 scans.
      Dropped: ir TestRetainedAccumulator (hand-built IR, not an ST VAR) and
      TestLowerRetainedAccumulator (declares VAR RETAIN, so it passes even if
      plain VAR stopped persisting).

  - id: ST-003
    claim: >-
      In a manifest project every tag in nautilus.yaml is in scope in every
      program without a VAR_EXTERNAL declaration, typed by its type: (or its
      init:).
    source: "#a-program-top-to-bottom"
    tests:
      - go ./internal/project TestManifestTagsAreImplicit
      - go ./lang/st TestLowerImplicitGlobals
      - go ./internal/project TestInitTypesAnImplicitTag

  - id: ST-004
    claim: >-
      A VAR_EXTERNAL that names a manifest tag must agree with the tag's
      type:. For a tag typed only by its init:, the declaration sets the
      type and the init: must be a value of it (init: TRUE against a REAL
      declaration is an error).
    source: "#a-program-top-to-bottom"
    tests:
      - go ./internal/project TestExplicitDeclarationMustAgreeWithTypedTag
      - go ./internal/project TestDeclarationTypesAnInitOnlyTag
      - go ./lang/st TestTagTypesAndUntypedTags

  - id: ST-005
    claim: >-
      Naming a tag binds it in the tag store rather than creating it, and
      reading a tag nothing has ever written faults the scan with "undefined
      tag".
    source: "#a-program-top-to-bottom"
    tests:
      - go ./runtime TestScanReadOfUnwrittenTagFaults
    note: >-
      A program reading a declared but never-written tag faults with
      "undefined tag Level", and runs once the tag is written. The page's
      aside that a communications driver's input is seeded (so it has been
      written, by the seed) is tag-model TAG-046.

  - id: ST-006
    claim: >-
      A FUNCTION_BLOCK sees no tag it does not declare in its own
      VAR_EXTERNAL.
    source: "#a-program-top-to-bottom"
    tests:
      - go ./internal/project TestFunctionBlocksDoNotSeeTagsImplicitly
      - go ./lang/st TestTagTypesAndUntypedTags

  - id: ST-007
    claim: >-
      The declaration sections VAR, VAR_INPUT, VAR_OUTPUT, VAR_IN_OUT,
      VAR_TEMP, VAR_GLOBAL and VAR_EXTERNAL parse, each closed by END_VAR,
      with RETAIN or CONSTANT allowed after the section keyword.
    source: "#declarations"
    tests:
      - go ./lang/st TestParseVarBlockKinds
      - go ./lang/st TestParseVarRetainConstant
      - go ./lang/st TestExternalStructFieldAssignment
    note: >-
      TestExternalStructFieldAssignment supplies VAR_EXTERNAL and VAR_GLOBAL,
      which the two parser tests do not include.

  - id: ST-008
    claim: >-
      VAR_GLOBAL and VAR_EXTERNAL resolve identically: both name a tag in the
      store.
    source: "#declarations"
    tests:
      - go ./lang/st TestLowerGlobalVar
      - go ./lang/st TestVarGlobalAndVarExternalResolveIdentically

  - id: ST-009
    claim: >-
      A declared initial value (Gain : REAL := 2.0;) is where the variable
      starts, in a PROGRAM, in every FUNCTION_BLOCK instance, and on every
      FUNCTION call.
    source: "#declarations"
    tests:
      - go ./lang/st TestConstantInBoundsAndInitialValues
      - go ./lang/st TestUserFB_InitialValues
      - go ./lang/st TestUserFunc_InitialValues
      - go ./lang/st TestUserFB_UnboundInputKeepsInitial
    note: >-
      TestConstantInBoundsAndInitialValues asserts a PROGRAM VAR's initial
      value (start : INT := N + 1) in its result.

  - id: ST-010
    claim: >-
      An initial value (:=) on a VAR_GLOBAL or VAR_EXTERNAL is a compile
      error; the tag's init: in the manifest sets it instead.
    source: "#declarations"
    tests:
      - go ./lang/st TestExternalInitialValueRejected
      - go ./lang/st TestGlobalConstantRules
      - go ./internal/project TestManifestTagsAreImplicit
    note: >-
      TestGlobalConstantRules carries the VAR_GLOBAL case; TestManifestTagsAreImplicit
      shows init: seeding the tag a program reads.

  - id: ST-011
    claim: >-
      VAR_TEMP starts every scan of a program, and every call of a function
      block or function, at its initial value (or zero), never at what the
      last execution left.
    source: "#declarations"
    tests:
      - go ./lang/conformance TestConformance/st-var-temp
      - go ./lang/st TestVarTempResetsEveryScan
      - go ./lang/st TestVarTempResetsEveryFBCall
      - go ./lang/st TestVarTempInFunction

  - id: ST-012
    claim: >-
      VAR CONSTANT is a named value folded at compile time; assigning one is a
      compile error.
    source: "#declarations"
    tests:
      - go ./lang/st TestConstantCannotBeWritten
      - go ./lang/st TestConstantInBoundsAndInitialValues

  - id: ST-013
    claim: >-
      VAR_GLOBAL CONSTANT in a library file declares project constants every
      POU sees; a constant is not a tag.
    source: "#declarations"
    tests:
      - go ./lang/st TestGlobalConstantsVisibleEverywhere
      - go ./lang/st TestGlobalConstantsLibraryAlone
      - go ./lang/conformance TestConformance/st-global-constants
    note: >-
      TestGlobalConstantCannotBeWritten was dropped: the page does not say a
      VAR_GLOBAL CONSTANT cannot be written.

  - id: ST-014
    claim: >-
      A standalone VAR_GLOBAL block at the top of a library file (a Codesys
      gvl.st) declares globals for every program; one the manifest does not
      declare becomes a state tag starting at the zero of its type.
    source: "#declarations"
    tests:
      - go ./lang/st TestFileScopeVarGlobalAheadOfProgram
      - go ./internal/project TestGVLComposesIntoEveryProgram
      - go ./internal/project TestGVLUndeclaredGlobalBecomesAStateTag

  - id: ST-015
    claim: >-
      The elementary types BOOL, SINT..LINT/USINT..ULINT/BYTE..LWORD, REAL,
      LREAL, TIME, LTIME, STRING, WSTRING, CHAR and WCHAR are accepted.
    source: "#declarations"
    tests:
      - go ./lang/st TestKeywordAndTypeNames
      - go ./lang/st TestResolveTypeName
      - go ./lang/st TestWideAndCharTypesAreAcceptedAsString

  - id: ST-016
    claim: >-
      All integer kinds share one 64-bit representation, so a declared width
      documents intent without narrowing (INT does not wrap at 16 bits, DINT
      not at 32).
    source: "#declarations"
    tests:
      - go ./lang/conformance TestConformance/st-int-width
      - go ./lang/conformance TestConformance/st-bitwise/bits above 32 survive - the width is 64 bits

  - id: ST-017
    claim: TIME counts milliseconds.
    source: "#declarations"
    tests:
      - go ./lang/conformance TestConformance/fn-conversions/TIME is milliseconds in both directions
      - go ./lang/conformance TestConformance/st-conversions-matrix/TIME is milliseconds, and wraps like any integer when narrowed
      - go ./lang/ir TestParseDuration

  - id: ST-018
    claim: >-
      ARRAY[lo..hi] OF T takes several comma-separated dimensions and any
      element type, including a UDT or a function block.
    source: "#declarations"
    tests:
      - go ./lang/st TestLowerArrayOneBasedIndexing
      - go ./lang/st TestLowerArrayArbitraryLowerBound
      - go ./lang/st TestLowerMultiDimArray
      - go ./lang/st TestParseMultiDimArray
      - go ./lang/st TestLowerNestedAggregateAssign
      - go ./lang/st TestFBInstanceArray

  - id: ST-019
    claim: >-
      Array bounds are integer constants: a literal, a named constant, or
      arithmetic on them (ARRAY[1..N_TANKS]).
    source: "#declarations"
    tests:
      - go ./lang/st TestConstantInBoundsAndInitialValues
      - go ./lang/conformance TestConformance/st-global-constants/an INT constant from a constant expression sizes an array and bounds a loop
      - go ./lang/st TestArrayBoundArithmeticInTheBound

  - id: ST-020
    claim: >-
      TYPE ... END_TYPE declares a STRUCT, an alias for another type, or an
      enumeration; enumeration members are used as Mode#Run or plain Run and
      shown by name in live values.
    source: "#declarations"
    tests:
      - go ./lang/st TestParseStructTypeDecl
      - go ./lang/st TestEnumBasics
      - go ./lang/st TestEnumAmbiguousMemberResolvedByContext
      - go ./lang/conformance TestConformance/st-enum
      - go ./runtime TestEnumTagsRenderByName
      - go ./lang/st TestTypeAliasOfAnotherType

  - id: ST-021
    claim: >-
      A struct-typed VAR_EXTERNAL tag is written one field at a time
      (P101.Running := TRUE) or whole, and each field write reaches the tag
      store as a member write.
    source: "#declarations"
    tests:
      - go ./lang/st TestExternalStructFieldAssignment
      - go ./lang/st TestVarInOutExternalStructField
      - go ./runtime TestStructTagWrittenFieldwiseAndWhole
    note: >-
      Asserted by behaviour: a field write changes that member and leaves every
      other member as it was, including one an operator set between scans, and
      a whole write copies every member. The VM does a field write as a
      read-modify-write of the whole tag within the one statement, not as a
      store-level member call.

  - id: ST-022
    claim: >-
      Literals cover decimals and exponents (1.5e3), based integers (16#FF,
      2#1010, 8#777), typed forms (INT#42, BOOL#TRUE, STRING#'hi') and
      durations (T#5s, T#500ms, T#1h30m).
    source: "#declarations"
    tests:
      - go ./lang/st TestParseBasedNumbers
      - go ./lang/st TestParseTypedLiterals
      - go ./lang/st TestParseTimeLiterals
      - go ./lang/st TestLowerBasedLiteral
      - go ./lang/ir TestParseDuration
      - go ./lang/st TestExponentLiteral

  - id: ST-023
    claim: Block comments (* ... *) nest, and // comments to end of line.
    source: "#declarations"
    tests:
      - go ./lang/st TestBlockComment_NestedTwoLevels
      - go ./lang/st TestBlockComment_NestedThreeLevels
      - go ./lang/st TestLineComment_StillWorks

  - id: ST-024
    claim: >-
      RETAIN parses and changes nothing at runtime: every program VAR and
      function block instance already keeps its value scan to scan.
    source: "#declarations"
    tests:
      - go ./lang/st TestParseVarRetainConstant
      - go ./lang/st TestRetainChangesNothingAtRuntime

  - id: ST-025
    claim: >-
      A warm swap carries program VAR and FB instance state across an online
      edit by name and type.
    source: "#declarations"
    tests:
      - go ./runtime TestSwapWarmCarriesRetainedState
      - go ./runtime TestSwapWarmTypeChangeResets
    note: >-
      Program VARs, a TON and a CTU, and a user FUNCTION_BLOCK instance's
      internal Sum carry across the swap (TestSwapWarmCarriesRetainedState); a
      type change resets (TestSwapWarmTypeChangeResets).

  - id: ST-026
    claim: >-
      IF/ELSIF/ELSE, CASE, FOR ... BY, WHILE, REPEAT ... UNTIL, EXIT, CONTINUE
      and RETURN execute with their standard meaning.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestLowerIfElsif
      - go ./lang/st TestLowerCaseRanges
      - go ./lang/st TestLowerForLoopSum
      - go ./lang/st TestLowerWhileWithExit
      - go ./lang/st TestLowerContinueSkipsEven
      - go ./lang/st TestLowerRepeatUntil
      - go ./lang/ir TestReturnEarly
      - go ./lang/st TestForByStepAndReturnFromST

  - id: ST-027
    claim: >-
      A CASE label is a constant (literal, named constant or enumeration
      member), a comma list, or an inclusive lo..hi range; a value outside
      every label falls to ELSE.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestLowerCaseMultipleValues
      - go ./lang/st TestLowerCaseRanges
      - go ./lang/st TestCaseConstantLabelForms
      - go ./lang/st TestCaseNamedConstantLabels
      - go ./lang/conformance TestConformance/st-case-constants
      - go ./lang/conformance TestConformance/st-enum/CASE labels and comparisons on members, qualified and not

  - id: ST-028
    claim: >-
      Two CASE labels with the same value are a compile error.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestCaseDuplicateLabelValues
      - go ./lang/conformance TestCaseDuplicateConstantLabelDiagnosed

  - id: ST-029
    claim: >-
      Assignment is :=, equality is =, and inequality is <>.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestLowerScalarAssign
      - go ./lang/st TestLowerIfElsif
      - go ./lang/st TestEqualityAndInequalityOperators

  - id: ST-030
    claim: >-
      REGION name ... END_REGION only groups statements (for folding and the
      Outline); it opens no scope.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestRegionIsANoOpGrouping
      - go ./lang/st TestRegionInFBAndCase
      - go ./lang/conformance TestConformance/st-region
      - go ./lang/st TestRegionOpensNoScope
    note: >-
      TestRegionOpensNoScope reads and writes an outer variable inside a
      region and sees the value after END_REGION, and the region's name is not
      a variable. TestRegionErrors (REGION syntax errors) is not a promise of
      the page.

  - id: ST-031
    claim: >-
      Operator precedence, tightest first: unary NOT and -; * / MOD; + -;
      the comparisons; AND; XOR; OR.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestOperatorPrecedence

  - id: ST-032
    claim: An INT widens to REAL where one is expected.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestLowerIntToRealPromotion
      - go ./lang/st TestIntWidensToRealParameter

  - id: ST-033
    claim: >-
      The other direction (REAL into an INT target) is a compile error;
      narrowing goes through a conversion.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestConversionCompileErrors
      - go ./lang/st TestRealIntoIntAssignmentIsACompileError

  - id: ST-034
    claim: >-
      REAL_TO_DINT (or TO_DINT) rounds to nearest with ties to even (2.5
      becomes 2, 3.5 becomes 4); TRUNC_DINT truncates toward zero.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/conformance TestConformance/st-conversions-matrix/REAL to integer rounds half to even; TRUNC goes toward zero

  - id: ST-035
    claim: >-
      Every IEC <A>_TO_<B> conversion between BOOL, the integer kinds, REAL,
      LREAL, TIME, LTIME and STRING exists; there are no WSTRING_TO_,
      CHAR_TO_ or WCHAR_TO_ functions.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/ir TestConversionMatrixShape
      - go ./lang/st TestConversionMatrixThroughST
      - go ./lang/conformance TestConformance/st-conversions-matrix
      - go ./lang/st TestNoWideOrCharConversionFunctions

  - id: ST-036
    claim: >-
      Integer narrowing wraps to the target width (DINT_TO_INT(70000) is
      4464).
    source: "#statements-and-expressions"
    tests:
      - go ./lang/conformance TestConformance/st-conversions-matrix/integer narrowing wraps at the target width (DINT to INT, UINT, BYTE)
      - go ./lang/ir TestConversionSemantics

  - id: ST-037
    claim: >-
      A REAL or a STRING with no value in the target type faults the scan.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/conformance TestConversionRangeFaults
      - go ./lang/conformance TestStringParseFaults
      - go ./lang/ir TestConversionFaults

  - id: ST-038
    claim: >-
      A function block instance is declared like a variable (dwell : TON;)
      and invoked as its own statement with named arguments; => copies an
      output into a target at the call site and dwell.Q reads one anywhere.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestFBTONReachesQAfterPT
      - go ./lang/st TestUserFB_OutputBinding

  - id: ST-039
    claim: >-
      Struct fields and array elements use .field and [i] on either side of an
      assignment.
    source: "#statements-and-expressions"
    tests:
      - go ./lang/st TestLowerUDTFieldAccess
      - go ./lang/st TestLowerNestedAggregateAssign
      - go ./lang/st TestParseArrayIndexAssignmentTarget

  - id: ST-040
    claim: An array index outside the declared bounds faults the scan.
    source: "#statements-and-expressions"
    tests:
      - go ./runtime TestScanArrayIndexOutOfBoundsFaults
    note: >-
      One past the end and a negative index both fault the scan with "out of
      bounds"; the last valid index runs.

  - id: ST-041
    claim: >-
      FUNCTION is stateless and returns one value assigned to the function's
      own name; FUNCTION_BLOCK is stateful and each instance owns its slots.
    source: "#functions-and-function-blocks"
    tests:
      - go ./lang/st TestUserFunc_DeclareAndCall
      - go ./lang/st TestUserFunc_NoState
      - go ./lang/st TestUserFB_DeclareAndCall
      - go ./lang/st TestUserFB_RetainsState
      - go ./lang/st TestUserFBInstancesOwnTheirSlots

  - id: ST-042
    claim: >-
      FUNCTION_BLOCK pins may be any type, a user TYPE included.
    source: "#functions-and-function-blocks"
    tests:
      - go ./lang/st TestFBStructPins
      - go ./lang/st TestFBStructPinFromLibraryFile
      - go ./lang/st TestEnumInStructsPinsArrays
      - go ./lang/st TestFBArrayAndAliasPins

  - id: ST-043
    claim: >-
      A VAR_IN_OUT pin is a reference: the caller binds a variable with :=
      and the block's writes land in that variable when the call returns.
    source: "#functions-and-function-blocks"
    tests:
      - go ./lang/st TestVarInOutScalar
      - go ./lang/st TestVarInOutStructLocal
      - go ./lang/st TestUserFB_VarConstant_InOutWriteBack

  - id: ST-044
    claim: >-
      A VAR_EXTERNAL UDT bound to a VAR_IN_OUT pin round-trips through the tag
      store as one whole-struct write.
    source: "#functions-and-function-blocks"
    tests:
      - go ./runtime TestVarInOutStructTagRoundTrip
      - go ./lang/st TestVarInOutExternalStructTag
      - go ./lang/st TestVarInOutExternalStructWritesBackAsOneWholeStruct

  - id: ST-045
    claim: >-
      Every VAR_IN_OUT must be bound at every call, to an assignable of
      exactly the pin's type.
    source: "#functions-and-function-blocks"
    tests:
      - go ./lang/st TestVarInOutMustBeBound
      - go ./lang/st TestVarInOutTypeMustMatch
      - go ./lang/st TestVarInOutRejectsNonLValue

  - id: ST-046
    claim: >-
      A .st file with no PROGRAM keyword is a library of TYPE, FUNCTION and
      FUNCTION_BLOCK declarations in scope for every program in the directory;
      blocks may also be written in .ld/.fbd libraries, composed after the ST
      libraries.
    source: "#functions-and-function-blocks"
    tests:
      - go ./runtime TestLibrariesUserFBFromFBD
      - go ./lang/st TestFBStructPinFromLibraryFile
      - go ./lang/ld TestLadderFunctionBlockFromST
      - go ./lang/st TestGlobalConstantsLibraryAlone
      - go ./internal/stproject TestLibrariesComposeSTFirstThenGraphical

  - id: ST-047
    claim: >-
      naut check prints gcc-style file:line:col: message diagnostics and
      exits non-zero when it finds any.
    source: "#tooling"
    tests:
      - go ./cmd/naut TestCheckReportsIdentifierColumn
      - go ./lang/st TestParseErrorPos
      - go ./lang/st TestLowerErrorPinsOffendingName

  - id: ST-048
    claim: >-
      Downloading a program warm-swaps it into a running controller with
      state carried across, and a failed compile leaves the running program
      untouched.
    source: "#tooling"
    tests:
      - go ./runtime TestSwapWarmCarriesRetainedState
      - go ./runtime TestSwapWarmCompileErrorLeavesRunning
      - go ./server TestProgramOnlineEditFlow
      - go ./server TestProgramDownloadCarriesStateAndFailedDownloadChangesNothing

  - id: ST-049
    claim: >-
      A program in a *_test.yaml runs on a virtual clock and tests assert on
      tags over virtual time.
    source: "#tooling"
    tests:
      - go ./lang/conformance TestConformance/fb-ton/Q false at PT-1ms, true at PT, ET clamps at PT
      - go ./acceptance TestVirtualDtIsExact
    note: >-
      TestRunsAreReproducible was dropped: run-to-run determinism is not
      what the page promises here.

  - id: ST-050
    claim: Pointers and references (REF_TO, dereference) are not supported.
    source: "#not-supported"
    tests:
      - go ./cmd/naut TestCheckRejects/REF_TO
      - go ./cmd/naut TestCheckRejectsDereference/read
      - go ./cmd/naut TestCheckRejectsDereference/write

  - id: ST-051
    claim: >-
      VAR_ACCESS, CONFIGURATION, RESOURCE and TASK declarations are not
      supported; tasks come from nautilus.yaml or Go composition.
    source: "#not-supported"
    tests:
      - go ./cmd/naut TestCheckRejects/VAR_ACCESS
      - go ./cmd/naut TestCheckRejects/CONFIGURATION
      - go ./cmd/naut TestCheckRejects/RESOURCE
      - go ./cmd/naut TestCheckRejects/TASK

  - id: ST-052
    claim: >-
      Subrange types are not supported; TYPE declares only a STRUCT, an
      enumeration, or an alias.
    source: "#not-supported"
    tests:
      - go ./cmd/naut TestCheckRejects/subrange

  - id: ST-053
    claim: >-
      DATE, TOD, TIME_OF_DAY, DT and DATE_AND_TIME are rejected as unknown
      scalar types, and their literals do not evaluate.
    source: "#not-supported"
    tests:
      - go ./cmd/naut TestCheckRejects/DATE
      - go ./cmd/naut TestCheckRejects/TOD
      - go ./cmd/naut TestCheckRejects/TIME_OF_DAY
      - go ./cmd/naut TestCheckRejects/DT
      - go ./cmd/naut TestCheckRejects/DATE_AND_TIME
      - go ./cmd/naut TestCheckRejects/DATE literal
      - go ./cmd/naut TestCheckRejects/D literal
      - go ./cmd/naut TestCheckRejects/D literal date
      - go ./cmd/naut TestCheckRejects/DT literal
      - go ./cmd/naut TestCheckRejects/DATE_AND_TIME literal
      - go ./cmd/naut TestCheckRejects/TOD literal
      - go ./cmd/naut TestCheckRejects/TIME_OF_DAY literal
    note: >-
      All five type names are refused as unknown scalar types, and the D#,
      DATE#, TOD#, TIME_OF_DAY#, DT# and DATE_AND_TIME# literals are refused
      with a diagnostic naming the construct (#307).

  - id: ST-054
    claim: Exponentiation with ** is not supported; EXPT(base, exp) is used instead.
    source: "#not-supported"
    tests:
      - go ./lang/conformance TestConformance/fn-trig-log
      - go ./cmd/naut TestCheckRejects/**
    note: >-
      EXPT is run by fn-trig-log; `2.0 ** 3.0` in ST is refused by naut check.

  - id: ST-055
    claim: Length-qualified strings (STRING[80]) are a parse error.
    source: "#not-supported"
    tests:
      - go ./cmd/naut TestCheckRejects/STRING[80]

  - id: ST-056
    claim: >-
      Aggregate initializers (:= [1, 2, 3]) in a declaration are a parse
      error.
    source: "#not-supported"
    tests:
      - go ./cmd/naut TestCheckRejects/array initializer

  - id: ST-057
    claim: >-
      SCL's # local prefix is rejected with a message saying to drop the #.
    source: "#not-supported"
    tests:
      - go ./lang/st TestHashPrefixRejectedEverywhere
      - go ./lang/conformance TestHashPrefixDiagnosed
