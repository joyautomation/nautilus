page: website/src/content/docs/guides/plcnext.md
title: Phoenix Contact PLCnext
prefix: PLX
claims:
  - id: PLX-001
    claim: >-
      The driver reads only the image bytes its bindings reach, one element
      name per byte (`Port[i]`), in one multi-item read per scan, and
      flushes the output span as one write.
    source: "#how-the-io-reaches-nautilus"
    tests:
      - go ./plcnext TestDriverAgainstFakeFirmware
    partial: true
    note: Against a fake of the firmware's data-access service; the firmware behaviour it models was measured on 2023.0.
  - id: PLX-002
    claim: >-
      The driver brings the bus up through BusConductor with rising edges
      on CONFIG_REQ and START_IO_REQ, and leaves a bus that is already
      configured and running alone (no request edge on reconnect).
    source: "#how-the-io-reaches-nautilus"
    tests:
      - go ./plcnext TestDriverAgainstFakeFirmware
      - go ./plcnext TestHandshakeIsIdempotent
  - id: PLX-003
    claim: >-
      A manifest that omits socket, inputs, outputs, run-port and
      byte-order gets the defaults (the local socket, the PND_S1 mirrors,
      the AXIO RUN bit, big-endian); `run-port: none` disables the RUN
      check.
    source: "#run-nautilus"
    tests:
      - go ./plcnext TestManifestParsesWithDefaults
  - id: PLX-004
    claim: >-
      Bit and integer formats decode from and encode into the image at
      the manifest's byte offsets.
    source: "#write-the-manifest"
    tests:
      - go ./plcnext TestCodec
  - id: PLX-005
    claim: >-
      The bus RUN bit is the image's quality: when it drops, every input
      is bad on a live connection.
    source: "#what-it-does-not-do-yet"
    tests:
      - go ./plcnext TestDriverAgainstFakeFirmware
  - id: PLX-006
    claim: >-
      Without BusConductor, or with a port the firmware does not answer
      for, the driver reports the problem instead of running on a
      half-bound image.
    source: "#how-the-io-reaches-nautilus"
    tests:
      - go ./plcnext TestDriverWithoutBusConductorAndMissingPort
  - id: PLX-007
    claim: >-
      On the bench controller the plcnext-bench project ran at about 9 %
      of one core and 23 MB resident, with about 11 ms per scan's image
      exchange over the local socket.
    source: "#run-nautilus"
    tests: []
    note: >-
      A bench measurement (2026-10-24), written up in
      docs/design/open-controllers.md §3. No automated test yet; the
      bench nightly is planned to record it per run.
  # PLX-020…024 sit here, in page order (Write the manifest); numbered
  # past the end so a claim appended elsewhere in the meantime keeps its id.
  - id: PLX-020
    claim: >-
      `ch:N` binds channel N of the module whose first byte is the offset,
      byte by byte (channel 01 is bit 0 of that byte, channel 09 bit 0 of
      the next); on a 16-channel module it binds the same bits as
      `bit:((N+7) mod 16)`, and the bench manifest in either spelling reads
      and writes the same bytes.
    source: "#write-the-manifest"
    tests:
      - go ./plcnext TestChannelSpellingBindsTheSameBits
      - go ./plcnext TestChannelSpellingSameOnTheWire
    partial: true
    note: >-
      Against the fake data-access service. The bit:N spelling of the same
      layout was checked with eyes on the bench (2026-10-27); the ch:N
      spelling has not been run on the controller.
  - id: PLX-021
    claim: >-
      `ch:01` is accepted as channel 1; `ch:0` and non-numbers are refused;
      with a module list, a `ch:N` that runs past its module is refused,
      while `bit:N` is checked exactly as before.
    source: "#write-the-manifest"
    tests:
      - go ./plcnext TestChannelFormatParseAndErrors
  - id: PLX-022
    claim: >-
      `naut plcnext import` lays the device list out in bus order with
      every module's frame length in both images, binds every channel of
      the types it knows (digital as `ch:N`, analog inputs as int16), and
      for the bench unit's four devices produces the hand-corrected
      manifest's modules and bindings.
    source: "#from-the-device-list"
    tests:
      - go ./plcnext TestImportBenchEqualsHandManifest
      - go ./cmd/naut TestPlcnextImportCLI
    partial: true
    note: >-
      The generated layout equals the one checked with eyes on the bench
      (2026-10-27); the import itself has not been run on the controller.
  - id: PLX-023
    claim: >-
      A device type the import does not know is laid out from its
      `length` in bits with a commented example binding; without a length,
      or with one that is not whole bytes, the import refuses, naming the
      slot; types are read as hexadecimal; and it will not replace a
      manifest or tag file that holds something else without `--force`.
    source: "#from-the-device-list"
    tests:
      - go ./plcnext TestImportUnknownDevicesAndMistakes
      - go ./cmd/naut TestPlcnextImportCLI
  - id: PLX-024
    claim: >-
      `--check-bus` reads BusConductor's CONFIGURED and NUM_MODULES and
      writes nothing; an unconfigured bus is an error, and a count that
      differs from the list is refused.
    source: "#from-the-device-list"
    tests:
      - go ./plcnext TestBusModulesReadsTheCountWithoutTouchingTheBus
    partial: true
    note: Against the fake data-access service; not run on the controller.
  - id: PLX-008
    claim: >-
      `transport` defaults to grpc and `output-watchdog` to 1s; `transport:
      shm` with `output-watchdog: "0"` holds the last outputs, and an
      unknown transport or an unparseable watchdog is refused.
    source: "#faster-the-in-process-tier"
    tests:
      - go ./plcnext TestManifestTransport
  - id: PLX-009
    claim: >-
      The Go driver and the C shim agree on the exchange page's layout:
      every offset and flag in the shim's header is checked against the
      driver's, in both directions.
    source: "#faster-the-in-process-tier"
    tests:
      - go ./plcnext TestShmLayoutMatchesTheShimsHeader
  - id: PLX-010
    claim: >-
      On transport shm the handshake goes over gRPC and the image through
      the page: inputs in, outputs out to the frame, quality from the
      shim's RUN bit, Stale when the shim stops cycling, a new handshake
      when the shim restarts, and the output frame driven to zero once
      the driver stops refreshing it.
    source: "#faster-the-in-process-tier"
    tests:
      - go ./plcnext TestDriverOverShm
    partial: true
    note: >-
      Against a Go fake of the shim that follows its header; the C shim's
      own watchdog and restart were tried by hand on the bench
      (2026-10-24, rt/plcnext-io/README.md Status).
  - id: PLX-011
    claim: >-
      With no BusConductor to nudge, transport shm needs no gRPC; with no
      page, the session fails saying so and the inputs stay not connected.
    source: "#faster-the-in-process-tier"
    tests:
      - go ./plcnext TestShmWithoutBusConductorNeverDials
      - go ./plcnext TestShmMissingPage
  - id: PLX-012
    claim: >-
      On the bench controller, transport shm took 0.03–0.05 ms per scan for
      the image against ~11 ms on grpc, and naut 4 % of one core against
      9 % at a 50 ms scan.
    source: "#faster-the-in-process-tier"
    tests: []
    note: >-
      A bench measurement (2026-10-24), in rt/plcnext-io/README.md Status.
      No automated test; the bench nightly (docs/design/bench-testing.md)
      is planned to record it per run.
  - id: PLX-013
    claim: >-
      Pinned to CPU 1, the shim was late (over 200 µs) in 0.13 % of cycles
      quiet, 0.20 % beside two busy loops and 33 % under a stream into the
      Ethernet best-effort; at SCHED_FIFO 80 none quiet or beside the busy
      loops, and 3.2 % under the stream, none by more than 1 ms.
    source: "#real-time-priority"
    tests: []
    note: >-
      `naut plcnext bench` runs (2026-10-25, 3-minute windows, naut at a
      50 ms scan on CPU 0, its task at FIFO 40), recorded in the
      controller's bench.jsonl and in rt/plcnext-io/README.md. No automated
      test until a bench nightly records them.
  - id: PLX-014
    claim: >-
      With the keepalive crontab, naut starts at boot and is restarted
      within a minute of a crash; after a reboot naut, the shim at FIFO 80
      and the heartbeat came back with no hand on them.
    source: "#start-on-boot"
    tests: []
    note: >-
      Tried on the bench (2026-10-24 kill, 2026-10-25 reboot),
      examples/plcnext-bench/README.md. No automated test.
  - id: PLX-015
    claim: >-
      A binding with `status: online`, `outages` or `watchdog-trips` is an
      input with no bytes of the image behind it, delivered from the first
      scan with good quality; online is true while the inputs are good, and
      outages counts the times it went false (a stalled shim, a restart).
    source: "#holding-outputs-until-an-operator-acknowledges"
    tests:
      - go ./plcnext TestManifestStatusBindings
      - go ./plcnext TestShmStatusForTheProgram
      - go ./plcnext TestShmRestartAfterAFaultIsATrip
    partial: true
    note: >-
      Against the in-process fake shim (transport shm). A lost gRPC
      connection or a stopped bus goes through the same online flag but has
      no test of its own. Not yet run on the bench unit.
  - id: PLX-016
    claim: >-
      watchdog-trips counts the times the output frame went to zero without
      the driver choosing it: naut stalled for longer than output-watchdog
      between two writes, the shim's watchdog bit rose, or the shim
      restarted, once each. A naut restarted after its predecessor's
      outputs went stale starts at 1; a first start on a fresh page counts
      nothing.
    source: "#holding-outputs-until-an-operator-acknowledges"
    tests:
      - go ./plcnext TestShmStatusForTheProgram
      - go ./plcnext TestShmRestartAfterAFaultIsATrip
    partial: true
    note: >-
      Against the in-process fake shim, which applies the C shim's
      watchdog rule. The keepalive restart on the controller has not been
      run with the counter, and the count staying 0 on transport grpc is
      not asserted.
  - id: PLX-017
    claim: >-
      A program can seal in a hold on any change of __Outages or
      __WatchdogTrips and release it on an operator acknowledge once
      __Online is true again, including a hold from the first scan after a
      restart that found a trip.
    source: "#holding-outputs-until-an-operator-acknowledges"
    tests:
      - naut examples/plcnext-bench an outage holds the outputs until it is acknowledged
      - naut examples/plcnext-bench a restart after a watchdog trip starts held
    partial: true
    note: >-
      The example's program in virtual time, with the status tags given by
      the test rather than delivered by the driver. The driver side is
      PLX-015 and PLX-016.
