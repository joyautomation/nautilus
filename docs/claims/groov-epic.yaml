page: website/src/content/docs/guides/groov-epic.md
title: Opto 22 groov EPIC
prefix: EPIC
claims:
  - id: EPIC-001
    claim: >-
      `naut optommp browse` and `import` read module type and channel type
      per slot, the channel-present mask and the current values from the
      processor over OptoMMP.
    source: "#import-the-chassis"
    tests:
      - go ./optommp TestScanBenchChassis
      - go ./optommp TestKindOf
    partial: true
    note: >-
      Against an in-process fake of the bench chassis. The live read of
      the real processor is the env-gated TestLiveDriver
      (NAUT_OPTOMMP_LIVE), not in CI; the bench nightly
      (docs/design/bench-testing.md) is where it will be checked.
  - id: EPIC-002
    claim: >-
      `naut optommp import` writes an optommp driver manifest and a tag
      file that load and check as a project: one tag per channel named
      <id>_M<slot>_<Kind><ch>, outputs writable, with _Count, _OnLatch /
      _OffLatch, _Quality and scratchpad tags on request.
    source: "#import-the-chassis"
    tests:
      - go ./cmd/naut TestOptommpImportMakesACheckableProject
      - go ./internal/project TestLoadOptommpDriver
      - go ./optommp TestManifestRoundTrip
  - id: EPIC-003
    claim: >-
      Re-running the import on an unchanged chassis writes byte-identical
      files.
    source: "#import-the-chassis"
    tests:
      - go ./optommp TestGenerateModbusMap
      - go ./optommp TestManifestRoundTrip
    partial: true
    note: Generation is deterministic in the tests; a run-twice-and-compare test is not written.
  - id: EPIC-004
    claim: >-
      `--modbus` binds every channel to the processor's Modbus map instead:
      digital state at coil/discrete 512 + slot*64 + ch, analog values as
      float32 at input register 4608 + (slot*64 + ch)*2.
    source: "#import-the-chassis"
    tests:
      - go ./optommp TestGenerateModbusMap
      - go ./cmd/naut TestOptommpImportModbus
  - id: EPIC-005
    claim: >-
      A scan is the fewest requests the bindings allow (three for the
      bench chassis), and digital outputs go out in one must-on/must-off
      write that touches only the commanded channels, read back.
    source: "#what-a-scan-does"
    tests:
      - go ./optommp TestDriverReadsTheBenchChassis
      - go ./optommp TestDriverWritesOnlyTheCommandedChannels
      - go ./optommp TestDriverWriteGate
      - go ./optommp TestDriverAnalogOutput
      - go ./optommp TestWriteRoundTrip
  - id: EPIC-006
    claim: >-
      The driver checks the chassis against the manifest on connect and
      every few seconds, reconnects when the processor goes away, and
      sends commands written meanwhile once it is back.
    source: "#what-a-scan-does"
    tests:
      - go ./optommp TestDriverSwappedOrEmptySlotIsBad
      - go ./optommp TestDriverHoldsCommandsAcrossADrop
      - go ./optommp TestDriverSendsThePowerupClear
  - id: EPIC-007
    claim: >-
      Quality is per channel: an empty or mismatched slot, an absent
      channel, a channel flagged in the module's quality mask and a NaN
      analog reading are bad; a dead connection is stale; a tag never
      read is not connected; the processor's quality code is the _Quality
      tag.
    source: "#quality-per-channel"
    tests:
      - go ./optommp TestDriverSwappedOrEmptySlotIsBad
      - go ./optommp TestDriverAbsentChannelIsBad
      - go ./optommp TestDriverDigitalQualityBit
      - go ./optommp TestDriverAnalogNaNIsBadAndRecovers
      - go ./optommp TestDriverNotConnectedBeforeFirstScan
      - go ./optommp TestDriverQualityCodes
      - go ./internal/project TestLoadOptommpDriver
  - id: EPIC-008
    claim: >-
      An analog channel the processor reports as NaN renders as JSON null
      on the tag API and stream.
    source: "#quality-per-channel"
    tests:
      - go ./server TestStateRendersNaNAsNull
      - go ./modbus TestNaNFloatIsBadQuality
  - id: EPIC-009
    claim: >-
      On/off latches catch a pulse shorter than a scan.
    source: "#import-the-chassis"
    tests:
      - go ./optommp TestDriverLatchesCatchAPulseBetweenScans
  - id: EPIC-010
    claim: >-
      `custom-area: true` makes a scan one read with the same values; the
      driver rewrites its pointers when another client changes them.
    source: "#poll-custom-area-or-stream"
    tests:
      - go ./optommp TestDriverCustomAreaIsOneReadWithTheSameResult
      - go ./optommp TestDriverRewritesCustomPointersAnotherClientChanged
  - id: EPIC-011
    claim: >-
      `stream:` has the processor push inputs over UDP; a late stream
      makes every tag stale, a stream gone for the request timeout ends
      the session, and a clean stop puts the stream configuration and
      pointers back as found.
    source: "#poll-custom-area-or-stream"
    tests:
      - go ./optommp TestDriverStreams
      - go ./optommp TestDriverStreamLateIsStaleThenTimesOut
      - go ./optommp TestDriverStopPutsTheStreamConfigBack
  - id: EPIC-012
    claim: >-
      Measured on the bench EPIC at 20 ms: packed poll 13.7 % naut CPU
      with 3 requests a scan, custom area 12.0 % with one, stream 10.0 %
      with none.
    source: "#poll-custom-area-or-stream"
    tests: []
    note: >-
      A bench measurement (2026-10-24), conditions in
      docs/design/open-controllers.md §2.3. No automated test; the bench
      nightly is planned to record it per run.
  - id: EPIC-013
    claim: >-
      A custom-area pointer into the packed analog area costs the
      processor's I/O server about 0.5 ms each time it is resolved; the
      driver points into the per-channel areas instead.
    source: "#poll-custom-area-or-stream"
    tests:
      - go ./optommp TestDriverCustomAreaIsOneReadWithTheSameResult
    partial: true
    note: >-
      The test pins which areas the pointers name; the cost was measured
      on the bench EPIC (2026-10-24, brief §2.2) and is not in CI.
  - id: EPIC-014
    claim: >-
      `watchdog:` sets the I/O unit's communication watchdog (0s turns it
      off, absent leaves it alone); a polling manifest refuses one shorter
      than three scans; while streaming the driver reads often enough to
      keep it fed.
    source: "#the-communication-watchdog"
    tests:
      - go ./optommp TestDriverWatchdog
      - go ./optommp TestDriverWatchdogOffAndLeftAlone
      - go ./optommp TestManifestCommOptionValidation
      - go ./internal/project TestOptommpStatusStreamAndWatchdog
    partial: true
    note: >-
      Against the in-process fake. On the bench unit (2026-10-27) a 1000 ms
      watchdog tripped as described when naut was stopped with SIGSTOP;
      that run is not automated.
  - id: EPIC-015
    claim: >-
      The runtime on the processor ran the epic-bench project (73 tags,
      polling) at 3.9 % of one core and 19.2 MB resident at 100 ms, 14.7 %
      at 20 ms, beside Opto's own software.
    source: "#run-it-on-the-processor"
    tests: []
    note: >-
      A bench measurement (2026-10-24), written up in
      docs/design/open-controllers.md §2.3. No automated test yet; the
      bench nightly is planned to record it per run.
  - id: EPIC-016
    claim: >-
      The driver manifest's `priority:` runs the driver loop on one
      SCHED_FIFO thread, polling or streaming, and reports its wake-up
      lateness and scan time; refused, it says why and runs normally.
    source: "#timing-on-the-processors-real-time-kernel"
    tests:
      - go ./optommp TestDriverPriorityPolls
      - go ./optommp TestDriverPriorityStreams
      - go ./optommp TestDriverPriorityStreamGoesLate
      - go ./optommp TestManifestPriority
      - go ./optommp TestTimingStats
      - go ./internal/project TestOptommpStatusTimingAndPriority
  - id: EPIC-017
    claim: >-
      On the bench EPIC's PREEMPT_RT kernel, task priority 20 left no scan
      more than 2 ms late in 5 minutes, quiet or loaded; driver priority 25
      brought the driver's wake-up p99 from 1–2 ms to under 0.2 ms; the
      scan's 2–5 ms p99 did not change.
    source: "#timing-on-the-processors-real-time-kernel"
    tests: []
    note: >-
      A bench measurement (2026-10-25, firmware 4.1.2.0, 20 ms scans, 5
      minutes a row, quiet and with four busy loops), conditions in
      docs/design/open-controllers.md §2.3. Not repeatable in CI.
  - id: EPIC-018
    claim: >-
      The systemd unit in the guide starts nautilus on the processor at
      boot with CAP_SYS_NICE; systemd stops it with SIGTERM, which
      nautilus handles as a clean stop; AmbientCapabilities gives
      CAP_SYS_NICE to a binary that has no file capability.
    source: "#start-it-on-boot"
    tests:
      - go ./optommp TestDriverStopPutsTheStreamConfigBack
    partial: true
    note: >-
      Tried on the bench EPIC on 2026-10-25 (firmware 4.1.2.0, systemd
      250). Rebooted with the unit enabled: systemd started naut 31.0 s
      after the kernel (mmp-server active at 30.9 s), the driver connected
      at 32.4 s with no restarts and no errors, CapEff 0x800000, the
      dashboard answered, and mmpServer settled at about 13 % of a core
      beside naut at about 15 %. Opto's own services were still running.
      Before that, `systemctl restart` stopped naut with SIGTERM
      ("Deactivated successfully", no kill) in poll mode, which has
      nothing to restore. The stream restore on stop is tested against
      the fake through the driver's Stop; SIGTERM reaches the same stop
      (cmd/naut/runcmd.go cancels its context on SIGINT or SIGTERM), but
      that is not tested end to end, which is why the claim is partial.
      `systemd-run -p AmbientCapabilities=CAP_SYS_NICE` gave an uncapped
      binary CapEff 0x800000, and 0 without it. The bench binary also
      carries the file capability, so the running naut's CapEff came from
      that.
  - id: EPIC-019
    claim: >-
      When the unit may have gone longer than its watchdog time without a
      request (a stalled process, a network outage TCP rode out, an
      overrun scan), the driver rewrites every digital and analog output
      it commands, logging a warning once each time; a reconnect rewrites
      every commanded output, scratchpad included.
    source: "#the-communication-watchdog"
    tests:
      - go ./optommp TestDriverRewritesOutputsAfterAStall
      - go ./optommp TestDriverRewritesEveryOutputOnReconnect
    partial: true
    note: >-
      Against the in-process fake, which applies watchdog values when it
      next sees a request. The stall is the driver's lock held with the
      socket open, polling and streaming; the network-outage and overrun
      cases go through the same bound (send to next answer) but have no
      test of their own, and the warning's once-per-trip is not asserted.
      The bench case it fixes (SIGSTOP 15 s, DO7 latched at its watchdog
      value, 2026-10-27) was re-run by hand with the fix the same day: DO7
      went to its watchdog value during the stop and was back to its
      command within 1 s of SIGCONT, with the bad-tag count unchanged.
      That run is not automated, and the bench has no analog output
      module, so the analog rewrite is checked against the fake only.
  - id: EPIC-020
    claim: >-
      A digital output still not in its commanded state 250 ms (or three
      scans) after the write reads bad until it is.
    source: "#quality-per-channel"
    tests:
      - go ./optommp TestDriverOutputNotInItsCommandedStateIsBad
  - id: EPIC-021
    claim: >-
      `naut optommp import` binds three status tags, <id>__Online (BOOL),
      <id>__Outages and <id>__WatchdogTrips (DINT), delivered from the
      first scan with good quality; __Online is true while a session is up
      and the stream (when streaming) is not late, and __Outages counts the
      times it went false.
    source: "#holding-outputs-until-an-operator-acknowledges"
    tests:
      - go ./optommp TestManifestRoundTrip
      - go ./optommp TestDriverNotConnectedBeforeFirstScan
      - go ./optommp TestDriverStatusOutageWithoutATrip
      - go ./optommp TestDriverStreamLateIsStaleThenTimesOut
    partial: true
    note: >-
      Against the in-process fake of the chassis (a dropped connection, a
      late then dead stream). Not yet run against the bench unit.
  - id: EPIC-022
    claim: >-
      <id>__WatchdogTrips counts the times the unit's watchdog may have
      fired: the driver went quiet for longer than the watchdog, or
      reconnected after a gap longer than it. Nothing is counted while the
      watchdog is off, nor for a drop shorter than it.
    source: "#holding-outputs-until-an-operator-acknowledges"
    tests:
      - go ./optommp TestDriverRewritesOutputsAfterAStall
      - go ./optommp TestDriverRewritesEveryOutputOnReconnect
      - go ./optommp TestDriverStatusOutageWithoutATrip
    partial: true
    note: >-
      Against the in-process fake, which applies watchdog values when it
      next sees a request; the stall is the driver's lock held with the
      socket open, polling and streaming. The bench freeze (SIGSTOP past
      the watchdog) has not been run with the counter.
  - id: EPIC-023
    claim: >-
      A program can seal in a hold on any change of __Outages or
      __WatchdogTrips and release it on an operator acknowledge once
      __Online is true again; an acknowledge while the processor is still
      away does nothing.
    source: "#holding-outputs-until-an-operator-acknowledges"
    tests:
      - naut examples/epic-bench an outage holds the lamps until it is acknowledged
      - naut examples/epic-bench a watchdog trip holds the lamps too
    partial: true
    note: >-
      The example's program in virtual time, with the status tags given by
      the test rather than delivered by the driver. The driver side is
      EPIC-021 and EPIC-022.
