page: website/src/content/docs/guides/ai-assistants.md
title: AI assistants and AGENTS.md
prefix: AI
claims:
  - id: AI-001
    claim: >-
      naut new writes an AGENTS.md and a CLAUDE.md that imports it into every
      manifest project it scaffolds (minimal and demo), and neither into the
      Go SDK templates (sdk, sdk-demo).
    source: "#"
    tests:
      - go ./cmd/naut TestScaffoldVariants
    note: >-
      Asserts both files exist for the minimal and demo templates, are absent
      from sdk and sdk-demo, and that CLAUDE.md has the @AGENTS.md import
      line.
  - id: AI-002
    claim: >-
      The examples AGENTS.md shows (a tank's sequence, interlocks and heater
      loop, and its tests) compile with no naut check errors or warnings and
      pass their acceptance tests.
    source: "#what-agentsmd-covers"
    tests:
      - go ./cmd/naut TestAgentsMdSnippetsRun
    note: >-
      Every program, tag line and test in AGENTS.md must be a file of
      cmd/naut/testdata/agents-md verbatim; that project is then checked
      (naut check, zero warnings), compiled, and its acceptance tests run,
      including more_test.yaml for what the examples' comments claim: CV
      follows CV_MAN off auto, the abort transition wins over t_full when
      both are true on the same scan (declaring t_full first fails that
      test), and the P0 CountBatch action counts once per batch (an N
      association fails it).
  - id: AI-003
    claim: >-
      naut check catches an output with no init: that a program reads before
      writing it, as a seal-in does, which would fault the scan.
    source: "#working-with-an-agent"
    tests:
      - go ./cmd/naut TestCheckReportsAnOutputReadBeforeItsFirstWrite
    note: >-
      The page's summary of TAG-053 (tag-model), which carries the full
      claim and its tests.
  - id: AI-004
    claim: >-
      naut agents adds AGENTS.md and a CLAUDE.md that imports it to a project
      that has neither; naut agents -check says whether either is missing or
      stale and writes nothing.
    source: "#an-existing-project"
    tests:
      - go ./cmd/naut TestRunAgents
    note: >-
      An empty manifest project checks as missing/missing with exit 1, is
      written, then checks current/current with exit 0; a refused run leaves
      the file byte for byte.
  - id: AI-005
    claim: >-
      naut agents replaces only the text between the nautilus markers, so
      notes above or below them are kept, and a copy an older naut new wrote
      without markers is recognised and updated, keeping notes added below
      it; an older copy edited inside is reported, not guessed at.
    source: "#keeping-it-current"
    tests:
      - go ./cmd/naut TestAgentsRenderRefreshKeepsTheProjectsOwnNotes
      - go ./cmd/naut TestAgentsRenderUpdatesAnOlderNautsUnmarkedCopy
      - go ./cmd/naut TestAgentsOlderCopyWithTheProjectsAdditions
      - go ./cmd/naut TestAgentsPreviousCoversHistory
    note: >-
      The history test checks that every earlier text of the template in git
      is in agentsPrevious, so a template change cannot orphan the projects
      an older naut made.
  - id: AI-006
    claim: >-
      An AGENTS.md naut did not write is left alone unless -append (adds the
      guidance below its text) or -force (replaces it); a CLAUDE.md without
      the import gets the @AGENTS.md line added and nothing else changes.
    source: "#keeping-it-current"
    tests:
      - go ./cmd/naut TestAgentsRenderRefusesSomebodysOwnFileUnlessTold
      - go ./cmd/naut TestAgentsBrokenMarkersAreNeverGuessedAt
      - go ./cmd/naut TestClaudeRender
  - id: AI-007
    claim: >-
      naut check warns when a project's nautilus guidance is older than the
      naut's, and gives no warning for a project with no AGENTS.md.
    source: "#keeping-it-current"
    tests:
      - go ./cmd/naut TestAgentsWarnings
