page: website/src/content/docs/guides/opcua-server.md
title: OPC UA server
prefix: OPC
claims:
  - id: OPC-001
    claim: >-
      An opcua: section serves the tag store as an OPC UA address space; the
      section's presence turns the server on, endpoint is where it listens
      (default opc.tcp://localhost:4840, which listens on 127.0.0.1), and
      naut check refuses an endpoint that is not opc.tcp://host:port (a bare
      host:port is read as opc.tcp://host:port).
    source: "#serving-opc-ua"
    tests:
      - go ./tools/blackbox TestBlackbox/001-F05-schemeless-endpoint
      - go ./tools/blackbox TestBlackbox/001-F02-ipv4-loopback
      - go ./tools/blackbox TestBlackbox/001-P-check-refuses-bad-endpoints
      - go ./tools/blackbox TestBlackbox/001-P-build-serves-opcua
      - go ./internal/project TestOPCUAConfig
      - go ./cmd/naut TestCheckRefusesBadOPCUAEndpoint
      - go ./cmd/naut TestNautRunServesOPCUA
      - go ./opcua/server TestParseEndpoint
      - go ./opcua/server TestNewRefusesNothingButABadEndpoint
      - go ./opcua/server TestEndpointHosts
      - go ./opcua/server TestEndpointsMatchEveryAliasAndFallBackToAll

  - id: OPC-011
    claim: >-
      The server advertises one endpoint per name it answers to (the host
      written, every interface address for 0.0.0.0, the host name, loopback)
      and never the wildcard itself; a client may dial any of them, and
      GetEndpoints for an unknown URL returns every endpoint rather than none.
      CreateSession's ServerEndpoints are the list GetEndpoints gives for the
      same URL, so a client that reached the server through a name it was not
      told about (a NAT address, a DNS alias) can open a session.
    source: "#serving-opc-ua"
    tests:
      - go ./tools/blackbox TestBlackbox/001-F17-endpoints-advertised
      - go ./tools/blackbox TestBlackbox/001-F24-advertises-0000
      - go ./tools/blackbox TestBlackbox/001-F23-createsession-serverendpoints
      - go ./opcua/server TestEndpointHosts
      - go ./opcua/server TestEndpointsMatchEveryAliasAndFallBackToAll
      - go ./opcua/server TestWildcardIsNotAdvertised
      - go ./opcua/server TestCreateSessionEndpointsAreTheDiscoveryList
      - go ./opcua/internal/uaserver TestCreateSessionServerEndpointsForAnUnknownURL

  - id: OPC-002
    claim: >-
      Under Objects there is one folder named after the project; a scalar
      tag is a Variable, a UDT tag an Object whose members (nested UDTs
      included) are child nodes, an array of scalars a Variable holding an
      OPC UA array, and an array of UDTs an Object with one child per element
      indexed from the declared lower bound.
    source: "#what-a-client-sees"
    tests:
      - go ./tools/blackbox TestBlackbox/001-P-project-folder
      - go ./tools/blackbox TestBlackbox/001-P-every-tag-a-node
      - go ./tools/blackbox TestBlackbox/001-P-shapes
      - go ./tools/blackbox TestBlackbox/001-F09-fb-instance-no-node
      - go ./tools/blackbox TestBlackbox/001-F10-2d-array-rows
      - go ./opcua/server TestBrowseWalksTheStore
      - go ./opcua/server TestBrowseFiltersThroughTheClient
      - go ./opcua/server TestReadsCarryTypesQualityAndTimestamps
      - go ./opcua/server TestFBPinsAreChildNodes
      - go ./opcua/server TestChildrenListMembersInDeclarationOrder
      - go ./opcua/server TestChildrenOfAnFBAreItsVisiblePins
      - go ./opcua/server TestWalkResolvesEveryMemberShape
      - go ./opcua/server TestNamespaceBrowseReferences
      - go ./opcua/server TestForeignAsyncuaClient

  - id: OPC-003
    claim: >-
      Node ids are string ids in the tag store's address form in namespace
      1 (ns=1;s=Level, ns=1;s=P101.Drive.Speed, ns=1;s=Levels[2]), the entry
      after http://opcfoundation.org/UA/ in the NamespaceArray with the URI
      urn:joyautomation:nautilus:<project>; a node id in another casing
      resolves to the same tag; a tag's desc and unit become the node's
      Description as "desc [unit]".
    source: "#what-a-client-sees"
    tests:
      - go ./tools/blackbox TestBlackbox/001-F01-namespace-index
      - go ./tools/blackbox TestBlackbox/001-F03-unknown-namespace-read
      - go ./tools/blackbox TestBlackbox/001-P-case-insensitive
      - go ./tools/blackbox TestBlackbox/001-P-description
      - go ./opcua/server TestProjectNamespaceIsIndexOne
      - go ./opcua/server TestBrowseWalksTheStore
      - go ./opcua/server TestReadsCarryTypesQualityAndTimestamps
      - go ./opcua/server TestNamespaceResolvesOnlyItsOwnStringIDs
      - go ./opcua/server TestNamespaceDescriptionFromTagMeta
      - go ./opcua/server TestForeignAsyncuaClient

  - id: OPC-023
    claim: >-
      The server identifies itself as nautilus: every endpoint's
      ApplicationDescription carries ApplicationUri
      urn:joyautomation:nautilus:<project> (the name percent-encoded; the
      same on every host and replica) or the manifest's
      opcua.application-uri, which naut check refuses unless it is an
      absolute URI; it is also the only entry of the Server object's
      ServerArray. ProductUri is urn:joyautomation:nautilus.
      ServerStatus.BuildInfo, the BuildInfo variable and its children carry
      that ProductUri, Joy Automation, Nautilus, the version naut version
      prints, the build's commit and its date. The Server object's variables
      are the standard node set's, with their standard BrowseNames,
      DataTypes, ValueRanks and HasComponent hierarchy (BuildInfo's fields
      under BuildInfo, under ServerStatus), and a Browse gives each
      reference's TypeDefinition as its target's type definition
      (ServerStatusType, PropertyType), never its DataType. ServiceLevel
      reads 255 while the server runs and Auditing false; ServerCapabilities'
      Mandatory properties have values (no profile or locale claimed, the
      sweep as MinSupportedSampleRate, no continuation-point limit); the
      optional MaxArrayLength and MaxStringLength are left out, as Part 5
      asks of a server that sets no such limit; ServerDiagnostics.EnabledFlag
      reads false (no diagnostics collected).
      The project folder under Objects browses as a FolderType.
    source: "#what-a-client-sees"
    tests:
      - go ./opcua/server TestServerObjectDescribesNautilus
      - go ./opcua/server TestBrowseTypeDefinitionsAreTypes
      - go ./opcua/server TestServerDiagnosticsFlagAndOptionalLimits
      - go ./opcua/internal/uaserver TestAddRefNeverUsesTheDataTypeAsTypeDefinition
      - go ./opcua/server TestApplicationURIIsStableAndOverridable
      - go ./opcua/server TestBinaryBuildIsNeverThePlaceholder
      - go ./opcua/internal/uaserver TestApplicationURIOptionWinsOverTheCertificate
      - go ./internal/project TestOPCUAConfig
      - go ./cmd/naut TestNautRunOPCUAReportsTheCLIVersion
    note: >-
      The tester's 001-F04b-server-identity-mandatory-vars proves everything
      it checks except Auditing: it reads i=2268 (ServerCapabilities, an
      Object) as Auditing, which is i=2994, so it cannot pass until the check
      is corrected; it stays open under #424 until then. The Go test reads
      i=2994. The build number and date come from the binary's VCS stamp;
      a binary built without one (-buildvcs=false) has no build number and
      dates itself by the executable's modification time.

  - id: OPC-004
    claim: >-
      Each node's DataType is the declared IEC type: BOOL Boolean, the eight
      integer widths their OPC UA integer, an enumeration Int32, REAL/LREAL
      Double, TIME Duration in milliseconds, STRING String, and an array of
      scalars an array of the element type. A STRING holding '' is sent as an
      empty String, not a null one, alone or in an array, by Read and by
      subscription.
    source: "#types"
    tests:
      - go ./tools/blackbox TestBlackbox/001-P-type-table
      - go ./tools/blackbox TestBlackbox/001-F37-empty-string-is-null
      - go ./opcua/server TestEmptyStringIsReadAsEmptyNotNull
      - go ./opcua/server TestEmptyStringIsNotifiedAsEmptyNotNull
      - go ./opcua/server TestEmptyStringOfAServerNodeIsReadAsEmpty
      - go ./opcua/server TestWireStringSurvivesTheEncoder
      - go ./opcua/server TestReadsCarryTypesQualityAndTimestamps
      - go ./opcua/server TestEveryIntegerWidthReadsAsItsOwnType
      - go ./opcua/server TestDataTypeFollowsTheDeclaredWidth
      - go ./opcua/server TestScalarConvertsInRangeAndWidensOutOfRange
      - go ./opcua/server TestVariantEncodesArraysOfEachKind
      - go ./opcua/server TestForeignAsyncuaClient

  - id: OPC-005
    claim: >-
      A value's status code is the tag's quality — good Good, stale
      Uncertain_LastUsableValue, bad Bad_DeviceFailure, not connected
      Bad_NotConnected — and a member of a UDT carries its tag's quality.
    source: "#quality-and-timestamps"
    tests:
      - go ./tools/blackbox TestBlackbox/001-P-stale-quality
      - go ./opcua/server TestReadsCarryTypesQualityAndTimestamps
      - go ./opcua/server TestStatusOfQuality
      - go ./opcua/server TestNeverDeliveredProtocolInputReadsBadNotConnected
      - go ./opcua/server TestNeverDeliveredLocalInputHasANode
      - go ./tools/blackbox TestBlackbox/001-F16-undelivered-tag-has-node
      - go ./opcua/server TestQualityChangeIsNotified
    note: >-
      The mapping is tested on the status function and on store-held values.
      A protocol input never delivered is seeded and reads Bad_NotConnected
      (TestNeverDeliveredProtocolInputReadsBadNotConnected, over a Memory
      driver reporting NotConnected); a quality-only change is pushed to a
      subscriber (TestQualityChangeIsNotified; #419); a local-I/O input never
      delivered, which is not seeded, is a node of its declared type with no
      value and Bad_NotConnected (or the driver's own Bad status), listed
      once, and a subscriber hears it go Good on its
      first delivery (TestNeverDeliveredLocalInputHasANode; #420). The black-box
      check 001-F15-status-change-notified stays open: it creates its item
      through asyncua's raw uaclient, so asyncua drops the notifications as
      an unknown handle whatever the server sends.
    partial: true

  - id: OPC-006
    claim: >-
      SourceTimestamp is the time the tag's current value was first seen
      (the server's start for a value unchanged since) and moves only when
      the value does, a member of a UDT holding its own while a sibling
      moves; ServerTimestamp is the time of the read.
    source: "#quality-and-timestamps"
    tests:
      - go ./tools/blackbox TestBlackbox/001-F12-source-timestamp-start
      - go ./tools/blackbox TestBlackbox/001-F22-udt-member-source-timestamp
      - go ./tools/blackbox TestBlackbox/001-P-http-write-notified
      - go ./opcua/server TestSourceTimestampIsSeededAtStart
      - go ./opcua/server TestIdleUDTMemberStaysQuietWhenASiblingMoves
      - go ./opcua/server TestReadsCarryTypesQualityAndTimestamps
      - go ./opcua/server TestStampAtMovesOnlyWithTheGeneration
      - go ./opcua/server TestSubscriptionCoversArraysElementsAndStaysQuiet
      - go ./opcua/server TestForeignAsyncuaClient

  - id: OPC-007
    claim: >-
      A subscription's monitored items are notified of a change to the tag
      they cover (the tag itself or a member of it) without the server
      polling a copy of the tag store.
    source: "#subscriptions"
    tests:
      - go ./tools/blackbox TestBlackbox/001-P-counter-cadence
      - go ./tools/blackbox TestBlackbox/001-P-http-write-notified
      - go ./tools/blackbox TestBlackbox/001-P-ten-subscribers
      - go ./tools/blackbox TestBlackbox/001-F21-udt-member-notified-once
      - go ./opcua/server TestSubscriptionHearsChanges
      - go ./opcua/server TestSubscriptionCoversArraysElementsAndStaysQuiet
      - go ./opcua/server TestSubscriptionFollowsTheRunningProgram
      - go ./opcua/server TestThousandsOfMovingTagsUnderConcurrentClients
      - go ./opcua/server TestQualityChangeIsNotified
      - go ./opcua/server TestForeignAsyncuaClient
    note: >-
      The 100 ms sweep cadence is not asserted (tests run a 20 ms sweep);
      MinimumSamplingInterval reporting the sweep is asserted in
      TestNamespaceAttributesOfFolderAndMembers.
    partial: true

  - id: OPC-012
    claim: >-
      CreateMonitoredItems refuses, in its own result, an item on a node id
      that is not a node or on an attribute the node lacks (a Value on an
      Object or the folder), with the code a Read gives, and creates the rest.
    source: "#subscriptions"
    tests:
      - go ./tools/blackbox TestBlackbox/001-F07-monitored-items-refused
      - go ./tools/blackbox TestBlackbox/001-P-read-error-codes
      - go ./opcua/server TestCreateMonitoredItemsRejectsWhatCannotBeMonitored

  - id: OPC-013
    claim: >-
      A created item's RevisedSamplingInterval is the nearest multiple of
      the sweep to what was requested (the sweep for "fastest"), the item is
      then sampled at that rate, and a monitored member of a UDT is notified
      only when its own value or status changes, not when a sibling moves.
    source: "#subscriptions"
    tests:
      - go ./tools/blackbox TestBlackbox/001-F20-revised-sampling-interval
      - go ./tools/blackbox TestBlackbox/001-F21-udt-member-notified-once
      - go ./tools/blackbox TestBlackbox/001-P-sampling-interval
      - go ./opcua/server TestRevisedSamplingIntervalIsAMultipleOfTheSweep
      - go ./opcua/server TestIdleUDTMemberStaysQuietWhenASiblingMoves

  - id: OPC-008
    claim: >-
      The server is read-only unless opcua.writable opens tags, and then only
      to a writer session: any other session's write to a tag's value is
      answered Bad_UserAccessDenied and does not land, and a write to another
      attribute or an Object is Bad_NotWritable. AccessLevel is CurrentRead
      on every node opcua.writable does not open, and the standard Server
      object and its variables are read-only for every session.
    source: "#security"
    tests:
      - go ./tools/blackbox TestBlackbox/001-P-read-only-tags
      - go ./tools/blackbox TestBlackbox/001-F08-server-object-read-only
      - go ./tools/blackbox TestBlackbox/001-F04a-server-variable-access-attrs
      - go ./opcua/server TestAnonymousWriteIsRefused
      - go ./opcua/server TestServerObjectIsReadOnly
      - go ./opcua/server TestNamespaceSetAttributeRefusesEverything
      - go ./opcua/server TestReadsCarryTypesQualityAndTimestamps
      - go ./opcua/server TestNamespaceAttributesOfFolderAndMembers
      - go ./opcua/server TestNonWriterSessionsAreRefused
      - go ./opcua/server TestNoWritableListIsReadOnly
      - go ./opcua/server TestAccessLevelsPerNodeAndSession
      - go ./cmd/naut TestNautRunServesOPCUA
      - go ./opcua/server TestForeignAsyncuaClient

  - id: OPC-016
    claim: >-
      Each advertised address carries four endpoints: None (anonymous) and
      Basic256Sha256, Aes128_Sha256_RsaOaep and Aes256_Sha256_RsaPss under
      SignAndEncrypt; Sign alone and the deprecated Basic128Rsa15 and
      Basic256 are refused when a channel opens (Bad_SecurityPolicyRejected),
      and a renewal must keep the security its channel opened with. On its
      first start the server makes its certificate in the store opcua.pki
      names (default ./pki): own/cert.der and own/private/key.pem (owner
      only), RSA-2048, SHA-256, self-signed, valid five years, naming the
      application-uri and every advertised host and address; a certificate
      already there is kept, and its URI is the one announced. naut new
      ignores /pki/ in git and naut build never embeds a certificate store.
      The opcua-server status row carries the certificate's thumbprint and
      expiry, and warns from 30 days before it expires.
    source: "#endpoints"
    tests:
      - go ./opcua/server TestServerCertificateIsGeneratedAndKept
      - go ./opcua/server TestUnofferedSecurityIsRejected
      - go ./opcua/server TestSecureChannelRenews
      - go ./opcua/server TestStatusWarnsBeforeTheCertificateExpires
      - go ./opcua/internal/uasc TestCheckOpen
      - go ./internal/project TestOPCUAStatusCarriesTheCertificate
      - go ./cmd/naut TestEmitBinarySkipsDependencyTrees
      - go ./opcua/server TestForeignAsyncuaSecure
    note: >-
      Unit and in-process client tests (gopcua's client, and the forked
      uasc's own client side, which reports the server's refusal code where
      gopcua's reads EOF), plus asyncua over all three policies, renewals
      and the refusals (TestForeignAsyncuaSecure). No
      black-box check covers the secure endpoints yet; the writes brief
      (slice 3) will.

  - id: OPC-017
    claim: >-
      A secured channel opens only from a client certificate in
      trusted/certs (DER or PEM, any name): an untrusted one is refused with
      Bad_CertificateUntrusted and filed in rejected/certs under its
      thumbprint, one outside its validity period with
      Bad_CertificateTimeInvalid. naut opcua certs lists the store, naut
      opcua trust <thumbprint prefix of 16+ digits> moves a rejected
      certificate to trusted/, and the next attempt connects without a
      restart, since the trust list is read on every connection and every
      renewal; a token lives an hour at most and a channel that does not
      renew in time is closed; rejected/ keeps the newest 100. CreateSession on a secured channel must present the
      channel's own certificate (Bad_SecurityChecksFailed) and the
      ApplicationUri it names (Bad_CertificateUriInvalid). Sessions are
      anonymous: another identity token is Bad_IdentityTokenInvalid. A
      session belongs to the channel that created it: its token is 32
      random bytes, and another connection presenting it is refused with
      Bad_SecureChannelIdInvalid.
    source: "#approving-a-client"
    tests:
      - go ./opcua/server TestUntrustedClientIsRefusedUntilTrusted
      - go ./opcua/server TestExpiredClientCertificateIsRefused
      - go ./opcua/server TestCreateSessionIsHeldToTheChannelCertificate
      - go ./cmd/naut TestOPCUACertsAndTrust
      - go ./opcua/internal/uaserver TestActivateSessionChecksTheIdentityToken
      - go ./opcua/internal/uaserver TestSessionTokensAreRandomAndLong
      - go ./opcua/internal/uaserver TestSessionTokensComeFromCryptoRand
      - go ./opcua/internal/uaserver TestSessionTokenRefusedOnAnotherChannel
      - go ./opcua/server TestForeignAsyncuaSecure

  - id: OPC-018
    claim: >-
      opcua.writable lists globs over tag names and member paths, with the
      rule sparkplug.writable uses: a pattern on a tag opens everything below
      it, through members and array elements alike (Drives opens
      Drives[0].Speed), one on a member opens it and everything below it. A
      writer session is one on a SignAndEncrypt endpoint from a trusted
      client certificate; anonymous on None, with or without a certificate,
      is never one. On every Write request the trust list is read again and
      the certificate's validity period checked, so a certificate taken out
      of trusted/, or one that has expired, writes nothing more on the
      channel it has (every item Bad_UserAccessDenied), and the session then
      reads UserAccessLevel CurrentRead. A writer may write the Value of a
      matched scalar tag or struct member, an output included; an input
      never (Bad_NotWritable), nor a tag no pattern opens. AccessLevel is
      CurrentRead|CurrentWrite on a matched non-input scalar (an array reads
      CurrentRead until array writes land), AccessLevelEx follows it, and
      UserAccessLevel is AccessLevel for a writer session and CurrentRead
      for any other. naut check refuses a malformed pattern and warns on one
      that matches nothing, one that matches only inputs, one that opens
      only arrays or Objects with no scalar member, and an output it opens
      that a program writes.
    source: "#writes"
    tests:
      - go ./internal/writable TestAllowsAMatchAndEverythingBelowIt
      - go ./internal/writable TestValidateRefusesAMalformedPattern
      - go ./opcua/server TestWriteStatusTable
      - go ./opcua/server TestNonWriterSessionsAreRefused
      - go ./opcua/server TestAccessLevelsPerNodeAndSession
      - go ./opcua/server TestUntrustedCertificateStopsWritingOnItsChannel
      - go ./opcua/server TestExpiredCertificateStopsWritingOnItsChannel
      - go ./opcua/server TestCertStandingFailsClosed
      - go ./opcua/server TestNewRefusesAMalformedWritablePattern
      - go ./cmd/naut TestCheckWarnsOnOPCUAWritable
      - go ./cmd/naut TestWireRedundancyGatesOPCUAWrites
      - go ./opcua/server TestForeignAsyncuaSecure
    note: >-
      No black-box check covers writes yet; the writes brief (design §5.3)
      will.

  - id: OPC-019
    claim: >-
      A written value lands exactly as sent or is refused. A Boolean node
      takes only a Boolean; an integer node any integer type, checked against
      the declared width (Bad_OutOfRange outside it), never a Float or Double
      (Bad_TypeMismatch); a ULINT or LWORD any 64-bit pattern; a Double node
      a Float, a Double or an integer within ±2^53, never NaN, infinity or
      an integer past ±2^53 (Bad_OutOfRange); an enumeration's Int32 node
      only a member's value (Bad_OutOfRange); a Duration node a Double or an
      integer of whole milliseconds (Bad_OutOfRange for a fraction); a
      String node a String, a null String written as ''. An absent
      StatusCode, or one whose severity is Good (GoodClamped included), is a
      plain write, and an Uncertain or Bad one is Bad_WriteNotSupported;
      source and server timestamps are accepted and ignored. An array, an
      IndexRange or an array Variant is Bad_WriteNotSupported; an unknown
      node Bad_NodeIdUnknown. A Write may name up to the 10 000 nodes
      MaxNodesPerWrite advertises (Bad_TooManyOperations past it).
    source: "#conversions"
    tests:
      - go ./opcua/server TestWriteStatusTable
      - go ./opcua/server TestMaxNodesPerWriteIsAdvertisedAndEnforced
      - go ./opcua/server TestForeignAsyncuaSecure
      - go ./runtime TestFrontDoorConversions

  - id: OPC-020
    claim: >-
      A written value is in the tag store when the response goes out; the
      items of one Write that pass land through one front-door batch under
      one store lock, so no reader sees part of a request, and a refused item
      does not hold back the others. A forced address, a member of one or a
      tag holding one is refused with Bad_Locked. Another session's
      subscription hears the new value through the sweep, with no
      notification path of its own.
    source: "#when-a-write-takes-effect"
    tests:
      - go ./opcua/server TestWriteRequestIsOneBatch
      - go ./opcua/server TestWriteStatusTable
      - go ./opcua/server TestWriteReachesAnotherSessionsSubscription
      - go ./runtime TestFrontDoorBatchIsAtomic
      - go ./runtime TestFrontDoorRefusesForced

  - id: OPC-021
    claim: >-
      Every landed write is an Info line opcua: write naming the node, the
      old and new values, the session, the client's ApplicationUri, the
      first 16 digits of its certificate thumbprint and its address. A
      trusted client's refusal on a node it may know is an opcua: write
      refused warning once per client, node and reason; every other refusal
      (a non-writer's, an unknown node id) is one line per client and reason
      with the refused item count; past 64 lines in an hour a client's
      refusals are only counted, so thousands of junk node ids cost a line
      or two. The
      opcua-server row on
      GET /api/drivers counts writes and writes refused, and says whether
      the server is writable.
    source: "#audit"
    tests:
      - go ./opcua/server TestWriteAuditAndCounters
      - go ./opcua/server TestRefusalsCannotFloodTheLog
      - go ./internal/project TestOPCUAStatusCarriesTheWrites

  - id: OPC-022
    claim: >-
      With redundancy, only the leader takes OPC UA writes: a standby
      answers every write Bad_InvalidState and its opcua-server row says it
      is a standby. The leadership gate is asked once per request, so a
      request lands whole or not at all. naut run gives the server the elector's leadership gate,
      as it does the drivers.
    source: "#when-a-write-takes-effect"
    tests:
      - go ./opcua/server TestStandbyRefusesWrites
      - go ./opcua/server TestStandbyGateIsAskedOncePerRequest
      - go ./cmd/naut TestWireRedundancyGatesOPCUAWrites
      - go ./internal/project TestOPCUAStatusCarriesTheWrites

  - id: OPC-009
    claim: >-
      GET /api/drivers carries an opcua-server row with the endpoint,
      whether it is listening, and the subscription and monitored-item
      counts (the write counters are OPC-021).
    source: "#status"
    tests:
      - go ./tools/blackbox TestBlackbox/001-P-driver-row
      - go ./cmd/naut TestNautRunServesOPCUA
      - go ./opcua/server TestStatusCountsWhatClientsHold
      - go ./opcua/server TestSubscriptionHearsChanges

  - id: OPC-010
    claim: >-
      An endpoint already in use is reported on stderr at start ("continuing
      without it") and as an error on the opcua-server row; the controller
      runs regardless. Stop closes every session; a restart on the same
      endpoint serves again. Stopping naut run (Ctrl+C, SIGTERM) with
      clients' sessions and subscriptions open closes their connections at
      once, gives the HTTP port back first, and exits promptly, so naut run
      started again straight away gets both ports.
    source: "#status"
    tests:
      - go ./tools/blackbox TestBlackbox/001-P-port-in-use
      - go ./tools/blackbox TestBlackbox/001-P-restart-under-subscriber
      - go ./tools/blackbox TestBlackbox/001-F14-shutdown-with-session
      - go ./cmd/naut TestNautRunContinuesWhenOPCUAPortIsTaken
      - go ./cmd/naut TestNautRunShutdownWithOPCUASessionIsPrompt
      - go ./cmd/naut TestNautRunGivesBackTheHTTPPortBeforeSlowStops
      - go ./opcua/server TestStartReportsAPortInUse
      - go ./opcua/server TestStopDropsClientsAndRestartReusesThePort
      - go ./opcua/internal/uaserver TestCloseWithSessionOpenIsPrompt

  - id: OPC-014
    claim: >-
      A requested publishing interval is revised to what the server supports
      (0 and anything below the sweep become the sweep, nothing slower than
      an hour) rather than booked as asked, and a ModifySubscription changes
      a live subscription's publishing interval and counts, revised the same
      way, and the subscription publishes at the new rate from its next
      cycle; SetMonitoringMode is honoured, a
      Disabled or Sampling item being silent until it is Reporting again and
      then hearing the current value first, and an item created Disabled
      silent from the start; and an item id that is not an item is refused
      in its own result. Items are booked without a blocking send, so a
      subscription that stops draining cannot freeze the server.
      CloseSession with deleteSubscriptions deletes the session's
      subscriptions and their items before it answers, and without it leaves
      them to their lifetime; a subscription id is never issued twice.
    source: "#subscriptions"
    tests:
      - go ./opcua/server TestCloseSessionHonoursDeleteSubscriptions
      - go ./opcua/server TestSubscriptionIDsAreNeverReused
      - go ./opcua/internal/uaserver TestCreateSubscriptionNeverReusesAnID
      - go ./opcua/server TestServerAnswersAfterASubscriptionIsCancelledWithValuesOwed
      - go ./tools/blackbox TestBlackbox/001-F13-closesession-deletes-subscriptions
      - go ./opcua/server TestRevisePublishing
      - go ./opcua/server TestPublishingIntervalIsRevisedNotActedOn
      - go ./opcua/server TestModifySubscriptionChangesThePublishingRate
      - go ./opcua/internal/uaserver TestModifyAfterTheTaskReturnedChangesNothing
      - go ./tools/blackbox TestBlackbox/001-F34-modifysubscription-no-op
      - go ./opcua/server TestMonitoringModeIsHonoured
      - go ./opcua/server TestDisablingDropsWhatTheItemHadQueued
      - go ./opcua/server TestCreateMonitoredItemsNeverBlocksOnAStalledSubscription
      - go ./opcua/server TestNewItemHearsTheCurrentValueOnce
      - go ./tools/blackbox TestBlackbox/001-F25-publish-interval-zero-crash
      - go ./tools/blackbox TestBlackbox/001-F27-setmonitoringmode-disabled
      - go ./tools/blackbox TestBlackbox/001-P-publish-interval-revised-range
      - go ./tools/blackbox TestBlackbox/001-P-monitoring-mode-transitions

  - id: OPC-015
    claim: >-
      A Read honours IndexRange (a slice of an array counted from 0; a
      String as an array of characters and an array of Strings with a
      second dimension over them; Bad_IndexRangeNoData for a range that
      starts past the end or a range on a number or boolean, the partial
      result for one that runs past the end;
      Bad_IndexRangeInvalid for a range that is not one), a monitored
      item's IndexRange means the same and the item hears only its slice,
      a Read names at most the 10 000 nodes MaxNodesPerRead advertises
      (Bad_TooManyOperations past it), and a Browse lists each reference
      once, the standard Server object's included.
    source: "#what-a-client-sees"
    tests:
      - go ./opcua/server TestParseNumericRange
      - go ./opcua/server TestReadHonoursIndexRange
      - go ./opcua/server TestMonitoredItemHonoursIndexRange
      - go ./opcua/server TestReadOverTheAdvertisedLimitIsRefused
      - go ./opcua/server TestBrowseListsEachReferenceOnce
      - go ./tools/blackbox TestBlackbox/001-F28-read-indexrange
      - go ./tools/blackbox TestBlackbox/001-F32-monitoreditem-indexrange
      - go ./tools/blackbox TestBlackbox/001-F33-indexrange-string
      - go ./tools/blackbox TestBlackbox/001-P-indexrange-error-codes
      - go ./tools/blackbox TestBlackbox/001-F35-indexrange-upper-overrun
      - go ./tools/blackbox TestBlackbox/001-F36-strarr-substring-overrun
      - go ./tools/blackbox TestBlackbox/001-P-monitoreditem-indexrange-edges
      - go ./tools/blackbox TestBlackbox/001-P-string-indexrange-characters
      - go ./tools/blackbox TestBlackbox/001-F29-server-browse-duplicate-refs
      - go ./tools/blackbox TestBlackbox/001-P-browse-paging-dedup
      - go ./tools/blackbox TestBlackbox/001-F30-maxnodesperread-enforced
      - go ./tools/blackbox TestBlackbox/001-P-read-limit-boundary

  - id: OPC-024
    claim: >-
      TranslateBrowsePathsToNodeIds resolves a path of browse names over the
      references a Browse lists, in the project namespace and in ns=0, a
      name compared exactly (case included), Bad_NoMatch for a path that
      reaches nothing. Call answers each method: the Server object's
      GetMonitoredItems and ResendData run for the calling session's own
      subscriptions (Bad_UserAccessDenied for another's),
      SetSubscriptionDurable and RequestServerStateChange are
      Bad_NotExecutable with Executable false, and a method that is not the
      object's is Bad_MethodInvalid. A Browse or BrowseNext names at most
      500 nodes, a TranslateBrowsePathsToNodeIds at most 100 paths (of at
      most 32 elements, Bad_QueryTooComplex past that), a Call at most 100
      methods, each limit advertised in OperationLimits and
      Bad_TooManyOperations past it.
    source: "#what-a-client-sees"
    tests:
      - go ./opcua/server TestTranslateBrowsePathsFollowsBrowse
      - go ./opcua/server TestOperationLimitsAreAdvertisedAndEnforced
      - go ./opcua/server TestCallAnswersEachMethod
      - go ./tools/blackbox TestBlackbox/001-F31-services-unsupported

  - id: OPC-025
    claim: >-
      ModifyMonitoredItems changes an item's sampling interval and client
      handle, revised as CreateMonitoredItems revises them, and the item is
      sampled at the new interval and heard under the new handle;
      SetPublishingMode pauses a subscription to keep-alives only and
      resumes it with what its items hold, and a subscription created with
      PublishingEnabled false starts paused. TransferSubscriptions moves a
      subscription to another session only of the same client application
      on a signed channel (same ApplicationUri), refuses a session on None
      or another application with Bad_UserAccessDenied, sends current
      values when asked, and tells the old session
      Good_SubscriptionTransferred, never a session that has taken the
      subscription back; a client on None claiming the application's
      ApplicationUri is not that application.
    source: "#subscriptions"
    tests:
      - go ./opcua/server TestModifyMonitoredItemsResamplesAndRehandles
      - go ./opcua/server TestSetPublishingModeHoldsAndResumes
      - go ./opcua/server TestTransferSubscriptionsToTheSameApplication
      - go ./opcua/server TestTransferSubscriptionsAfterCloseSession
      - go ./opcua/server TestTransferredBackIsNotReportedTransferred
      - go ./opcua/server TestNoneClientClaimingAnApplicationUriIsNotIt
      - go ./opcua/internal/uaserver TestMayTransfer
      - go ./opcua/internal/uaserver TestChangesAfterTheTaskReturnedChangeNothing
      - go ./tools/blackbox TestBlackbox/001-F31-services-unsupported
