page: website/src/content/docs/guides/alarms.md
title: Alarms
prefix: ALM
claims:
  - id: ALM-001
    claim: >-
      A project with no alarms section behaves exactly as before: there is no
      alarm engine, all five /api/alarms routes answer 404, /api/meta reports
      alarms false, and stream frames carry no alarms field.
    source: "#the-shape"
    tests:
      - go ./internal/project TestNoAlarmsSectionMeansNoEngine
      - go ./server TestAlarmRoutes404WithoutAnEngine
      - go ./server TestFrameCarriesAlarmSummary
    note: >-
      "Naming the manifest key" dropped (the page does not say it).
      TestNoAlarmRetainerLeavesTheStateAlone removed: retain contents are not
      one of the listed promises.

  - id: ALM-002
    claim: >-
      match takes type, member and tag, all globs; a rule with a member matches
      struct members, and a rule without one matches flat BOOL tags.
    source: "#rules-versus-definitions"
    tests:
      - go ./alarm TestMatchMemberDiscriminatesStructFromFlat
    partial: true
    note: >-
      Member and tag globs and the struct-versus-flat split are asserted. A
      glob in type is never tested (every case spells the type literally), and
      no test shows a member-less rule skipping a flat non-BOOL tag.
      "Case-insensitive" dropped (not on the page).

  - id: ALM-003
    claim: Rules are tried in file order and the first matching rule wins.
    source: "#rules-versus-definitions"
    tests:
      - go ./alarm TestExpandCoversTheFleetFromFewRules
    note: >-
      "A member no rule claims produces no definition" dropped (not on the
      page), and with it TestRulesExpandAgainstComposedTags, which asserted
      only that clause.

  - id: ALM-005
    claim: >-
      An unknown placeholder in an id, name, site, area, display or enable
      template is a load error, not literal braces on an operator screen.
    source: "#rules-versus-definitions"
    tests:
      - go ./alarm TestExpandRejectsUnknownPlaceholder
      - go ./internal/project TestBadTemplateFailsAtLoad
    partial: true
    note: Both tests put the bad placeholder in a name template; id, site, area, display and enable templates are not tested.

  - id: ALM-006
    claim: >-
      An alarm id declared in two sources (two rules, a rule and an explicit
      definition, or a manifest and an alarm file) is an error naming both
      sources, never last-wins.
    source: "#rules-versus-definitions"
    tests:
      - go ./alarm TestExpandRejectsDuplicateIDs
      - go ./alarm TestExpandRejectsRuleCollidingWithExplicitAlarm
      - go ./internal/project TestAlarmFilesDuplicateIDIsAnError
    partial: true
    note: >-
      Error-not-last-wins is asserted for all three pairs, but naming both
      sources only for two rules ("rule 0" and "rule 1"). The rule-versus-entry
      test checks only the id. The manifest-versus-alarm-file test checks only
      the substring "declared by both", and the message actually reads
      `alarm "X" is declared by both alarm "X" and alarm "X"`: it names
      neither the file nor the manifest.

  - id: ALM-007
    claim: >-
      Alarm files are bare YAML lists, composed with the manifest's own alarms
      section.
    source: "#rules-versus-definitions"
    tests:
      - go ./alarm TestLoadAlarmFile
      - go ./internal/project TestAlarmFilesCompose
    note: >-
      Unknown-key rejection dropped (the page does not promise it), and with it
      TestLoadRejectsUnknownKey, TestLoadRejectsUnknownKeyInsideMatch and
      TestManifestAlarmsDecodeStrictly.

  - id: ALM-008
    claim: >-
      site-from and area-from patterns set each definition's site and area
      from the tag name (RTU9_WEL15_FIT_001 gives site RTU9, area WEL15).
    source: "#the-shape"
    tests:
      - go ./internal/project TestRulesExpandAgainstComposedTags
    note: >-
      Rewritten to the page's example. The capture-group-required load error
      (TestSiteFromNeedsACaptureGroup) is not a promise of the page.

  - id: ALM-009
    claim: >-
      A condition becomes Unack-Active only after it has held for on-delay; a
      bit that drops before the delay elapses never qualifies and journals
      nothing.
    source: "#states"
    tests:
      - go ./alarm TestOnDelayQualifiesAgainstTheClock
      - go ./acceptance TestAlarmOnDelayWalksInVirtualTime

  - id: ALM-010
    claim: >-
      An active alarm whose condition goes false returns to Unack-RTN only
      after it has held false for off-delay.
    source: "#states"
    tests:
      - go ./alarm TestOffDelayHoldsTheAlarmUp

  - id: ALM-011
    claim: >-
      The ISA-18.2 transition table holds: Unack-Active acks to Ack-Active,
      Ack-Active returns to Normal on clear, Unack-RTN needs an ack to reach
      Normal, and Unack-RTN going true again becomes Unack-Active.
    source: "#states"
    tests:
      - go ./alarm TestLifecycleActiveAckRTN
      - go ./alarm TestStateMachineTable
      - go ./alarm TestUnackRTNRequiresAnAck

  - id: ALM-012
    claim: >-
      ack-required false collapses Unack-Active to Ack-Active and Unack-RTN to
      Normal on arrival; auto-clear false latches the alarm in Unack-RTN until
      acked.
    source: "#states"
    tests:
      - go ./alarm TestStateMachineTable

  - id: ALM-013
    claim: >-
      A shelf always expires (there is no permanent shelf), and the alarm then
      returns to the state it interrupted rather than dropping to Normal.
    source: "#states"
    tests:
      - go ./alarm TestShelveExpires
      - go ./alarm TestShelveRejectsThePastAndTheUnshelvable
      - go ./server TestAckShelveAndUnshelve
      - naut examples/lift-station a shelved high-level alarm is silent and always expires
    note: >-
      The 400 status and "permanent shelf" message dropped from the claim (not
      on the page); the tests still show both a past shelf and an open-ended
      request refused.

  - id: ALM-014
    claim: >-
      A shelved alarm is silent: off the active list, and journalling nothing
      while its condition cycles.
    source: "#states"
    tests:
      - go ./alarm TestShelveIsSilentButStillTracks
      - go ./alarm TestShelveExpires
      - naut examples/lift-station a shelved high-level alarm is silent and always expires
    note: >-
      "Condition still tracked" dropped: not on the page, and the test cannot
      show it (the condition ends true and the interrupted state was already
      Unack-Active, so unshelve gives the same answer either way). The
      non-shelvable refusal is not a page promise, so
      TestShelveRejectsThePastAndTheUnshelvable was removed here.

  - id: ALM-016
    claim: >-
      When the enable path goes false the alarm becomes Suppressed (leaving the
      active list), and returns to its live state when enable goes true again,
      with suppress and unsuppress journalled.
    source: "#states"
    tests:
      - go ./alarm TestSuppressedWhenEnableFalse
      - naut examples/remote-fleet/scada a dark site suppresses its own pump-fault alarm instead of leaving it active

  - id: ALM-017
    claim: >-
      A definition whose tag does not resolve (a site that has never birthed)
      is Suppressed with a reason, never an error that faults the engine.
    source: "#states"
    tests:
      - go ./alarm TestMissingTagSuppressesWithAReason
    note: >-
      The non-BOOL case is not on the page; TestNonBoolConditionIsSuppressedNotFatal
      was removed.

  - id: ALM-018
    claim: >-
      Acknowledgement and shelf persist through the retain store, and a
      restarted or failed-over engine restores them: an acked alarm is
      Ack-Active again rather than unacked, and a shelved alarm stays shelved.
    source: "#ack-is-host-state"
    tests:
      - go ./alarm TestRetainedAckSurvivesRestart
      - go ./runtime TestAlarmStateRoundTripsThroughRetain
    partial: true
    note: >-
      The two halves are tested apart: the engine's snapshot and restore, and
      the runtime's retain plumbing with a fake engine. Registering the real
      engine with the runtime (rt.SetAlarms in cmd/naut) is not tested, so
      dropping that line would leave both tests green.

  - id: ALM-019
    claim: >-
      A standby re-reads the retain store on the leadership edge and restores
      alarm state, so a failover does not resurrect acked alarms as unacked.
    source: "#ack-is-host-state"
    tests:
      - go ./runtime TestTakeoverRestoresAlarmsOnTheLeadershipEdge
    note: >-
      Engine-level restore is tested with a fake alarm engine; there is no
      end-to-end two-node failover test with a real engine.
    partial: true

  - id: ALM-020
    claim: >-
      Only ack and shelf persist; active and RTN are not retained but re-derive
      from the field.
    source: "#ack-is-host-state"
    tests:
      - go ./alarm TestRetainedAckSurvivesRestart
    partial: true
    note: >-
      The snapshot holds only ack and shelf (the retained record has no field
      for anything else). No test restores an ack while the field is false to
      show the state re-derives rather than coming back active. The
      unknown-id and expired-shelf cases are not on the page, so
      TestRestoreIgnoresUnknownAndExpired was removed.

  - id: ALM-021
    claim: >-
      Acknowledgement and shelf are never written back to the edge device's
      tags.
    source: "#ack-is-host-state"
    tests: []
    note: >-
      No test asserts that ack or shelve performs no tag write.
      (TestAlarmAckVerb's `expect: FIT_001.L: true` after an ack cannot count:
      the program rewrites that bit every scan.)

  - id: ALM-022
    claim: GET /api/alarms returns a timestamp, the summary and the active alarm list.
    source: "#the-api"
    tests:
      - go ./server TestAlarmsListAndSummary

  - id: ALM-023
    claim: >-
      POST /api/alarms/ack acknowledges the listed ids, or all of them in one
      request.
    source: "#the-api"
    tests:
      - go ./server TestAckShelveAndUnshelve
      - go ./alarm TestAckAllAndUnknownID
    note: The returned count, the 404 for an unknown id and the no-half-apply rule are code details, not page claims.

  - id: ALM-024
    claim: >-
      POST /api/alarms/shelve shelves an alarm for the given seconds and
      records who (by); POST /api/alarms/unshelve takes it off the shelf.
    source: "#the-api"
    tests:
      - go ./server TestAckShelveAndUnshelve
    partial: true
    note: >-
      The shelf's expiry is asserted only to be non-zero, not to be now plus
      the requested seconds.

  - id: ALM-025
    claim: >-
      GET /api/alarms/journal filters by from, to, site, priority, id, kind,
      state, free text q and limit.
    source: "#the-api"
    tests:
      - go ./server TestJournalQuery
      - go ./alarm TestJournalFiltering
    partial: true
    note: >-
      Over HTTP only kind, site and q are asserted (plus a malformed from
      rejected). Priority, id, the from/to range and limit are asserted only
      on the ring journal. The state filter is not asserted anywhere.
      TestParseTimeAcceptsBothForms removed (a parse helper, not a filter).

  - id: ALM-026
    claim: >-
      Alarm writes (ack, shelve, unshelve) require the same authorization as a
      tag write (Bearer or X-Nautilus-Token), while reads stay ungated.
    source: "#the-api"
    tests:
      - go ./server TestAlarmWritesHonorAuth
    note: >-
      No token gives 401 and X-Nautilus-Token gives 200; an Authorization:
      Bearer token is not tried, and the same-origin default for browser writes
      is not asserted.
    partial: true

  - id: ALM-027
    claim: A standby forwards alarm writes to the leader the same way it forwards a tag write.
    source: "#the-api"
    tests: []
    note: No test covers forwarding of /api/alarms writes from a standby.

  - id: ALM-028
    claim: >-
      Each stream frame carries a counts-only alarms summary (active, unacked,
      shelved, suppressed, byPriority, worst, newest, rev), never alarm rows.
    source: "#the-api"
    tests:
      - go ./server TestFrameCarriesAlarmSummary
      - go ./alarm TestSummaryCounts
    partial: true
    note: >-
      The frame test checks active and worst; the engine test adds unacked,
      shelved, byPriority and newest. Suppressed and rev are not checked in
      these tests, and the frame's JSON field names are not asserted.

  - id: ALM-029
    claim: >-
      The summary rev bumps on any state change and stays constant across
      quiet scans.
    source: "#the-api"
    tests:
      - go ./alarm TestSummaryRevBumpsOnlyOnChange
    partial: true
    note: Bumps are asserted for activation and ack only; rtn, shelve, unshelve, suppress and unsuppress are not checked.

  - id: ALM-030
    claim: >-
      /api/meta reports whether the alarm engine is present and the offered
      shelve times in seconds.
    source: "#the-api"
    tests:
      - go ./server TestMetaReportsAlarmsAndShelveTimes
    note: TestConfigShelveDurationsFallBack removed (default shelve times are not a page claim).

  - id: ALM-032
    claim: >-
      Every state change produces exactly one journal event of kind active,
      rtn, ack, shelve, unshelve, suppress or unsuppress.
    source: "#the-journal"
    tests:
      - go ./alarm TestStateMachineTable
      - go ./alarm TestSuppressedWhenEnableFalse
      - go ./alarm TestShelveExpires
    note: TestEventJSONShape removed (it serialises a hand-built event; no state change is involved).

  - id: ALM-033
    claim: >-
      An in-memory journal ring is always on and bounded by its keep depth,
      dropping the oldest events, so the journal works without any database.
    source: "#the-journal"
    tests:
      - go ./alarm TestRingJournalRoundTrip
    note: The always-on default (no sink configured) and the keep config key are not asserted at the project level.
    partial: true

  - id: ALM-034
    claim: The file journal sink is a durable journal written as rotated JSONL.
    source: "#the-journal"
    tests:
      - go ./alarm TestFileJournalRoundTrip
      - go ./alarm TestFileJournalRotatesAndStillQueriesAcross
    note: >-
      Querying across generations and skipping a torn line are code details,
      not page claims; TestFileJournalSkipsATornLine was removed.

  - id: ALM-035
    claim: The postgres journal sink creates its table idempotently at startup.
    source: "#the-journal"
    tests:
      - go ./alarm TestPGJournal
    partial: true
    note: >-
      Skips unless NAUTILUS_TEST_DATABASE_URL points at a real Postgres (no CI
      job sets it); idempotence shows only on a second run against the same
      database. "Queries newest first" dropped (not on the page).

  - id: ALM-036
    claim: >-
      The postgres sink reads its connection string from the environment
      variable dsn-env names, defaulting to NAUTILUS_ALARM_DB_URL and falling
      back to DATABASE_URL.
    source: "#the-journal"
    tests:
      - go ./internal/project TestPostgresJournalNeedsAnEnvironmentVariable
    partial: true
    note: >-
      Only the both-unset case is tested (the error names
      NAUTILUS_ALARM_DB_URL). That a set dsn-env, the default or the
      DATABASE_URL fallback is actually read is not asserted.

  - id: ALM-038
    claim: >-
      Notifiers (log, and webhook with a header) receive each event and run off
      the scan goroutine.
    source: "#the-journal"
    tests:
      - go ./alarm TestWebhookPostsTheEventAsJSON
      - go ./alarm TestEngineNotifiesOffTheScanGoroutine
    partial: true
    note: >-
      Asserted: the engine hands each event to a notifier, and the webhook
      posts it with a custom header. Not asserted: running off the scan
      goroutine (the test passes with synchronous delivery too), the log
      notifier's output (TestLogNotifier logs to io.Discard and checks only
      for no error, so it was removed), and header-env. Retry and
      final-status behaviour are not page claims; their tests were removed.

  - id: ALM-039
    claim: >-
      A slow notifier drops events with a counter on a bounded queue instead of
      stalling the scan.
    source: "#the-journal"
    tests: []
    note: Only the idle-notifier path (Dropped is 0) is tested; no test saturates the queue.

  - id: ALM-040
    claim: >-
      The engine evaluates once per main scan on the post-scan hook, so one
      scan over a tripped limit is enough to raise the alarm.
    source: "#where-the-engine-runs"
    tests:
      - go ./internal/project TestEngineEvaluatesOnScan
    partial: true
    note: >-
      One scan is shown to be enough (the bit the logic sets in that scan is
      seen); that evaluation happens exactly once per main scan is not
      asserted.

  - id: ALM-041
    claim: A standby never evaluates alarms because it skips Scan.
    source: "#where-the-engine-runs"
    tests:
      - go ./runtime TestStandbyDoesNotScan
    partial: true
    note: Asserts the standby does not scan; does not assert on the alarm engine directly.

  - id: ALM-042
    claim: >-
      The same engine works on a single controller against a BOOL its own
      logic computes, on a one-box memory-driver project.
    source: "#where-the-engine-runs"
    tests:
      - naut examples/lift-station a shelved high-level alarm is silent and always expires
    note: TestLiveSealInAndAlarm removed (it checks a tag on a fake live controller; no alarm engine is involved).

  - id: ALM-043
    claim: >-
      naut check reports a condition path naming a missing member or a non-BOOL
      as an error, an undeclared tag and a rule matching nothing as warnings.
    source: "#checking-it-offline"
    tests:
      - go ./internal/project TestCheckAlarmsCatchesUnknownMember
      - go ./internal/project TestCheckAlarmsWarnsOnUndeclaredAndDeadRule

  - id: ALM-044
    claim: >-
      Acceptance tests assert alarm state with the alarms matchers (active,
      unacked, shelved, state, priority, journal) and drive it with the ack,
      shelve and unshelve verbs, in virtual time so an on-delay is exact.
    source: "#testing"
    tests:
      - go ./acceptance TestAlarmOnDelayWalksInVirtualTime
      - go ./acceptance TestAlarmAckVerb
      - go ./acceptance TestAlarmShelveAndUnshelveVerbs
      - go ./acceptance TestAlarmFailureNamesWhatItSaw
    partial: true
    note: >-
      Only the active matcher is shown to fail on a wrong expectation
      (TestAlarmFailureNamesWhatItSaw). unacked, shelved, state, priority and
      journal appear only in suites that must pass, so a matcher that ignored
      its argument would go unnoticed. The no-leak and no-engine error cases
      are not page claims; their tests were removed.

  - id: ALM-045
    claim: >-
      naut alarms list dumps the expanded alarm set (-o yaml re-loadable,
      with -count, -site and -priority narrowing it).
    source: "#the-shape"
    tests: []
    note: No test found for the naut alarms list command.
