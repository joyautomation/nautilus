page: website/src/content/docs/guides/real-time.md
title: Scan timing and real-time
prefix: RT
claims:

  - id: RT-001
    claim: >-
      Lateness is kept per task, cumulative since start, as the time from a
      slot's due time to the scan actually starting; late counts scans that
      started more than the threshold after their slot.
    source: "#what-the-diagnostics-measure"
    tests:
      - go ./runtime TestLateTrackerCountsAndPercentiles
      - go ./runtime TestLateUs
      - go ./runtime TestLatenessUnderVirtualClock
    note: >-
      "An early sample counts as a scan, not as late" dropped (not on the
      page). TestLatenessUnderVirtualClock added for the per-task clause: main
      and the fast task carry separate lateness blocks.

  - id: RT-002
    claim: >-
      overruns counts scans whose execution took longer than the period.
    source: "#what-the-diagnostics-measure"
    tests:
      - go ./runtime TestLateTrackerCountsAndPercentiles
    partial: true
    note: Asserted on the tracker with a flag handed in; the detection of an over-period execution by the run loop is not asserted.

  - id: RT-003
    claim: >-
      The late threshold is the task's late-threshold, defaulting to a tenth
      of the period.
    source: "#what-the-diagnostics-measure"
    tests:
      - go ./runtime TestLateThresholdDefaults
      - go ./runtime TestLatenessUnderVirtualClock
    partial: true
    note: The late-threshold manifest key is not parsed in a project-level test. The page example comment says the default for the 1 ms task is 100 µs, consistent with a tenth.

  - id: RT-004
    claim: >-
      p50, p99 and p999 are bucket upper edges, at most 3 percent above the
      true value.
    source: "#what-the-diagnostics-measure"
    tests:
      - go ./runtime TestLateTrackerCountsAndPercentiles
      - go ./runtime TestFineBucketsAreMonotonic
      - go ./runtime TestFineResolution
    partial: true
    note: >-
      The tests bound the error at 1/32 (3.125 %), not the page's 3 %: with
      fineSub = 32 the widest bucket is 3.125 % of its lower edge, so the
      page's figure is slightly optimistic. "Empty trackers report zeros"
      dropped (not on the page), with TestLateTrackerEmpty.

  - id: RT-005
    claim: The lateness histogram is 1-2-5 log-spaced from 1 µs to 100 ms.
    source: "#what-the-diagnostics-measure"
    tests:
      - go ./runtime TestCoarseIndex
      - go ./runtime TestLateTrackerCountsAndPercentiles
    partial: true
    note: >-
      Bucket indexes pin the edges at 1, 2, 5, 1000 and 100000 µs and the
      count between them; the other edge values, and the bucketsUs list
      reported in the snapshot, are not listed.

  - id: RT-007
    claim: >-
      The scan block reports scan time (lastMs, minMs/maxMs, a 2 ms histogram,
      the phase bar) separately from lateness.
    source: "#what-the-diagnostics-measure"
    tests:
      - go ./runtime TestScanStatsDiagnostics
      - go ./server TestFrameCarriesScanDiagnostics
    partial: true
    note: >-
      lastMs, min/max and a 15-bucket histogram are asserted. The 2 ms bucket
      width and the phase-bar fields (beyond ExecUs > 0) are not. "Per task"
      dropped (the page keeps lateness, not scan time, per task).

  - id: RT-008
    claim: >-
      The loop keeps an absolute schedule so lateness never accumulates, and a
      loop more than a whole period behind skips the lost slots and reports
      them as missed instead of firing a burst of catch-up scans.
    source: "#what-the-runtime-does"
    tests:
      - go ./runtime TestRunLoopHoldsScheduleAndCountsMissed
    partial: true
    note: >-
      Missed-slot reporting and the no-burst bound (scans + missed <= 152) are
      asserted. Non-accumulation is not: the lower bound of 120 of about 150
      scans would also pass a loop that drifted by up to 20 %. (Bounds are
      loose for shared CI runners.) "Does not start before its slot" dropped
      from the claim (not on the page).

  - id: RT-010
    claim: >-
      On Linux the sleep is the kernel's absolute sleep (clock_nanosleep) on
      a thread of the task's own with reduced timer slack, avoiding the
      one-millisecond rounding of a Go timer.
    source: "#what-the-runtime-does"
    tests:
      - go ./runtime TestSleepUntilLandsOnDeadline
    partial: true
    note: Checks the wake-up lands within 10 ms of the deadline; the sub-millisecond precision and timer-slack setting are not asserted (hardware dependent).

  - id: RT-011
    claim: >-
      Task isolation: each scan copies its external tags in, executes
      privately, and commits what changed as one unit, so a reader never sees
      a scan half-done.
    source: "#what-the-runtime-does"
    tests:
      - go ./runtime TestScanViewSnapshotAndCommit
      - go ./runtime TestScanCommitsAreAtomic
    note: The equal-value-write generation rule dropped from the claim (not on the page).

  - id: RT-012
    claim: >-
      Tasks run concurrently, and a fast task never waits behind a slow one.
    source: "#what-the-runtime-does"
    tests:
      - go ./runtime TestFastTaskDoesNotWaitForSlowTask
    note: >-
      Skips on machines where the slow scan takes under 5 ms.
      TestTasksRunConcurrently removed: it only checks that both tasks scanned
      during Run, which a sequential scheduler would pass too.

  - id: RT-013
    claim: >-
      Two tasks writing the same tag resolve by commit order, last commit wins.
    source: "#what-the-runtime-does"
    tests:
      - go ./runtime TestScanViewSnapshotAndCommit

  - id: RT-014
    claim: >-
      The VM makes no allocation per builtin call, user-function call or
      function-block step, so the scan loop gives the garbage collector no
      work.
    source: "#what-the-runtime-does"
    tests: []
    note: Verified by allocation benchmarks (b.ReportAllocs) that do not assert a zero count; no AllocsPerRun test.

  - id: RT-015
    claim: >-
      A 1 ms task alone runs every scan with p99 lateness around 30 to 55 µs
      on a busy desktop with a stock kernel, and a 20 ms task beside it
      changes nothing it can see.
    source: "#what-the-runtime-does"
    tests: []
    partial: true
    note: Hardware-dependent latency figure measured with tools/jitter and docs/design/realtime.md; not CI-testable.

  - id: RT-016
    claim: A task's cpu setting pins its thread to that core (Linux).
    source: "#priority-and-pinning"
    tests:
      - go ./runtime TestApplySchedAffinity
      - go ./runtime TestRunReportsSched
    partial: true
    note: >-
      Pinning is asserted on applySched (skips when only one CPU is allowed),
      and Run is shown to apply a CPU list from Options. The cpu: manifest key
      is not parsed in a project-level test. The nonexistent-CPU failure is
      not a page claim.

  - id: RT-017
    claim: >-
      A task's priority requests SCHED_FIFO at that priority (1 to 99).
    source: "#priority-and-pinning"
    tests:
      - go ./runtime TestApplySchedFIFORefusalIsExplicit
    partial: true
    note: >-
      The refusal path and the 1-99 range check are asserted, but the whole
      test skips where SCHED_FIFO is granted, and a successful SCHED_FIFO
      grant is never asserted. The priority: manifest key is not parsed in a
      project-level test.

  - id: RT-018
    claim: >-
      A refused SCHED_FIFO or pin request is loud: the error names the fix,
      the refusal shows on the task's row (REFUSED), and the task runs at
      normal priority.
    source: "#priority-and-pinning"
    tests:
      - go ./runtime TestApplySchedFIFORefusalIsExplicit
      - go ./runtime TestRunReportsSched
    partial: true
    note: >-
      Asserted: a SCHED_FIFO refusal names CAP_SYS_NICE, setcap and ulimit -r,
      and Run records either applied or the refusal in the task's sched stats
      (RT-019 merged here). Not asserted: the REFUSED dashboard label (a
      Svelte component), the logged error line, the wording of a pin refusal,
      and that the refused task keeps scanning.

  - id: RT-020
    claim: >-
      SCHED_FIFO priority reduces p99 lateness from 55 µs to 20 µs and the
      worst case from 2.3 ms to 0.3 ms on the busy desktop; cpu alone worsens
      p99 to 300 to 400 µs.
    source: "#priority-and-pinning"
    tests: []
    partial: true
    note: Hardware and load dependent measurement; not CI-testable.

  - id: RT-021
    claim: >-
      A task that continuously overruns its period under the kernel RT
      throttle (95 percent of every second) shows as missed slots.
    source: "#priority-and-pinning"
    tests: []
    partial: true
    note: Depends on kernel sched_rt_runtime_us; not CI-testable. Missed-slot counting itself is covered by TestRunLoopHoldsScheduleAndCountsMissed.

  - id: RT-022
    claim: >-
      Kernel boot parameters (isolcpus, nohz_full, rcu_nocbs, irqaffinity)
      keep a pinned core quiet.
    source: "#keeping-a-core-quiet"
    tests: []
    partial: true
    note: Kernel configuration guidance, not a runtime behaviour a test can falsify.

  - id: RT-023
    claim: >-
      With GOGC=off and a memory limit, GC collections drop from 448 a minute
      with a 2.1 ms worst pause to 12 with an 82 µs worst pause under 50 MB/s
      of allocation elsewhere.
    source: "#the-garbage-collector"
    tests: []
    partial: true
    note: Hardware and workload dependent measurement; not CI-testable.

  - id: RT-024
    claim: >-
      tools/jitter runs a mixed resource (1 ms loopback I/O task, 10 ms task,
      slow task, allocation-heavy task) on the real scheduler and writes a
      report with machine, kernel, Go version and settings beside the
      numbers.
    source: "#measuring-it-yourself"
    tests: []
    note: No test for the jitter tool.
