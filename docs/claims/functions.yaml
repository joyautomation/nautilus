page: docs/functions.md
title: Language reference
prefix: FN
claims:
  # ── How a scan evaluates ────────────────────────────────────────────
  - id: FN-001
    claim: >-
      Statements and rungs evaluate top to bottom within a scan: a value
      written by one is visible to the ones below it in the same scan and to
      everything on the next scan (the seal-in idiom works).
    source: "#how-a-scan-evaluates"
    tests:
      - go ./runtime TestLadderProgram
      - go ./lang/fbd TestSealInLatch
      - go ./lang/conformance TestConformance/ld-scan-order
    note: >-
      ld-scan-order runs the same four assignments in ST, LD and FBD: a coil
      written by one rung is read as a contact by the next rung in the same
      scan, and a coil written below its reader is seen by it one scan later.
      The seal-in is run end to end by TestLadderProgram and TestSealInLatch.

  - id: FN-002
    claim: >-
      A diagnostic raised anywhere in the .ld/.fbd to ST chain lands on the
      user's own source line (the rung, the FBD statement), because every
      hop preserves a line map.
    source: "#how-a-scan-evaluates"
    tests:
      - go ./lang/ld TestLineMap
      - go ./lang/fbd TestTranspileLineMap
      - go ./internal/lsp TestAnalyzeLDHopErrorLandsOnRung
      - go ./internal/lsp TestAnalyzeLDFunctionBlocks
      - go ./internal/lsp TestAnalyzeFBDParseError
      - go ./internal/lsp TestAnalyzeFBDMapsDiagnosticsToSource
    note: >-
      The line maps are tested per hop, and the editor's diagnostics (the
      language server) land on the source line for an error raised at each
      stage: the ladder hop (a misplaced coil, on its RUNG), the FBD hop (a
      netlist parse error) and ST (an undeclared name, through .fbd and
      through .ld).

  - id: FN-003
    claim: >-
      Logic that does not type-check is a compile diagnostic on the offending
      line or rung, never a silent coercion (for example a REAL assigned to a
      BOOL).
    source: "#how-a-scan-evaluates"
    tests:
      - go ./lang/st TestLowerAssignRealToBool
      - go ./lang/st TestLowerErrorPinsOffendingName
      - go ./lang/st TestLowerIfNonBool
    partial: true
    note: Sampled cases; there is no exhaustive type-rule matrix.

  # ── FBD networks ────────────────────────────────────────────────────
  - id: FN-004
    claim: >-
      FBD execution order is network order: network 1 runs completely, then
      network 2. A read of a later network's FB output sees the value from
      the previous scan.
    source: "#fbd-networks"
    tests:
      - go ./lang/fbd TestNetworksRunInOrder
      - go ./lang/fbd TestNetworksParseModelAndOrder

  - id: FN-005
    claim: >-
      Statements before the first NETWORK line form an untitled first
      network, and a body with no NETWORK line is a single network, exactly
      the program it always was.
    source: "#fbd-networks"
    tests:
      - go ./lang/fbd TestNetworksParseModelAndOrder
      - go ./lang/fbd TestBodyWithoutNetworkLinesIsOneNetwork
    note: >-
      The implicit untitled first network is asserted
      (TestNetworksParseModelAndOrder). A body with no NETWORK line reports no
      networks, transpiles to the same ST as the same statements under one
      NETWORK line, and runs as one network (the FB call sorted ahead of its
      reader, unlike the two-network control).

  - id: FN-006
    claim: >-
      NETWORK stands alone on its line; a tag that happens to be called
      Network still works (Network := x is a coil), and a statement on the
      NETWORK line is refused.
    source: "#fbd-networks"
    tests:
      - go ./lang/fbd TestNetworkParseEdges

  - id: FN-007
    claim: >-
      A read that crosses a network boundary (an FB output or a wire from
      another network) draws as a variable box in the reading network, never
      as a line across bands.
    source: "#fbd-networks"
    tests:
      - go ./lang/fbd TestCrossNetworkReadsDrawAsBoxesInTheReadingNetwork
      - go ./lang/fbd TestNetworksParseModelAndOrder
    note: >-
      A named wire and an FB instance output read from another network are
      each a variable box in the reading network, and no edge joins nodes of
      two networks; the same wire read inside its own network stays a line.

  # ── Ladder power flow ───────────────────────────────────────────────
  - id: FN-008
    claim: >-
      Series ladder elements AND together, parallel branch legs OR (legs are
      series and nest freely), a plain contact passes power when its tag is
      TRUE and an NC contact (/Tag) when it is FALSE.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestRungShapes
      - go ./lang/ld TestTranspileRungs
      - go ./lang/conformance TestConformance/ld-coils/nested branch, bare leg passes at once
      - go ./lang/conformance TestConformance/ld-coils/nested branch, FB leg is Q false at PT-1ms, true at PT, drop resets

  - id: FN-009
    claim: >-
      A rising-edge contact (+Tag) passes power for exactly one scan on the
      tag's 0 to 1 transition and a falling-edge contact (-Tag) for one scan
      on 1 to 0; holding the input steady fires neither again.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestEdgeContactOneShot
      - go ./lang/conformance TestConformance/ld-coils/+ contact passes one scan on the rise, - contact one scan on the fall

  - id: FN-010
    claim: >-
      A plain coil sets its tag to the rung condition every scan; a set coil
      latches (Tag := Tag OR condition) and a reset coil unlatches (Tag :=
      Tag AND NOT condition).
    source: "#ladder-power-flow"
    tests:
      - go ./lang/conformance TestConformance/ld-coils/S coil latches, R coil unlatches, R wins a same-scan tie
      - go ./lang/conformance TestConformance/ld-coils/+ contact passes one scan on the rise, - contact one scan on the fall

  - id: FN-011
    claim: >-
      A P coil is TRUE for exactly one scan when the rung condition rises and
      an N coil for one scan when it falls.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/conformance TestConformance/ld-coils/P coil is TRUE for exactly one scan on the rising edge
      - go ./lang/conformance TestConformance/ld-coils/N coil is TRUE for exactly one scan on the falling edge

  - id: FN-012
    claim: >-
      Edge instances get a stable derived name (from rung name, reference
      and position among repeats), so the R_TRIG's retained state survives an
      unrelated edit; two edge contacts on the same tag in one rung are
      independent instances.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestEdgeContactSyntax
      - go ./lang/ld TestEdgeTrigNamesMatchTheCompiler
      - go ./lang/ld TestEdgeStateSurvivesUnrelatedEdit
    note: >-
      Naming and two instances for two contacts on one tag are asserted on
      the transpiled output; TestEdgeStateSurvivesUnrelatedEdit inserts a
      rung ahead and edits another, warm-swaps the frame (ir.MigrateFrame)
      with the tag held TRUE, and the contact does not fire again.

  - id: FN-013
    claim: >-
      A function contact FN(args) passes power when the call yields TRUE, and
      /FN(args) negates it; the negation applies to any BOOL-yielding contact
      term (a plain ref, an accessor chain such as /t1.Q, a call such as
      /GT(a, b)).
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestNegatedFunctionContact
      - go ./lang/ld TestFunctionContactExpressionArgs
      - go ./lang/ld TestTranspileRungs
      - go ./lang/conformance TestConformance/ld-coils/negated function contact passes power when the call returns FALSE

  - id: FN-014
    claim: >-
      A rung with only a coil is driven by the rail (TRUE), and multiple
      coils on one rung share the same condition.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestRungShapes
      - go ./lang/ld TestTranspileRungs

  - id: FN-015
    claim: >-
      A rung's only output may be a function block instance, with no trailing
      coil: its own output (inst.Q, inst.DN) is read elsewhere.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestFBOnlyRung
      - go ./lang/conformance TestConformance/ld-coils/FB-only rung (no coil) still runs, its outputs read elsewhere

  - id: FN-016
    claim: >-
      A rung's trailing output zone (coils or a rung-final function block)
      must be contiguous at the rung's right end; a coil ahead of later
      elements is the compile error "coils must sit at the rung's right end".
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestRungErrors
      - go ./lang/ld TestCoilBeforeFunctionBlockRefused

  - id: FN-017
    claim: >-
      The BOOL rule: anything that gates ladder power must yield BOOL.
      Comparisons (GT, GE, LT, LE, EQ, NE) are valid contacts; a numeric
      function such as ADD(TempC, 0.0) used as a contact is a compile error,
      not a pass-through.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestNumericFunctionContactIsACompileError
      - go ./lang/ld TestFunctionContactExpressionArgs
    note: >-
      ADD(TempC, 0.0) as a contact fails with the page's two messages
      ("operator AND on BOOL and REAL" in series, "cannot assign REAL to BOOL"
      alone), and all six comparisons are run as contacts.

  - id: FN-018
    claim: >-
      An assignment element { Tag := expr } is made only when the rung has
      power at that point and passes power through unchanged; several may be
      chained with ";".
    source: "#ladder-power-flow"
    tests:
      - go ./lang/ld TestAssignmentElement
      - go ./lang/conformance TestConformance/ld-assign
    note: >-
      ld-assign runs two chained assignments behind a contact: made every
      powered scan, held while unpowered, and power passes through to the coil
      after a second contact (A AND B). TestAssignmentElement asserts the SEL
      lowering.

  - id: FN-019
    claim: >-
      An assignment element's value is evaluated every scan like any block
      (compiled as a SEL), so an array index in it must stay valid while the
      rung is false.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/conformance TestLadderAssignmentIndexEvaluatedWhileRungFalse
      - go ./lang/ld TestAssignmentElement
    note: >-
      With the rung FALSE, { Out := Arr[I] } faults the scan when I is out of
      bounds and leaves Out alone when it is in range; TestAssignmentElement
      asserts the SEL lowering.

  - id: FN-020
    claim: >-
      The standard's output binding (inst:TON(PT := T#5S, ET => Elapsed))
      stores an FB output into a variable at the call site, in ladder, FBD
      and ST.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/conformance TestConformance/ld-coils/FB-only rung (no coil) still runs, its outputs read elsewhere
      - go ./lang/st TestUserFB_OutputBinding
      - go ./lang/fbd TestOutputBinding
      - go ./lang/ld TestLadderOutputBinding
    note: >-
      Ladder (CV => ld_Cnt in ld-coils; ET => Elapsed in
      TestLadderOutputBinding), ST (Y => result) and FBD (ET => Elapsed in
      TestOutputBinding) are run and the bound variable asserted.

  - id: FN-021
    claim: >-
      An instance output is addressable as inst.Pin anywhere in the program
      that declares the instance, a non-BOOL pin as a contact's argument
      included. Another task's program cannot name the instance (t1.Q, or
      through its program's or task's name): that is an undeclared
      identifier whose error names the owning program and says to go
      through a tag. Published to a tag in the owner, the output reaches
      the other task as of the owner's last committed scan — at once for a
      reader that scans after the owner, on its next scan for one that
      scans before.
    source: "#ladder-power-flow"
    tests:
      - go ./lang/conformance TestConformance/ld-coils/FB-only rung (no coil) still runs, its outputs read elsewhere
      - go ./lang/conformance TestCrossTaskPublishedInstanceOutput
      - go ./lang/conformance TestCrossTaskInstanceIsDiagnosed
      - go ./lang/conformance TestUndeclaredIdentifierWithoutPeerKeepsItsMessage
      - go ./cmd/naut TestCheckGoldenCrossTaskInstance
      - go ./internal/lsp TestCrossTaskInstanceDiagnostic
    note: >-
      #327: the page used to say an instance output is readable from
      another task's program; it never was (an instance lives in its
      program's private frame, and tasks share only the tag store). The
      page now states the rule and the tag recipe. The diagnostic is
      asserted from the runtime (project load), naut check and the
      language server, for ST and ladder readers; the recipe's timing in
      naut test's deterministic task order (main first, then tasks: order).

  # ── SFC qualifiers and step supervision ─────────────────────────────
  - id: FN-022
    claim: >-
      The untimed action qualifiers behave as specified: N active while the
      step is active, S / R set / reset once on the activation scan, P1 / P
      one scan on activation and P0 one scan on deactivation.
    source: "#sfc-action-qualifiers-and-step-supervision"
    tests:
      - go ./lang/conformance TestConformance/sfc-qualifiers
      - go ./lang/sfc TestSetActsOnceThenActionMayClear
      - go ./lang/sfc TestResetActsOnceThenActionMaySet

  - id: FN-023
    claim: >-
      The timed qualifiers L, D, SD, DS and SL behave as specified: L active
      from activation for the duration, D once active the duration, SD / DS /
      SL stored past leaving the step, SL for the duration even after
      leaving.
    source: "#sfc-action-qualifiers-and-step-supervision"
    tests:
      - go ./lang/conformance TestConformance/sfc-timed-qualifiers

  - id: FN-024
    claim: >-
      An R acts on its step's activation scan and clears the S, SD, DS and SL
      latches on its target; a timed SL that has run out stays latched until
      an R.
    source: "#sfc-action-qualifiers-and-step-supervision"
    tests:
      - go ./lang/conformance TestConformance/sfc-timed-qualifiers/R resets the stored qualifiers
      - go ./lang/conformance TestConformance/sfc-timed-qualifiers/R before PT cuts SL short and stops SD from ever coming on
      - go ./lang/conformance TestConformance/sfc-timed-qualifiers/re-entry restarts L and D; a timed-out SL stays off until an R
      - go ./lang/conformance TestConformance/sfc-timed-qualifiers/after an R, SL arms again on the next activation
      - go ./lang/conformance TestConformance/sfc-timed-qualifiers/R acts once on its step's activation, not on every scan the step is active
      - go ./lang/conformance TestConformance/sfc-timed-qualifiers/R clears an S latch - the stored body runs on after the step is left until the R
    note: >-
      R acting once on its activation scan, R clearing SD, DS and SL, a
      timed-out SL staying off until an R, and R clearing an S latch (an
      S-stored BOOL and an S-stored ACTION body that keeps running in the next
      step until the R) are asserted.

  - id: FN-025
    claim: >-
      Both association spellings compile and mean the same: "Q Target;" /
      "Q Target(T#3S);" and the standard's textual "Target(Q);" /
      "Target(Q, T#3S);". The duration of a timed qualifier is a TIME literal
      or a TIME variable.
    source: "#sfc-action-qualifiers-and-step-supervision"
    tests:
      - go ./lang/sfc TestIECAssociationForm
      - go ./lang/sfc TestTimedQualifiersParseAndCheckClean
      - go ./lang/conformance TestConformance/sfc-assoc-forms
    note: >-
      sfc-assoc-forms runs twin targets side by side: N in both spellings, L
      with a literal and with a TIME variable in both spellings, D in each,
      asserted equal at every edge; a second test changes the variable (40ms)
      and the variable-duration twins move while the literal ones do not.

  - id: FN-026
    claim: >-
      Every timed association has its own timer, retained across an online
      edit.
    source: "#sfc-action-qualifiers-and-step-supervision"
    tests:
      - go ./lang/sfc TestTimedLoweringStableSlots
      - go ./lang/sfc TestWarmMigration/timers-latches-pulses
    note: >-
      One TON per association, with slot names stable across an edit, is
      asserted on the transpiled chart. TestWarmMigration/timers-latches-pulses
      edits a running chart (adds a step and a transition), migrates the
      frame, and asserts the D and SL associations' timers carry 6 s of
      elapsed time and fire at 10 s / 20 s after activation, not after the
      swap.

  - id: FN-027
    claim: >-
      A step's MAXTIME makes Step.ERR TRUE once the step has been active
      longer than the limit (Step.ERR is legal in transition conditions and
      action bodies); it stays TRUE after the step is left and clears on the
      step's next activation.
    source: "#sfc-action-qualifiers-and-step-supervision"
    tests:
      - go ./lang/conformance TestConformance/sfc-step-maxtime

  - id: FN-028
    claim: >-
      "ERROR :=" on a step mirrors Step.ERR into a BOOL variable (a manifest
      tag an alarm can watch).
    source: "#sfc-action-qualifiers-and-step-supervision"
    tests:
      - go ./lang/conformance TestConformance/sfc-step-maxtime

  # ── Case-insensitivity ──────────────────────────────────────────────
  - id: FN-029
    claim: >-
      Identifiers are case-insensitive in every language: variables, tags,
      POUs, TYPEs, FB instances and pins, struct members, SFC steps/actions
      and their .X/.T flags, and FBD wires.
    source: "#identifiers-are-case-insensitive"
    tests:
      - go ./lang/conformance TestConformance/st-case-insensitive
      - go ./lang/st TestLowerCaseInsensitiveIdentifiers
      - go ./lang/fbd TestCaseInsensitiveCallsKeepSpelling
      - go ./lang/fbd TestCaseInsensitiveWiresAndInstances
      - go ./runtime TestTagNamesAreCaseInsensitive

  - id: FN-030
    claim: >-
      The declaration's spelling is the name shown: the tag store, live
      values and the HTTP API answer with the declared spelling however a
      program spells it, and no second tag appears.
    source: "#identifiers-are-case-insensitive"
    tests:
      - go ./runtime TestTagNamesAreCaseInsensitive
      - go ./server TestWriteTagAnyCasing
    partial: true
    note: >-
      Store and HTTP write are covered; Sparkplug metric names, diagnostics,
      hover and the L5X tag list spelling are not asserted.

  - id: FN-031
    claim: >-
      Two declarations that differ only in case in the same scope (variables,
      POUs, TYPEs, manifest tags, block pins) are a duplicate-declaration
      error naming both; the same name in different scopes is fine.
    source: "#identifiers-are-case-insensitive"
    tests:
      - go ./lang/st TestLowerCaseOnlyDuplicates
      - go ./lang/st TestLowerCaseDifferentScopesCoexist
      - go ./internal/project TestTagFilesRejectDuplicates/differing only in case
    note: >-
      Variables, FUNCTIONs, FUNCTION_BLOCKs, TYPEs and FB pins are tested,
      each error naming both spellings; two manifest tags Level / LEVEL are
      refused with an error naming both and their sources.

  - id: FN-032
    claim: >-
      The HTTP API accepts any casing for a tag or member path on writes, and
      forces and acceptance-test given:/expect: keys accept any casing too.
    source: "#identifiers-are-case-insensitive"
    tests:
      - go ./server TestWriteTagAnyCasing
      - go ./server TestForceAPIAnyCasing
      - go ./runtime TestTagNamesAreCaseInsensitive
      - go ./lang/conformance TestConformance/st-case-insensitive
    note: >-
      HTTP writes of tags and member paths by any casing; a force sent over
      HTTP as "level" lands on Level (reported under the declared spelling, no
      new tag) and an unforce as "LEVEL" removes it; given:/expect: keys in
      other casings (the st-case-insensitive corpus runs through the
      acceptance runner).

  # ── Project tags in scope ───────────────────────────────────────────
  - id: FN-033
    claim: >-
      Every tag the manifest declares is in scope in every PROGRAM (ST,
      ladder, FBD, SFC) without a declaration.
    source: "#project-tags-are-in-scope"
    tests:
      - go ./internal/project TestManifestTagsAreImplicit
      - go ./internal/project TestImplicitTagsBindOnlyWhereUsed
      - go ./lang/st TestImplicitGlobalsBindOnUse
      - go ./lang/conformance TestConformance/tag-implicit-scope
    note: >-
      tag-implicit-scope has an ST, a ladder, an FBD and an SFC program, none
      with a VAR_EXTERNAL, each reading the shared tags (in a rung, an FBD
      wire, an SFC transition and action body) and writing its own.

  - id: FN-034
    claim: >-
      A tag's type is its type: (any elementary type, a project TYPE or an
      ARRAY of either), else the type its init: implies; a tag with neither
      cannot be typed and naming it is an error that says to give it a type:.
    source: "#project-tags-are-in-scope"
    tests:
      - go ./internal/project TestElementaryTagTypes
      - go ./internal/project TestImplicitStructTagBindsInOut
      - go ./internal/project TestTagTypeFromInit
      - go ./internal/project TestTagTypeArrayOfProjectType
      - go ./internal/project TestUntypedTagErrorWording
      - go ./lang/st TestTagTypesAndUntypedTags
    partial: true
    note: >-
      Asserted: all 17 elementary type: names load, and the stored kind is
      checked for BOOL, INT, LWORD, REAL, LREAL, TIME and STRING; a project
      TYPE, an ARRAY OF REAL and an ARRAY of a project TYPE; the type init:
      implies (TRUE BOOL, 5 REAL, T#5s TIME, other text STRING), each used in
      a way only that type compiles; and the untyped-tag error saying "give
      Valve a type:". Not asserted: that an integer tag keeps its declared
      width. Every integer width is stored as one 64-bit kind, so a SINT,
      DINT or UDINT tag typed as INT would pass these tests.

  - id: FN-035
    claim: >-
      VAR_EXTERNAL stays legal and must agree with a stated type: (an error
      at the declaration otherwise); two programs binding one untyped tag
      with different types is an error naming both.
    source: "#project-tags-are-in-scope"
    tests:
      - go ./internal/project TestExplicitDeclarationMustAgreeWithTypedTag
      - go ./internal/project TestProgramsDisagreeingOnAnUntypedTag
      - go ./internal/project TestTagTypeDisagreementsNameTheirSources
    partial: true
    note: >-
      Asserted: a VAR_EXTERNAL of BOOL against type: REAL is an error at the
      declaration's line; two programs binding an untyped tag as DINT and
      REAL is an error naming both tasks (main, b) and both types.
      Disagreement: agreement is checked by shape (ir.SameShape), not by type,
      so integer widths never disagree. `VAR_EXTERNAL D : INT` against
      `type: DINT` loads cleanly (checked 2026-10-13).

  - id: FN-036
    claim: >-
      A program's own VAR with a tag's name shadows the tag (IEC scoping),
      and naut check and the editor warn.
    source: "#project-tags-are-in-scope"
    tests:
      - go ./internal/project TestLocalShadowsTag
      - go ./cmd/naut TestCheckGoldenShadowWarning
      - go ./internal/lsp TestShadowWarning
    note: >-
      Shadowing at run time; the naut check warning (golden text on the
      declaration's line) and the language server's warning diagnostic on the
      declaration.

  - id: FN-037
    claim: >-
      FUNCTION_BLOCK and FUNCTION bodies do not see tags implicitly; a block
      reaches a tag only through its own VAR_EXTERNAL.
    source: "#project-tags-are-in-scope"
    tests:
      - go ./internal/project TestFunctionBlocksDoNotSeeTagsImplicitly
      - go ./internal/project TestFunctionsDoNotSeeTagsImplicitly
    note: >-
      A FUNCTION_BLOCK body and a FUNCTION body each give an undeclared-name
      error without a VAR_EXTERNAL. With one, the FUNCTION reads the tag (Out
      = 10); the FUNCTION_BLOCK case is only shown to load.

  - id: FN-038
    claim: >-
      A GVL file (a library .st holding a file-level VAR_GLOBAL block)
      declares globals for every program; one the manifest does not declare
      is a state tag starting at zero.
    source: "#project-tags-are-in-scope"
    tests:
      - go ./internal/project TestGVLComposesIntoEveryProgram
      - go ./internal/project TestGVLRedeclarationMustAgree
      - go ./lang/st TestFileScopeVarGlobalAheadOfProgram
      - go ./internal/project TestGVLGlobalIsAStateTagAtZero
    note: >-
      Composition into every program; a GVL global the manifest does not
      declare is a state-role tag holding the zero of its declared type (BOOL,
      DINT, TIME) before any scan, while one the manifest declares keeps the
      manifest's role and init.

  # ── Types ───────────────────────────────────────────────────────────
  - id: FN-039
    claim: >-
      Integer kinds share one 64-bit runtime representation, so arithmetic
      on INT, DINT, UINT or WORD never wraps at the declared width.
    source: "#types"
    tests:
      - go ./lang/conformance TestConformance/st-int-width

  - id: FN-040
    claim: >-
      A diagnostic names the declared integer type (DINT, WORD), and partial
      access knows a DINT has 32 bits.
    source: "#types"
    tests:
      - go ./lang/st TestPartialAccessErrorsNameDeclaredType
    note: >-
      Beyond partial access ("bit 32 is out of range for DINT (bits
      0..31)"), the same test asserts ordinary diagnostics naming the
      declared type: "cannot assign STRING to DINT" and "member access on
      non-struct type WORD".

  - id: FN-041
    claim: >-
      TIME counts milliseconds; literals T#500MS, T#5S, T#2M30S parse, and
      TIME values compare with the ordinary comparisons.
    source: "#types"
    tests:
      - go ./lang/st TestLowerTimeArithmetic
      - go ./lang/conformance TestConformance/fn-conversions/TIME is milliseconds in both directions
      - go ./lang/conformance TestConformance/sfc-step-t/a Step.T condition fires one scan after T reaches PT
      - go ./lang/st TestParseTimeLiterals
    note: >-
      Milliseconds (T#2s + T#500ms = 2500) and a TIME comparison are run;
      TestParseTimeLiterals checks compound literals' values (T#1h30m, T#2d4h)
      through ParseTimeMs, which lowering uses and which ignores unit case.

  - id: FN-042
    claim: >-
      Mixed numeric arguments promote to REAL; comparing or combining a
      STRING with a number is a compile error, not a coercion.
    source: "#types"
    tests:
      - go ./lang/st TestLowerIntToRealPromotion
      - go ./lang/st TestMixedNumericArgsPromoteStringNumberRefused

  - id: FN-043
    claim: >-
      A user TYPE is first-class: it can be a variable, a tag, a struct
      field, an array element, a FUNCTION argument or return and a
      FUNCTION_BLOCK pin, and structs nest.
    source: "#types"
    tests:
      - go ./lang/st TestLowerUDTFieldAccess
      - go ./lang/st TestLowerNestedAggregateAssign
      - go ./lang/st TestFBStructPins
      - go ./lang/st TestEnumInStructsPinsArrays
      - go ./lang/st TestUserTypeAsFunctionArgLocalReturnAndBlockVar
    note: >-
      TestUserTypeAsFunctionArgLocalReturnAndBlockVar passes a nested UDT to a
      FUNCTION, uses one as its local and returns one (the argument is a copy).

  - id: FN-044
    claim: >-
      Assigning a struct or an array copies it (b := a; b.F := 1 leaves a.F
      alone), and so does passing a struct to a VAR_INPUT pin; only
      VAR_IN_OUT writes back to the caller.
    source: "#types"
    tests:
      - go ./lang/st TestStructAssignmentIsACopy
      - go ./lang/st TestFBStructInputIsCopied
      - go ./lang/st TestArrayAssignmentIsACopy
      - go ./lang/st TestVarInOutAcceptsEveryAssignableForm
    note: >-
      TestArrayAssignmentIsACopy: b := a; b[1] := 99 leaves a[1], also for an
      array inside a struct. A struct passed to a VAR_INPUT that the block
      changes leaves the caller's alone; a VAR_IN_OUT writes back to the
      caller's variable, struct field, array element and tag
      (TestVarInOutAcceptsEveryAssignableForm).

  - id: FN-045
    claim: >-
      A field or element of a tag assigns directly (P101.Running := TRUE,
      Levels[2] := 41.0); the whole aggregate round-trips through the tag
      store.
    source: "#types"
    tests:
      - go ./lang/st TestExternalStructFieldAssignment
      - go ./lang/st TestVarInOutExternalStructField
      - go ./internal/project TestArrayTagElementAssignsDirectly
    note: >-
      Struct-field assignment on a tag; Levels[2] := 41.0 on an ARRAY tag
      lands in the stored array with the other elements intact, and a second
      task reads the whole array back from the store.

  # ── Enumerations ────────────────────────────────────────────────────
  - id: FN-046
    claim: >-
      An enumerated TYPE member without ":= n" takes the previous value plus
      one (the first, 0); names and values are unique within the type; the
      type's initial value is the one after the list, else the first member;
      a Codesys base type after the list is accepted.
    source: "#enumerations"
    tests:
      - go ./lang/st TestEnumBasics
      - go ./lang/st TestEnumDeclarationErrors
      - go ./lang/conformance TestCodesysEnumTypeCompiles
      - go ./lang/st TestEnumNumberingOrderingInit
    note: >-
      TestEnumNumberingOrderingInit: an implicit member after an explicit one
      takes the previous value plus one (Mid = 6, Top = 2), and the initial
      value after the list (Mid) is not the first member.

  - id: FN-047
    claim: >-
      A member is named qualified (WashState#Fill), or bare where only one
      enumeration in scope has it or the context says which; otherwise the
      compiler asks for the qualified form.
    source: "#enumerations"
    tests:
      - go ./lang/st TestEnumAmbiguousMemberResolvedByContext
      - go ./lang/st TestEnumTypeErrors
      - go ./lang/conformance TestConformance/st-enum/CASE labels and comparisons on members, qualified and not

  - id: FN-048
    claim: >-
      Values of one enumeration compare (=, <>, and < / > by member value)
      and are CASE labels; assignment is between the same enumeration only,
      and an enumeration does not mix with an integer and has no arithmetic.
    source: "#enumerations"
    tests:
      - go ./lang/st TestEnumBasics
      - go ./lang/st TestEnumTypeErrors
      - go ./lang/conformance TestConformance/st-enum
      - go ./lang/st TestEnumNumberingOrderingInit
    note: >-
      TestEnumNumberingOrderingInit compares members whose values differ from
      their positions with < and >, so ordering by member value is told apart
      from ordering by position.

  - id: FN-049
    claim: >-
      Enumeration conversion is explicit: TO_INT(s) (or any TO_<type>) gives
      the member's integer and TO_WashState(n) gives the member with integer
      n; a number no member has keeps that number.
    source: "#enumerations"
    tests:
      - go ./lang/st TestEnumConversions

  - id: FN-050
    claim: >-
      A manifest tag may be typed with an enumeration, seeded by member name
      or number.
    source: "#enumerations"
    tests:
      - go ./internal/project TestEnumTypedTag
      - go ./lang/conformance TestConformance/st-enum/a tag of an enumerated type starts at the type's initial member
      - go ./internal/project TestEnumTagSeededByNumber
    note: >-
      Seeding by name (init: Run) and by number (init: 10, init: 11 give Run
      and Fault, compared against the members in the program).

  - id: FN-051
    claim: >-
      Live values show the member name: /api/state, the live stream, the
      editors' inline values and acceptance expect: all show and take the
      member name, while a value underneath is its integer (what Sparkplug,
      Modbus and the retain store carry).
    source: "#enumerations"
    tests:
      - go ./acceptance TestGivenEnumMemberByPath
      - go ./acceptance TestGivenEnumNonMemberNamesMembers
      - go ./lang/st TestEnumFromTagStore
    partial: true
    note: >-
      Acceptance given/expect names are covered; /api/state, the SSE stream
      and the integer on Sparkplug/Modbus/retain are not asserted.

  # ── Constants ───────────────────────────────────────────────────────
  - id: FN-052
    claim: >-
      VAR CONSTANT reads fold at compile time; assigning one (or a field,
      element or bit of one, or using it as a FOR variable) is a compile
      error.
    source: "#constants"
    tests:
      - go ./lang/st TestConstantCannotBeWritten
      - go ./lang/conformance TestConstantsAndMembersAreNotWritable
      - go ./lang/st TestConstantFoldsAndPartsCannotBeWritten
    note: >-
      TestConstantFoldsAndPartsCannotBeWritten asserts the read lowers to a
      literal (folded) and that writing a field, an element, a bit (.3, .%X3), a
      partial (.%B0) or the whole constant, or using it as a FOR variable, is
      the "is a constant" error.

  - id: FN-053
    claim: >-
      A constant's value, an initial value and an array bound may be a
      constant expression (literals, other constants and operators).
    source: "#constants"
    tests:
      - go ./lang/st TestConstantInBoundsAndInitialValues
      - go ./lang/conformance TestConformance/st-global-constants/an INT constant from a constant expression sizes an array and bounds a loop

  - id: FN-054
    claim: >-
      VAR_GLOBAL CONSTANT in a library file declares project constants,
      visible to every POU in every language (ST, ladder, FBD, SFC) and
      folded the same way.
    source: "#constants"
    tests:
      - go ./lang/conformance TestConformance/st-global-constants
      - go ./lang/st TestGlobalConstantsVisibleEverywhere
      - go ./lang/st TestGlobalConstantsLibraryAlone

  - id: FN-055
    claim: >-
      A project constant is not a tag (no manifest entry, live value or API
      path), a POU's own declaration of the same name shadows it, and its
      type is elementary or an enumeration.
    source: "#constants"
    tests:
      - go ./lang/st TestLocalShadowsGlobalConstant
      - go ./lang/st TestGlobalConstantRules
      - go ./lang/st TestGlobalConstantsVisibleEverywhere
      - go ./internal/project TestProjectConstantIsNotATag
    note: >-
      Shadowing and the type rule are tested; constants are absent from the
      compiled program's globals, and in a running project from the tag
      store and from GET /api/state's live values (a GVL global beside it is
      listed). POST /api/tags with the constant's name is refused with a 400
      naming it (an undeclared name never creates a tag, #329) and the
      program still reads the constant.

  # ── VAR_TEMP ────────────────────────────────────────────────────────
  - id: FN-056
    claim: >-
      VAR_TEMP starts every scan of a PROGRAM, and every call of a
      FUNCTION_BLOCK or FUNCTION, at its declared initial value (or its
      type's zero), never at what the previous scan or call left.
    source: "#temporaries-var_temp"
    tests:
      - go ./lang/conformance TestConformance/st-var-temp
      - go ./lang/st TestVarTempResetsEveryScan
      - go ./lang/st TestVarTempResetsEveryFBCall
      - go ./lang/st TestVarTempInFunction

  - id: FN-057
    claim: >-
      A temp cannot be RETAIN and cannot be a function-block instance, and
      an online edit never carries a temp over.
    source: "#temporaries-var_temp"
    tests:
      - go ./lang/st TestVarTempRejections
      - go ./lang/st TestVarTempNotMigrated

  # ── REGION ──────────────────────────────────────────────────────────
  - id: FN-058
    claim: >-
      REGION groups statements, nests, appears anywhere a statement can, and
      changes nothing about how they run: it opens no scope and declares
      nothing, and REGION is not a reserved word (a variable may be called
      Region).
    source: "#structure-region"
    tests:
      - go ./lang/conformance TestConformance/st-region
      - go ./lang/st TestRegionIsANoOpGrouping
      - go ./lang/st TestRegionOpensNoScope
      - go ./lang/st TestRegionInFBAndCase

  - id: FN-059
    claim: >-
      A REGION must be closed inside the statement list it opened in (not
      across an END_IF).
    source: "#structure-region"
    tests:
      - go ./lang/st TestRegionErrors

  # ── CASE labels ─────────────────────────────────────────────────────
  - id: FN-060
    claim: >-
      A CASE label is a constant: a literal, a named constant, an enumeration
      member or a range of them; each label ends the clause before it, named
      or not.
    source: "#case-labels"
    tests:
      - go ./lang/st TestCaseNamedConstantLabels
      - go ./lang/st TestCaseConstantLabelForms
      - go ./lang/conformance TestConformance/st-case-constants
      - go ./lang/st TestGlobalConstantsVisibleEverywhere
      - go ./lang/conformance TestConformance/st-enum/CASE labels and comparisons on members, qualified and not

  - id: FN-061
    claim: A variable is not a CASE label (compile error).
    source: "#case-labels"
    tests:
      - go ./lang/st TestCaseLabelMustBeConstant

  - id: FN-062
    claim: >-
      Two CASE labels with the same value (two constants, a constant and a
      literal, a value inside a range) are a compile error naming both.
    source: "#case-labels"
    tests:
      - go ./lang/st TestCaseDuplicateLabelValues
      - go ./lang/conformance TestCaseDuplicateConstantLabelDiagnosed

  # ── SCL # prefix ────────────────────────────────────────────────────
  - id: FN-063
    claim: >-
      The SCL "#name" local prefix is rejected wherever it appears with "the
      # prefix is Siemens SCL syntax; write the name without it", including
      on an assignment target.
    source: "#scls--prefix"
    tests:
      - go ./lang/st TestHashPrefixRejectedEverywhere
      - go ./lang/conformance TestHashPrefixDiagnosed

  # ── Operators ───────────────────────────────────────────────────────
  - id: FN-064
    claim: >-
      AND, OR and XOR are logical on BOOL and bitwise on integers, over all
      64 bits (-8 AND 6 = 0).
    source: "#operators"
    tests:
      - go ./lang/conformance TestConformance/st-bitwise
      - go ./lang/conformance TestConformance/st-xor
      - go ./lang/conformance TestConformance/fn-ops/AND, OR and XOR are logical on BOOL (the whole truth table), NOT negates a BOOL
      - go ./lang/conformance TestConformance/fn-ops/AND, OR and XOR take a third input - the third one counts
    note: >-
      Bitwise AND/OR/XOR on integers (ST and FBD, bits above 32, -8 AND 6 =
      0) in st-bitwise; the logical BOOL truth tables of AND, OR and XOR, two
      and three inputs, as FBD blocks and ST operators, in fn-ops.

  - id: FN-065
    claim: >-
      NOT is negation on BOOL and bitwise complement on an integer (NOT 0 =
      -1, NOT 12 = -13).
    source: "#operators"
    tests:
      - go ./lang/conformance TestConformance/st-bitwise
      - go ./lang/st TestLowerNotOnInt
      - go ./lang/conformance TestConformance/fn-ops/AND, OR and XOR are logical on BOOL (the whole truth table), NOT negates a BOOL
    note: >-
      The integer complement (NOT 0 = -1, NOT 12 = -13) in st-bitwise; NOT
      on a BOOL, as the FBD block and the ST operator, in fn-ops.

  - id: FN-066
    claim: >-
      ADD and MUL are n-ary, SUB is binary, and the result has the common
      type of the arguments: for integers, the narrowest type both widen to
      (DINT + DINT is DINT, a literal takes the other argument's type, the
      wider of two signed, unsigned or bit-string types, signed with
      unsigned the narrowest signed type holding both, a bit string with a
      number as its unsigned width); an integer with a REAL is a REAL. The
      type does not cut the value: TO_INT(d1 + d2) with both at 40000 is
      14464.
    source: "#operators"
    tests:
      - go ./lang/st TestLowerRealArithmetic
      - go ./lang/conformance TestConformance/fn-ops/ADD and MUL are n-ary - the third input counts; SUB is the binary difference
      - go ./lang/conformance TestConformance/fn-ops/an INT combined with a REAL gives a REAL - the common type, nothing truncated
      - go ./lang/conformance TestConformance/fn-ops/DINT + DINT keeps its value past INT's range; a conversion of it wraps only to the target
      - go ./lang/conformance TestArithmeticTakesTheCommonWidth
      - go ./lang/conformance TestArithmeticLiteralTakesTheOperandWidth
      - go ./lang/conformance TestArithmeticBlocksTakeTheCommonWidth
      - go ./lang/ir TestCommonIntEveryPair
      - go ./lang/fbd TestB1OperatorArityAndTypes
    note: >-
      Three-input ADD and MUL (the third input counts), SUB as the binary
      difference (a three-input SUB is refused), INT with REAL is a REAL
      (1 + 0.5 = 1.5; it may not drive an INT coil). The integer widths
      (#326): TestArithmeticTakesTheCommonWidth reads the type of a op b out
      of the checker's diagnostic (assigned to a STRING) for 23 width pairs
      and every operator (+ - * / MOD), TestArithmeticLiteralTakesTheOperandWidth
      the literal and chained cases, TestArithmeticBlocksTakeTheCommonWidth
      the FBD ADD/SUB/MUL/DIV/MOD blocks, and TestCommonIntEveryPair all 144
      pairs (order-independent, never narrower than an operand, Equal to
      INT so assignability is unchanged, converted as LINT). The fn-ops case
      pins the values: 40000 + 40000 = 80000 as a DINT, TO_INT of it 14464,
      TO_LINT of 2000000000 + 2000000000 all 4000000000 (ST and FBD).

  - id: FN-067
    claim: DIV gives the quotient and MOD the remainder of two integers.
    source: "#operators"
    tests:
      - go ./lang/conformance TestConformance/st-div-zero/ordinary division truncates toward zero, MOD keeps the dividend's sign
      - go ./lang/conformance TestConformance/fn-ops/DIV of two integers is the quotient, MOD the remainder
    note: >-
      The DIV and MOD blocks (FBD) and ST's / and MOD on two integers, both
      signs (7 DIV 2 = 3, -7 DIV 2 = -3, -7 MOD 2 = -1, 7 MOD -2 = 1).

  - id: FN-068
    claim: >-
      DIV by zero yields 0 for integer and REAL (never Inf or NaN), MOD by
      zero yields 0, and the scan keeps running.
    source: "#operators"
    tests:
      - go ./lang/conformance TestConformance/st-div-zero
      - go ./runtime TestDivideByZeroCountsAndKeepsScanning

  - id: FN-069
    claim: >-
      Every divide-by-zero bumps the controller-wide divZero counter in the
      scan stats (/api/state scan.divZero), counted since start.
    source: "#operators"
    tests:
      - go ./runtime TestDivideByZeroCountsAndKeepsScanning
      - go ./server TestStateCarriesDivZeroCount

  - id: FN-070
    claim: MOVE passes its single input through as an assignment (FBD wiring aid).
    source: "#operators"
    tests:
      - go ./lang/conformance TestConformance/fn-ops/MOVE passes its single input through unchanged, whatever its type
      - go ./lang/fbd TestB1OperatorArityAndTypes
    note: >-
      The FBD MOVE block passes a BOOL, an INT (beyond 32 bits), a REAL and a
      STRING through unchanged, matching the ST assignment; a two-input MOVE
      is refused and MOVE of a REAL may not drive an INT (it keeps its type).

  - id: FN-071
    claim: >-
      GT, GE, LT, LE, EQ, NE take two comparable arguments (numeric or TIME)
      and return BOOL.
    source: "#operators"
    tests:
      - go ./lang/conformance TestConformance/fn-ops/GT GE LT LE EQ NE on INT return BOOL - below, equal, above
      - go ./lang/conformance TestConformance/fn-ops/GT GE LT LE EQ NE on REAL compare the fractions too
      - go ./lang/conformance TestConformance/fn-ops/GT GE LT LE EQ NE on TIME (milliseconds)
      - go ./lang/fbd TestB1OperatorArityAndTypes
    note: >-
      All six as FBD blocks and ST operators on INT, REAL and TIME, each
      below, equal and above, driving BOOL tags; a three- or one-input
      comparison is refused and a comparison may not drive an INT (its
      result is BOOL). TestFunctionContactExpressionArgs and the sfc-step-t
      condition were dropped: one compiles contacts, the other is one TIME
      comparison.

  # ── Standard functions ──────────────────────────────────────────────
  - id: FN-072
    claim: >-
      A standard-function call is positional or formal (every input by its
      standard name: LIMIT(MN := 0.0, IN := x, MX := 100.0)); one call is
      one or the other, never a mix.
    source: "#standard-functions"
    tests:
      - go ./lang/st TestENOnFunctionAssign
      - go ./lang/st TestENOOnlyAndPositional
      - go ./lang/st TestENErrors
      - go ./lang/fbd TestENOErrors
      - go ./lang/conformance TestConformance/fn-select-numeric/SEL gives IN0 when G is FALSE and IN1 when G is TRUE, positional or formal
      - go ./lang/conformance TestConformance/fn-select-numeric/a formal MUX picks by K over IN0..IN2
      - go ./lang/conformance TestConformance/fn-select-numeric/MIN and MAX of three or four inputs find the extreme wherever it sits
      - go ./lang/conformance TestConformance/fn-select-numeric/ABS is the absolute value of an INT, a DINT and a REAL, each in its own type
    note: >-
      Formal calls run under every naming scheme the page lists, each
      matching the positional call: LIMIT (MN/IN/MX) and MAX (IN1/IN2) in
      the ST EN/ENO tests; SEL (G/IN0/IN1), MUX (K/IN0..IN2), MIN
      (IN1..IN3) and ABS (IN) in fn-select-numeric, ST and FBD. A mixed
      call is refused in ST ("formal or positional") and FBD ("by name or
      none").

  - id: FN-073
    claim: SEL(G, IN0, IN1) returns IN0 when G is FALSE and IN1 when G is TRUE.
    source: "#selection"
    tests:
      - go ./lang/st TestBuiltinSelMux
      - go ./lang/conformance TestConformance/fn-select-numeric/SEL gives IN0 when G is FALSE and IN1 when G is TRUE, positional or formal
    note: G = FALSE gives IN0 and G = TRUE gives IN1, positional and formal, in ST and FBD.

  - id: FN-074
    claim: >-
      MUX(K, IN0, ..., INn) picks the K-th input, 0-based.
    source: "#selection"
    tests:
      - go ./lang/conformance TestConformance/st-mux-fault/K picks the K-th input, 0-based
      - go ./lang/st TestBuiltinSelMux

  - id: FN-075
    claim: >-
      A MUX selector outside 0..n faults the scan; clamping K with LIMIT
      keeps it in range.
    source: "#selection"
    tests:
      - go ./lang/conformance TestMuxOutOfRangeFaults
      - go ./lang/conformance TestConformance/st-mux-fault/LIMIT keeps a wandering selector in range, so the scan never faults
      - go ./lang/st TestBuiltinMuxOutOfRangeFaults

  - id: FN-076
    claim: >-
      MIN and MAX are n-ary numeric and LIMIT(MN, IN, MX) clamps IN into
      [MN, MX].
    source: "#selection"
    tests:
      - go ./lang/st TestBuiltinMinMaxLimit
      - go ./lang/conformance TestConformance/st-mux-fault/LIMIT keeps a wandering selector in range, so the scan never faults
      - go ./lang/conformance TestConformance/fn-select-numeric/MIN and MAX of three or four inputs find the extreme wherever it sits
      - go ./lang/st TestMixedNumericArgsPromoteStringNumberRefused
      - go ./lang/st TestENOnFunctionAssign
    partial: true
    note: >-
      LIMIT clamps at both ends, on INT and on REAL (TestENOnFunctionAssign);
      MIN and MAX of three INT inputs (and MAX of four, one a DINT) find the
      extreme in any position, in ST and FBD; MAX of an INT and a REAL is
      the REAL 2.5. Not asserted: MIN of REAL arguments. No test anywhere
      runs MIN on a REAL, and disabling the REAL comparison leaves every
      MIN test green.

  - id: FN-077
    claim: ABS returns the absolute value in the argument's own type.
    source: "#numeric"
    tests:
      - go ./lang/st TestBuiltinABS
      - go ./lang/conformance TestConformance/fn-select-numeric/ABS is the absolute value of an INT, a DINT and a REAL, each in its own type
      - go ./lang/st TestB1ABSKeepsArgumentType
    note: >-
      Values for INT, DINT and REAL arguments (ST and FBD); the result type
      is the argument's for SINT, INT, DINT, LINT, UINT, UDINT and REAL (the
      compiler names it when the result cannot be assigned).

  - id: FN-078
    claim: >-
      SQRT, LN, LOG (base 10, not natural), EXP, EXPT and the trigonometric
      functions SIN/COS/TAN (radians), ASIN/ACOS/ATAN and the quadrant-correct
      ATAN2 return REAL with the stated meaning.
    source: "#numeric"
    tests:
      - go ./lang/conformance TestConformance/fn-trig-log
      - go ./lang/st TestBuiltinNumerics

  - id: FN-079
    claim: >-
      TRUNC truncates toward zero for both signs, into the 64-bit integer an
      undeclared INT is; TRUNC_<int> does the same into the typed integer.
    source: "#numeric"
    tests:
      - go ./lang/conformance TestConformance/fn-conversions/TRUNC goes toward zero for both signs
      - go ./lang/conformance TestConformance/st-conversions-matrix/REAL to integer rounds half to even; TRUNC goes toward zero
      - go ./lang/ir TestConversionSemantics
      - go ./lang/st TestBuiltinTruncStaysTruncation
      - go ./lang/conformance TestConformance/fn-select-numeric/TRUNC goes toward zero into a 64-bit integer - a value beyond 32 bits survives
    note: >-
      Toward-zero truncation is asserted for TRUNC and the typed TRUNC_DINT /
      TRUNC_INT; TRUNC(±5000000000.7) = ±5000000000 shows the result is a
      64-bit integer.

  - id: FN-080
    claim: >-
      SHL and SHR shift left / right (SHR zero-fills) and ROL and ROR rotate;
      all operate over 64 bits, so a WORD you think of as 16 bits rotates as
      a 64-bit value.
    source: "#bit-operations"
    tests:
      - go ./lang/conformance TestConformance/st-int-width/shifts act on 64 bits
      - go ./lang/conformance TestConformance/st-int-width/ROL and ROR rotate over 64 bits, not the declared 16
      - go ./lang/st TestBuiltinBitOps

  - id: FN-081
    claim: >-
      Word.3 is bit 3 of an integer as a BOOL, readable anywhere a BOOL is
      (IF, a ladder contact, a compare argument) and assignable (a ladder
      coil too), numbered from 0 at the least significant end; the IEC
      Word.%X3 spelling works, and so do bits of array elements and
      structure members.
    source: "#bit-operations"
    tests:
      - go ./lang/st TestBitAccess
      - go ./lang/st TestBitAccessInIfCompareArrayAndStruct
      - go ./lang/conformance TestConformance/st-partial-access
    note: >-
      TestBitAccessInIfCompareArrayAndStruct reads a bit in an IF and as a
      compare argument, and reads and writes bits of an array element
      (Words[2].15) and a structure member (P101.Status.12) in both spellings.
      The st-partial-access corpus runs a ladder contact and coil on a bit in
      both the .%X3 and the Logix .3 spelling. TestBitAccessInLadder was
      removed: it checks lowering text only.

  - id: FN-082
    claim: >-
      Partial access (w.%B1, w.%W0, w.%D1, w.%L0) reads as an unsigned
      integer of that width and writes back only its own bits; ladder
      contacts/coils and FBD wires take every form.
    source: "#bit-operations"
    tests:
      - go ./lang/conformance TestConformance/st-partial-access
      - go ./lang/st TestPartialAccessReadWrite
      - go ./lang/st TestPartialAccessUnsignedAndL
    note: >-
      %X, %B, %W, %D and %L read and write back only their own bits, and parts
      with their top bit set read unsigned (128, 32768, 2147486216), in ST and
      FBD wires. Ladder contacts and coils take %X and .n, and a function
      contact's argument takes %B unsigned (GT(Alarms.%B3, 100) passes power
      at 16#80). A ladder assignment element { x := w.%W1 } does not parse;
      the page promises partial access in contacts, coils and FBD wires, not in
      assignment elements.

  - id: FN-083
    claim: >-
      A partial access must fit the declared type: d.%X32 on a DINT or w.16
      on a WORD is a compile error that names the type.
    source: "#bit-operations"
    tests:
      - go ./lang/st TestPartialAccessErrorsNameDeclaredType

  - id: FN-161
    claim: >-
      The top bit of a signed type is its sign: on an INT, x.15 := TRUE makes
      0 into -32768 and x.15 := FALSE makes -1 into 32767 (SINT bit 7, DINT
      bit 31, LINT bit 63), and a partial access that holds the sign bit sets
      the sign with it. An unsigned or bit-string type's top bit is an
      ordinary value bit (w.15 := TRUE on a WORD is 32768).
    source: "#bit-operations"
    tests:
      - go ./lang/st TestSignedTopBitIsTheSign
      - go ./lang/st TestSignedPartialAccessCarriesTheSign
      - go ./lang/st TestUnsignedTopBitIsAValueBit
      - go ./runtime TestLadderCoilOnSignBit
    note: >-
      Every signed width, set and cleared, on a global, a local, a structure
      member and an array element, in both spellings; the parts %B, %W, %D
      and %L and a bit of a part; ladder output, set and reset coils. Every
      unsigned and bit-string width keeps its unsigned value.

  - id: FN-084
    claim: >-
      String functions use 1-based positions, and length and position
      arguments clamp to the string instead of faulting (LEFT, RIGHT, MID,
      INSERT, DELETE, REPLACE).
    source: "#strings"
    tests:
      - go ./lang/conformance TestConformance/st-string-clamp
      - go ./lang/st TestBuiltinStrings

  - id: FN-085
    claim: >-
      FIND returns the 1-based position of IN2 in IN1, and 0 when absent or
      when IN2 is empty.
    source: "#strings"
    tests:
      - go ./lang/conformance TestConformance/st-string-clamp/FIND is 1-based and gives 0 when absent or when the needle is empty

  - id: FN-086
    claim: LEN returns the length, and CONCAT is n-ary.
    source: "#strings"
    tests:
      - go ./lang/st TestBuiltinStrings
      - go ./lang/conformance TestConformance/st-string-clamp/in-range arguments behave as the standard says (1-based)

  # ── Type conversions ────────────────────────────────────────────────
  - id: FN-087
    claim: >-
      Every <A>_TO_<B> between the 18 elementary types exists (294
      functions) except the marked cells, which are compile errors, as is the
      overloaded TO_<type> for the same cells; there are no implicit
      conversions across kinds.
    source: "#type-conversions"
    tests:
      - go ./lang/ir TestConversionMatrixShape
      - go ./lang/st TestConversionCompileErrors
      - go ./lang/st TestConversionMatrixThroughST

  - id: FN-088
    claim: >-
      Integer narrowing wraps: the result keeps the target's low bits, read
      signed or unsigned as the target is (DINT_TO_INT(70000) = 4464,
      INT_TO_USINT(-1) = 255, BYTE_TO_SINT(255) = -1, SINT_TO_WORD(-1) =
      16#FFFF).
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/st-conversions-matrix/integer narrowing wraps at the target width (DINT to INT, UINT, BYTE)
      - go ./lang/ir TestConversionSemantics

  - id: FN-089
    claim: >-
      The argument of a conversion is read as its own declared type first, so
      UINT_TO_DINT(u) with u at -1 sees 65535.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/st-conversions-matrix/sign - a signed source sign-extends, an unsigned one does not
      - go ./lang/ir TestConversionSemantics

  - id: FN-090
    claim: >-
      REAL to integer and REAL to TIME round to nearest, ties to even (2.5 to
      2, 3.5 to 4, -2.5 to -2); TRUNC* go toward zero.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/fn-conversions/REAL_TO_INT rounds half to even, not half away from zero
      - go ./lang/conformance TestConformance/fn-conversions/REAL_TO_TIME rounds milliseconds half to even
      - go ./lang/conformance TestConformance/st-conversions-matrix/REAL to integer rounds half to even; TRUNC goes toward zero
      - go ./lang/st TestBuiltinRealRoundingTiesToEven

  - id: FN-091
    claim: >-
      A REAL with no value in the target (beyond its range, NaN or infinite)
      faults the scan; LREAL_TO_SINT(127.5) faults while
      LREAL_TO_SINT(-128.5) rounds to the even -128 and does not.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConversionRangeFaults
      - go ./lang/ir TestConversionFaults
      - go ./lang/conformance TestConformance/st-conversions-matrix/REAL to integer rounds half to even; TRUNC goes toward zero

  - id: FN-092
    claim: >-
      REAL and bit-string conversions are binary transfers of the IEEE 754
      pattern, only at the same width (REAL_TO_DWORD(1.0) = 16#3F800000); a
      pattern that is NaN or infinite faults; REAL_TO_WORD is a compile error
      that says what to write instead.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/st-conversions-matrix/REAL to DWORD and back is the IEEE 754 bit pattern (binary transfer)
      - go ./lang/conformance TestConversionRangeFaults/NaN bit pattern
      - go ./lang/st TestConversionCompileErrors
      - go ./lang/ir TestConversionSemantics
      - go ./lang/ir TestConversionInfinitePatternFaults
    note: >-
      TestConversionInfinitePatternFaults: +/-Inf patterns fault for
      DWORD_TO_REAL and LWORD_TO_LREAL.

  - id: FN-093
    claim: >-
      Integers convert to REAL exactly up to 2^53 (REAL and LREAL are both
      float64 at run time), ULINT and LWORD convert unsigned, and
      REAL_TO_LREAL / LREAL_TO_REAL change only the type.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/st-conversions-matrix/integers to REAL - REAL holds LREAL precision here
      - go ./lang/ir TestConversionSemantics
      - go ./lang/ir TestConversionExactUnsignedAndRealLreal
    note: >-
      TestConversionExactUnsignedAndRealLreal: 16777217 and 2^53-1 exact as
      REAL, REAL_TO_LREAL / LREAL_TO_REAL keep 0.1 and 16777217 and are typed
      LREAL / REAL, ULINT and LWORD all-ones read as 2^64-1 (LWORD_TO_STRING,
      TO_STRING of an LWORD, ULINT_TO_REAL).

  - id: FN-094
    claim: >-
      BOOL converts to 0/1 of any numeric type (1 ms for TIME); any number
      converts to TRUE when it is nonzero in the source width
      (BYTE_TO_BOOL(256) is FALSE).
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/st-conversions-matrix/BOOL is 0 and 1; a number is TRUE when nonzero in the source width
      - go ./lang/conformance TestConformance/fn-conversions/BOOL to INT and REAL, INT and REAL to BOOL
      - go ./lang/ir TestConversionSemantics

  - id: FN-095
    claim: >-
      TIME and LTIME count milliseconds (LTIME is not nanoseconds), and
      TIME_TO_INT wraps like any integer narrowing.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/st-conversions-matrix/TIME is milliseconds, and wraps like any integer when narrowed
      - go ./lang/conformance TestConformance/fn-conversions/TIME is milliseconds in both directions
      - go ./lang/ir TestConversionSemantics
    note: >-
      LTIME appears in neither conformance program; TestConversionSemantics
      covers it (TIME_TO_LTIME(42) = 42, LTIME_TO_LREAL(250) = 250,
      LTIME#5000ms both ways), which a nanosecond LTIME would fail.

  - id: FN-096
    claim: >-
      STRING_TO_x parses after trimming blanks: decimal or base-prefixed
      integers (16#FF, 2#1010, 8#17) with _ separators, decimal/exponent
      REALs, durations (T#1m30s, 90s, 500ms), and BOOL as TRUE/FALSE/1/0 in
      any case.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/fn-conversions/parsing from STRING
      - go ./lang/conformance TestConformance/st-conversions-matrix/STRING formatting, parsing and round trips
      - go ./lang/ir TestConversionSemantics
      - go ./lang/ir TestStringParsesEveryDocumentedForm
    note: >-
      TestStringParsesEveryDocumentedForm: 8#17 (with _), 16#FF, 2#1010,
      exponent REALs (1.5e3, 2E-2), bare durations 90s / 500ms / 1m30s, and BOOL
      in mixed case (True, fAlSe), each after trimming.

  - id: FN-097
    claim: >-
      Text that does not parse, or parses to a value the target cannot hold
      (STRING_TO_SINT('128'), STRING_TO_UINT('-1')), faults the scan.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestStringParseFaults
      - go ./lang/conformance TestConversionRangeFaults

  - id: FN-098
    claim: >-
      Formatting to STRING is decimal for integers (unsigned for U- and
      bit-string types), the shortest exact form for REAL, T#5000ms /
      LTIME#5000ms for durations, so STRING_TO_x(x_TO_STRING(v)) gives v
      back.
    source: "#type-conversions"
    tests:
      - go ./lang/conformance TestConformance/fn-conversions/formatting to STRING
      - go ./lang/ir TestConversionSemantics
      - go ./lang/ir TestConversionStringRoundTrip

  - id: FN-099
    claim: >-
      TO_<type>(x) is the overloaded form (an expression's integer converts
      as LINT, an enumeration as its integer); TRUNC_<int>(x) and
      <real>_TRUNC_<int>(x) truncate toward zero; TO_<Enum>(n) gives the
      member.
    source: "#type-conversions"
    tests:
      - go ./lang/ir TestOverloadedTo
      - go ./lang/ir TestConversionSemantics
      - go ./lang/st TestConversionMatrixThroughST
      - go ./lang/st TestEnumConversions
      - go ./lang/st TestToTypeOfIntegerExpressionIsLINT
    note: >-
      TestToTypeOfIntegerExpressionIsLINT: TO_DINT(x + x) with INT x = 30000 is
      60000 (an INT variable holding it converts to -5536), TO_LINT of a DINT
      product keeps all its bits, TO_STRING of an expression is the LINT's text.

  - id: FN-100
    claim: >-
      DATE, TIME_OF_DAY and DATE_AND_TIME are not run-time types yet and
      have no conversions.
    source: "#type-conversions"
    tests:
      - go ./lang/st TestDateTypesAreNotRuntimeTypes
      - go ./cmd/naut TestCheckRejects/D literal
      - go ./cmd/naut TestCheckRejects/TOD literal
      - go ./cmd/naut TestCheckRejects/TIME_OF_DAY literal
    note: >-
      Every spelling of the three (DATE, TIME_OF_DAY, TOD, DATE_AND_TIME, DT) is
      refused as a type, no typed or TO_<type> conversion to or from them
      exists, and their literals (D#, DATE#, TOD#, TIME_OF_DAY#, DT#,
      DATE_AND_TIME#) are refused by naut check instead of compiling as
      integers (#307).

  # ── Standard function blocks ────────────────────────────────────────
  - id: FN-101
    claim: >-
      TON (on-delay): Q rises after IN has been TRUE for PT; ET is the
      elapsed time.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-ton

  - id: FN-102
    claim: >-
      TOF (off-delay): Q stays TRUE for PT after IN drops.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-tof

  - id: FN-103
    claim: >-
      TP (pulse): rising IN produces a PT-wide TRUE pulse, a rising edge
      during the pulse is ignored, afterwards ET holds at PT while IN stays
      TRUE and returns to 0 the scan IN is FALSE.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-tp

  - id: FN-104
    claim: >-
      CTU counts rising CU edges, Q is TRUE when CV reaches PV, and R resets.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-ctu
      - go ./lang/st TestFBCTUCountsAndResets
    note: >-
      fb-ctu (ST, LD, FBD) pins counting on rising edges only (held CU and its
      fall do not count), Q on the scan CV reaches PV and staying TRUE past
      it, R resetting CV and Q, and R dominating a same-scan CU edge.

  - id: FN-105
    claim: >-
      CTD counts down from PV (LD loads PV), and Q is TRUE when CV is at or
      below 0.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-ctd

  - id: FN-106
    claim: >-
      CTUD (inputs CU, CD, R, LD, PV; outputs QU, QD, CV) is an up/down
      counter.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-ctud

  - id: FN-107
    claim: >-
      R_TRIG's Q is TRUE for exactly one scan on CLK's rising edge.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-r-trig
      - go ./lang/st TestFBRTrigDetectsRisingEdge
    note: >-
      fb-r-trig (ST, LD, FBD) pins one scan on the rise, nothing while held or
      on the fall, first scan with CLK TRUE, and a toggling CLK.

  - id: FN-108
    claim: >-
      F_TRIG's Q is a one-scan pulse on CLK's falling edge.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-f-trig

  - id: FN-109
    claim: SR (S1, R → Q1) is a set-dominant latch.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-sr

  - id: FN-110
    claim: RS (S, R1 → Q1) is a reset-dominant latch.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-rs

  - id: FN-111
    claim: >-
      Each function-block instance keeps its own state between scans, and its
      outputs read as inst.Pin from any language.
    source: "#standard-function-blocks"
    tests:
      - go ./lang/conformance TestConformance/fb-instances
      - go ./lang/conformance TestConformance/fb-ton
    note: >-
      fb-instances runs two CTU instances in ST, LD, FBD and SFC: each count
      carries across idle scans, edges on one never move the other, and Q
      (BOOL) and CV (INT) are read as inst.Pin in all four languages.

  # ── EN / ENO ────────────────────────────────────────────────────────
  - id: FN-112
    claim: >-
      With EN FALSE a function call does not execute: its result is not
      assigned and the variable it drives keeps its value.
    source: "#eneno-execution-control"
    tests:
      - go ./lang/conformance TestConformance/fbd-en-eno/EN FALSE leaves the function's result unassigned
      - go ./lang/conformance TestConformance/fbd-en-eno/EN FALSE from power-up never assigns (the tag keeps its init)
      - go ./lang/st TestENOnFunctionAssign

  - id: FN-113
    claim: >-
      With EN FALSE a function-block body does not run: outputs, every =>
      binding and internal state (a counter's edge memory, a timer's start)
      keep their values until it runs again.
    source: "#eneno-execution-control"
    tests:
      - go ./lang/conformance TestConformance/fbd-en-eno/an FB with EN FALSE does not run — edges it misses are not counted
      - go ./lang/conformance TestConformance/fbd-en-eno/the FB's edge memory is stale while disabled — a rise across it counts on return
      - go ./lang/st TestENOnFBCall

  - id: FN-114
    claim: >-
      ENO = EN AND no error; a call that errors faults the scan, so a call
      that returns has ENO = EN, except FBD's DIV and MOD whose ENO is FALSE
      on a zero divisor (the result is still 0, counted in divZero).
    source: "#eneno-execution-control"
    tests:
      - go ./lang/conformance TestConformance/fbd-en-eno/EN TRUE runs the call and ENO is TRUE
      - go ./lang/conformance TestConformance/fbd-en-eno/DIV's ENO is FALSE on a zero divisor, TRUE otherwise
      - go ./lang/conformance TestConformance/fbd-en-eno/DIV with EN FALSE holds its result and reports ENO FALSE
      - go ./lang/conformance TestConformance/fbd-en-eno/EN FALSE leaves the function's result unassigned
      - go ./lang/fbd TestENOModByZero
      - go ./runtime TestB1FBDDivModZeroENOAndDivZero
      - go ./lang/conformance TestMuxOutOfRangeFaults
    note: >-
      ENO follows EN for LIMIT and CTU (TRUE when run, FALSE when not); DIV's
      and MOD's ENO is FALSE on a zero divisor with the result 0, and each
      zero divisor is counted in divZero while the scan keeps running
      (TestB1FBDDivModZeroENOAndDivZero, FBD on the runtime); a call that
      errors (MUX out of range) faults the scan.

  - id: FN-115
    claim: >-
      In ST, EN and ENO are formal arguments (t1(EN := Enable, ..., ENO =>
      t1Ok); LIMIT(EN := ..., ENO => ok)).
    source: "#eneno-execution-control"
    tests:
      - go ./lang/st TestENOnFBCall
      - go ./lang/st TestENOnFunctionAssign
      - go ./lang/st TestENOOnlyAndPositional

  - id: FN-116
    claim: >-
      A function's EN/ENO needs its call to be a statement of its own (the
      whole right-hand side of an assignment, or a user FUNCTION called as a
      statement); inside a larger expression it is a compile error.
    source: "#eneno-execution-control"
    tests:
      - go ./lang/st TestENErrors
      - go ./lang/st TestENOnFunctionAssign
      - go ./lang/st TestENOnUserFunctionCalledAsStatement
    note: >-
      The compile error inside a larger expression (a standard function and
      a user FUNCTION) and the whole-right-hand-side form are asserted; a
      user FUNCTION called as a statement with EN FALSE does not run its
      body and writes ENO FALSE, and with EN TRUE runs with ENO TRUE.

  - id: FN-117
    claim: >-
      In FBD, any block takes EN/ENO the same way; a block with EN/ENO must
      drive a variable (never another block's input), and ENO reads as a wire
      (t1.ENO, sp.ENO) that feeds a coil or the next block's EN.
    source: "#eneno-execution-control"
    tests:
      - go ./lang/fbd TestENOModelAndTranspile
      - go ./lang/fbd TestENOFunctionGatesItsCoil
      - go ./lang/fbd TestENOErrors
      - go ./lang/conformance TestConformance/fbd-en-eno
      - go ./lang/fbd TestB1ENOFeedsTheNextBlocksEN
    note: >-
      EN/ENO on LIMIT, DIV, TON and CTU, the "must drive a variable" error,
      and ENO wired to a coil are asserted. TestB1ENOFeedsTheNextBlocksEN
      chains ENO into the next block's EN through every kind of block (a
      standard function, an operator block, a user FUNCTION, a standard FB,
      a user FUNCTION_BLOCK, DIV): EN FALSE at the head stops the whole
      chain, a zero divisor at the tail drops only the last ENO.

  - id: FN-118
    claim: >-
      A user block that declares its own EN input or ENO output keeps them as
      ordinary pins: its body decides what they mean.
    source: "#eneno-execution-control"
    tests:
      - go ./lang/st TestENOnUserFunctionStatementAndOwnEN
    note: >-
      Gate's body runs with its own EN FALSE (it counts the call but not the
      run), so EN is an ordinary pin, not execution control.
  - id: FN-119
    claim: >-
      In a rung, rung power drives a standard block's power-in pin (TON/TOF/TP
      IN, CTU CU, CTD CD, R_TRIG/F_TRIG CLK, SR S1, RS S) and continues from
      its power-out pin (Q, or Q1 for SR/RS).
    source: "#power-pins-in-ladder"
    tests:
      - go ./lang/conformance TestConformance/fb-ton
      - go ./lang/conformance TestConformance/fb-tof
      - go ./lang/conformance TestConformance/fb-tp
      - go ./lang/conformance TestConformance/fb-ctu
      - go ./lang/conformance TestConformance/fb-ctd
      - go ./lang/conformance TestConformance/fb-r-trig
      - go ./lang/conformance TestConformance/fb-f-trig
      - go ./lang/conformance TestConformance/fb-sr
      - go ./lang/conformance TestConformance/fb-rs
    note: >-
      The ld column of each feature puts the block in a rung with power on its
      power-in pin (IN, CU, CD, CLK, S1, S) and its coil after the block, so
      the power-out pin (Q, Q1) is asserted against ST and FBD.

  - id: FN-120
    claim: >-
      For a user FUNCTION_BLOCK, power drives EN else the first BOOL
      VAR_INPUT the call does not bind by name, and continues from ENO else
      the first BOOL VAR_OUTPUT.
    source: "#power-pins-in-ladder"
    tests:
      - go ./lang/ld TestLadderFunctionBlockPowerPins
      - go ./lang/ld TestLadderFunctionBlockPowerOutOfENO
      - go ./lang/ld TestLadderFunctionBlockPowerPinPreference
    note: >-
      First free BOOL input and first BOOL output (PowerPins); a declared EN
      taking power over an earlier free BOOL input, ENO over the first BOOL
      output, and an earlier BOOL input bound by name being skipped
      (PowerPinPreference, run).

  - id: FN-121
    claim: >-
      Passing the power pin explicitly in the argument list (t1:TON(IN :=
      x)) is a compile error: power owns it.
    source: "#power-pins-in-ladder"
    tests:
      - go ./lang/ld TestRungErrors

  - id: FN-122
    claim: >-
      A block with no power-in (every BOOL input bound by name, or none) is
      called unconditionally and may only sit on a rail-driven rung; with
      contacts ahead of it is the error "no free BOOL input for the rung's
      power".
    source: "#power-pins-in-ladder"
    tests:
      - go ./lang/ld TestLadderFunctionBlockPowerPins
      - go ./lang/ld TestLadderFunctionBlockWithNoBoolInputs
      - go ./lang/ld TestLadderFunctionBlockInOutStructPin
    note: >-
      Both shapes: every BOOL input bound by name (refused behind a contact,
      run on a rail-driven rung) and a block with no BOOL input at all
      (refused with the message behind a contact, called on every scan on the
      rail).

  - id: FN-123
    claim: >-
      A block with no BOOL output passes power through unchanged, so whatever
      conditioned the block still conditions the coils to its right.
    source: "#power-pins-in-ladder"
    tests:
      - go ./lang/ld TestLadderFunctionBlockPowerPins

  - id: FN-124
    claim: >-
      A user block's pins are resolved from the whole compile (this file's
      FUNCTION_BLOCKs plus every project library); a block whose type nothing
      in the compile declares falls back to IN/Q.
    source: "#power-pins-in-ladder"
    tests:
      - go ./lang/ld TestLadderFunctionBlockLowers
      - go ./lang/ld TestLadderFunctionBlockNested
      - go ./internal/project TestLadderLibraryProjectRuns
      - go ./lang/ld TestLadderUndeclaredBlockFallsBackToINQ
    note: >-
      Pins resolved from this file (PumpSeq's Start in
      TestLadderFunctionBlockLowers), another file (Debounce's IN/OUT) and
      project libraries; an undeclared type takes power on IN and passes it on
      from Q.

  # ── PID ─────────────────────────────────────────────────────────────
  - id: FN-125
    claim: >-
      PID output CV is clamped to [CV_MIN, CV_MAX], and leaving both unbound
      falls back to the IEC 0..100 range instead of pinning CV at zero.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDDefaultClampRange
      - go ./lang/st TestPIDAntiWindupStaysClamped
      - go ./lang/st TestPIDClampsAtCVMin
    note: >-
      Both ends are asserted (CV_MIN 10 / CV_MAX 90 with the loop asking for
      -1000, +1000 and 50 in TestPIDClampsAtCVMin), and the unbound pair
      gives 0..100 (TestPIDDefaultClampRange).

  - id: FN-126
    claim: >-
      DIRECT := FALSE is reverse acting (error = SP - PV, raise CV when PV is
      low, a heater) and DIRECT := TRUE direct acting (error = PV - SP, a
      cooling valve).
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDDirectVsReverse

  - id: FN-127
    claim: >-
      Manual mode (AUTO = FALSE): CV tracks CV_MAN and the integral is
      back-solved every scan so returning to AUTO is bumpless, with no jump
      in CV.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDManualToAutoBumpless
      - go ./lang/st TestPIDManualTracksMovingCVMan
    note: >-
      TestPIDManualTracksMovingCVMan moves CV_MAN, PV and SP on every manual
      scan: CV follows CV_MAN, P_TERM + I_TERM + D_TERM equals CV_MAN on each
      scan (back-solved every scan, not once on entering MANUAL), and the
      switch to AUTO continues from the last CV_MAN.

  - id: FN-128
    claim: >-
      Anti-windup is conditional integration: the integral does not
      accumulate when that would push the unclamped output further past a rail
      it has reached, CV comes off the rail as soon as the error reverses,
      and SAT_HI / SAT_LO report the clamp.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDAntiWindupStaysClamped
      - go ./lang/st TestPIDAntiWindupLowRail
    note: >-
      Each rail is asserted: I_TERM frozen while clamped, SAT_HI / SAT_LO
      set, and CV off the rail on the scan the error reverses.

  - id: FN-129
    claim: >-
      DT left at 0 (unbound) makes the block measure elapsed time itself from
      the scan clock; a bound DT is used as seconds since the last call.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDDTZeroUsesScanDt
      - go ./lang/st TestPIDBoundDTOverridesClock
    partial: true
    note: >-
      A bound DT is asserted: 0.5 s per scan integrates 0.5 s while the clock
      advances 1 s (and once 3 s). The unbound case is not:
      TestPIDDTZeroUsesScanDt advances the clock a constant 1 s per scan, so
      a fallback hard-coded to 1 s passes it too (every TestPID* stays green
      with dt = 1.0 in place of the measured interval). An irregular clock
      with DT unbound is needed to show the elapsed time is measured.

  - id: FN-130
    claim: >-
      PID is closed-loop control: around a process it drives PV to the
      setpoint and holds it there.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDStepResponseConverges

  - id: FN-131
    claim: >-
      KP = 0 disables the whole controller, not just the P term; KI = 0
      disables integral action and KD = 0 derivative action.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDZeroGainsDisable
    note: >-
      KP = 0 with KI and KD nonzero and PV moving keeps CV, P_TERM, I_TERM
      and D_TERM at 0; KI = 0 keeps I_TERM at 0 under a held error (a KI > 0
      control integrates); KD = 0 keeps D_TERM at 0 under a PV ramp.

  - id: FN-132
    claim: >-
      The derivative acts on PV, not on error (a setpoint step never kicks
      D_TERM), through a fixed first-order filter with time constant KD/10.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDDerivativeOnPVFiltered
    note: >-
      Setpoint steps with PV still leave D_TERM at 0; a PV step's D_TERM
      decays with the filter weight DT/(KD/10 + DT), asserted at KD = 10 and
      KD = 30.

  - id: FN-133
    claim: >-
      DB is a deadband on error: within +/-DB the P and I terms see zero
      error, while the D term still sees every PV move.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDDeadband
    note: >-
      PV wandering inside ±DB leaves P_TERM and I_TERM at 0 while D_TERM
      follows each move; outside the band the full error reaches P and I.

  - id: FN-134
    claim: RESET = TRUE zeroes the integral this scan.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDResetZeroesIntegral

  - id: FN-135
    claim: >-
      The diagnostic outputs hold their stated values: ERR is the error
      before the deadband, and P_TERM, I_TERM, D_TERM are the three
      contributions to CV.
    source: "#pid-closed-loop-control"
    tests:
      - go ./lang/st TestPIDDiagnosticTerms
    note: >-
      ERR, P_TERM, I_TERM, D_TERM and CV = P + I + D are asserted against
      hand-computed values over four scans, reverse and direct acting, the
      last scan inside the deadband (ERR raw, P_TERM 0). The block's first
      AUTO scan does not integrate (the bumpless-transfer rule), so the
      integral counts from the second scan.

  # ── Arrays of instances ─────────────────────────────────────────────
  - id: FN-136
    claim: >-
      A function-block instance can be declared in an array
      (Timers : ARRAY[0..3] OF TON); each element is its own instance with
      its own retained state, callable by index in ST and in a rung, and the
      index may be a variable.
    source: "#arrays-of-instances"
    tests:
      - go ./lang/st TestFBInstanceArray
      - go ./lang/st TestFBInstanceArrayVariableIndexRuns
      - go ./lang/ld TestFBInstanceArrayInLadder
      - go ./lang/ld TestFBInstanceArrayVariableIndexInLadderRuns
    note: >-
      In ST and in a rung, a TON element called by a variable index keeps its
      own elapsed time across scans in which the index points elsewhere, and
      elements never called stay idle.

  - id: FN-137
    claim: >-
      On a Logix target an array of instances is one TIMER[4] tag; an element
      called with a literal index carries its preset in the tag's data, one
      called with a computed index takes a MOVE to its .PRE ahead of the
      rung. Once an array is called with a computed index anywhere, its
      literal-index calls also re-assert their presets with a MOVE ahead of
      their rungs.
    source: "#arrays-of-instances"
    tests:
      - go ./logix/writer TestTimerInstanceArrayOnLogix
      - go ./logix/writer TestArraysOfBlocks
      - go ./logix/writer TestGolden/arrays
      - go ./logix/importer TestRoundTripArrayPresets
    note: >-
      Asserted: ARRAY[0..3] OF TON is one TIMER tag with Dimensions 4; with
      only literal indices each element's preset is in the tag's data and no
      MOVE is emitted; a computed index takes MOVE(1000,Timers[i].PRE) ahead
      of its rung. On an array also called with a computed index, the
      literal-index elements still carry their presets in the tag's data
      (TestArraysOfBlocks: PRE 2000 / 0 / 500; the arrays golden:
      [[0,2000,0],[0,0,0],[0,0,0],[0,500,0]]) and their calls take
      MOVE(2000,Timers[0].PRE) ahead of the rung (#331). The re-assert is the
      Echo finding in docs/design/logix-authoring.md: a MOVE to .PRE is
      sticky on the controller. Written, imported and written again, every
      call keeps its PT := and the rungs are identical.

  # ── Dialects ────────────────────────────────────────────────────────
  - id: FN-138
    claim: >-
      dialect: names are nautilus (the default, adds nothing), logix, and
      the reserved siemens and codesys.
    source: "#dialects"
    tests:
      - go ./internal/dialect TestLogixLibraryParsesAndIsDeclarationsOnly
      - go ./internal/project TestDialectNamesAndDefault
    note: >-
      nautilus adding nothing, logix having a library, and siemens reserved
      and empty (Sources); a project with no dialect: or dialect: nautilus has
      no TONR while dialect: logix does, and dialect: siemens and dialect:
      codesys are accepted by the manifest.

  - id: FN-139
    claim: >-
      The logix dialect's TONR is a TON whose Reset clears the accumulated
      time and Q while TRUE; the free-running pulse is t:TONR(PT := T#1S,
      Reset := t.Q).
    source: "#dialects"
    tests:
      - go ./lang/conformance TestConformance/dialect-logix-tonr
    note: >-
      dialect-logix-tonr composes the logix dialect through dialect: logix and
      runs TONR in ST, ladder and FBD: Reset clears ET and Q and holds them
      cleared while TRUE, then the timer times from scratch; without Reset it
      is a TON; and the free-running pulse (Reset := Q, PT 1s) gives one TRUE
      scan per period, twice in a row.

  - id: FN-140
    claim: >-
      On a Logix controller a TONR in ladder is written as a TON with a
      RES(t) rung ahead of the timer's rung, and in ST as TONR(t) on an
      FBD_TIMER whose .Reset is TRUE while Reset is TRUE or IN is FALSE.
    source: "#dialects"
    tests:
      - go ./logix/writer TestTONR

  - id: FN-141
    claim: >-
      A manifest tag's alias: is emitted by the Logix writer as an alias tag,
      and the L5X importer turns an export's alias tags, and rack points the
      logic named directly, into tags with alias:, and a rung that names an
      alias tag imports with the tag typed through its target.
    source: "#dialects"
    tests:
      - go ./logix/writer TestAliasTags
      - go ./logix/importer TestDialectAndAliasImport
      - go ./logix/importer TestAliasTagImportsWithAlias
      - go ./logix/importer TestAliasTagsInRungsImportAndRoundTrip
      - go ./logix/importer TestAliasTagsTheExportCannotTypeAreRefusedByName
    note: >-
      The writer's alias tags, the importer turning an export's alias tag
      (TagType="Alias" AliasFor=...) into a tag with alias:, and rack points
      named directly in the logic, are asserted. Rungs naming alias tags of
      every target kind (a base tag, a UDT member, a UDT BIT member, an Add-On
      Instruction parameter, a bit of a DINT, an array element, a rack
      point's bit) import with each tag declared as its target's type, keep
      alias: in the tag file, and write back to the export's rung text with
      each tag an alias tag of the same target (#330). An alias the export
      cannot type is refused by name, each case asserted: a whole rack word
      with no module definition, a target not in the export, a whole TIMER,
      a member the target's type lacks, and a program-scoped alias tag.

  - id: FN-142
    claim: >-
      The nautilus runtime ignores a tag's alias: binding: the tag is a tag,
      so a simulation runs the same source.
    source: "#dialects"
    tests:
      - go ./lang/conformance TestConformance/tag-alias
    note: >-
      tag-alias gives every tag an alias: naming a rack point and runs a
      start/stop seal-in on them in ST, ladder and FBD: inputs reach the
      programs and outputs hold their writes exactly as plain tags.

  # ── User function blocks ────────────────────────────────────────────
  - id: FN-143
    claim: >-
      A FUNCTION_BLOCK pin (VAR_INPUT / VAR_OUTPUT / VAR_IN_OUT / VAR) and a
      FUNCTION's inputs, locals and return type may be any type, including a
      user TYPE with nested structs, resolved against the whole compile; a
      pin naming an undeclared type is a compile error naming the type.
    source: "#a-pin-may-be-any-type-including-a-user-type"
    tests:
      - go ./lang/st TestFBStructPins
      - go ./lang/st TestFBStructPinFromLibraryFile
      - go ./lang/st TestFBUnknownPinTypeStillErrors
      - go ./lang/st TestVarInOutStructLocal
      - go ./lang/st TestUserTypeAsFunctionArgLocalReturnAndBlockVar
    partial: true
    note: >-
      Asserted: VAR_INPUT, VAR_OUTPUT, VAR_IN_OUT and VAR of a nested user
      TYPE, a TYPE from a library joined ahead, a FUNCTION's input, local and
      return of a nested user TYPE, and the unknown-type error naming the
      type; elementary pins are used throughout. Not asserted: "any type" for
      ARRAY types. No test declares a VAR_INPUT, VAR_OUTPUT or VAR_IN_OUT of
      an ARRAY type, or a FUNCTION input of one.

  - id: FN-144
    claim: >-
      A call may leave any VAR_INPUT out: it keeps its value, the declared
      initial value until something writes it (as an unconnected FB input in
      TIA or CODESYS); EN, unbound, is TRUE.
    source: "#an-input-left-unbound-keeps-its-value"
    tests:
      - go ./lang/st TestENOOnlyAndPositional
      - go ./lang/st TestUserFB_UnboundInputKeepsInitial
      - go ./lang/st TestUnboundInputKeepsTheWrittenValue
    note: >-
      TestUnboundInputKeepsTheWrittenValue: an omitted input reads its initial
      7, then 100 after one call writes it, and keeps 100 on later calls that
      omit it; a user block called with EN unbound runs and reports ENO TRUE.

  - id: FN-145
    claim: >-
      A VAR_IN_OUT is bound to a variable, and what the block writes into it
      is visible to the caller when the call returns (scalar, struct local,
      VAR_EXTERNAL struct tag as one whole-struct write).
    source: "#var_in_out-is-a-reference-pin"
    tests:
      - go ./lang/st TestVarInOutScalar
      - go ./lang/st TestVarInOutStructLocal
      - go ./lang/st TestVarInOutExternalStructTag
      - go ./lang/st TestUserFB_VarConstant_InOutWriteBack

  - id: FN-146
    claim: >-
      A VAR_IN_OUT argument must be assignable (a variable, a struct field,
      an array element or a VAR_EXTERNAL tag); an expression is a compile
      error.
    source: "#var_in_out-is-a-reference-pin"
    tests:
      - go ./lang/st TestVarInOutRejectsNonLValue
      - go ./lang/st TestVarInOutAcceptsEveryAssignableForm
    note: >-
      TestVarInOutAcceptsEveryAssignableForm binds a variable, a struct field,
      array elements (literal and variable index), a VAR_EXTERNAL tag and a
      tag's field, and each receives the block's write.

  - id: FN-147
    claim: >-
      The argument's type must match a VAR_IN_OUT pin exactly (an INT does
      not stand in for a REAL pin).
    source: "#var_in_out-is-a-reference-pin"
    tests:
      - go ./lang/st TestVarInOutTypeMustMatch

  - id: FN-148
    claim: >-
      Every VAR_IN_OUT must be bound at every call site (a compile error
      otherwise).
    source: "#var_in_out-is-a-reference-pin"
    tests:
      - go ./lang/st TestVarInOutMustBeBound

  - id: FN-149
    claim: A VAR_IN_OUT pin's own type may not be a function block.
    source: "#var_in_out-is-a-reference-pin"
    tests:
      - go ./lang/st TestVarInOutRejectsFBPinType

  - id: FN-150
    claim: >-
      Two calls in one scan bound to different variables each see and update
      their own.
    source: "#var_in_out-is-a-reference-pin"
    tests:
      - go ./lang/st TestVarInOutTwoCallsSameScanEachOwnVariable
    note: >-
      One instance called twice in a scan with a and c, and two instances with x
      and y: each call sees its own variable's value on entry and writes back to
      it, over two scans.

  - id: FN-151
    claim: >-
      FUNCTIONs have no VAR_IN_OUT or VAR_OUTPUT: an IEC function is a single
      return value, and the compiler says so.
    source: "#var_in_out-is-a-reference-pin"
    tests:
      - go ./lang/st TestFunctionRefusesInOutAndOutput
    note: >-
      Both VAR_IN_OUT and VAR_OUTPUT in a FUNCTION are compile errors naming the
      section and "single return value".

  - id: FN-152
    claim: >-
      A VAR_IN_OUT is bound with :=, like an input; the => form binds
      outputs, so it is not the way to bind an IN_OUT (a compile-time rule).
    source: "#var_in_out-is-a-reference-pin"
    tests:
      - go ./lang/st TestVarInOutScalar
      - go ./lang/st TestVarInOutRefusesOutputBinding
    note: >-
      Binding an IN_OUT with := runs (TestVarInOutScalar); => on a VAR_IN_OUT is
      refused at compile time, alone (unbound, "N := <variable>") and beside a
      := binding ("is a VAR_IN_OUT - bind it with N := <variable>").

  # ── Function blocks in ladder ───────────────────────────────────────
  - id: FN-153
    claim: >-
      A .ld file may define FUNCTION_BLOCKs whose body is rungs, each
      instance with its own retained state (two pumps are two instances,
      each with its own seal-in and its own t1).
    source: "#function-blocks-in-ladder"
    tests:
      - go ./lang/ld TestLadderFunctionBlockRuns
      - go ./lang/ld TestLadderFunctionBlockLowers
      - go ./lang/ld TestLadderFunctionBlockTwoInstancesIndependent
    note: >-
      Two PumpSeq instances in one program each hold their own seal-in and
      their own t1, started three seconds apart and finishing three seconds
      apart.

  - id: FN-154
    claim: >-
      A ladder block's VAR_* sections are ordinary POU declarations,
      VAR_IN_OUT included, so a ladder block can take a UDT by reference.
    source: "#function-blocks-in-ladder"
    tests:
      - go ./lang/ld TestLadderFunctionBlockInOutStructPin

  - id: FN-155
    claim: >-
      A ladder block is called from ladder with power on its power-in pin and
      => capturing outputs, and from ST or FBD like any other block.
    source: "#calling-one"
    tests:
      - go ./lang/ld TestLadderFunctionBlockRuns
      - go ./lang/ld TestLadderFunctionBlockFromST
      - go ./internal/project TestLadderAndFBDLibrariesCalledFromEveryLanguage
    note: >-
      Ladder (power on Start, Run => PumpRun), ST and FBD programs each call
      the ladder block and run its seal-in.

  - id: FN-156
    claim: >-
      An FB instance a rung declares inline needs no VAR entry, and a
      declaration in the POU's own header wins (the rung is a call on it, not
      a second declaration).
    source: "#calling-one"
    tests:
      - go ./lang/ld TestLadderFunctionBlockNested
      - go ./lang/ld TestLadderFunctionBlockLowers
      - go ./lang/ld TestLadderInlineInstanceNotHiddenByLibraryBlockVar
    note: >-
      TestLadderFunctionBlockNested runs an inline d1:Debounce() with no VAR
      entry; TestLadderFunctionBlockLowers asserts a header-declared t1 is
      declared once and compiles. Only the POU's own header counts: an inline
      t1:TON still runs with an ST block's VAR t1 earlier in the file
      (TestLadderInlineInstanceNotHiddenByLibraryBlockVar, #332). Removed: TestInlineRungBody (a one-line
      rung, not an inline instance), TestInsertReusesHeaderDeclaredInstance
      (an editor insert) and the FBD TestInstanceDeclaredInHeaderIsNotRedeclared
      (not ladder).

  - id: FN-157
    claim: >-
      A .ld file with no PROGRAM is a project library whose blocks join the
      prelude ahead of every task, usable from any language; .fbd libraries
      work the same way.
    source: "#a-ld-library"
    tests:
      - go ./internal/project TestLadderLibraryComposes
      - go ./internal/project TestLadderLibraryProjectRuns
      - go ./internal/project TestLadderAndFBDLibrariesCalledFromEveryLanguage
    note: >-
      A PROGRAM-less .ld and a PROGRAM-less .fbd library are both composed,
      and ST, LD, FBD and SFC tasks of one project each call both libraries'
      blocks.

  - id: FN-158
    claim: >-
      A library may sit in the project root or under lib/; lib/ holds
      libraries only (a PROGRAM there is an error) and no other subdirectory
      composes.
    source: "#a-ld-library"
    tests:
      - go ./internal/project TestLibDirComposes
      - go ./internal/project TestLibDirRefusesAProgram
      - go ./internal/project TestOtherSubdirsStayIgnored
      - go ./internal/project TestLadderLibraryProjectRuns
    note: >-
      The libdir fixture has lib/ libraries only; the project-root case is
      TestLadderLibraryProjectRuns, whose blocks.ld and scale.st sit in the
      root and run.

  - id: FN-159
    claim: >-
      Composition order is every .st library first, then every transpiled
      .ld / .fbd library, each group sorted by project-relative path; order
      never decides whether a call resolves (blocks may reference each other
      in either direction, across files), only which duplicate is reported.
    source: "#a-ld-library"
    tests:
      - go ./internal/project TestLadderLibraryComposes
      - go ./internal/stproject TestLibraryPathsRootAndLib
      - go ./internal/project TestLibDirComposes
      - go ./internal/project TestLibDirDuplicateAcrossRootAndLib
      - go ./internal/project TestLibraryReferencesResolveInEitherDirection
    note: >-
      Tier order is asserted where path order disagrees with it
      (TestLadderLibraryComposes: scale.st composes ahead of blocks.ld).
      TestLibraryPathsRootAndLib sorts each tier by project-relative path,
      root and lib/ interleaved, with .fbd in the graphical tier. A block in
      both the root and lib/ reports the same duplicate error as two root
      files. a.st (composed first) instantiates a block from b.st and one
      from a .ld library, b.st calls a FUNCTION from a.st, and the project
      runs. TestLibDirComposes and the resolve test cannot tell tier order
      from path order on their own: their .st paths already sort first.

  - id: FN-160
    claim: >-
      Declaring the same FUNCTION_BLOCK twice in one .ld file is refused with
      the second declaration's line, before anything is transpiled.
    source: "#a-ld-library"
    tests:
      - go ./lang/ld TestLadderFunctionBlockErrors
