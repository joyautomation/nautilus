# GoReleaser builds the nautilus CLI for every platform and publishes a
# GitHub Release on a v* tag. Validated on every push by the `goreleaser
# check` job in ci.yml, so a schema mistake surfaces on a PR, not at tag time.
version: 2

project_name: nautilus

builds:
  - id: nautilus
    main: ./cmd/naut
    binary: naut
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    # 32-bit ARM is for controllers: the groov EPIC and the PLCnext AXC F
    # 2152 are both ARMv7 (hard float), and the binary runs on them as is.
    goarm: ['7']
    ignore:
      - {goos: darwin, goarch: arm}
      - {goos: windows, goarch: arm}
    ldflags:
      # -s -w strips debug info; -X injects the tag version into the CLI so
      # `naut version` matches the release.
      - -s -w -X github.com/joyautomation/nautilus/internal/lsp.Version={{ .Version }}

archives:
  - id: nautilus
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # linux_armv7 for the ARM build; every other name is unchanged.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  github:
    owner: joyautomation
    name: nautilus
  # v0.x.y-rc* etc. are marked as pre-releases automatically.
  prerelease: auto
