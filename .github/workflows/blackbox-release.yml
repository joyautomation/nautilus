# The independent tester's `release` checks (tools/blackbox), two ways:
#
# - On a CLI release: against the binary the release actually published,
#   the tarball from the GitHub Release, checksums verified, never a
#   rebuild. The runner and the checks are taken from the released tag's
#   tree.
# - Nightly against main: naut built from main's tree by the runner, so a
#   claim citing a release check has a verdict between releases, and a
#   release check main broke shows the next morning, not at the release.
#
# ci.yml's runtime-evidence job reads the most recent run's artifact (either
# kind) for the claims that cite these checks (tools/evidence `-release`).
# By hand: Actions → blackbox-release → Run workflow, with a tag or empty
# for main.
name: blackbox-release
on:
  schedule:
    - cron: '23 7 * * *' # daily, 07:23 UTC
  # After the CLI release workflow has published the tag's Release. Not
  # `release: published`: goreleaser creates the Release with GITHUB_TOKEN,
  # and events made with GITHUB_TOKEN start no workflows, so that trigger
  # never fired (v0.19.0 shipped without a run). For a tag push,
  # workflow_run's head_branch is the tag.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: CLI release tag, e.g. v0.18.0; empty runs main's tree
        required: false

permissions:
  contents: read

jobs:
  release-checks:
    name: Black-box — the tester's release checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == 'joyautomation/nautilus') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v') && !startsWith(github.event.workflow_run.head_branch, 'vscode-v'))
    runs-on: ubuntu-latest
    env:
      # Empty on the nightly: the checks run against main's tree.
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r tools/blackbox/requirements.txt
      # The same fetch the tester's operator does (nautilus-blackbox
      # bin/fetch.sh): the linux/amd64 asset, checked against checksums.txt.
      # Without a tag NAUTILUS_BLACKBOX_NAUT stays unset and the runner
      # builds naut from the checkout, as the gate job does.
      - name: Fetch the published binary
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${TAG#v}
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/rel" \
            -p "nautilus_${ver}_linux_amd64.tar.gz" -p checksums.txt
          ( cd "$RUNNER_TEMP/rel" && grep "nautilus_${ver}_linux_amd64.tar.gz" checksums.txt | sha256sum -c - )
          tar -C "$RUNNER_TEMP/rel" -xzf "$RUNNER_TEMP/rel/nautilus_${ver}_linux_amd64.tar.gz"
          naut=$(find "$RUNNER_TEMP/rel" -type f -name naut | head -1)
          [ -n "$naut" ] || { echo '::error::no naut in the release tarball'; find "$RUNNER_TEMP/rel" -type f; exit 1; }
          chmod +x "$naut"; "$naut" --help | head -1
          echo "NAUTILUS_BLACKBOX_NAUT=$naut" >> "$GITHUB_ENV"
      - name: Release checks
        shell: bash
        run: |
          mkdir -p evidence
          NAUTILUS_BLACKBOX_PYTHON="$(which python)" NAUTILUS_BLACKBOX_DISPOSITION=release \
            go test -json ./tools/blackbox -run TestBlackbox -v -timeout 1800s | tee evidence/blackbox-release.json | go run ./tools/evidence cat
      # Kept when a check fails too: the claims citing it must read failing,
      # not fall back to an older run that passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-blackbox-release-${{ env.TAG || 'main' }}
          path: evidence/
          retention-days: 90
