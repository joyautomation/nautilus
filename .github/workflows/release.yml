name: release
on:
  push:
    # "v*" alone would also match the extension's vscode-v* tags (GitHub's
    # filter is a prefix glob); those belong to vscode-stable.yml.
    tags: ["v*", "!vscode-v*"]

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  # CLI binaries → GitHub Release. Needs no secrets beyond the automatic
  # GITHUB_TOKEN, so this works the moment you push a tag.
  cli:
    name: CLI binaries (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Pin the current and previous CLI tags: a commit can also carry a
      # vscode-v* tag, and GoReleaser would otherwise consider it for either.
      - name: CLI tags for GoReleaser
        run: |
          echo "GORELEASER_CURRENT_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"; fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A convenience VSIX attached to the Release, built at the extension's own
  # package.json version. That is main's version, which is always the
  # pre-release line (odd minor), so it is always packaged as a pre-release.
  # Registry publishing is NOT driven by v* tags: pre-releases ship from main
  # (publish.yml), stable from vscode-v* tags (vscode-stable.yml). See
  # RELEASING.md.
  extension:
    name: VS Code extension (VSIX on the Release)
    runs-on: ubuntu-latest
    needs: cli # the Release must exist before we upload the VSIX to it
    steps:
      - uses: actions/checkout@v4
      - name: Package VSIX (pre-release)
        id: pkg
        uses: ./.github/actions/vscode-package
        with: {pre-release: 'true'}
      - name: Attach VSIX to the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSIX: ${{ steps.pkg.outputs.vsix }}
        run: gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
