name: release
on:
  push:
    # "v*" alone would also match the extension's vscode-v* tags (GitHub's
    # filter is a prefix glob); those belong to vscode-stable.yml.
    tags: ["v*", "!vscode-v*"]

permissions:
  contents: write # create the GitHub Release and upload assets

# A CLI release carries the CLI only, plus the PLCnext shim it drives. The
# extension has its own releases: stable VSIXes are on the vscode-v* GitHub
# Releases (vscode-stable.yml) and pre-releases ship from main (publish.yml). A VSIX built here would be main's
# package.json at tag time, which can predate the release PR's bump and then
# names the wrong version (v0.16.0 carried a "0.13.2" that was 0.13.3 code).

jobs:
  # CLI binaries → GitHub Release. Needs no secrets beyond the automatic
  # GITHUB_TOKEN, so this works the moment you push a tag.
  cli:
    name: CLI binaries (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Pin the current and previous CLI tags: a commit can also carry a
      # vscode-v* tag, and GoReleaser would otherwise consider it for either.
      - name: CLI tags for GoReleaser
        run: |
          echo "GORELEASER_CURRENT_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"; fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # logixd as source plus a one-command installer, never as a binary: it links
  # the Logix Designer SDK's .NET client, which is Rockwell's and comes only
  # with the SDK install, so it is built on the licensed machine.
  # install-logixd.ps1 fetches logixd.zip, adds a private .NET 10 SDK if
  # needed, and runs install.ps1. VERSION is stamped into the build.
  logixd:
    name: logixd source + installer on the Release
    runs-on: ubuntu-latest
    needs: cli # the Release must exist before we upload to it
    steps:
      - uses: actions/checkout@v4
      - name: Package logixd.zip
        run: |
          cd tools/logixd
          echo "${GITHUB_REF_NAME#v}" > VERSION
          zip -qr "$RUNNER_TEMP/logixd.zip" . -x 'bin/*' 'obj/*'
          cp install-logixd.ps1 "$RUNNER_TEMP/"
      - name: Attach to the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/logixd.zip" "$RUNNER_TEMP/install-logixd.ps1" --clobber

  # The PLCnext in-process tier (rt/plcnext-io): a C program the firmware's
  # ACF starts, so it is not part of the Go build. Built with zig for the
  # controller's glibc, packed with its ACF files and README, and attached
  # beside the CLI's armv7 tarball; the version is stamped into its log.
  plcnext-io:
    name: PLCnext nautilus_io on the Release
    runs-on: ubuntu-latest
    needs: cli # the Release must exist before we upload to it
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: {version: 0.17.0}
      - name: Build and pack
        run: VERSION="${GITHUB_REF_NAME#v}" rt/plcnext-io/build.sh -p "$RUNNER_TEMP/plcnext-io"
      - name: Attach to the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/plcnext-io/*.tar.gz "$RUNNER_TEMP"/plcnext-io/*.tar.gz.sha256 --clobber
