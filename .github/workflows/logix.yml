name: Logix

# The Allen-Bradley half of the toolchain, split by what it needs to run.
#
#   lang/l5x and logix/logixd unit tests need nothing at all — they are in
#   the main CI job (`go test ./...`), and this workflow's `reader` job adds
#   the corpus sweep on top when a corpus is configured.
#
#   Everything that drives a Logix PROJECT needs the Studio 5000 SDK, which
#   means Windows, a licence, and the SDK's NuGet package — none of which a
#   GitHub-hosted runner has. That work lives on a self-hosted runner and is
#   opt-in: without one, this workflow must stay green rather than red, or a
#   contributor with no Rockwell licence cannot land a change.

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

env:
  GOTOOLCHAIN: local

jobs:
  reader:
    name: L5X reader — unit + corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Unit tests
        run: go test ./lang/l5x/... ./logix/... ./cmd/nautilus/ -run 'Logix|L5X|Ladder|Types|Tags|Normalize|ParseRung|Parse|Client|Import|Download|Convert|Session|XPath|Event' -v
      # The development corpus is ~60 real exports, most of it client work
      # that cannot live in the repo. A runner that has it mounted sweeps
      # it; one that does not skips, and says so.
      - name: Corpus sweep
        if: vars.NAUTILUS_L5X_CORPUS != ''
        env:
          NAUTILUS_L5X_CORPUS: ${{ vars.NAUTILUS_L5X_CORPUS }}
        run: go test ./lang/l5x/ -run TestCorpus -v

  agent:
    name: logixd — build and integration
    # Opt-in. Set the repo variable LOGIX_SELF_HOSTED=true once a runner
    # labelled `logix-sdk` exists; until then this job is skipped, not failed.
    if: vars.LOGIX_SELF_HOSTED == 'true'
    runs-on: [self-hosted, windows, logix-sdk]
    timeout-minutes: 60
    env:
      # The runner's own configuration. None of it is a secret except the
      # token, and none of it is supplied by a pull request.
      LOGIXD_ADDR: http://127.0.0.1:8188
      LOGIXD_WORKDIR: ${{ runner.temp }}\logixd-work
      NAUTILUS_LOGIXD_URL: http://127.0.0.1:8188
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}

      - name: Build logixd
        working-directory: tools/logixd
        run: |
          & $env:LOGIXD_DOTNET build -c Release -o "$env:RUNNER_TEMP\logixd-bin"
        shell: pwsh

      - name: Start logixd
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = Split-Path -Parent $env:LOGIXD_DOTNET
          $p = Start-Process -FilePath $env:LOGIXD_DOTNET `
            -ArgumentList "$env:RUNNER_TEMP\logixd-bin\logixd.dll" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\logixd.out" `
            -RedirectStandardError  "$env:RUNNER_TEMP\logixd.err" `
            -PassThru -WindowStyle Hidden
          "LOGIXD_PID=$($p.Id)" | Out-File -Append $env:GITHUB_ENV
          # Wait for it to answer rather than sleeping a guessed interval.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Milliseconds 500
            try { $ok = (Invoke-WebRequest "$env:NAUTILUS_LOGIXD_URL/v1/health" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 }
            catch { $ok = $false }
          } while (-not $ok -and (Get-Date) -lt $deadline)
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\logixd.err"; throw "logixd did not come up" }

      # Informational, never fatal. A lapsed activation is an operations
      # problem, not a broken build — and the report says which gate failed,
      # which is the thing an operator actually needs.
      - name: Licensing probe
        continue-on-error: true
        run: go run ./cmd/nautilus logix probe

      # Tier 1: the agent's own contract — auth, the file sandbox, error
      # classification. Needs no licence, so it MUST pass.
      - name: Agent contract tests
        run: go test ./logix/logixd/ -run TestAgent -v -timeout 15m

      # Tier 2: the SDK itself. Each test asks the probe first and skips
      # with the failing gate named, so an unlicensed runner reports
      # "skipped: no activation" instead of a red build.
      - name: SDK integration tests
        run: go test ./logix/logixd/ -run TestSDK -v -timeout 45m

      - name: logixd log
        if: always()
        shell: pwsh
        run: |
          Write-Host "--- stdout ---"; Get-Content "$env:RUNNER_TEMP\logixd.out" -ErrorAction SilentlyContinue -Tail 100
          Write-Host "--- stderr ---"; Get-Content "$env:RUNNER_TEMP\logixd.err" -ErrorAction SilentlyContinue -Tail 100

      - name: Stop logixd
        if: always()
        shell: pwsh
        run: if ($env:LOGIXD_PID) { Stop-Process -Id $env:LOGIXD_PID -Force -ErrorAction SilentlyContinue }
