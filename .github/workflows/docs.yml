name: docs

on:
  push:
    branches: [main]
    # The docs' own sources, and everything the playground (/playground/) is
    # built from: it follows main, so a Go or extension change redeploys it.
    paths: ['website/**', 'docs/**', 'hmi/**', 'hmi-3d/**', 'tools/vscode-iec/**', 'playground/**',
            'examples/lift-station/**', 'examples/plcnext-bench/**', 'examples/epic-bench/**', '**.go', 'go.mod', 'go.sum']
  pull_request:
    paths: ['website/**', 'docs/**', 'hmi/README.md', 'tools/vscode-iec/syntaxes/**', 'tools/vscode-iec/webview-ui/gesture-harness/INVENTORY.md']

  # Dispatched by a green rig-nightly / rig-demo so the proof pages pick up
  # the new clips.
  workflow_dispatch:

# Deploys go out one at a time, newest last (#752). Without this, two merges
# a few seconds apart deployed at once and the older one could finish second:
# on 2026-11-17 the site ran a commit behind main for 20 minutes. A deploy
# in progress always finishes; a newer one waiting replaces an older one
# still waiting. A PR's build is only cancelled by that PR's next push.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR's check that the site builds. On main the deploy job's image build
  # runs the same npm ci && npm run build (website/Dockerfile), so this job
  # would only hold the deploy up by a minute.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # fetch-verified.mjs lists runs and downloads artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      # The prebuild fetch of verified clips is soft: no token or no green run
      # yields empty data and the build still passes (see the script).
      - run: npm run build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  # Ships nautilus.joyautomation.com — same pattern as the joyautomation.com
  # site: image → DO registry, kubectl apply to k8s-joy-1/joy. Skips cleanly
  # until the DIGITALOCEAN_ACCESS_TOKEN secret exists in this repo.
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # fetch-verified.mjs downloads rig/CI artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: gate
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "DIGITALOCEAN_ACCESS_TOKEN not set — skipping deploy"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install doctl
        if: steps.gate.outputs.go == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # The image build has no token, so fetch the proof-page clips here; the
      # Dockerfile copies the generated website/public/verified and
      # website/src/data/verified.json in. Soft: no script / no green run is fine.
      # The npm download cache covers every package the playground build
      # installs (playground/scripts/build.sh and app.sh), not only the site.
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            hmi/package-lock.json
            hmi-3d/package-lock.json
            tools/vscode-iec/package-lock.json
            tools/vscode-iec/webview-ui/package-lock.json
            playground/app/package-lock.json
            examples/lift-station/hmi/package-lock.json
            examples/plcnext-bench/hmi/package-lock.json
      - name: Fetch verified clips
        if: steps.gate.outputs.go == 'true'
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if test -f scripts/fetch-verified.mjs; then
            npm ci
            node scripts/fetch-verified.mjs
          else
            echo 'no fetch script yet'
          fi
      # The playground (playground/dist): naut.wasm, the VS Code app with the
      # extension's web build, the examples and lift-station's HMI. The
      # Dockerfile copies it in and the site serves it at /playground/engine/.
      - uses: actions/setup-go@v5
        if: steps.gate.outputs.go == 'true'
        with:
          go-version-file: go.mod
      - name: Build the playground
        if: steps.gate.outputs.go == 'true'
        run: ./playground/scripts/build.sh
      - name: Build container image
        if: steps.gate.outputs.go == 'true'
        run: docker build -f website/Dockerfile -t registry.digitalocean.com/jar-containers/nautilus-docs:$(echo $GITHUB_SHA | head -c7) .
      - name: Log in to DigitalOcean Container Registry
        if: steps.gate.outputs.go == 'true'
        run: doctl registry login --expiry-seconds 1200
      - name: Push image
        if: steps.gate.outputs.go == 'true'
        run: docker push registry.digitalocean.com/jar-containers/nautilus-docs:$(echo $GITHUB_SHA | head -c7)
      # The playground's saved projects (playground/share), which the docs
      # ingress sends /playground/api/ to. Its pod restarts on each deploy
      # (one replica on one volume); for those seconds the Share button
      # puts the whole project in the link instead.
      - name: Build and push the share service image
        if: steps.gate.outputs.go == 'true'
        run: |
          img=registry.digitalocean.com/jar-containers/nautilus-playground-share:$(echo $GITHUB_SHA | head -c7)
          docker build -f playground/share/Dockerfile -t $img .
          docker push $img
      - name: Set image in manifests
        if: steps.gate.outputs.go == 'true'
        run: |
          sed -i 's|<IMAGE>|registry.digitalocean.com/jar-containers/nautilus-docs:'$(echo $GITHUB_SHA | head -c7)'|' website/k8s/deploy.yml
          sed -i 's|<IMAGE>|registry.digitalocean.com/jar-containers/nautilus-playground-share:'$(echo $GITHUB_SHA | head -c7)'|' playground/share/k8s.yml
      - name: Save kubeconfig
        if: steps.gate.outputs.go == 'true'
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 k8s-joy-1
      # The share service first, so the ingress path it adds has somewhere
      # to go.
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        run: |
          kubectl apply -f playground/share/k8s.yml
          kubectl rollout status deployment/nautilus-playground-share -n joy --timeout=5m
          kubectl apply -f website/k8s/deploy.yml
      - name: Verify rollout
        if: steps.gate.outputs.go == 'true'
        run: kubectl rollout status deployment/nautilus-docs -n joy
