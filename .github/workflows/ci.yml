name: CI
on:
  push: {branches: [main]}
  pull_request:
# GOTOOLCHAIN=local makes the pinned go-version a floor, not a suggestion:
# without it, a dependency bump that raises go.mod's `go` directive gets a
# newer toolchain auto-downloaded and CI stays green while `go install`
# breaks for everyone on the documented minimum (this bit v0.4.1).
env:
  GOTOOLCHAIN: local
# A new push to a PR cancels that PR's run still in progress: only its latest
# commit can merge, and a run is 20-odd jobs on a shared pool of runners.
# On main the group is the commit itself, so no main run (and none of the
# runtime evidence it keeps) is ever cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # How much of this workflow a PR needs (#752): .github/scripts/ci-scope.sh
  # reads the PR's changed paths. A PR whose every path is on its light list
  # (an example's HMI app, the docs site, the playground's app shell, design
  # notes) skips the Go, driver, foreign-stack and extension jobs and runs
  # the checks that apply to it: naut check + naut test on the example
  # projects it touched, the HMI 3D and playground builds, version-sync and
  # the docs-claims drift warning. Anything else, and every push to main,
  # runs everything. Separately, the VS Code extension's jobs (compile/test,
  # gesture harness) run only when the extension, what it bundles or what
  # its tests read changes (ci-scope.sh's extension list), or .github/. The
  # CLI-discovery e2e's macOS and Windows legs run only when what that e2e
  # reads changes (tools/vscode-iec/, hmi/, hmi-3d/; not the example
  # diagrams or components, #916) or a .github/ change touches the e2e's own
  # definition (ci-scope.sh's e2e-all): those legs wait longest for a runner,
  # and every push to main runs all three anyway. A PR without them runs the
  # e2e on Linux only, the other legs left out of the matrix (absent, not
  # "skipped": were they ever made required checks, they would wait at
  # "expected"). A skipped
  # job reports "skipped", which branch protection counts as passing.
  # Every gate below fails closed: a job is left out only on an explicit
  # "false", never on a missing or garbled output.
  changes:
    name: Changes — full suite or light
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      examples: ${{ steps.scope.outputs.examples }}
      hmibuild: ${{ steps.scope.outputs.hmibuild }}
      extension: ${{ steps.scope.outputs.extension }}
      # The CLI-discovery e2e's OS legs: all three when what it reads or its
      # own definition changed (e2e-all); Linux only otherwise (it
      # drives a naut built from the PR, so a Go change still runs it,
      # without the macOS/Windows queues).
      e2e-os: ${{ steps.scope.outputs.e2e-all != 'false' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2} # a PR's merge commit: HEAD^1 is the base
      - name: the scope rules pass their own table test
        run: .github/scripts/ci-scope.test.sh
      - name: the ci-ok gate passes its own table test
        run: .github/scripts/ci-ok.test.sh
      - name: scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          out=
          if [ "$EVENT" = pull_request ] && changed=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$changed"
            # The base's ci.yml, for e2e-all's comparison (none: it counts
            # as changed).
            base_ci="$RUNNER_TEMP/base-ci.yml"
            git show HEAD^1:.github/workflows/ci.yml >"$base_ci" 2>/dev/null || base_ci=
            out=$(printf '%s\n' "$changed" | CI_SCOPE_BASE_CI="$base_ci" .github/scripts/ci-scope.sh) || out=
          fi
          # Fail closed: a push, no diff, or a script that failed or printed
          # no verdict runs everything.
          if ! grep -qxE 'full=(true|false)' <<<"$out" || ! grep -qxE 'extension=(true|false)' <<<"$out" \
            || ! grep -qxE 'e2e-all=(true|false)' <<<"$out"; then
            out=$'full=true\nextension=true\ne2e-all=true'
          fi
          printf '%s\n' "$out" | tee -a "$GITHUB_OUTPUT"
  go:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Go — vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: false}
      # Its own build cache (#752): setup-go's is keyed on go.sum alone, so
      # whichever job saved first after a go.sum change owns it, and this
      # job rebuilt nearly all of nautilus every run. Main saves one a day
      # (about 220 MB compressed); a PR restores the newest and never
      # saves. Tests still all run: -count=1 keeps cached results out.
      # The key carries the resolved toolchain ('1.25' floats to the newest
      # patch): after a patch release, entries from the old toolchain would
      # only miss, so a new patch starts its own line. Go itself trims cache
      # entries unused for 5 days, so the saved cache does not grow without
      # bound.
      - id: key
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: gocache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.key.outputs.day }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ steps.key.outputs.go }}-
      - run: go vet ./...
      # -json and the coverage profile are kept as runtime evidence (the
      # runtime-evidence job joins them to docs/claims); `evidence cat`
      # prints the stream as the usual go test output.
      # TestReleaseTargetsBuildWithoutCgo cross-compiles the CLI seven times
      # (about 4 minutes, most of cmd/naut's time): the go-crossbuild job runs
      # it in parallel instead (#752).
      - name: go test ./...
        shell: bash
        run: |
          mkdir -p evidence
          go test -json -count=1 -coverprofile=evidence/cover.out -skip '^TestReleaseTargetsBuildWithoutCgo$' ./... | tee evidence/go-test.json | go run ./tools/evidence cat
      # The real-time guard (#836) against a real SCHED_FIFO thread: the
      # runtime's test binary (and the PLCnext shim's guard harness) gets
      # CAP_SYS_NICE with setcap, and a thread spinning at FIFO 1 must be
      # demoted by RLIMIT_RTTIME. It cannot wedge
      # the runner: the limit's hard half SIGKILLs the spinner after 125 ms
      # and the test gives up after 5 s. NAUTILUS_REQUIRE_RT=1 makes a missing
      # capability fail instead of skip, so a setcap that silently did not
      # take cannot pass here (go test ./... above still skips it).
      - name: runtime RT guard (real SCHED_FIFO, CAP_SYS_NICE via setcap)
        env: {NAUTILUS_REQUIRE_RT: '1'}
        run: |
          go test -c -o "$RUNNER_TEMP/rt.test" ./runtime
          sudo setcap cap_sys_nice+ep "$RUNNER_TEMP/rt.test"
          "$RUNNER_TEMP/rt.test" -test.run '^TestRTGuard' -test.v -test.count=1
          # The PLCnext shim's guard (rt/plcnext-io/rtguard.h): its harness
          # gets the capability from this binary as an ambient one. Run from
          # the package directory: the harness's source path is relative.
          go test -c -o "$RUNNER_TEMP/rtc.test" ./rt/plcnext-io/ctest
          sudo setcap cap_sys_nice+ep "$RUNNER_TEMP/rtc.test"
          (cd rt/plcnext-io/ctest && "$RUNNER_TEMP/rtc.test" -test.run '^TestRTGuard' -test.v -test.count=1)
      - run: go build ./...
      # The browser playground (playground/, cmd/naut-wasm): GOOS=js swaps
      # internal/project's drivers for simulated ones, so a change that
      # pulls a field driver or a socket into the shared path breaks here.
      - name: playground wasm build
        run: GOOS=js GOARCH=wasm go vet ./cmd/naut-wasm && GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/naut-wasm
      # Its own tests run under Node (the runner has it): a controller's
      # streams end when naut run replaces it or naut stop stops it.
      - name: playground wasm tests
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/naut-wasm
      # Every benchmark once, so one that no longer compiles its own program
      # fails here rather than when someone next profiles (#612). The test
      # step above has already built the packages, so this adds little (15-35 s
      # from a cold cache); the numbers are not kept.
      - name: benchmarks compile and run (1 iteration)
        run: go test -run '^$' -bench . -benchtime 1x ./...
      - name: Save the Go build cache (main, once a day)
        if: always() && steps.gocache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.key.outputs.day }}
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-go
          path: evidence/
          retention-days: 14

  # Every example project through naut itself, beside go test rather than
  # after it (#752): naut check builds and renders each HMI, which is most
  # of this job's time. On a light PR (the changes job) it checks only the
  # example projects whose HMI the PR changed, and carries the docs-claims
  # drift warning that runtime-evidence gives a full run.
  examples:
    name: Examples — naut check, naut test (every manifest)
    needs: changes
    runs-on: ubuntu-latest
    env:
      FULL: ${{ needs.changes.outputs.full != 'false' }}
      EXAMPLES: ${{ needs.changes.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2} # the light drift check diffs HEAD^1
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: mkdir -p evidence
      - name: build naut
        run: go build -o "$RUNNER_TEMP/naut" ./cmd/naut
      # Node with type stripping, for the example HMIs' own unit tests
      # (npm test, below): the runner's default Node may predate it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/*/hmi/package-lock.json
      # Every claim in docs/claims names tests that exist (#752): a renamed
      # test or a typo in a claim fails the PR here, light PRs included (it
      # takes a second). Only the references gate; the claims' verdicts
      # stay a report (runtime-evidence).
      - name: claims name tests that exist (tools/evidence check)
        run: go run ./tools/evidence check
      # The spatial rig's HDRI, backdrop and floor textures live in a GitHub
      # release, not in git (examples/spatial-rig/hmi/assets.json); naut
      # check holds the scene file to files that exist, so fetch them first.
      - name: fetch the spatial rig's assets
        run: node examples/spatial-rig/hmi/fetch-assets.mjs
      - name: naut check (examples)
        if: env.FULL == 'true'
        run: '"$RUNNER_TEMP/naut" check examples'
      - name: naut check + naut test (psu-lab fixture)
        if: env.FULL == 'true'
        # testdata/projects/psu-lab links examples/it-cluster's lib/server.st,
        # so it gates here; the other testdata projects are read by go test.
        run: |
          "$RUNNER_TEMP/naut" check testdata/projects/psu-lab
          "$RUNNER_TEMP/naut" test testdata/projects/psu-lab
      - name: naut check + naut test (every example project's every manifest)
        # Discovers project roots by their nautilus.yaml (so go-sdk, which
        # has none, is skipped automatically) and runs
        # .github/scripts/naut-example.sh on each: every manifest checked,
        # the suites tested. A new example project is covered the moment it
        # gets a nautilus.yaml; nothing here names lift-station/batch-skid/
        # remote-fleet by hand. Two projects at a time: each naut check
        # renders its HMI in its own Chrome, with its own profile, port and
        # preview server, and writes nothing into the project. The renders
        # are CPU-bound (software WebGL), so more at once on a 4-CPU runner
        # only slows each one down (three at a time doubled the render times
        # and saved a minute) and brings Chrome closer to its 20 s start
        # limit. Each project's output is printed whole, in order. A light
        # PR: only the projects it touched (none for a docs-only PR).
        run: |
          set -u
          logs=$RUNNER_TEMP/examples
          mkdir -p "$logs"
          if [ "$FULL" = true ]; then
            mapfile -t roots < <(find examples -name nautilus.yaml -printf '%h\n' | sort)
          else
            read -r -a roots <<<"$EXAMPLES"
            echo "light PR: example projects touched: ${roots[*]:-none}"
            [ ${#roots[@]} -gt 0 ] || exit 0
          fi
          printf '%s\n' "${roots[@]}" | xargs -P 2 -I{} bash -c \
            'log="$3/$(tr / _ <<<"$2")"; .github/scripts/naut-example.sh "$1" "$2" >"$log.log" 2>&1 || touch "$log.failed"' \
            _ "$RUNNER_TEMP/naut" {} "$logs"
          failed=()
          for root in "${roots[@]}"; do
            log="$logs/$(tr / _ <<<"$root")"
            if [ -e "$log.failed" ]; then
              failed+=("$root")
              echo "::group::$root — FAILED"
            else
              echo "::group::$root"
            fi
            cat "$log.log"
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::naut check / naut test failed in: ${failed[*]} (open the group for its output)"
            exit 1
          fi
      # Each example HMI's own unit tests (npm test, where its package.json
      # has one): the same roots as above, all of them on a full run. The
      # script's table test runs first, so a script that stopped failing
      # on a failing test cannot pass here.
      - name: npm test (example HMIs that have one)
        run: |
          set -u
          .github/scripts/example-hmi-tests.test.sh
          if [ "$FULL" = true ]; then
            .github/scripts/example-hmi-tests.sh
          else
            read -r -a roots <<<"$EXAMPLES"
            [ ${#roots[@]} -gt 0 ] || exit 0
            .github/scripts/example-hmi-tests.sh "${roots[@]}"
          fi
      # Every acceptance suite again as JSON, tagged with its project root,
      # for the runtime evidence (docs/claims can name a test with
      # `naut <root> <name>`). Verdicts only: the step above gates. The
      # Logix conformance projects run here on nautilus; their controller
      # half (`naut test --target logix`) needs a Logix controller and is
      # not in CI.
      # The one Go test that builds an example's HMI (it pins the lift
      # station's pages): a light PR skips go test, so it runs here.
      - name: TestBuildsTheLiftStationApp (light PR touching its HMI)
        if: env.FULL != 'true' && needs.changes.outputs.hmibuild == 'true'
        run: go test ./internal/hmibuild -run '^TestBuildsTheLiftStationApp$' -v
      # A docs page that changed while its claims file didn't: a warning,
      # never a failure. runtime-evidence gives it on a full run.
      - name: Docs changed, claims didn't (light PR)
        if: env.FULL != 'true'
        run: git diff --name-only HEAD^1 HEAD | go run ./tools/evidence drift -github -summary "$GITHUB_STEP_SUMMARY"
      - name: naut test -json (runtime evidence)
        if: env.FULL == 'true'
        run: |
          while IFS= read -r -d '' m; do
            root=$(dirname "$m")
            ls "$root"/*_test.yaml >/dev/null 2>&1 || continue
            "$RUNNER_TEMP/naut" test -json "$root" | jq -c --arg root "$root" '. + {root: $root}' >> evidence/naut-tests.ndjson || true
          done < <(find examples testdata/projects logix/writer/testdata/conformance -name nautilus.yaml -print0 | sort -z)
      - name: Keep the results as runtime evidence
        if: env.FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-examples
          path: evidence/
          retention-days: 14
  # The TIA Openness agent's contract (siemens/tiad): tiad's C# core under
  # Mono with a scripted host instead of TIA (tools/tiad/build-fake.sh →
  # tiad-fake.exe), and the Go contract suite against it. The suite skips
  # without TIAD_FAKE_BIN; NAUTILUS_REQUIRE_TIAD=1 makes that a failure here,
  # so a build that silently stopped producing the fake can't pass. The plain
  # go job leaves the flag unset and skips. TIAD_BIN (the real agent, on the
  # TIA image) is never set here.
  siemens-tiad:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Siemens tiad — contract suite on Mono (tiad-fake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      # The Windows-only files (the real tiad host on a TIA Portal machine,
      # tiadtest/real_windows_test.go, #929) never compile on this runner,
      # nor in go-windows (it tests only file semantics): vet type-checks
      # them, tests included, for windows.
      - name: vet the Windows-only tiad files (GOOS=windows)
        run: GOOS=windows go vet ./siemens/tiad/...
      # mono-devel, not mono-mcs + mono-runtime: build-fake.sh compiles with
      # -sdk:4.8 and references System.Web.Extensions.dll, and only
      # mono-devel carries the .NET 4.8 reference assemblies (verified in a
      # clean ubuntu:24.04: the smaller pair fails with CS8001).
      - name: Mono (mono-devel)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-devel
      - name: build tiad-fake
        run: tools/tiad/build-fake.sh
      - name: contract suite against tiad-fake (must run, not skip)
        env:
          NAUTILUS_REQUIRE_TIAD: '1'
        run: TIAD_FAKE_BIN="$PWD/tools/tiad/out/tiad-fake.exe" go test -count=1 -v ./siemens/tiad/...
  # The race detector over the module (#752): a data race in runtime (#870)
  # went unnoticed because no job ran -race on it. Every package runs here
  # except the three slowest under -race (about 680 s of the module's 1300 s
  # locally): opcua, opcua/server and cmd/naut, which the go job still runs
  # without it and race-nightly.yml runs under -race with the whole module
  # every night (not a PR gate; it files what it finds). Among what runs: the test brokers' churn test (1000 rounds
  # under -race, the window where mochi's own Close deadlocks) and every
  # concurrency-heavy package (runtime, leader, server, io, sparkplug),
  # the real-time guard's thread-table tests among them (#870, #872).
  go-race:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Go — race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: false}
      # Its own build cache: -race builds every package apart from the go
      # job's. Main saves one a day; a PR restores the newest.
      - id: key
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: gocache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.key.outputs.day }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-${{ steps.key.outputs.go }}-
      - name: go test -race (every package but opcua, opcua/server, cmd/naut)
        run: |
          pkgs=$(go list ./... | grep -vxE 'github.com/joyautomation/nautilus/(opcua|opcua/server|cmd/naut)')
          go test -race -count=1 $pkgs
      - name: Save the Go build cache (main, once a day)
        if: always() && steps.gocache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.key.outputs.day }}
  # The release build's promise (macOS, Linux and Windows, amd64 and arm64,
  # Linux ARMv7, CGO off): seven cross-compiles of the CLI, about 4 minutes.
  # Its own job so it runs beside go test, not inside it; the go job skips it.
  go-crossbuild:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Go — release targets cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: false}
      # Its own build cache (#752): setup-go's is keyed on go.sum alone, so
      # whichever job saved first after a go.sum change owns it, and this
      # job rebuilt nearly all of nautilus every run. Main saves one a day
      # (about 570 MB compressed); a PR restores the newest and never
      # saves. Tests still all run: -count=1 keeps cached results out.
      # The key carries the resolved toolchain ('1.25' floats to the newest
      # patch): after a patch release, entries from the old toolchain would
      # only miss, so a new patch starts its own line. Go itself trims cache
      # entries unused for 5 days, so the saved cache does not grow without
      # bound.
      - id: key
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: gocache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.key.outputs.day }}
          restore-keys: |
            go-cross-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-
            go-cross-${{ runner.os }}-${{ steps.key.outputs.go }}-
      - name: TestReleaseTargetsBuildWithoutCgo
        shell: bash
        run: |
          mkdir -p evidence
          go test -json -count=1 ./cmd/naut -run '^TestReleaseTargetsBuildWithoutCgo$' -v -timeout 20m | tee evidence/crossbuild.json | go run ./tools/evidence cat
      - name: Save the Go build cache (main, once a day)
        if: always() && steps.gocache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-${{ runner.os }}-${{ steps.key.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.key.outputs.day }}
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-crossbuild
          path: evidence/
          retention-days: 14

  # staticcheck, as a REPORT (#752; James, 2026-11-18): the findings go to the
  # job summary and are routed to the sessions that own the code; it becomes
  # a gate once it stays clean. continue-on-error is what keeps it out of the
  # required ci-ok (ci-ok.sh leaves a continue-on-error job unjudged): a
  # finding never blocks a merge. A staticcheck that crashes, rather than
  # finding something, still fails this job, visibly. Pinned: 2026.1 (v0.7.0),
  # the newest that runs on Go 1.25 (v0.8 needs Go 1.26).
  staticcheck:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Static analysis — staticcheck (report, not a gate)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - name: staticcheck 2026.1 (v0.7.0)
        shell: bash
        run: |
          set +e
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -f json ./... > "$RUNNER_TEMP/staticcheck.jsonl"
          code=$?
          set -e
          # 0: clean; 1: findings (reported, not a failure); anything else, or
          # no JSON at all, means staticcheck itself did not run through.
          if [ "$code" -gt 1 ] || ! jq -se . "$RUNNER_TEMP/staticcheck.jsonl" >/dev/null; then
            echo "::error::staticcheck did not run through (exit $code)"
            exit 1
          fi
          .github/scripts/staticcheck-summary.sh "$RUNNER_TEMP/staticcheck.jsonl" >> "$GITHUB_STEP_SUMMARY"
          echo "$(jq -s length "$RUNNER_TEMP/staticcheck.jsonl") finding(s): see the job summary"
  # Packages a native Windows service depends on (argonaut's second site
  # runs on Windows Server): file semantics differ there, a rename over an
  # open file above all, so they are tested on Windows, not assumed.
  go-windows:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Go — Windows file semantics
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      # retain: the retained values' file store renames over the old file
      # and keeps a corrupt one aside (#842).
      - run: go test ./oplog/ ./alarm/ ./retain/ ./audit/
  # PROFINET's raw-Ethernet transport (AF_PACKET) on a veth pair. The test
  # runs itself as root of a new user + network namespace, so it needs no
  # privilege and touches no host interface; ubuntu-latest restricts
  # unprivileged user namespaces through AppArmor, so this job lifts that
  # for its own run and makes a skip a failure.
  profinet-veth:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: PROFINET — raw Ethernet on a veth pair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: NAUTILUS_PROFINET_VETH=1 go test -count=1 -run 'TestPacketVeth|TestOpenWithoutCapability' -v ./profinet/transport/
  profinet-fuzz:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: PROFINET — fuzz the wire parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      # Every parser of bytes from the wire or a UDP datagram has a Fuzz
      # target (profinet/wire/fuzz_test.go); none may panic. A count, not a
      # duration: a time budget can end with "context deadline exceeded"
      # while a worker is busy, failing the job with no crasher found.
      - shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for f in $(go test -list '^Fuzz' ./profinet/wire/ | grep '^Fuzz'); do
            echo "== $f"
            go test ./profinet/wire/ -run '^$' -fuzz "^$f\$" -fuzztime 1000000x
          done
  sparkplug-tck:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Sparkplug B — TCK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      # Drives an in-process edge node through its full lifecycle against the
      # joyautomation/sparkplug-tck-go edge-node profile (embeds its own
      # broker) and fails on any conformance assertion failure.
      - name: Edge-node profile
        shell: bash
        run: |
          mkdir -p evidence
          NAUTILUS_TCK=1 go test -json ./sparkplug/ -run TestTCKConformance -v -timeout 90s | tee evidence/tck-edge.json | go run ./tools/evidence cat
      # The host-application profile's twin: sparkplug/host.Driver is the SUT,
      # and the test scripts its own raw-paho edge node into the harness
      # broker (births, a deliberate seq gap that must provoke NCMD/Rebirth,
      # D/NDEATH) because the harness does not simulate one. Asserts zero FAIL
      # and a non-zero PASS count, so an all-N/A run cannot pass silently.
      - name: Host-application profile
        shell: bash
        run: NAUTILUS_TCK=1 go test -json ./sparkplug/host/ -run TestTCKHostConformance -v -timeout 120s | tee evidence/tck-host.json | go run ./tools/evidence cat
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-tck
          path: evidence/
          retention-days: 14

  hmi-3d:
    name: HMI 3D package — test, check, package; build the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # The pure logic (scene validation, bindings, the alarm fold) has unit
      # tests on the same 60-line harness hmi/ uses; svelte-check covers the
      # components; svelte-package + publint prove it publishes.
      - run: npm ci && npm test && npm run check && npm run package
        working-directory: hmi-3d
      # examples/spatial-rig/hmi consumes the package by file: link, so it
      # builds against the dist/ the step above just produced — the same
      # arrangement as webview-ui and hmi/.
      - run: npm ci && npm run check && npm run build
        working-directory: examples/spatial-rig/hmi
      # examples/well-site/hmi: the paper look (design §3f), same arrangement.
      - run: npm ci && npm run check && npm run build
        working-directory: examples/well-site/hmi
      # examples/lift-station/hmi links the package the same way, for the
      # /3d view it carries beside its mimic (lift-station.scene.json), and
      # links the hmi kit too (file:../../../hmi, until its next release is
      # on npm): build the kit's dist/ first, or nothing resolves it.
      - name: Build hmi (lift-station's local dependency)
        run: npm ci && npm run package
        working-directory: hmi
      - run: npm ci && npm run check && npm run build
        working-directory: examples/lift-station/hmi
  hmi-packs:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    # naut builds HMIs from a committed pack of the packages it carries
    # (internal/hmibuild): this rebuilds it from the kits in this tree and
    # the pins in packs/package.json, and fails when the committed one
    # differs, so a kit change can't ship to naut without its pack.
    name: HMI packs — packs.tar.gz is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: internal/hmibuild/packs/generate.sh
      - name: the committed pack is the one generate.sh makes
        run: |
          git diff --exit-code --stat -- internal/hmibuild/packs/packs.tar.gz || {
            echo "::error::internal/hmibuild/packs/packs.tar.gz is stale: run internal/hmibuild/packs/generate.sh and commit it"
            exit 1
          }

  vscode-iec:
    needs: changes
    if: needs.changes.outputs.extension != 'false'
    name: VS Code extension — compile, test
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: tools/vscode-iec}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      # webview-ui links the hmi package locally (file:../../../hmi), and
      # its mimic tests import from hmi's dist/ — build it first.
      - name: Build hmi (webview-ui's local dependency)
        run: npm ci && npm run package
        working-directory: hmi
      # ...and hmi-3d the same way (file:../../../hmi-3d), for the scene
      # editor's bundle; its dist/ must exist before webview-ui type-checks.
      - name: Build hmi-3d (webview-ui's local dependency)
        run: npm ci && npm run package
        working-directory: hmi-3d
      # webview-ui is a separate npm package (its own lockfile/deps, e.g.
      # the local hmi package the mimic routing tests import) — `npm test`
      # now also runs its pure-logic test files, so its deps must exist too.
      - run: npm ci --prefix webview-ui
      - run: npm test
      # The web build (esbuild.web.mjs: the browser playground runs it): type-
      # check src/web/ against the DOM, and bundle with the swaps.
      - name: web build (playground)
        run: npm run check:web && npm run compile:web
      # Vite strips types without checking them, so nothing else type-checks
      # the webview's .svelte and .ts files. Warnings (a11y) don't fail it.
      - name: Type-check the webview (svelte-check)
        run: npm --prefix webview-ui run check -- --output human
  # The playground as the docs deploy builds it (docs.yml): build.sh, the
  # docs image with the playground inside, nginx's config, and the share
  # service's image. Without this, the first full build of a change is the
  # deploy to main, and an nginx config that does not load takes the docs
  # site down with it.
  playground:
    name: Playground — full build, docs and share images
    runs-on: ubuntu-latest
    # About 4 min on main; a hung Chrome must not hold a runner and the
    # required check for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: share links (keep.js)
        run: node --test playground/app/keep.test.js
      - run: ./playground/scripts/build.sh
      # The built playground in a real headless Chrome (#906, #833): every
      # example reaches "nautilus: live" (#891's offline bug), and YAML files
      # get their schemas. No Chrome fails the job; the tests never skip.
      # The live test allows 300 s (Chrome can take 90 s to start on a slow
      # runner), well inside the job's 30 min.
      - name: Chrome for the browser tests
        run: .github/scripts/require-chrome.test.sh && .github/scripts/require-chrome.sh
      - name: playground browser tests
        run: GESTURE_NO_SANDBOX=1 node --test playground/app/*.browser.test.mjs
      - name: docs image
        run: docker build -f website/Dockerfile -t nautilus-docs:ci .
      - name: share image
        run: docker build -f playground/share/Dockerfile -t nautilus-playground-share:ci .
      # The image's nginx starts, and serves what the playground needs the
      # way it should (caching, short links, the share API left to the ingress).
      - name: docs image serves the playground
        shell: bash
        run: |
          docker run --rm nautilus-docs:ci nginx -t
          docker run -d --name docs -p 8080:80 nautilus-docs:ci
          trap 'docker rm -f docs >/dev/null' EXIT
          for i in $(seq 20); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 0.5; done
          code() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1"; }
          header() { curl -s -D - -o /dev/null "http://localhost:8080$1" | tr -d '\r' | sed -n "s/^$2: //Ip"; }
          build=$(curl -fs http://localhost:8080/playground/engine/engine.json | sed -n 's/.*"build":"\([0-9a-z]*\)".*/\1/p')
          version=$(curl -fs http://localhost:8080/playground/engine/engine.json | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          test -n "$build"
          fail=0
          check() { if [ "$2" != "$3" ]; then echo "::error::$1: got '$2', want '$3'"; fail=1; else echo "ok  $1"; fi; }
          check "/playground/" "$(code /playground/)" 200
          check "short link" "$(code /playground/p/abcdefghijkl)" 200
          check "malformed short link" "$(code /playground/p/short)" 404
          check "share API (the ingress's)" "$(code /playground/api/healthz)" 404
          check "this build's wasm" "$(header "/playground/engine/naut.wasm?v=$version.$build" cache-control)" "public, max-age=31536000, immutable"
          check "another build's wasm" "$(header "/playground/engine/naut.wasm?v=old.000000000000" cache-control)" "no-cache"
          check "an example" "$(header /playground/engine/examples/lift-station.json cache-control)" "no-cache"
          check "precompressed wasm" "$(curl -s -H 'Accept-Encoding: gzip' -D - -o /dev/null "http://localhost:8080/playground/engine/naut.wasm?v=$version.$build" | tr -d '\r' | sed -n 's/^content-encoding: //Ip')" gzip
          exit $fail
  # The webview's real-input gesture harness (CDP-driven headless Chrome over
  # the production bundles: mimic, FBD, LD, SFC). ubuntu-latest ships Chrome.
  vscode-iec-gestures:
    needs: changes
    if: needs.changes.outputs.extension != 'false'
    name: VS Code extension — webview gesture harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: tools/vscode-iec}
    env:
      # Chrome's sandbox is refused on the runner (unprivileged user namespaces
      # are restricted); the harness only adds --no-sandbox when this is set.
      GESTURE_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build hmi (webview-ui's local dependency)
        run: npm ci && npm run package
        working-directory: hmi
      - name: Build hmi-3d (webview-ui's local dependency)
        run: npm ci && npm run package
        working-directory: hmi-3d
      - run: npm ci
      - run: npm ci --prefix webview-ui
      - run: npm --prefix webview-ui run build
      # Every test records a clip of its run (gesture-harness/clips.mjs);
      # the runner image may not carry ffmpeg, so make sure of it. The clips
      # are a convenience, not the test: an apt mirror that hangs (it has,
      # holding the job until its 15-minute limit) gives up after 4 minutes
      # and the tests run without clips.
      - name: ffmpeg (for the clips)
        id: ffmpeg
        timeout-minutes: 4
        continue-on-error: true
        run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -yqq --no-install-recommends ffmpeg; }
      - run: npm --prefix webview-ui run test:gestures
        env:
          GESTURE_CLIPS: ${{ steps.ffmpeg.outcome == 'success' && format('{0}/gesture-clips', github.workspace) || '' }}
      # index.html in the artifact plays every clip beside its PASS/FAIL.
      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesture-clips
          path: gesture-clips # includes manifest.json (set "gestures")
          if-no-files-found: warn
          retention-days: 90 # the docs build downloads the last green main run's clips
  # A real VS Code with nothing useful on PATH, the way a desktop launcher
  # starts it, on each OS: the extension has to find a plain `go install` in
  # ~/go/bin (language-server diagnostics, diagram editors), and without a
  # CLI still activate and say how to fix it. See src/e2e/run.ts.
  vscode-iec-e2e:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: VS Code extension — CLI discovery e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.e2e-os) }}
    runs-on: ${{ matrix.os }}
    # A hung VS Code otherwise holds the runner for the 6-hour default.
    timeout-minutes: 15
    defaults:
      run: {working-directory: tools/vscode-iec, shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # The VS Code download only, never a profile (run.ts makes a fresh one).
      - uses: actions/cache@v4
        with:
          path: tools/vscode-iec/.vscode-test/vscode-*
          key: vscode-download-${{ runner.os }}-${{ hashFiles('tools/vscode-iec/package-lock.json') }}
      - run: npm ci
      # The diagram exporter (webview-ui/src/export → media/dist), which the
      # suite drives through "Export Diagram…" on every OS. Pure TypeScript:
      # it needs webview-ui's vite, not the hmi packages built.
      - name: Build the diagram exporter
        run: npm --prefix webview-ui ci && npm --prefix webview-ui run build:export
      # The resolver and installer against this OS's real filesystem (the ubuntu `npm test`
      # above only exercises Linux paths).
      - run: npm run compile && node --test out/cliResolve.test.js out/cliInstall.test.js
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
  version-sync:
    name: Versions — repo not behind registries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo is the source of truth for the extension and HMI versions;
      # publishing happens from main (publish.yml). A registry running AHEAD
      # of the repo means someone published out of band — fail loudly.
      - name: hmi vs npm
        run: |
          repo=$(node -p "require('./hmi/package.json').version")
          reg=$(npm view @joyautomation/nautilus-hmi version 2>/dev/null || echo 0.0.0)
          echo "repo=$repo npm=$reg"
          if [ "$(printf '%s\n%s\n' "$repo" "$reg" | sort -V | tail -1)" != "$repo" ]; then
            echo "::error::hmi/package.json ($repo) is behind npm ($reg)"; exit 1
          fi
      - name: hmi-3d vs npm
        run: |
          repo=$(node -p "require('./hmi-3d/package.json').version")
          reg=$(npm view @joyautomation/nautilus-hmi-3d version 2>/dev/null || echo 0.0.0)
          echo "repo=$repo npm=$reg"
          if [ "$(printf '%s\n%s\n' "$repo" "$reg" | sort -V | tail -1)" != "$repo" ]; then
            echo "::error::hmi-3d/package.json ($repo) is behind npm ($reg)"; exit 1
          fi
      # The extension has two channels, checked separately (RELEASING.md):
      #   pre-release: main's package.json vs the highest PRE-RELEASE on each
      #                registry;
      #   stable:      the highest vscode-v* tag vs the highest STABLE on each
      #                registry (no tags and no stable yet → passes).
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: extension vs Marketplace and Open VSX (per channel)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          repo=$(node -p "require('./tools/vscode-iec/package.json').version")
          # A PR into anything but main (a stable hotfix branch cut from a
          # vscode-v* tag) does not carry the pre-release line: skip that half.
          if [ -n "$BASE" ] && [ "$BASE" != main ]; then repo=-; fi
          tag=$(git ls-remote --tags --refs origin 'vscode-v*' \
                | sed -n 's#.*refs/tags/vscode-v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' \
                | sort -V | tail -1)
          .github/scripts/vscode-channel-guard.sh sync "$repo" "${tag:-0.0.0}"
      # "Behind a registry" catches an out-of-band publish. It does NOT catch
      # shipping a feature and forgetting the bump: the repo and the registry
      # then agree, the guard passes, and publish.yml -- which only fires when
      # the repo is AHEAD -- never runs. That is how L5X support sat in main
      # for two days while the Marketplace served a build without it.
      - name: extension changed without a version bump
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- tools/vscode-iec                     | grep -vE '^tools/vscode-iec/(CHANGELOG\.md|.*\.test\.ts)$' || true)
          [ -n "$changed" ] || { echo "extension untouched"; exit 0; }
          now=$(node -p "require('./tools/vscode-iec/package.json').version")
          was=$(git show "$base:tools/vscode-iec/package.json" | node -p                 "JSON.parse(require('fs').readFileSync(0)).version" || echo 0.0.0)
          echo "extension version $was -> $now"
          if [ "$was" = "$now" ]; then
            echo "::error::tools/vscode-iec changed but the version is still $now."
            echo "::error::publish.yml only ships when the repo is AHEAD of the registry,"
            echo "::error::so without a bump this change never reaches anyone."
            echo "$changed" | sed 's/^/  changed: /'
            exit 1
          fi

  release-config:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Release config — goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with: {version: '~> v2', args: check}
      # The PLCnext in-process tier is C, built by the release job with the
      # same script; compiling it here (warnings are errors) keeps a break
      # from surfacing first at tag time.
      # use-cache off: it saved a new 18 MB cache on every run (one C file
      # to build), about 200 entries that crowded the repo's 10 GB cache
      # limit and evicted the ones that matter (#752).
      - uses: mlugg/setup-zig@v2
        with: {version: 0.17.0, use-cache: false}
      - name: Build nautilus_io (PLCnext, ARMv7)
        run: rt/plcnext-io/build.sh
  postgres:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    # The historian's Postgres store and the alarm journal's Postgres table
    # skip unless NAUTILUS_TEST_DATABASE_URL is set; here they run against a
    # real Postgres, so the docs' Postgres claims have evidence.
    name: Postgres — historian and alarm journal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - name: Postgres tests
        shell: bash
        env:
          NAUTILUS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          mkdir -p evidence
          go test -json ./hist/ ./alarm/ -run 'Postgres|PGJournal' -v -timeout 120s | tee evidence/postgres.json | go run ./tools/evidence cat
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-postgres
          path: evidence/
          retention-days: 14

  modbus-sim:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Modbus TCP — foreign stack (pymodbus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # The driver's only other peer is its own slave; pymodbus is the foreign
      # implementation (someone else's encoder, datastore and exception
      # handling). Pinned exactly: the 3.x datastore API moved twice (3.7
      # ModbusSlaveContext → 3.11 ModbusDeviceContext → 3.15 SimDevice) and
      # the script targets the last one. Bump with modbus/testdata/sim.
      - run: pip install 'pymodbus==3.15.0'
      # Two sims from one script: the seeded map on 5020, and the same map
      # answering every request 1s late on 5021 for the timeout case. Wait
      # for each one's "listening on" line rather than sleeping.
      - name: Start simulators
        run: |
          python modbus/testdata/sim/pymodbus_sim.py --port 5020 > sim.log 2>&1 &
          python modbus/testdata/sim/pymodbus_sim.py --port 5021 --latency-ms 1000 > sim-slow.log 2>&1 &
          for i in $(seq 1 50); do
            grep -q 'listening on' sim.log && grep -q 'listening on' sim-slow.log && break
            sleep 0.2
          done
          grep -q 'listening on' sim.log && grep -q 'listening on' sim-slow.log \
            || { echo '::error::simulator did not start'; cat sim.log sim-slow.log; exit 1; }
      # Decode of every seeded format in all four word/byte layouts, write
      # round trip per function code, exception 0x02 → one Bad block, and the
      # latency-above-timeout path. Skipped without the env vars.
      - name: Foreign-stack tests
        shell: bash
        run: |
          mkdir -p evidence
          NAUTILUS_MODBUS_SIM=127.0.0.1:5020 NAUTILUS_MODBUS_SIM_SLOW=127.0.0.1:5021 \
            go test -json ./modbus/ -run TestForeign -v -timeout 120s | tee evidence/modbus-foreign.json | go run ./tools/evidence cat
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-modbus
          path: evidence/
          retention-days: 14
  opcua-foreign:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: OPC UA — foreign stack (asyncua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # Every other OPC UA test speaks gopcua to gopcua — the same codec on
      # both ends. asyncua is the foreign implementation (someone else's
      # decoder, browse, subscription and status handling) doing what a
      # SCADA gateway does against the server. Pinned exactly; bump with
      # opcua/server/testdata/foreign/asyncua_client.py.
      - run: pip install 'asyncua==2.1.0'
      # Discovery, browse Objects → project → tags → UDT members → array
      # elements, typed reads with status and timestamps, a subscription
      # that sees a change, and a refused write. Skipped without the env var.
      - name: Foreign-stack test
        shell: bash
        run: |
          mkdir -p evidence
          NAUTILUS_OPCUA_PYTHON="$(which python)" \
            go test -json ./opcua/server -run TestForeign -v -timeout 120s | tee evidence/opcua-foreign.json | go run ./tools/evidence cat
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-opcua
          path: evidence/
          retention-days: 14
  opcua-client-matrix:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: OPC UA client — server matrix (open62541, Milo, IO-Link masters; poll + subscribe)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the test's own limit is 10 min; a run takes about 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      # The client driver against servers the test starts itself
      # (opcua/matrix_test.go), in both read modes: import, typed reads,
      # writes, namespace remap, and recovery from a restart and from a
      # blackhole. open62541 and Milo run in containers (a blackhole is a
      # docker pause); open62541 is built by the test from a tagged release
      # (opcua/testdata/matrix/open62541, tagged by the directory's
      # content), Milo's image is pinned by digest. The IO-Link master
      # simulators run in process (opcua/matrix_virtual_test.go), behind a
      # relay that goes silent for a blackhole.
      - name: Server matrix
        shell: bash
        run: |
          mkdir -p evidence
          NAUTILUS_OPCUA_MATRIX=all \
            go test -json ./opcua/ -run TestForeignServerMatrix -v -timeout 600s | tee evidence/opcua-client-matrix.json | go run ./tools/evidence cat
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-opcua-client-matrix
          path: evidence/
          retention-days: 14
  snmp-sim:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: SNMP — foreign stack (snmpsim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # snmpsim (LeXtudio's maintained fork, on pysnmp) replays the committed
      # .snmprec walks: someone else's BER, USM and GetBulk. The script owns
      # the pins (snmpsim, pysnmp, pysmi, cryptography — the last two are
      # undeclared run-time needs snmpsim does not install itself) and the
      # v2c communities / v3 users the test expects.
      - name: Start snmpsim
        run: |
          scripts/snmp-sim.sh --port 1161 > sim.log 2>&1 &
          for i in $(seq 1 150); do
            grep -q 'Listening at UDP' sim.log && break
            sleep 0.2
          done
          grep -q 'Listening at UDP' sim.log || { echo '::error::snmpsim did not start'; cat sim.log; exit 1; }
      # Decode agreement per binding kind, v2c and v3 authPriv, GetBulk past
      # a table end, wrong credentials → error with a legible message, a
      # counter step → rate. The test waits for the source itself.
      - name: Foreign-stack tests
        shell: bash
        run: |
          mkdir -p evidence
          NAUTILUS_SNMP_SIM=127.0.0.1:1161 go test -json ./snmp/ -run TestForeign -v -timeout 300s | tee evidence/snmp-foreign.json | go run ./tools/evidence cat
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-snmp
          path: evidence/
          retention-days: 14
  redfish-sim:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Redfish — foreign stack (DMTF mockup server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # DMTF's own Redfish-Mockup-Server serving two mockups from the
      # published DSP2043 bundle (a legacy Thermal/Power server and a
      # ThermalSubsystem/PowerSubsystem one). The test spawns and restarts
      # the server itself (session recovery), so the script only prepares
      # the directory and runs the test.
      - name: Foreign-stack tests
        shell: bash
        run: |
          mkdir -p evidence
          GO_TEST_FLAGS=-json scripts/redfish-sim.sh | tee evidence/redfish-foreign.json | go run ./tools/evidence cat
        timeout-minutes: 15
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-redfish
          path: evidence/
          retention-days: 14
  prom-sim:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: Prometheus — foreign stack (node_exporter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      # A real node_exporter release binary, checksum-verified by the script
      # before it runs: the exposition format, metric names and label shapes
      # come from the exporter itself, not from our fixtures.
      - name: Start node_exporter
        run: |
          scripts/prom-sim.sh --port 9100 > sim.log 2>&1 &
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9100/metrics > /dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:9100/metrics > /dev/null || { echo '::error::node_exporter did not start'; cat sim.log; exit 1; }
      - name: Foreign-stack tests
        shell: bash
        run: |
          mkdir -p evidence
          NAUTILUS_PROM_SIM=127.0.0.1:9100 go test -json ./prom/... -run TestForeign -v -timeout 300s | tee evidence/prom-foreign.json | go run ./tools/evidence cat
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-prom
          path: evidence/
          retention-days: 14
  blackbox-gate:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    # The independent tester's checks (tools/blackbox, docs/design/blackbox.md):
    # scripts a foreign client wrote against the public docs and the specs,
    # imported verbatim and run against naut built from this PR. One subtest
    # per check, so a claim can cite `go ./tools/blackbox TestBlackbox/<id>`.
    # Skips, green, while the manifest has no gate checks.
    name: Black-box — the tester's gate checks (foreign clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # The oracle clients, pinned to the versions the runs recorded.
      - run: pip install -r tools/blackbox/requirements.txt
      - name: Gate checks
        shell: bash
        run: |
          mkdir -p evidence
          NAUTILUS_BLACKBOX_PYTHON="$(which python)" NAUTILUS_BLACKBOX_DISPOSITION=gate \
          NAUTILUS_BLACKBOX_COVERDIR="$PWD/evidence/blackbox-cover" \
            go test -json ./tools/blackbox -run TestBlackbox -v -timeout 600s | tee evidence/blackbox-gate.json | go run ./tools/evidence cat
      - name: Coverage — how far the foreign client's checks reach
        # The SUT was coverage-instrumented (NAUTILUS_BLACKBOX_COVERDIR); the
        # counters say which code a client that never saw it exercised. Per
        # package here, the full profile in the artifact; the tester cannot
        # measure this and should not, the next brief is aimed with it.
        if: always()
        shell: bash
        run: |
          if [ -d evidence/blackbox-cover ] && [ -n "$(ls -A evidence/blackbox-cover)" ]; then
            go tool covdata textfmt -i=evidence/blackbox-cover -o evidence/blackbox-cover.txt
            go tool covdata percent -i=evidence/blackbox-cover | grep -vE '\s0\.0%' | sort
            rm -r evidence/blackbox-cover
          else
            echo "no coverage data (no gate checks ran)"
          fi
      - name: Claims coverage — which promises a black-box check proves
        if: always()
        run: go run ./tools/evidence blackbox
      - name: Keep the results as runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-blackbox
          path: evidence/
          retention-days: 14

  runtime-evidence:
    # Joins every job's test results to the claims inventory (docs/claims)
    # and keeps the result for the docs site's /verified/runtime/ pages,
    # which bake the last green main run's artifact. Claims never block:
    # the job is continue-on-error, a claim problem is only reported (the
    # PR's job summary, compared with main's last evidence), and on main a
    # problem opens or updates the rolling "claims out of date" issue,
    # which a clean run closes.
    name: Runtime evidence — claims × test results
    needs: [changes, go, examples, go-crossbuild, sparkplug-tck, modbus-sim, opcua-foreign, opcua-client-matrix, snmp-sim, redfish-sim, prom-sim, postgres, blackbox-gate]
    if: needs.changes.outputs.full != 'false'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read # main's last evidence, for the PR comparison
      issues: write # the rolling "claims out of date" issue
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2} # HEAD^1 is the base, for the drift check
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - uses: actions/download-artifact@v4
        with: {pattern: evidence-*, path: evidence}
      # A docs page that changed while its claims file didn't: a warning on
      # the PR, never a failure (docs/claims/README.md).
      - name: Docs changed, claims didn't
        if: github.event_name == 'pull_request'
        run: git diff --name-only HEAD^1 HEAD | go run ./tools/evidence drift -github -summary "$GITHUB_STEP_SUMMARY"
      - name: main's last evidence (a PR is compared with it)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n runtime-evidence -D "$RUNNER_TEMP/base" || echo "main's run $id has no runtime-evidence artifact"
          fi
      # The `release` black-box checks run in blackbox-release.yml, never in
      # this workflow; the claims citing them take the verdicts of its most
      # recent run against main (the nightly, or a dispatch on main with no
      # tag: the artifact named -main). A tag run is evidence for that
      # release, not for main, so it is never read here. A failed run
      # counts, so a check that fails reads failing rather than an older
      # pass, and one that left no results is reported by `evidence build`
      # with its run and date. The summary names the run and its age.
      - name: The last blackbox-release run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow blackbox-release.yml --branch main --status completed --limit 20 \
              --json databaseId,conclusion,event \
              --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | select(.conclusion == "success" or .conclusion == "failure") | .databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n evidence-blackbox-release-main -D "$RUNNER_TEMP/release"; then
              exit 0
            fi
            rm -rf "$RUNNER_TEMP/release" # a failed download must not read as an empty run
          done
          echo "No blackbox-release run on main has left evidence yet: its checks read release-only."
      - name: Build the evidence file
        run: |
          mkdir -p runtime-evidence
          base=()
          [ -f "$RUNNER_TEMP/base/evidence.json" ] && base=(-baseline "$RUNNER_TEMP/base/evidence.json")
          go run ./tools/evidence build -in evidence -cover evidence/evidence-go/cover.out -release "$RUNNER_TEMP/release" \
            -o runtime-evidence/evidence.json "${base[@]}" -summary "$RUNNER_TEMP/claims.md"
          cat "$RUNNER_TEMP/claims.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: runtime-evidence/
          retention-days: 90 # the docs build downloads the last green main run's evidence
      # Main only: problems (a claim that does not check, a reference no job
      # reported) open the rolling issue or add a comment to it; a clean run
      # closes it. The site keeps showing them honestly ("not reported").
      - name: Rolling issue
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="claims out of date"
          n=$(jq '((.problems // []) | length) + ((.missing // []) | length)' runtime-evidence/evidence.json)
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[]|select(.title==\"$title\")][0].number // empty")
          if [ "$n" = 0 ]; then
            [ -z "$num" ] || gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Every claim checks again: $RUN_URL"
            exit 0
          fi
          body=$RUNNER_TEMP/issue.md
          {
            echo "Main at **${GITHUB_SHA::8}** — $n claim problem(s) — $RUN_URL"
            echo
            echo "A claim in \`docs/claims/\` names a test that no longer exists or that no job ran (usually a rename). Fix the reference; \`go run ./tools/evidence check\` checks by hand."
            echo
            cat "$RUNNER_TEMP/claims.md"
          } >"$body"
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label claims-audit --body-file "$body"
          fi

  # Client names must not enter this repository: it is PUBLIC (#752 moved
  # this here from sourcing.yml, so ci-ok gates it).
  #
  # The denylist is a regex kept OUT of the repository -- a list of client
  # names committed to a public repo is the thing it exists to prevent. Set
  # it as a SECRET, not a variable:
  #
  #     gh secret set SOURCING_DENYLIST --body '<name>|<name>|<name>'
  #
  # A secret specifically, because repository VARIABLES are passed to
  # workflows run from forked pull requests, and anyone may fork a public
  # repo. Secrets are not. On a fork PR the value is empty, the job says so
  # and passes, so forks still build -- and the denylist never leaves this
  # organisation. It runs on every PR, light ones too: it is cheap and it is
  # the public-repo guard.
  sourcing:
    name: No client identifiers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        env:
          DENY: ${{ secrets.SOURCING_DENYLIST }}
        run: |
          if [ -z "$DENY" ]; then
            echo "::notice::SOURCING_DENYLIST unset (or a fork PR) - nothing to check."
            exit 0
          fi
          # Never print the pattern or the matching text: this log is public,
          # and a violation report that quotes the line leaks the very name
          # the check exists to keep out. File and line number only.
          hits=0
          while IFS= read -r f; do
            case "$f" in
              *node_modules/*|*package-lock.json) continue ;;
            esac
            [ -f "$f" ] || continue
            lines=$(grep -nEi "$DENY" -- "$f" 2>/dev/null | cut -d: -f1 | tr '\n' ',' | sed 's/,$//') || true
            if [ -n "$lines" ]; then
              echo "::error file=$f::client identifier present (line(s): $lines)"
              hits=$((hits + 1))
            fi
          done < <(git ls-files)
          if [ "$hits" -gt 0 ]; then
            echo "$hits file(s) carry a denylisted identifier. The text is not printed here on purpose."
            exit 1
          fi
          echo "clean"

  # The L5X reader's tests, plus the corpus sweep when a corpus is set
  # (moved here from logix.yml by #752, so ci-ok gates it; logix.yml keeps
  # the self-hosted, opt-in SDK job). The development corpus is ~60 real
  # exports, most of it client work that cannot live in the repo: a runner
  # that has it mounted sweeps it; one that does not skips, and says so.
  l5x-reader:
    needs: changes
    if: needs.changes.outputs.full != 'false'
    name: L5X reader — unit + corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - name: Unit tests
        run: go test ./lang/l5x/... ./logix/... ./cmd/naut/ -run 'Logix|L5X|Ladder|Types|Tags|Normalize|ParseRung|Parse|Client|Import|Download|Convert|Session|XPath|Event' -v
      - name: Corpus sweep
        if: vars.NAUTILUS_L5X_CORPUS != ''
        env:
          NAUTILUS_L5X_CORPUS: ${{ vars.NAUTILUS_L5X_CORPUS }}
        run: go test ./lang/l5x/ -run TestCorpus -v

  # The one required status check on main (#752). Branch protection can't
  # require the path-scoped jobs themselves (a skipped matrix leg never
  # reports, and would wait at "expected"), so this always runs, after every
  # other job, and passes only when each passed or was skipped because the
  # scope said so: .github/scripts/ci-ok.sh reads this workflow to tell. A
  # failed or cancelled job, a failed scope job, or a job left out of these
  # needs fails it. runtime-evidence is informational (continue-on-error)
  # and not waited on. A new job goes in this list; ci-ok.test.sh (run by
  # the changes job) fails until it does.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, go, go-race, siemens-tiad, examples, go-crossbuild, go-windows, profinet-veth, profinet-fuzz, sparkplug-tck, hmi-3d, hmi-packs, vscode-iec, playground, vscode-iec-gestures, vscode-iec-e2e, version-sync, release-config, postgres, modbus-sim, opcua-foreign, opcua-client-matrix, snmp-sim, redfish-sim, prom-sim, blackbox-gate, sourcing, l5x-reader]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every job passed, or was skipped by the scope
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | .github/scripts/ci-ok.sh .github/workflows/ci.yml
