name: CI
on:
  push: {branches: [main]}
  pull_request:
# GOTOOLCHAIN=local makes the pinned go-version a floor, not a suggestion:
# without it, a dependency bump that raises go.mod's `go` directive gets a
# newer toolchain auto-downloaded and CI stays green while `go install`
# breaks for everyone on the documented minimum (this bit v0.4.1).
env:
  GOTOOLCHAIN: local
jobs:
  go:
    name: Go — vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      # The spatial rig's HDRI, backdrop and floor textures live in a GitHub
      # release, not in git (examples/spatial-rig/hmi/assets.json); naut
      # check holds the scene file to files that exist, so fetch them first.
      - name: fetch the spatial rig's assets
        run: node examples/spatial-rig/hmi/fetch-assets.mjs
      - name: naut check (examples)
        run: go run ./cmd/naut check examples
      - name: naut check + naut test (every example project's every manifest)
        # Discovers project roots by their nautilus.yaml (so go-sdk, which
        # has none, is skipped automatically) and, in each one, every
        # sibling *.yaml with a top-level `tasks:` key — nautilus.yaml
        # itself plus a field/line/site variant (field.yaml, line.yaml,
        # ...) — skipping generated tag/device files. A new example project
        # is covered the moment it gets a nautilus.yaml; nothing here names
        # lift-station/batch-skid/remote-fleet by hand.
        run: |
          set -u
          fail=0
          while IFS= read -r -d '' root_manifest; do
            root=$(dirname "$root_manifest")
            for manifest in "$root"/*.yaml; do
              [ -e "$manifest" ] || continue
              name=$(basename "$manifest")
              case "$name" in
                *_manifest.yaml|devices.yaml|sites.yaml) continue ;;
              esac
              grep -q '^tasks:' "$manifest" || continue
              if [ "$name" = nautilus.yaml ]; then
                echo "::group::naut check $root"
                go run ./cmd/naut check "$root" || fail=1
              else
                echo "::group::naut check -m $name $root"
                go run ./cmd/naut check -m "$name" "$root" || fail=1
              fi
              echo "::endgroup::"
            done
            if ls "$root"/*_test.yaml >/dev/null 2>&1; then
              echo "::group::naut test $root"
              go run ./cmd/naut test "$root" || fail=1
              echo "::endgroup::"
            fi
          done < <(find examples -name nautilus.yaml -print0 | sort -z)
          exit $fail
  sparkplug-tck:
    name: Sparkplug B — TCK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      # Drives an in-process edge node through its full lifecycle against the
      # joyautomation/sparkplug-tck-go edge-node profile (embeds its own
      # broker) and fails on any conformance assertion failure.
      - name: Edge-node profile
        run: NAUTILUS_TCK=1 go test ./sparkplug/ -run TestTCKConformance -v -timeout 90s
      # The host-application profile's twin: sparkplug/host.Driver is the SUT,
      # and the test scripts its own raw-paho edge node into the harness
      # broker (births, a deliberate seq gap that must provoke NCMD/Rebirth,
      # D/NDEATH) because the harness does not simulate one. Asserts zero FAIL
      # and a non-zero PASS count, so an all-N/A run cannot pass silently.
      - name: Host-application profile
        run: NAUTILUS_TCK=1 go test ./sparkplug/host/ -run TestTCKHostConformance -v -timeout 120s

  hmi-3d:
    name: HMI 3D package — test, check, package; build the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # The pure logic (scene validation, bindings, the alarm fold) has unit
      # tests on the same 60-line harness hmi/ uses; svelte-check covers the
      # components; svelte-package + publint prove it publishes.
      - run: npm ci && npm test && npm run check && npm run package
        working-directory: hmi-3d
      # examples/spatial-rig/hmi consumes the package by file: link, so it
      # builds against the dist/ the step above just produced — the same
      # arrangement as webview-ui and hmi/.
      - run: npm ci && npm run check && npm run build
        working-directory: examples/spatial-rig/hmi
  vscode-iec:
    name: VS Code extension — compile, test
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: tools/vscode-iec}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      # webview-ui links the hmi package locally (file:../../../hmi), and
      # its mimic tests import from hmi's dist/ — build it first.
      - name: Build hmi (webview-ui's local dependency)
        run: npm ci && npm run package
        working-directory: hmi
      # webview-ui is a separate npm package (its own lockfile/deps, e.g.
      # the local hmi package the mimic routing tests import) — `npm test`
      # now also runs its pure-logic test files, so its deps must exist too.
      - run: npm ci --prefix webview-ui
      - run: npm test
      # Vite strips types without checking them, so nothing else type-checks
      # the webview's .svelte and .ts files. Warnings (a11y) don't fail it.
      - name: Type-check the webview (svelte-check)
        run: npm --prefix webview-ui run check -- --output human
  # The webview's real-input gesture harness (CDP-driven headless Chrome over
  # the production bundles: mimic, FBD, LD, SFC). ubuntu-latest ships Chrome.
  vscode-iec-gestures:
    name: VS Code extension — webview gesture harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: tools/vscode-iec}
    env:
      # Chrome's sandbox is refused on the runner (unprivileged user namespaces
      # are restricted); the harness only adds --no-sandbox when this is set.
      GESTURE_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build hmi (webview-ui's local dependency)
        run: npm ci && npm run package
        working-directory: hmi
      - run: npm ci
      - run: npm ci --prefix webview-ui
      - run: npm --prefix webview-ui run build
      # Every test records a clip of its run (gesture-harness/clips.mjs);
      # the runner image may not carry ffmpeg, so make sure of it.
      - name: ffmpeg (for the clips)
        run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -yqq --no-install-recommends ffmpeg; }
      - run: npm --prefix webview-ui run test:gestures
        env:
          GESTURE_CLIPS: ${{ github.workspace }}/gesture-clips
      # index.html in the artifact plays every clip beside its PASS/FAIL.
      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesture-clips
          path: gesture-clips
          if-no-files-found: warn
          retention-days: 14
  # A real VS Code with nothing useful on PATH, the way a desktop launcher
  # starts it, on each OS: the extension has to find a plain `go install` in
  # ~/go/bin (language-server diagnostics, diagram editors), and without a
  # CLI still activate and say how to fix it. See src/e2e/run.ts.
  vscode-iec-e2e:
    name: VS Code extension — CLI discovery e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung VS Code otherwise holds the runner for the 6-hour default.
    timeout-minutes: 15
    defaults:
      run: {working-directory: tools/vscode-iec, shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # The VS Code download only, never a profile (run.ts makes a fresh one).
      - uses: actions/cache@v4
        with:
          path: tools/vscode-iec/.vscode-test/vscode-*
          key: vscode-download-${{ runner.os }}-${{ hashFiles('tools/vscode-iec/package-lock.json') }}
      - run: npm ci
      # The resolver and installer against this OS's real filesystem (the ubuntu `npm test`
      # above only exercises Linux paths).
      - run: npm run compile && node --test out/cliResolve.test.js out/cliInstall.test.js
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
  version-sync:
    name: Versions — repo not behind registries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo is the source of truth for the extension and HMI versions;
      # publishing happens from main (publish.yml). A registry running AHEAD
      # of the repo means someone published out of band — fail loudly.
      - name: hmi vs npm
        run: |
          repo=$(node -p "require('./hmi/package.json').version")
          reg=$(npm view @joyautomation/nautilus-hmi version 2>/dev/null || echo 0.0.0)
          echo "repo=$repo npm=$reg"
          if [ "$(printf '%s\n%s\n' "$repo" "$reg" | sort -V | tail -1)" != "$repo" ]; then
            echo "::error::hmi/package.json ($repo) is behind npm ($reg)"; exit 1
          fi
      - name: hmi-3d vs npm
        run: |
          repo=$(node -p "require('./hmi-3d/package.json').version")
          reg=$(npm view @joyautomation/nautilus-hmi-3d version 2>/dev/null || echo 0.0.0)
          echo "repo=$repo npm=$reg"
          if [ "$(printf '%s\n%s\n' "$repo" "$reg" | sort -V | tail -1)" != "$repo" ]; then
            echo "::error::hmi-3d/package.json ($repo) is behind npm ($reg)"; exit 1
          fi
      # The extension has two channels, checked separately (RELEASING.md):
      #   pre-release: main's package.json vs the highest PRE-RELEASE on each
      #                registry;
      #   stable:      the highest vscode-v* tag vs the highest STABLE on each
      #                registry (no tags and no stable yet → passes).
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: extension vs Marketplace and Open VSX (per channel)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          repo=$(node -p "require('./tools/vscode-iec/package.json').version")
          # A PR into anything but main (a stable hotfix branch cut from a
          # vscode-v* tag) does not carry the pre-release line: skip that half.
          if [ -n "$BASE" ] && [ "$BASE" != main ]; then repo=-; fi
          tag=$(git ls-remote --tags --refs origin 'vscode-v*' \
                | sed -n 's#.*refs/tags/vscode-v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' \
                | sort -V | tail -1)
          .github/scripts/vscode-channel-guard.sh sync "$repo" "${tag:-0.0.0}"
      # "Behind a registry" catches an out-of-band publish. It does NOT catch
      # shipping a feature and forgetting the bump: the repo and the registry
      # then agree, the guard passes, and publish.yml -- which only fires when
      # the repo is AHEAD -- never runs. That is how L5X support sat in main
      # for two days while the Marketplace served a build without it.
      - name: extension changed without a version bump
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- tools/vscode-iec                     | grep -vE '^tools/vscode-iec/(CHANGELOG\.md|.*\.test\.ts)$' || true)
          [ -n "$changed" ] || { echo "extension untouched"; exit 0; }
          now=$(node -p "require('./tools/vscode-iec/package.json').version")
          was=$(git show "$base:tools/vscode-iec/package.json" | node -p                 "JSON.parse(require('fs').readFileSync(0)).version" || echo 0.0.0)
          echo "extension version $was -> $now"
          if [ "$was" = "$now" ]; then
            echo "::error::tools/vscode-iec changed but the version is still $now."
            echo "::error::publish.yml only ships when the repo is AHEAD of the registry,"
            echo "::error::so without a bump this change never reaches anyone."
            echo "$changed" | sed 's/^/  changed: /'
            exit 1
          fi

  release-config:
    name: Release config — goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with: {version: '~> v2', args: check}
  modbus-sim:
    name: Modbus TCP — foreign stack (pymodbus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # The driver's only other peer is its own slave; pymodbus is the foreign
      # implementation (someone else's encoder, datastore and exception
      # handling). Pinned exactly: the 3.x datastore API moved twice (3.7
      # ModbusSlaveContext → 3.11 ModbusDeviceContext → 3.15 SimDevice) and
      # the script targets the last one. Bump with modbus/testdata/sim.
      - run: pip install 'pymodbus==3.15.0'
      # Two sims from one script: the seeded map on 5020, and the same map
      # answering every request 1s late on 5021 for the timeout case. Wait
      # for each one's "listening on" line rather than sleeping.
      - name: Start simulators
        run: |
          python modbus/testdata/sim/pymodbus_sim.py --port 5020 > sim.log 2>&1 &
          python modbus/testdata/sim/pymodbus_sim.py --port 5021 --latency-ms 1000 > sim-slow.log 2>&1 &
          for i in $(seq 1 50); do
            grep -q 'listening on' sim.log && grep -q 'listening on' sim-slow.log && break
            sleep 0.2
          done
          grep -q 'listening on' sim.log && grep -q 'listening on' sim-slow.log \
            || { echo '::error::simulator did not start'; cat sim.log sim-slow.log; exit 1; }
      # Decode of every seeded format in all four word/byte layouts, write
      # round trip per function code, exception 0x02 → one Bad block, and the
      # latency-above-timeout path. Skipped without the env vars.
      - name: Foreign-stack tests
        run: |
          NAUTILUS_MODBUS_SIM=127.0.0.1:5020 NAUTILUS_MODBUS_SIM_SLOW=127.0.0.1:5021 \
            go test ./modbus/ -run TestForeign -v -timeout 120s
  snmp-sim:
    name: SNMP — foreign stack (snmpsim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # snmpsim (LeXtudio's maintained fork, on pysnmp) replays the committed
      # .snmprec walks: someone else's BER, USM and GetBulk. The script owns
      # the pins (snmpsim, pysnmp, pysmi, cryptography — the last two are
      # undeclared run-time needs snmpsim does not install itself) and the
      # v2c communities / v3 users the test expects.
      - name: Start snmpsim
        run: |
          scripts/snmp-sim.sh --port 1161 > sim.log 2>&1 &
          for i in $(seq 1 150); do
            grep -q 'Listening at UDP' sim.log && break
            sleep 0.2
          done
          grep -q 'Listening at UDP' sim.log || { echo '::error::snmpsim did not start'; cat sim.log; exit 1; }
      # Decode agreement per binding kind, v2c and v3 authPriv, GetBulk past
      # a table end, wrong credentials → error with a legible message, a
      # counter step → rate. The test waits for the source itself.
      - name: Foreign-stack tests
        run: NAUTILUS_SNMP_SIM=127.0.0.1:1161 go test ./snmp/ -run TestForeign -v -timeout 300s
  redfish-sim:
    name: Redfish — foreign stack (DMTF mockup server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # DMTF's own Redfish-Mockup-Server serving two mockups from the
      # published DSP2043 bundle (a legacy Thermal/Power server and a
      # ThermalSubsystem/PowerSubsystem one). The test spawns and restarts
      # the server itself (session recovery), so the script only prepares
      # the directory and runs the test.
      - name: Foreign-stack tests
        run: scripts/redfish-sim.sh
        timeout-minutes: 15
  prom-sim:
    name: Prometheus — foreign stack (node_exporter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      # A real node_exporter release binary, checksum-verified by the script
      # before it runs: the exposition format, metric names and label shapes
      # come from the exporter itself, not from our fixtures.
      - name: Start node_exporter
        run: |
          scripts/prom-sim.sh --port 9100 > sim.log 2>&1 &
          for i in $(seq 1 100); do
            curl -sf http://127.0.0.1:9100/metrics > /dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:9100/metrics > /dev/null || { echo '::error::node_exporter did not start'; cat sim.log; exit 1; }
      - name: Foreign-stack tests
        run: NAUTILUS_PROM_SIM=127.0.0.1:9100 go test ./prom/... -run TestForeign -v -timeout 300s
