name: CI
on:
  push: {branches: [main]}
  pull_request:
# GOTOOLCHAIN=local makes the pinned go-version a floor, not a suggestion:
# without it, a dependency bump that raises go.mod's `go` directive gets a
# newer toolchain auto-downloaded and CI stays green while `go install`
# breaks for everyone on the documented minimum (this bit v0.4.1).
env:
  GOTOOLCHAIN: local
jobs:
  go:
    name: Go — vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: nautilus check (examples)
        run: go run ./cmd/nautilus check examples
  sparkplug-tck:
    name: Sparkplug B — TCK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      # Drives an in-process edge node through its full lifecycle against the
      # joyautomation/sparkplug-tck-go edge-node profile (embeds its own
      # broker) and fails on any conformance assertion failure.
      - name: Edge-node profile
        run: NAUTILUS_TCK=1 go test ./sparkplug/ -run TestTCKConformance -v -timeout 90s
      # The host-application profile's twin: sparkplug/host.Driver is the SUT,
      # and the test scripts its own raw-paho edge node into the harness
      # broker (births, a deliberate seq gap that must provoke NCMD/Rebirth,
      # D/NDEATH) because the harness does not simulate one. Asserts zero FAIL
      # and a non-zero PASS count, so an all-N/A run cannot pass silently.
      - name: Host-application profile
        run: NAUTILUS_TCK=1 go test ./sparkplug/host/ -run TestTCKHostConformance -v -timeout 120s

  vscode-iec:
    name: VS Code extension — compile, test
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: tools/vscode-iec}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      # webview-ui links the hmi package locally (file:../../../hmi), and
      # its mimic tests import from hmi's dist/ — build it first.
      - name: Build hmi (webview-ui's local dependency)
        run: npm ci && npm run package
        working-directory: hmi
      # webview-ui is a separate npm package (its own lockfile/deps, e.g.
      # the local hmi package the mimic routing tests import) — `npm test`
      # now also runs its pure-logic test files, so its deps must exist too.
      - run: npm ci --prefix webview-ui
      - run: npm test
  version-sync:
    name: Versions — repo not behind registries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo is the source of truth for the extension and HMI versions;
      # publishing happens from main (publish.yml). A registry running AHEAD
      # of the repo means someone published out of band — fail loudly.
      - name: hmi vs npm
        run: |
          repo=$(node -p "require('./hmi/package.json').version")
          reg=$(npm view @joyautomation/nautilus-hmi version 2>/dev/null || echo 0.0.0)
          echo "repo=$repo npm=$reg"
          if [ "$(printf '%s\n%s\n' "$repo" "$reg" | sort -V | tail -1)" != "$repo" ]; then
            echo "::error::hmi/package.json ($repo) is behind npm ($reg)"; exit 1
          fi
      - name: extension vs Marketplace and Open VSX
        run: |
          repo=$(node -p "require('./tools/vscode-iec/package.json').version")
          mkt=$(npx --yes @vscode/vsce show joyauto.vscode-iec --json 2>/dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0)).versions[0].version" \
                || echo 0.0.0)
          ovsx=$(curl -s https://open-vsx.org/api/joyauto/vscode-iec \
                 | node -p "JSON.parse(require('fs').readFileSync(0)).version" || echo 0.0.0)
          echo "repo=$repo marketplace=$mkt open-vsx=$ovsx"
          for reg in "$mkt" "$ovsx"; do
            if [ "$(printf '%s\n%s\n' "$repo" "$reg" | sort -V | tail -1)" != "$repo" ]; then
              echo "::error::extension package.json ($repo) is behind a registry ($reg)"; exit 1
            fi
          done
  release-config:
    name: Release config — goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with: {version: '~> v2', args: check}
