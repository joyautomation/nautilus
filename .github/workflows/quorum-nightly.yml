# The vote protocol's long checks, nightly (#997; #710's test plan §3.2,
# §3.3): the mutation runner, split over 8 legs (#1096: the table grew
# past an hour on one runner and every night timed out), and beside it
# 200,000 seeded simulator schedules (a PR runs 2,000). Not a PR gate. A red run opens (or comments on) the
# rolling "quorum: nightly simulator" issue with the failing step, the
# mutation table or the failing seeds' QUORUM_SEED repro lines, and the
# run; a green run closes it (.github/scripts/quorum-nightly-issue.sh).
# By hand: Actions → quorum-nightly → Run workflow.
name: quorum-nightly
on:
  schedule:
    - cron: '11 5 * * *' # daily, 05:11 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # Each leg runs every 8th row of tools/quorum-mutants' table (about 8 min
  # of a one-hour table) on its own VM, so the timing-bound loopback tests
  # never share a CPU with another mutant. Its baseline is its rows' tests,
  # green with no mutation. Non-zero if a mutation survived or a build broke.
  mutants:
    name: Quorum mutants ${{ strategy.job-index }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The legs; their count is strategy.job-total, and MUTANTS_LEGS in
        # the report job below.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - name: go run ./tools/quorum-mutants -shard ${{ strategy.job-index }}/${{ strategy.job-total }}
        timeout-minutes: 25 # leaves the log's upload time to run
        shell: bash
        run: |
          set -o pipefail
          go run ./tools/quorum-mutants -shard ${{ strategy.job-index }}/${{ strategy.job-total }} 2>&1 | tee "$RUNNER_TEMP/mutants-${{ matrix.shard }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quorum-mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants-${{ matrix.shard }}.log
          retention-days: 14

  seeds:
    name: Quorum — 200k seeds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      # TestSeeds takes about 130 s; each failing seed prints a
      # QUORUM_SEED=k repro line. Then the operator-intent
      # log's three-replica schedules (#710 3b-4a, about 6 min); a failing
      # one names its seed (OPLOG_SIM_ONE=k reruns it with a trace). The
      # clone schedules (#1029 layer 2) run their own 200,000 too, the
      # clone races (#1029 step 1) 20,000 per case, the clone splits
      # (#1029 3c-1) 2,000 per shape, the spare gates (#1029 3c-2)
      # 2,000 per family, and the from-spare gate (#1029 3c-3c) 1,000 per
      # cell.
      - name: QUORUM_SEEDS=200000 go test ./quorum/sim (default and clone schedules), OPLOG_SIM_SEEDS=3000 go test ./oplog
        id: seeds
        timeout-minutes: 40 # leaves the log's upload time to run
        shell: bash
        env:
          QUORUM_SEEDS: '200000'
          QUORUM_CLONE_SEEDS: '200000'
          QUORUM_CLONE_RACE_SEEDS: '20000'
          QUORUM_CLONE_SPLIT_SEEDS: '2000'
          QUORUM_CLONE_RESTART_SEEDS: '1000'
          QUORUM_SPARE_SEEDS: '2000'
          OPLOG_SIM_SEEDS: '3000'
        run: |
          set -o pipefail
          rc=0
          go test -count=1 -timeout 20m ./quorum/sim -run '^TestSeeds$' 2>&1 | tee "$RUNNER_TEMP/seeds.log" || rc=1
          go test -count=1 -timeout 20m ./quorum/sim -run '^TestCloneSeeds$' 2>&1 | tee -a "$RUNNER_TEMP/seeds.log" || rc=1
          go test -count=1 -timeout 30m ./quorum/sim -run '^TestCloneRaceSeeds$' 2>&1 | tee -a "$RUNNER_TEMP/seeds.log" || rc=1
          go test -count=1 -timeout 20m ./quorum/sim -run '^TestCloneSplit' 2>&1 | tee -a "$RUNNER_TEMP/seeds.log" || rc=1
          go test -count=1 -timeout 20m ./quorum/sim -run '^(TestACloneBesideASettledPairBecomesASpare|TestLateFramesOfARestartMakeNoSpare|TestTheIncumbentRestartsOrDiesWhileTheSpareRuns|TestTheSpareDecisionUnderASplit|TestASplitWithASpareClearsByRestarts|TestALossyOriginalNeverGoesSpare|TestAnOriginalRestartingAfterTheMarkStaysAMember|TestLateFramesToBothVotersUpToALeaseMakeNoSpare|TestFromSpareNeverMakesTwoLeaders)$' 2>&1 | tee -a "$RUNNER_TEMP/seeds.log" || rc=1
          go test -count=1 -timeout 20m ./oplog -run '^TestThreeReplicaSimulation$' 2>&1 | tee -a "$RUNNER_TEMP/seeds.log" || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quorum-seeds
          path: ${{ runner.temp }}/seeds.log
          retention-days: 14

  # The rolling issue, from every leg's outcome and log.
  report:
    name: Quorum — rolling issue
    needs: [mutants, seeds]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the rolling issue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true # a leg that never started has no log
        with:
          pattern: quorum-*
          path: ${{ runner.temp }}/logs
          merge-multiple: true
      - name: Rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          MUTANTS_OUTCOME: ${{ needs.mutants.result }}
          SEEDS_OUTCOME: ${{ needs.seeds.result }}
          MUTANTS_LOG: ${{ runner.temp }}/mutants.log
          MUTANTS_LEGS: '8' # the mutants matrix's length: a leg without its done row is named
          SEEDS_LOG: ${{ runner.temp }}/logs/seeds.log
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat "$RUNNER_TEMP"/logs/mutants-*.log > "$MUTANTS_LOG" 2>/dev/null || true
          .github/scripts/quorum-nightly-issue.sh
