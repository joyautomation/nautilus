# Publishes the extension and the HMI kit when their package.json version on
# main is ahead of the registry. The repo is the source of truth: bump the
# version in a PR, merge, and this ships it. Nothing publishes when versions
# already match, so the workflow is idempotent and safe on every push.
# For the extension this is the PRE-RELEASE channel only; stable releases
# ship from vscode-v* tags (vscode-stable.yml).
name: publish
on:
  push:
    branches: [main]
concurrency: publish-main

jobs:
  hmi:
    name: HMI kit → npm
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC) — no stored token; see RELEASING.md.
    permissions:
      id-token: write
      contents: read
    defaults:
      run: {working-directory: hmi}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Compare repo version with npm
        id: v
        run: |
          repo=$(node -p "require('./package.json').version")
          reg=$(npm view @joyautomation/nautilus-hmi version 2>/dev/null || echo 0.0.0)
          echo "repo=$repo npm=$reg"
          if [ "$repo" = "$reg" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$repo" "$reg" | sort -V | tail -1)" != "$repo" ]; then
            echo "::error::npm has $reg, ahead of the repo's $repo — out-of-band publish"; exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.publish == 'true'
        run: npm ci
      - name: Publish to npm (trusted publisher)
        if: steps.v.outputs.publish == 'true'
        run: |
          if [ "${{ vars.PUBLISH_HMI }}" != "true" ]; then
            echo "repo variable PUBLISH_HMI != true — skipping npm publish"; exit 0
          fi
          npm publish --access public --provenance

  # main is the extension's PRE-RELEASE line (odd minor, e.g. 0.11.x): every
  # bump publishes with --pre-release. Stable (even minor) ships only from
  # vscode-v* tags via vscode-stable.yml. See RELEASING.md.
  extension:
    name: VS Code extension (pre-release) → Marketplace + Open VSX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # Fails on an even minor on main, on a registry pre-release ahead of the
      # repo (out-of-band publish), and on a version below the highest stable.
      # Outputs which registries still need this version.
      - name: Guard — main is the pre-release line, registries not ahead
        id: v
        run: |
          repo=$(node -p "require('./tools/vscode-iec/package.json').version")
          .github/scripts/vscode-channel-guard.sh publish-pre "$repo"
      - name: Package VSIX (pre-release)
        id: pkg
        if: steps.v.outputs.mkt == 'true' || steps.v.outputs.ovsx == 'true'
        uses: ./.github/actions/vscode-package
        with: {pre-release: 'true'}
      - name: Publish to VS Code Marketplace
        if: steps.v.outputs.mkt == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.pkg.outputs.vsix }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT not set — skipping Marketplace publish"; exit 0; fi
          npx --yes @vscode/vsce publish --pre-release --skip-duplicate --packagePath "$VSIX" -p "$VSCE_PAT"
      # Runs even when the Marketplace step failed: its gallery API times out
      # for stretches (three runs in a row on 2026-09-13), and Open VSX should
      # not lag behind because of it. The job still fails, so a rerun retries
      # the Marketplace; the guard then sees Open VSX is current and skips it.
      # The VSIX carries the pre-release flag in its manifest; ovsx reads it
      # from there (its --pre-release only applies when ovsx packages).
      - name: Publish to Open VSX
        if: steps.v.outputs.ovsx == 'true' && steps.pkg.outcome == 'success' && !cancelled()
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.pkg.outputs.vsix }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT not set — skipping Open VSX publish"; exit 0; fi
          # Namespace must exist and match the VSIX publisher; idempotent.
          npx --yes ovsx create-namespace joyauto -p "$OVSX_PAT" 2>/dev/null || true
          npx --yes ovsx publish "$VSIX" --skip-duplicate -p "$OVSX_PAT"
