name: Feature request
description: Something nautilus should do that it doesn't.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public: describe the need with made-up names, not a real plant's.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from the user's side (a manifest key, a CLI flag, a screen behaviour).
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds and alternatives
      description: What you do now, or how other tools handle it.
