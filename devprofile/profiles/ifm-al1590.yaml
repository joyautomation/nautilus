profile: ifm-al1590
title: ifm AL1590 8-port IO-Link master, OPC UA server
maker: ifm electronic
model: AL1590
version: 3
docs:
  - id: al1427
    title: "AL1427 IO-Link master with EtherNet/IP interface, operating instructions, §5.6 OPC UA server and §10.4.3 address space (11/2025), the ifm OPC UA tree the AL1590's follows"
    code: "11701454 / 00"
    url: https://www.instrumart.com/assets/ifm-efector-performanceline-io-link-master-AL1427.pdf
  - id: measured
    title: >-
      The node ids a deployed controller's program reads from AL1590 masters, 2026-10:
      port 4843; ns=5;s=<location>/iolinkmaster/port[n]/iolinkdevice/pdin as STRING,
      the process data as hex text ('0286' is 0x0286).
protocol: opcua
params:
  location: AL1590     # the master's configured name; it prefixes every node id
opcua:
  port: 4843           # measured; the AL1427 manual gives 4840 for that model
  namespaces:
    - urn:virtual:ifm:ns1      # indices 1-4: present on the device, URIs not published
    - urn:virtual:ifm:ns2
    - urn:virtual:ifm:ns3
    - urn:virtual:ifm:ns4
    - urn:virtual:ifm:al1590   # index 5: where the ports are
  object-namespace: 5
iolink:                # docs/design/iolink.md §3
  ports: 8
  # pdin is hex text, two digits per octet (measured: '0286' is 02 86).
  # pdout, the ids and the status are NOT measured: their names follow
  # pdin's (see notes), so they are unverified until read from a real
  # AL1590, and a port's identity check stands on them.
  pd-in: { point: "Port{n}_Pdin", form: hex, doc: "measured pdin hex text, '0286' is 0x0286" }
  pd-out: { point: "Port{n}_Pdout", form: hex, unverified: true, doc: "al1427 p. 168, as ProcessDataOutput (BYTE ARRAY, rw only when DeviceConfigurationDisabled is false); not read from an AL1590" }
  vendor-id: "Port{n}_VendorID"
  device-id: "Port{n}_DeviceID"
  status: "Port{n}_Status"
points:
  - { name: "Port{n}_Pdin", type: STRING, repeat: 8,
      node-id: "ns=5;s={location}/iolinkmaster/port[{n}]/iolinkdevice/pdin",
      path: "{location}/iolinkmaster/port[{n}]/iolinkdevice/pdin",
      desc: "Port {n}: IO-Link process data in, as hex text", doc: "measured pdin; tree per al1427 §10.4.3" }
  - { name: "Port{n}_Pdout", type: STRING, repeat: 8, writable: true,
      node-id: "ns=5;s={location}/iolinkmaster/port[{n}]/iolinkdevice/pdout",
      path: "{location}/iolinkmaster/port[{n}]/iolinkdevice/pdout",
      desc: "Port {n}: IO-Link process data out, as hex text", doc: "al1427 p. 168, as ProcessDataOutput", unverified: true }
  - { name: "Port{n}_VendorID", type: UDINT, repeat: 8,
      node-id: "ns=5;s={location}/iolinkmaster/port[{n}]/iolinkdevice/vendorid",
      path: "{location}/iolinkmaster/port[{n}]/iolinkdevice/vendorid",
      desc: "Port {n}: attached device vendor id (0: no device)", doc: "al1427 p. 163, as VendorID (UINT16)", unverified: true }
  - { name: "Port{n}_DeviceID", type: UDINT, repeat: 8,
      node-id: "ns=5;s={location}/iolinkmaster/port[{n}]/iolinkdevice/deviceid",
      path: "{location}/iolinkmaster/port[{n}]/iolinkdevice/deviceid",
      desc: "Port {n}: attached device id (0: no device)", doc: "al1427 p. 162, as DeviceID (UINT32)", unverified: true }
  - { name: "Port{n}_Status", type: BYTE, repeat: 8,
      node-id: "ns=5;s={location}/iolinkmaster/port[{n}]/status",
      path: "{location}/iolinkmaster/port[{n}]/status",
      desc: "Port {n}: port status (4 = OPERATE)", doc: "al1427 p. 162, as Status (BYTE)", unverified: true }
simulator: { block: IFM_AL1590_SIM, source: ifm-al1590.st }
notes: |
  The simulator turns a word the process model writes (<Master>_Port<n>_Word)
  into the four hex digits pdin carries; a sensor with other process data
  writes Port<n>_Pdin through its own simulator. The objects on the way are
  served as ns=5;s=<path>, the scheme the measured ids follow (not measured
  themselves).

  pdout, vendorid, deviceid and status (added in version 3) are UNVERIFIED
  names: only pdin was measured. The AL1427 manual (al1427) documents the
  same data under other names in an OPC 30120-shaped tree, with no node ids:
  ProcessDataInput / ProcessDataOutput under iolinkdevice/General (BYTE
  ARRAY, pdout read-write only when DeviceConfigurationDisabled is false,
  p. 168), VendorID (UINT16, p. 163) and DeviceID (UINT32, p. 162), and Status
  (BYTE: 4 = OPERATE, p. 156, 162). Which spelling an AL1590 serves, and
  whether pdout is a text or an octet node, is to be read from one. Not
  served yet: pin2/pin4 states, the rest of al1427 §12.2, and the methods.
