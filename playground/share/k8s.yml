# The playground's saved projects, beside nautilus-docs: the docs ingress
# (website/k8s/deploy.yml) sends /playground/api/ here.
#
# One replica on one volume, so Recreate: a rolling update would wait
# forever for the old pod to let go of the volume.
#
# Taking a project down needs SHARE_ADMIN_TOKEN, from a secret made by
# hand (without it, nothing can be taken down):
#   kubectl -n joy create secret generic nautilus-playground-share \
#     --from-literal=SHARE_ADMIN_TOKEN=$(openssl rand -hex 24)
#   curl -X DELETE -H "Authorization: Bearer $TOKEN" \
#     https://nautilus.joyautomation.com/playground/api/p/<id>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nautilus-playground-share
  namespace: joy
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautilus-playground-share
  namespace: joy
  labels:
    app: nautilus-playground-share
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nautilus-playground-share
  template:
    metadata:
      labels:
        app: nautilus-playground-share
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532 # distroless nonroot: the volume is writable by it
      containers:
        - name: share
          image: <IMAGE>
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nautilus-playground-share
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /playground/api/healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /playground/api/healthz
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nautilus-playground-share
---
apiVersion: v1
kind: Service
metadata:
  name: nautilus-playground-share
  namespace: joy
spec:
  selector:
    app: nautilus-playground-share
  ports:
    - port: 80
      targetPort: 8080
---
# A snapshot of the volume every night (DigitalOcean volume snapshots, via
# the cluster's CSI snapshot class), keeping the last 14. Files are written
# to a .tmp and renamed, so a snapshot never holds half a project.
#
# To restore, make a claim from a snapshot and point the deployment at it:
#   kubectl -n joy get volumesnapshot -l app=nautilus-playground-share-snapshot
#   spec.dataSource: {apiGroup: snapshot.storage.k8s.io, kind: VolumeSnapshot, name: <snapshot>}
# To take one now: kubectl -n joy create job --from=cronjob/nautilus-playground-share-snapshot snap-now
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nautilus-playground-share-snapshot
  namespace: joy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nautilus-playground-share-snapshot
  namespace: joy
rules:
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nautilus-playground-share-snapshot
  namespace: joy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nautilus-playground-share-snapshot
subjects:
  - kind: ServiceAccount
    name: nautilus-playground-share-snapshot
    namespace: joy
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nautilus-playground-share-snapshot
  namespace: joy
spec:
  schedule: "30 7 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          serviceAccountName: nautilus-playground-share-snapshot
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          containers:
            - name: snapshot
              # kubectl with a shell (registry.k8s.io/kubectl has none).
              image: alpine/k8s:1.34.1@sha256:ec714df3813b5405292860f8a1c55c5727bf8c33c88992f1e981efad8065547f
              command: [sh, -euc]
              env:
                - name: HOME
                  value: /tmp
              args:
                - |
                  name=nautilus-playground-share-$(date -u +%Y%m%d)
                  printf '%s' '{"apiVersion":"snapshot.storage.k8s.io/v1","kind":"VolumeSnapshot",
                    "metadata":{"name":"'"$name"'","namespace":"joy","labels":{"app":"nautilus-playground-share-snapshot"}},
                    "spec":{"volumeSnapshotClassName":"do-block-storage","source":{"persistentVolumeClaimName":"nautilus-playground-share"}}}' \
                    | kubectl apply -f -
                  kubectl -n joy wait --for=jsonpath='{.status.readyToUse}'=true "volumesnapshot/$name" --timeout=15m
                  # Only once tonight's is ready: the oldest beyond 14 go.
                  kubectl -n joy get volumesnapshot -l app=nautilus-playground-share-snapshot \
                    --sort-by=.metadata.creationTimestamp -o name \
                    | head -n -14 | xargs -r kubectl -n joy delete
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
