# Generated by `naut prometheus import --host 127.0.0.1:9100 --tag TESTBOX` — the
# "node" profile's bindings against that scrape. Do not edit — re-run the
# import. Validated offline: `naut check` builds the driver from this file
# with no exporter in sight.
sources:
  - id: TESTBOX
    url: http://127.0.0.1:9100/metrics
tags:
  - name: TESTBOX
    type: Server
    source: TESTBOX
    members:
      CpuPct:     {expr: "100 - 100 * idle / cpus", from: {cpus: {metric: node_cpu_seconds_total, labels: {mode: "idle"}, agg: count}, idle: {metric: node_cpu_seconds_total, labels: {mode: "idle"}, agg: sum, rate: true}}}
      FanCount:   {const: 1}
      Fault:      {expr: "maxtemp >= crit", from: {crit: {metric: node_hwmon_temp_crit_celsius, agg: min}, maxtemp: {metric: node_hwmon_temp_celsius, agg: max}}}
      InletTempC: {const: 0}
      Load1:      {metric: node_load1}
      MaxTempC:   {metric: node_hwmon_temp_celsius, agg: max}
      MemPct:     {expr: "100 * (1 - avail / total)", from: {avail: {metric: node_memory_MemAvailable_bytes}, total: {metric: node_memory_MemTotal_bytes}}}
      Model:      {metric: node_uname_info, label: nodename}
      PowerOn:    {const: true}
      PsuCount:   {const: 0}
      TempCount:  {const: 2}
      UptimeS:    {expr: "__now - boot", from: {boot: {metric: node_boot_time_seconds}}}
      Warning:    {expr: "maxtemp >= warn", from: {maxtemp: {metric: node_hwmon_temp_celsius, agg: max}, warn: {metric: node_hwmon_temp_max_celsius, agg: min}}}
  - name: TESTBOX_Fan1
    type: Fan
    source: TESTBOX
    members:
      Fault:   {expr: "rpm == 0", from: {rpm: {metric: node_hwmon_fan_rpm, labels: {chip: "c1", sensor: "fan1"}}}}
      Name:    {const: "c1 fan1"}
      Pct:     {const: 0}
      Present: {const: true}
      RPM:     {metric: node_hwmon_fan_rpm, labels: {chip: "c1", sensor: "fan1"}}
  - name: TESTBOX_Temp_c1_temp1
    type: TempSensor
    source: TESTBOX
    members:
      High:       {derived: "Value >= HighSP"}
      HighHigh:   {derived: "Value >= HighHighSP"}
      HighHighSP: {metric: node_hwmon_temp_crit_celsius, labels: {chip: "c1", sensor: "temp1"}}
      HighSP:     {metric: node_hwmon_temp_max_celsius, labels: {chip: "c1", sensor: "temp1"}}
      Name:       {const: "c1_temp1"}
      Value:      {metric: node_hwmon_temp_celsius, labels: {chip: "c1", sensor: "temp1"}}
  - name: TESTBOX_Temp_c1_temp2
    type: TempSensor
    source: TESTBOX
    members:
      Name:  {const: "c1_temp2"}
      Value: {metric: node_hwmon_temp_celsius, labels: {chip: "c1", sensor: "temp2"}}
