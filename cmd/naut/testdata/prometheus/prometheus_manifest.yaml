# Generated by `naut prometheus import --tag BENCH1 --url http://bench1:9100/metrics --file metrics.txt` — the
# "node" profile's bindings against that scrape. Do not edit — re-run the
# import. Validated offline: `naut check` builds the driver from this file
# with no exporter in sight.
sources:
  - id: BENCH1
    url: http://bench1:9100/metrics
tags:
  - name: BENCH1
    type: Server
    source: BENCH1
    members:
      CpuPct:      {expr: "100 - 100 * idle / cpus", from: {cpus: {metric: node_cpu_seconds_total, labels: {mode: "idle"}, agg: count}, idle: {metric: node_cpu_seconds_total, labels: {mode: "idle"}, agg: sum, rate: true}}}
      FanCount:    {const: 1}
      Fault:       {expr: "maxtemp >= crit", from: {crit: {metric: node_hwmon_temp_crit_celsius, agg: min}, maxtemp: {metric: node_hwmon_temp_celsius, agg: max}}}
      InletTempC:  {const: 0}
      Load1:       {metric: node_load1}
      MaxTempC:    {metric: node_hwmon_temp_celsius, agg: max}
      MemPct:      {expr: "100 * (1 - avail / total)", from: {avail: {metric: node_memory_MemAvailable_bytes}, total: {metric: node_memory_MemTotal_bytes}}}
      Model:       {metric: node_uname_info, label: nodename}
      Online:      {const: true}
      PowerOn:     {const: true}
      PsuCount:    {const: 0}
      RootDiskPct: {expr: "100 * (1 - avail / size)", from: {avail: {metric: node_filesystem_avail_bytes, labels: {mountpoint: "/"}}, size: {metric: node_filesystem_size_bytes, labels: {mountpoint: "/"}}}}
      Serial:      {metric: node_dmi_info, label: product_serial}
      TempCount:   {const: 2}
      UptimeS:     {expr: "__now - boot", from: {boot: {metric: node_boot_time_seconds}}}
      Warning:     {expr: "maxtemp >= warn", from: {maxtemp: {metric: node_hwmon_temp_celsius, agg: max}, warn: {metric: node_hwmon_temp_max_celsius, agg: min}}}
  - name: BENCH1_Fan1
    type: Fan
    source: BENCH1
    members:
      Fault:   {expr: "rpm == 0", from: {rpm: {metric: node_hwmon_fan_rpm, labels: {chip: "platform_coretemp_0", sensor: "fan1"}}}}
      Name:    {const: "platform_coretemp_0 fan1"}
      Pct:     {const: 0}
      Present: {const: true}
      RPM:     {metric: node_hwmon_fan_rpm, labels: {chip: "platform_coretemp_0", sensor: "fan1"}}
  - name: BENCH1_Temp_platform_coretemp_0_temp1
    type: TempSensor
    source: BENCH1
    members:
      High:       {derived: "Value >= HighSP"}
      HighHigh:   {derived: "Value >= HighHighSP"}
      HighHighSP: {metric: node_hwmon_temp_crit_celsius, labels: {chip: "platform_coretemp_0", sensor: "temp1"}}
      HighSP:     {metric: node_hwmon_temp_max_celsius, labels: {chip: "platform_coretemp_0", sensor: "temp1"}}
      Name:       {const: "platform_coretemp_0_temp1"}
      Value:      {metric: node_hwmon_temp_celsius, labels: {chip: "platform_coretemp_0", sensor: "temp1"}}
  - name: BENCH1_Temp_platform_coretemp_0_temp2
    type: TempSensor
    source: BENCH1
    members:
      Name:  {const: "platform_coretemp_0_temp2"}
      Value: {metric: node_hwmon_temp_celsius, labels: {chip: "platform_coretemp_0", sensor: "temp2"}}
