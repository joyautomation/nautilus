# Generated by `naut redfish import --tag NODE1` from the BMC's Redfish tree.
# Do not edit the tags: re-run the import. Commands (writes:) are never
# generated — add one by hand, in a reviewed diff (docs/design/it-drivers.md §7).
# Validated offline: `naut check` needs no BMC and no password.
sources:
  - id: NODE1
    host: "https://bmc1"
    user: admin
    password-env: NODE1_BMC_PASSWORD
    tls:
      insecure: true
tags:
  - name: NODE1
    type: Server
    source: NODE1
    desc: "Example Systems R1U-L"
    resource: /redfish/v1/Systems/1
    members:
      Online: {path: Id, exists: true}
      PowerOn: {path: PowerState, eq: "On"}
      Health: {path: Status.Health, map: {Critical: 2, OK: 0, Warning: 1}}
      Fault: {derived: "Health == 2"}
      Warning: {derived: "Health == 1"}
      Model: {path: Model}
      Serial: {path: SerialNumber}
      InletTempC: {resource: /redfish/v1/Chassis/1/Thermal, path: "Temperatures[MemberId=2].ReadingCelsius"}
      MaxTempC: {resource: /redfish/v1/Chassis/1/Thermal, path: "Temperatures[*].ReadingCelsius", agg: max}
      PowerW: {resource: /redfish/v1/Chassis/1/Power, path: "PowerControl[MemberId=0].PowerConsumedWatts"}
      FanCount: {const: 4}
      PsuCount: {const: 2}
      TempCount: {const: 4}
  - name: NODE1_Fan1
