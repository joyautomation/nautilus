# The logix dialect: TONR, a timer with a Reset pin — the Logix `RES(t)`
# idioms (a free-running pulse, a reset from an input) on both runtimes.
name: conformance-dialect
dialect: logix
tasks:
  - program: Main.ld
    scan: 10ms
tags:
  - { name: Go, role: input, init: false }
  - { name: Clear, role: input, init: false }
  - { name: Pulses, role: state, init: 0 }
  - { name: Held, role: output, init: false }
target:
  logix:
    controller: DemoLine
    processor: 1756-L85E
    revision: "38.11"
    comm-path: AB_ETH-1\100.93.56.45\Backplane\0
    host: 100.93.56.45
    side:
      heartbeat: Nautilus_Scan
