# DemoLine as a nautilus project with a Logix deploy target: the fixture
# `naut logix deploy` and `naut check` are tested against, and the project
# the Echo demo deploys (docs/design/logix-authoring.md §8).
name: demoline
tasks:
  - program: MainProgram.ld
    scan: 100ms
target:
  logix:
    controller: DemoLine
    processor: 1756-L85E
    revision: "38.11"
    # ECHO1's Echo controller, reached by logixd through FactoryTalk Linx
    # and by live values over EtherNet/IP; both on the VM's Tailscale address.
    comm-path: AB_ETH-1\100.93.56.45\Backplane\0
    host: 100.93.56.45
