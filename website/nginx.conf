# The docs site, and the playground under /playground/ (see the Dockerfile).

# The playground asks for its engine, worker and extension files with
# ?v=<version>.<build>; the build id changes when they do, so a request
# naming the build this image carries can be cached for good. The
# Dockerfile writes the build in from engine.json. Any other ?v= (a page
# loaded from the other side of a rolling deploy) is only revalidated, so
# an old file is never kept under a new build's name.
map $arg_v $playground_cache {
    default "no-cache";
    "~\.@PLAYGROUND_BUILD@$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the ingress's TLS: a trailing-slash redirect keeps the visitor's
    # scheme and host instead of naming http:// and this container.
    absolute_redirect off;

    # Every compressible file has a .gz beside it, made when the image is
    # built: the pod's CPU limit is far too small to compress the 20 MB
    # naut.wasm per request. Nothing is compressed on the fly.
    gzip_static on;
    gzip_vary on;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # A project saved by the Share button: the playground page, which hands
    # the id to the playground. The project itself comes from
    # /playground/api/, which the ingress sends to playground/share.
    location ~ "^/playground/p/[a-z2-7]{12}/?$" {
        try_files /playground/index.html =404;
    }

    # Fingerprinted build output: the name changes when the content does.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /playground/engine/app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The rest of the playground: kept for good when asked for with this
    # build's ?v=, otherwise revalidated (a 304 when unchanged). The
    # examples, engine.json and the service worker never carry ?v=, so an
    # edited example reaches visitors on their next load.
    location /playground/engine/ {
        add_header Cache-Control $playground_cache;
    }
}
