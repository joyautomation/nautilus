apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautilus-docs
  namespace: joy
  labels:
    app: nautilus-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nautilus-docs
  template:
    metadata:
      labels:
        app: nautilus-docs
    spec:
      containers:
        - name: nautilus-docs
          image: <IMAGE>
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nautilus-docs
  namespace: joy
spec:
  selector:
    app: nautilus-docs
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nautilus-docs
  namespace: joy
  # ASSUMPTION: cluster-issuer and ingress class copied from common DO setups.
  # Compare with the existing site's ingress before first apply:
  #   kubectl get ingress -n joy -o yaml
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nautilus.joyautomation.com
      secretName: nautilus-docs-tls
  rules:
    - host: nautilus.joyautomation.com
      http:
        paths:
          # The playground's saved projects (playground/share/k8s.yml).
          - path: /playground/api
            pathType: Prefix
            backend:
              service:
                name: nautilus-playground-share
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nautilus-docs
                port:
                  number: 80
