name: counter

tasks:
  - program: program.st
    scan: 100ms

tags:
  - { name: Eye,   role: setpoint, type: BOOL, init: false, desc: Photo-eye (TRUE while a parcel blocks the beam) }
  - { name: Reset, role: setpoint, type: BOOL, init: false, desc: Reset button (TRUE while pressed) }
  - { name: Count, role: output,   type: INT,  init: 0,     desc: Parcels counted }
  - { name: Full,  role: output,   type: BOOL, init: false, desc: Bin full (5 parcels or more) }

driver:
  type: memory
