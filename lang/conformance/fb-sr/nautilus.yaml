# fb-sr - the standard SR latch (set-dominant) in every language that
# can express it. One task per language; outputs are prefixed st_/ld_/fbd_ so one
# assertion in fb-sr_test.yaml checks all three paths at once.
#
#   go test ./lang/conformance/ -run 'TestConformance/fb-sr'
#   go run ./cmd/naut test lang/conformance/fb-sr
name: fb-sr

tasks:
  - program: fb-sr.st      # the first task is always "main"; its prefix is still st_
    scan: 10ms
  - name: ld
    program: fb-sr.ld
    scan: 10ms
  - name: fbd
    program: fb-sr.fbd
    scan: 10ms

tags:
  # Shared inputs - plain tags every task reads.
  - { name: S, role: state, init: false, desc: "Set request" }
  - { name: R, role: state, init: false, desc: "Reset request" }

  # Outputs, one set per language.
  - { name: st_Q,  role: state, init: false }
  - { name: ld_Q,  role: state, init: false }
  - { name: fbd_Q, role: state, init: false }

driver:
  type: memory
