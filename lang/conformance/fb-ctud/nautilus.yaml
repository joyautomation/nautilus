# fb-ctud — the standard CTUD (up/down counter) in ST, LD and FBD. The
# load input's shared tag is LOAD (CTUD.LD).
#
#   go test ./lang/conformance/ -run 'TestConformance/fb-ctud'
name: fb-ctud

tasks:
  - program: fb-ctud.st
    scan: 1ms
  - name: ld
    program: fb-ctud.ld
    scan: 1ms
  - name: fbd
    program: fb-ctud.fbd
    scan: 1ms

tags:
  - { name: CU,   role: state, init: false, desc: "Count-up input (CTUD.CU), rising edges" }
  - { name: CD,   role: state, init: false, desc: "Count-down input (CTUD.CD), rising edges" }
  - { name: R,    role: state, init: false, desc: "Reset input (CTUD.R): CV := 0" }
  - { name: LOAD, role: state, init: false, desc: "Load input (CTUD.LD): CV := PV" }
  - { name: PV,   role: state, init: 3,     desc: "Preset value (CTUD.PV)" }

  - { name: st_QU,  role: state, init: false }
  - { name: st_QD,  role: state, init: false }
  - { name: st_CV,  role: state, init: 0 }
  - { name: ld_QU,  role: state, init: false }
  - { name: ld_QD,  role: state, init: false }
  - { name: ld_CV,  role: state, init: 0 }
  - { name: fbd_QU, role: state, init: false }
  - { name: fbd_QD, role: state, init: false }
  - { name: fbd_CV, role: state, init: 0 }

driver:
  type: memory
