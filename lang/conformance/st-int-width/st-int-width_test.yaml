# Integer widths as IEC 61131-3 has them (#782, James 2026-11-17: refuse +
# wrap). Arithmetic is computed in 64 bits and never wraps on its own
# (#326); a store into a declared integer keeps its low bits, read signed
# or unsigned as the type is, so INT wraps at 16 bits, DINT at 32, UINT at
# 0..65535. Shifts and rotates act on the first operand's declared width
# (ROL of a WORD rotates over 16 bits). This replaces the earlier pin of a
# 64-bit deviation (decision 4 in randd/handoffs/TEST-PLAN-HANDOFF.md §8).
tests:
  - name: INT wraps at 16 bits
    steps:
      - { given: { I16: 32767 },  scans: 1, expect: { st_I16: -32768 } }
      - { given: { I16: -32768 }, scans: 1, expect: { st_I16: -32767 } }

  - name: DINT wraps at 32 bits
    steps:
      - { given: { D32: 2147483647 }, scans: 1, expect: { st_D32: -2147483648 } }
      - { given: { D32: 100000 },     scans: 1, expect: { st_Mul: 1410065408 } } # 1e10 keeps its low 32 bits

  - name: UINT and WORD wrap at 0..65535
    steps:
      - { given: { U16: 0 },     scans: 1, expect: { st_U16: 65535 } }
      - { given: { U16: 5 },     scans: 1, expect: { st_U16: 4 } }
      - { given: { W16: 65535 }, scans: 1, expect: { st_W16: 0 } }

  - name: shifts act on the operand's 16 bits, and an INT reads bit 15 as the sign
    steps:
      - { given: { W16: 1, N: 40 },     scans: 1, expect: { st_Shl: 0 } }      # shifted past 16 bits
      - { given: { W16: 65535, N: 4 },  scans: 1, expect: { st_Shl: -16 } }    # 16#FFF0 into an INT
      - { given: { W16: 1, N: 64 },     scans: 1, expect: { st_Shl: 0 } }
      - { given: { I16: 256, N: 4 },    scans: 1, expect: { st_Shr: 16 } }
      - { given: { I16: -1, N: 4 },     scans: 1, expect: { st_Shr: 4095 } }   # zero-fill over 16 bits

  - name: ROL and ROR rotate over the declared 16 bits
    steps:
      - { given: { W16: 32768, N: 1 }, scans: 1, expect: { st_Rol: 1 } }
      - { given: { W16: 1, N: 1 },     scans: 1, expect: { st_Ror: -32768 } }  # 16#8000 into an INT
      - { given: { W16: 1, N: 15 },    scans: 1, expect: { st_Rol: -32768 } }
      - { given: { W16: 1, N: 16 },    scans: 1, expect: { st_Rol: 1, st_Ror: 1 } }  # a full turn is the identity
      - { given: { W16: 6, N: 17 },    scans: 1, expect: { st_Rol: 12, st_Ror: 3 } } # the count is taken mod 16
      - { given: { W16: 65535, N: 5 }, scans: 1, expect: { st_Rol: -1, st_Ror: -1 } } # all ones rotate to all ones
