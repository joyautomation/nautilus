# it-cluster: a three-node lab cluster (three switches, three servers) as a
# plant simulation — the monitoring side of an IT rack with no rack. See
# README.md.
#
#   naut check .   validate (no recording needed)
#   naut test .    the plant's fault logic, virtual time
#   naut run .     the plant on http://localhost:8087
#
# Its device tags (SW1_Port25, ...) are the recording bent by fault inputs
# (Sim_SW1_Port25.Down, ...). `naut snmp serve --from` serves them to a
# monitoring project through that project's own manifest.
name: it-cluster

server:
  addr: "localhost:8087"
  online-edits: true

tasks:
  - program: plant.st
    scan: 1s

drivers:
  - type: replay
    manifest: replay_manifest.yaml

tag-files:
  - tags/clock.yaml
  - tags/recorded.yaml
  - tags/switches.yaml
  - tags/nodes.yaml
