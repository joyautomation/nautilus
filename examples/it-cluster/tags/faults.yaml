- { name: ScenarioCatalog, role: state, init: "[{\"name\": \"normal\", \"about\": \"Every fault cleared: the recording as it was.\"}, {\"name\": \"port-down\", \"about\": \"A switch port loses link (SW2 te0/26); node1's slot 3 port 2, at the far end, loses it too.\"}, {\"name\": \"port-flap\", \"about\": \"SW2 te0/26 flaps, down 10 s in every 30 s: never long enough for a link-down alarm.\"}, {\"name\": \"cable-pull\", \"about\": \"The cable between SW3 te0/25 and node3's slot 3 port 2 is pulled.\"}, {\"name\": \"mesh-cable-pull\", \"about\": \"A server-to-server link (node1 slot 2 port 1 to node2 slot 3 port 1) is pulled.\"}, {\"name\": \"speed-degrade\", \"about\": \"node1's uplink (SW1 te0/25) renegotiates at 1G.\"}, {\"name\": \"error-burst\", \"about\": \"SW2 te0/25 starts counting 50 errors a second.\"}, {\"name\": \"broadcast-storm\", \"about\": \"A broadcast storm (a loop, say) floods every port in the layer-2 domain; the 1G ports saturate and drop.\"}, {\"name\": \"multicast-storm\", \"about\": \"A multicast flood with no IGMP snooping to stop it reaches every port.\"}, {\"name\": \"switch-down\", \"about\": \"SW3 goes dark: its ports and every cable to it go down, and it stops answering.\"}, {\"name\": \"switch-reboot\", \"about\": \"SW3 reboots, dark for 90 s, and comes back with its uptime reset.\"}, {\"name\": \"cpu-overheat\", \"about\": \"node2 runs flat out with two fans gone; its CPU climbs past HighHigh in a few minutes.\"}, {\"name\": \"fan-fail\", \"about\": \"node1's FAN3 stops; the others ramp and the CPU warms.\"}, {\"name\": \"psu-loss\", \"about\": \"node1's PSU2 loses its input; PSU1 carries the load and the server stays up.\"}, {\"name\": \"drive-pull\", \"about\": \"node3's NVMe bay 2 is pulled.\"}, {\"name\": \"drive-failing\", \"about\": \"node3's NVMe bay 1 predicts its own failure.\"}, {\"name\": \"node-off\", \"about\": \"node2 powers off; its links drop and the switches alarm.\"}, {\"name\": \"bmc-dark\", \"about\": \"node3's BMC stops answering.\"}, {\"name\": \"bmc-reboot\", \"about\": \"node3's BMC reboots, dark for two minutes, then back.\"}, {\"name\": \"hot-room\", \"about\": \"The room runs 15 \u00b0C hot; every inlet, and everything behind it, rises.\"}, {\"name\": \"cooling-failure\", \"about\": \"The room's cooling fails; the inlets climb 2 \u00b0C a minute for ten minutes.\"}]", desc: "Every named scenario and what it does, as JSON (scenarios.yaml)" }
- { name: ScenarioS, role: state, init: 0.0, desc: "Seconds since the Scenario was written" }
