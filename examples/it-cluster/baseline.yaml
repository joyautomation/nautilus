# Corrections to the recording, so that the plant's normal is the site as
# planned: with no fault set, the monitor should see nothing wrong. gen.py
# applies them to the replay manifest and to the devices' snapshot; the
# recording itself is not changed.
#
#   series:  a device tag plays another tag's recorded series (its members:
#            AdminUp, OperUp, speed, counters). Identity (name, index,
#            alias) stays the port's own, from the walk.

series:
  # While the cluster was recorded, the bench trunk was cabled to SW1 g0/23;
  # the plan puts the site uplink on g0/1, which sat admin up with no link
  # (a standing link-down alarm). g0/1 plays what g0/23 carried...
  SW1_Port01: SW1_Port23
  # ...and g0/23 reads as a spare: shut, like g0/2 to g0/22.
  SW1_Port23: SW1_Port22
