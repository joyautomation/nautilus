# The heated surge tank with NO GO ANYWHERE — the feature tour of the
# manifest product surface:
#   nautilus run          scan loop + dashboard + tag API
#   nautilus build        one deployable controller binary, no toolchain
#   nautilus check        compile in CI
# Four tasks, three IEC languages, one tag store — control in FBD,
# reporting in FBD, the annunciator in ladder, and even the PLANT PHYSICS
# simulated in ST (Go remains the tier for real buses and richer sims).
name: heated-tank-nogo

server:
  addr: "localhost:8080"   # NAUTILUS_ADDR overrides
  online-edits: true       # download/rollback from VS Code, per task by POU

tasks:
  - program: program.fbd   # the control loop — pump seal-in + heater PI
    scan: 100ms
    dt-tag: ScanDtS
  - name: sim              # the plant, simulated in IEC (no Go physics)
    program: sim.st
    scan: 100ms
    dt-tag: SimDtS
  - name: reports          # 1 Hz operator-facing values (arrays, user FB)
    program: reports.fbd
    scan: 1s
    dt-tag: RepDtS
  - name: interlocks       # the annunciator, in ladder
    program: interlocks.ld
    scan: 200ms

# Tags by role, with the HMI metadata (units, descriptions) that the
# dashboard table and /api/meta serve.
tags:
  # process values — owned by the sim task here; a real deployment makes
  # these role: input and lets the field driver supply them
  - { name: LevelPct,    role: state, init: 60.0, unit: "%",   desc: "Tank level" }
  - { name: TempC,       role: state, init: 60.0, unit: "°C",  desc: "Tank temperature" }
  - { name: FT101,       role: state, init: 0.0,  unit: "L/s", desc: "Tank inflow (pump)" }
  - { name: FT102,       role: state, init: 0.0,  unit: "L/s", desc: "Tank outflow (demand)" }
  - { name: DV101,       role: state, init: 60.0, unit: "%",   desc: "Demand valve position" }
  - { name: SupplyTempC, role: state, init: 50.0, unit: "°C",  desc: "Inlet supply temperature" }
  - { name: HeaterKw,    role: state, init: 0.0,  unit: "kW",  desc: "Heater power" }
  # operator setpoints — writable from the HMI/API from scan one
  - { name: TempSP,         role: setpoint, init: 65.0,  unit: "°C", desc: "Temperature setpoint" }
  - { name: TempSPEco,      role: setpoint, init: 55.0,  unit: "°C", desc: "Eco-mode temperature setpoint" }
  - { name: EcoMode,        role: setpoint, init: false, desc: "Run at the eco setpoint (SEL in the diagram)" }
  - { name: Kp,             role: setpoint, init: 12.0,  desc: "PI proportional gain" }
  - { name: Ki,             role: setpoint, init: 0.15,  unit: "1/s", desc: "PI integral gain" }
  - { name: PumpStartLevel, role: setpoint, init: 40.0,  unit: "%", desc: "Pump seal-in level" }
  - { name: PumpStopLevel,  role: setpoint, init: 75.0,  unit: "%", desc: "Pump drop-out level" }
  - { name: Demand,         role: setpoint, init: 60.0,  unit: "%", desc: "Process demand — the drain valve tracks it" }
  - { name: HornAck,        role: setpoint, init: false, desc: "Horn acknowledge — releases when alarms clear" }
  # commands — sent to the driver (loopback here)
  - { name: PumpRun, role: output, init: false, desc: "Pump run command" }
  - { name: Heater,  role: output, unit: "%",   desc: "Heater output command" }
  # computed state — retained across scans and online edits
  - { name: TempLowAlm, role: state, init: false, desc: "Low temperature alarm (10 s delay)" }
  - { name: HiTempAlm,  role: state, init: false, desc: "High temperature alarm (interlocks.ld)" }
  - { name: Horn,       role: state, init: false, desc: "Annunciator horn (interlocks.ld)" }
  - { name: TempAvg,    role: state, init: 0.0, unit: "°C",     desc: "Temperature, 4 s rolling average" }
  - { name: TempRate,   role: state, init: 0.0, unit: "°C/min", desc: "Temperature rate of change" }
  - { name: Status,     role: state, init: "",  desc: "Operator status line (built in reports.fbd)" }

driver:
  type: memory   # loopback; swap for `type: eip` + a manifest for real I/O
