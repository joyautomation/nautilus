# epic-bench — the office groov EPIC as nautilus I/O
#
# An Opto 22 GRV-EPIC-PR1 with four modules (24 DI, 12 DO, 12 ICTD
# temperature inputs, 24 voltage inputs) driven by the nautilus runtime over
# the processor's own Modbus/TCP server. Nothing runs on the EPIC but its
# stock firmware: no PAC Control strategy, no CODESYS, no license. The
# chassis was imported, not typed:
#
#   naut optommp browse --host 192.168.82.243     what the processor reports
#   naut optommp import --host 192.168.82.243     → modbus_manifest.yaml + tags/optommp.yaml
#
#   naut check .     validate offline
#   naut test  .     the acceptance suite, virtual time, no EPIC needed
#   naut run   .     poll the EPIC for real: http://localhost:8086
#
# bench.st is deliberately small — a heartbeat on the last output, a
# pushbutton mirrored to the first output, and the two wired analog
# channels copied onto named tags — because the point of this project is the
# round trip, not the logic. See README.md for what the EPIC is and what
# the next step (the runtime on the EPIC itself) needs.
name: epic-bench

server:
  addr: "localhost:8086"
  online-edits: true

driver:
  type: modbus
  manifest: modbus_manifest.yaml
  scan-rate: 100ms

tasks:
  - program: bench.st
    scan: 100ms
    dt-tag: BenchDtS

tag-files:
  - tags/optommp.yaml

tags:
  - { name: BenchDtS,      role: state, init: 0.0, unit: "s", desc: "Scan interval handed to bench.st" }
  - { name: BlinkPeriodS,  role: setpoint, init: 1.0, unit: "s", desc: "Heartbeat period on slot 1 output 11" }
  - { name: Blink,         role: state, init: false, desc: "Heartbeat state" }
  - { name: BenchTempC,    role: state, init: 0.0, unit: "°C", desc: "ICTD probe on slot 2 channel 0" }
  - { name: BenchVoltsV,   role: state, init: 0.0, unit: "V", desc: "Voltage input on slot 3 channel 0" }
