# plcnext-bench — the nautilus runtime ON the office PLCnext
#
# A Phoenix Contact AXC F 2152 (ARMv7, PREEMPT_RT Linux, firmware 2023.0)
# with four Axioline Smart Elements on its local bus. The same `naut` binary,
# cross-compiled for the controller, runs this project there and drives
# the modules through rt/plcnext-io's in-process shim (transport: shm in
# the manifest; the BusConductor handshake goes over the firmware's
# data-access socket); PLCnext Engineer
# is not involved and no IEC program of Phoenix's runs. BusConductor
# (Phoenix Contact's own open component) configures the bus at start.
#
#   naut check .                       validate offline, on the laptop
#   naut test  .                       the acceptance suite, virtual time
#   CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o naut-arm ./cmd/naut
#   ./naut-arm build -o controller .   the project embedded on the ARM binary
#   PLC=<the controller's address>
#   scp controller admin@$PLC:/opt/plcnext/apps/nautilus/
#   ssh admin@$PLC /opt/plcnext/apps/nautilus/controller
#                                      dashboard + tag API on the controller's :8080
#
# README.md has what the controller needs first (the BusConductor files
# and one runtime restart) and what has and has not been verified.
name: plcnext-bench

server:
  addr: ":8080"
  online-edits: true
  # The 3D screen, once built (cd hmi && npm install && npm run build): the
  # controller and its Smart Elements with their channel lamps lit from the
  # tags. Build it before `naut build`, which embeds it. Tolerates being
  # absent. Serves it at "/"; the built-in dashboard moves to "/_nautilus/".
  hmi: hmi/build

driver:
  type: plcnext
  manifest: plcnext_manifest.yaml
  scan-rate: 50ms

tasks:
  - program: bench.st
    scan: 50ms
    dt-tag: BenchDtS

tag-files:
  - tags/plcnext.yaml   # the I/O, generated from plcnext_manifest.yaml
  - tags/bench.yaml     # the program's own: heartbeat, outage hold

