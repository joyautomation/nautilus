# The bench AXC F 2152's local Axioline bus as BusConductor presents it in
# its generic (auto-config) mode: one 512-byte input image and one
# 512-byte output image, and EVERY module occupies its own frame length
# in BOTH images, in bus order — a DO16 takes two bytes of the input
# image it never writes, a DI16 two bytes of the output image nobody
# reads. The modules are Smart Elements on one backplane (K2 on the
# panel, its elements labelled K2.1, K2.2, K2.3 in slot order).
#
# Measured on the bench 2026-10-27 with eyes on the LEDs and a switch on
# the inputs: the DO16 comes first (outputs at bytes 0..1), the DI16
# second (inputs at bytes 2..3), and the AI4 U's four channels sit at
# input bytes 4..11 (its output frame, by the both-images rule, at 4..11
# too, unused). A digital module numbers its channels byte by byte:
# channel 01 is bit 0 of the module's first byte, channel 09 bit 0 of its
# second. bit:N counts in the 16-bit big-endian word at the offset, so
# channel n is bit:((n+7) mod 16) — channel 01 is bit:8, channel 16
# bit:7. The analogs are big-endian words, as the format assumes.
#
# transport: shm — the bytes go through rt/plcnext-io's nautilus_io, the
# ACF-started shim that touches the Axioline frames every millisecond
# through the firmware's ANSI-C API, by way of its shared-memory page
# (shm and output-watchdog take their defaults: /dev/shm/nautilus-plcnext-io,
# 1s). The BusConductor handshake still runs over the firmware's gRPC
# socket. `transport: grpc` (the default) instead reads the images through
# their GDS mirrors, Arp.Plc.Eclr/PND_S1_INPUTS and PND_S1_OUTPUTS (see
# controller/ and the README) — with the shim deployed it is the frame's
# only writer, so on grpc the outputs no longer reach the bus.
transport: shm
bus-conductor: BcComponent1
modules:
  - { slot: 1, part: "AXL SE DO16/1", in: 2, out: 2, desc: "K2.1, 16 digital outputs (device 0x00400002)" }
  - { slot: 2, part: "AXL SE DI16/1", in: 2, out: 2, desc: "K2.2, 16 digital inputs (device 0x00800002)" }
  - { slot: 3, part: "(no process data)", desc: "K2.3, the SC element (device 0x00000100)" }
  - { slot: 4, part: "AXL SE AI4 U", in: 8, out: 8, desc: "4 analog voltage inputs (device 0x00200008)" }
tags:
  - { name: DI_00, dir: in, offset: 2, format: "bit:8",  desc: "slot 2 input 01" }
  - { name: DI_01, dir: in, offset: 2, format: "bit:9",  desc: "slot 2 input 02" }
  - { name: DI_02, dir: in, offset: 2, format: "bit:10", desc: "slot 2 input 03" }
  - { name: DI_03, dir: in, offset: 2, format: "bit:11", desc: "slot 2 input 04" }
  - { name: DI_04, dir: in, offset: 2, format: "bit:12", desc: "slot 2 input 05" }
  - { name: DI_05, dir: in, offset: 2, format: "bit:13", desc: "slot 2 input 06" }
  - { name: DI_06, dir: in, offset: 2, format: "bit:14", desc: "slot 2 input 07" }
  - { name: DI_07, dir: in, offset: 2, format: "bit:15", desc: "slot 2 input 08" }
  - { name: DI_08, dir: in, offset: 2, format: "bit:0",  desc: "slot 2 input 09" }
  - { name: DI_09, dir: in, offset: 2, format: "bit:1",  desc: "slot 2 input 10" }
  - { name: DI_10, dir: in, offset: 2, format: "bit:2",  desc: "slot 2 input 11" }
  - { name: DI_11, dir: in, offset: 2, format: "bit:3",  desc: "slot 2 input 12" }
  - { name: DI_12, dir: in, offset: 2, format: "bit:4",  desc: "slot 2 input 13" }
  - { name: DI_13, dir: in, offset: 2, format: "bit:5",  desc: "slot 2 input 14" }
  - { name: DI_14, dir: in, offset: 2, format: "bit:6",  desc: "slot 2 input 15" }
  - { name: DI_15, dir: in, offset: 2, format: "bit:7",  desc: "slot 2 input 16" }
  - { name: AI_00, dir: in, offset: 4, format: int16, desc: "slot 4 analog input 0, raw counts (0x8020 = supply missing)" }
  - { name: AI_01, dir: in, offset: 6, format: int16, desc: "slot 4 analog input 1, raw counts" }
  - { name: AI_02, dir: in, offset: 8, format: int16, desc: "slot 4 analog input 2, raw counts" }
  - { name: AI_03, dir: in, offset: 10, format: int16, desc: "slot 4 analog input 3, raw counts" }
  - { name: DO_00, dir: out, offset: 0, format: "bit:8",  init: false, desc: "slot 1 output 01" }
  - { name: DO_01, dir: out, offset: 0, format: "bit:9",  init: false, desc: "slot 1 output 02" }
  - { name: DO_02, dir: out, offset: 0, format: "bit:10", init: false, desc: "slot 1 output 03" }
  - { name: DO_03, dir: out, offset: 0, format: "bit:11", init: false, desc: "slot 1 output 04" }
  - { name: DO_04, dir: out, offset: 0, format: "bit:12", init: false, desc: "slot 1 output 05" }
  - { name: DO_05, dir: out, offset: 0, format: "bit:13", init: false, desc: "slot 1 output 06" }
  - { name: DO_06, dir: out, offset: 0, format: "bit:14", init: false, desc: "slot 1 output 07" }
  - { name: DO_07, dir: out, offset: 0, format: "bit:15", init: false, desc: "slot 1 output 08" }
  - { name: DO_08, dir: out, offset: 0, format: "bit:0",  init: false, desc: "slot 1 output 09" }
  - { name: DO_09, dir: out, offset: 0, format: "bit:1",  init: false, desc: "slot 1 output 10" }
  - { name: DO_10, dir: out, offset: 0, format: "bit:2",  init: false, desc: "slot 1 output 11" }
  - { name: DO_11, dir: out, offset: 0, format: "bit:3",  init: false, desc: "slot 1 output 12" }
  - { name: DO_12, dir: out, offset: 0, format: "bit:4",  init: false, desc: "slot 1 output 13" }
  - { name: DO_13, dir: out, offset: 0, format: "bit:5",  init: false, desc: "slot 1 output 14" }
  - { name: DO_14, dir: out, offset: 0, format: "bit:6",  init: false, desc: "slot 1 output 15" }
  - { name: DO_15, dir: out, offset: 0, format: "bit:7",  init: false, desc: "slot 1 output 16 — heartbeat" }
  # The driver's own status, for bench.st's hold-until-acknowledged
  # (lib/io_hold.st): no bytes of either image behind these.
  - { name: AXC__Online, status: online }
  - { name: AXC__Outages, status: outages }
  - { name: AXC__WatchdogTrips, status: watchdog-trips }
