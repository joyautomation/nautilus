# The device map for this example plant — the ONE hand-written input to
# `naut modbus import`. Three generic device types: an Omron-style PID
# temperature controller behind a Modbus TCP gateway carrying two loops on
# two unit-ids, a VFD, and a four-channel gas analyser. Register maps are
# datasheet-shaped; scaling and word order live here, once per type, not
# per instance. The schema is documented in modbus/codegen/devicemap.go.
#
# Regenerate the committed files with:
#   naut modbus import --map devices.yaml
devices:
  temp-controller:
    description: PID temperature controller behind a Modbus TCP gateway
    scan-class: slow
    registers:
      - {tag: Tpv, address: 0, format: int32, scale: 0.1, unit: degC, desc: process temperature}
      - {tag: MV, address: 8, format: int32, scale: 0.1, unit: "%", desc: PID output}
      - {tag: Tsp, address: 262, format: int32, scale: 0.1, writable: true, rewrite: 2.5s, init: 0.0, unit: degC, desc: temperature setpoint}
      - {tag: AlmH, address: 12, table: discrete, desc: high temperature alarm}
  vfd:
    description: variable-frequency drive on the main fan
    registers:
      - {tag: Status, address: 2000, desc: status word}
      - {tag: Running, address: 2000, format: "bit:1", desc: running bit of the status word}
      - {tag: Spv, address: 2001, format: int16, scale: 0.01, unit: Hz, desc: actual speed}
      - {tag: Control, address: 2100, writable: true, write-only: true, init: 0.0, desc: control word}
      - {tag: Ssp, address: 2101, format: int16, scale: 0.01, writable: true, rewrite: 1s, init: 0.0, unit: Hz, desc: speed setpoint}
  analyser:
    description: four-channel gas analyser
    word-order: little
    timeout: 2s
    max-block: 64
    registers:
      - {tag: CH1, address: 0, format: float32, unit: ppm, desc: channel 1}
      - {tag: CH2, address: 2, format: float32, unit: ppm, desc: channel 2}
      - {tag: CH3, address: 4, format: float32, unit: ppm, desc: channel 3}
      - {tag: CH4, address: 6, format: float32, unit: ppm, desc: channel 4}
      - {tag: Flow, address: 0, table: input, format: float32, unit: "L/min", desc: sample flow}
# Unit ids are distinct across the whole plant, not just per host, so
# `naut modbus serve` can stand in for every device on ONE listener —
# the plain-TCP devices (FAN, GAS) don't care what unit id they answer to.
instances:
  - {id: TC_A, type: temp-controller, host: 192.168.10.10, unit-id: 1, enable-tag: CFG_HeatersOn, desc: zone A loop}
  - {id: TC_B, type: temp-controller, host: 192.168.10.10, unit-id: 2, enable-tag: CFG_HeatersOn, desc: zone B loop}
  - {id: FAN, type: vfd, host: 192.168.10.24, unit-id: 3, scan-class: fast, desc: main fan}
  - {id: GAS, type: analyser, host: 192.168.10.51, unit-id: 4, desc: stack analyser}
