# examples/modbus — a generic three-device plant polled over Modbus TCP:
# two PID temperature loops behind one gateway (unit-ids 1 and 2), a VFD,
# and a four-channel gas analyser.
#
#   naut modbus import --map devices.yaml     regenerate the committed
#                                                 manifest + tag file
#   naut test -m memory.yaml .                logic-only acceptance tests
#   naut modbus serve --manifest modbus_manifest.yaml --values seed.json
#                                                 stand in for the devices
#   naut run .                                poll them for real (the
#                                                 modbus driver is wired in)
#
name: modbus-plant

server:
  addr: "localhost:8080"

tasks:
  - program: plant.st
    scan: 250ms

# tags/modbus.yaml is GENERATED from devices.yaml — do not hand-edit it;
# re-run the import instead.
tag-files:
  - tags/modbus.yaml

# Hand-authored tags stay where a person edits them.
tags:
  - { name: CFG_HeatersOn, role: setpoint, init: true, desc: "Enable the TC_A/TC_B sources (manifest enable: tag)" }
  - { name: TspCmd, role: setpoint, init: 180.0, unit: "degC", desc: "Operator temperature setpoint, both zones" }
  - { name: FanCmd, role: setpoint, init: 30.0, unit: "Hz", desc: "Operator fan speed command" }
  - { name: AvgPPM, role: state, init: 0.0, unit: "ppm", desc: "Average of the analyser channels" }
  - { name: TErr, role: state, init: 0.0, unit: "degC", desc: "Zone A control error" }
  - { name: HighAlm, role: state, init: false, desc: "Average concentration high" }

driver:
  type: modbus
  manifest: modbus_manifest.yaml
  scan-rate: 1s
  scan-classes: { fast: 500ms, slow: 2.5s }
