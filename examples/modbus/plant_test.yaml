# Acceptance tests for plant.st — logic only, virtual time, no socket:
#
#   naut test -m memory.yaml .       on any build
#   naut test .                      once the loader knows driver modbus
#
# `given:` writes the driver's input image directly — exactly what a block
# read would leave behind — so these tests are the same against the memory
# driver and against the real one. plant.st reads every GAS channel and
# TC_A_Tpv unconditionally, so every test seeds that full baseline before
# its first scan; drop one and `naut test -v` shows the read fault.

tolerance: 0.001

tests:
  - name: analyser average and the high alarm drive the fan control word
    given: { GAS_CH1: 100.0, GAS_CH2: 200.0, GAS_CH3: 300.0, GAS_CH4: 400.0, TC_A_Tpv: 175.0 }
    steps:
      - scans: 1
        expect: { AvgPPM: 250.0, HighAlm: false, FAN_Control: 0.0 }
      - given: { GAS_CH4: 600.0 }
        scans: 1
        expect: { AvgPPM: 300.0, HighAlm: true, FAN_Control: 1.0 }
      - given: { GAS_CH4: 400.0 }
        scans: 1
        expect: { HighAlm: false, FAN_Control: 0.0 }

  - name: operator setpoints reach the writable bindings
    given: { GAS_CH1: 0.0, GAS_CH2: 0.0, GAS_CH3: 0.0, GAS_CH4: 0.0,
             TC_A_Tpv: 175.0, TspCmd: 185.0, FanCmd: 42.5 }
    steps:
      - scans: 1
        expect: { TC_A_Tsp: 185.0, TC_B_Tsp: 185.0, FAN_Ssp: 42.5, TErr: 10.0 }
      - given: { TspCmd: 190.0 }
        scans: 1
        expect: { TC_A_Tsp: 190.0, TC_B_Tsp: 190.0, TErr: 15.0 }
