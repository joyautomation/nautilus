<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🛢️</text></svg>" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>nautilus HMI demo</title>
		%sveltekit.head%
		<script>
			// Pre-paint theme stamp: read the saved choice and put it on <html>
			// BEFORE the first paint, so a dark HMI never flashes white on load.
			// The kit's `theme` store reads the same key and agrees with this.
			// The default is dark — the ops-room-at-03:00 case.
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
