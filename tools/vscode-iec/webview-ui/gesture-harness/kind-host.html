<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Host page for the kind editor's gesture harness (kind.test.mjs).
		     Stands in for the extension's webview shell (src/kindEditor.ts):
		     <body data-scene-mode="kind"> mounts the kind editor from the SAME
		     production scene-editor bundle, and this page performs the host side
		     of the message protocol. No CSP, no acquireVsCodeApi, so vscodeApi.ts's
		     fallback captures every posted message on window.__POSTED__. -->
		<title>kind gesture harness</title>
		<link rel="stylesheet" href="./scene-editor.css" />
		<style>
			html, body { margin: 0; height: 100%; }
			#app { height: 100vh; }
		</style>
	</head>
	<body data-scene-mode="kind">
		<div id="app"></div>
		<script>
			window.__POSTED__ = [];
			window.__deliver = (msg) => window.postMessage(msg, '*');
			window.__posted = () => window.__POSTED__;
			window.__ops = () => window.__POSTED__.filter((m) => m && m.type === 'kindOp').map((m) => m.op);
			window.__reset = () => { window.__POSTED__.length = 0; };

			const vpCenter = (el) => {
				const r = el.getBoundingClientRect();
				return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: r.width, h: r.height, left: r.left, top: r.top };
			};
			window.__canvas = () => {
				const c = document.querySelector('.stage canvas');
				return c ? vpCenter(c) : null;
			};
			window.__labels = () =>
				Array.from(document.querySelectorAll('.stage .lbl')).map((l) => ({
					title: l.querySelector('b')?.textContent?.trim() ?? l.textContent.trim(), ...vpCenter(l)
				}));
			// The header's model state pill, the footer, the status preview.
			window.__state = () => document.querySelector('header .state')?.textContent.trim() ?? '';
			window.__footer = () => document.querySelector('footer')?.textContent.trim() ?? '';
			window.__status = () => document.querySelector('[data-kind=status-preview]')?.textContent.trim() ?? null;
			// A panel input by aria-label, with its value and centre.
			window.__field = (label) => {
				const i = document.querySelector('aside[aria-label=Kind] [aria-label="' + label + '"]');
				return i ? { value: i.type === 'checkbox' ? i.checked : i.value, tag: i.tagName, ...vpCenter(i) } : null;
			};
			// Drive rows: mesh + channel per row, and each row's own fields.
			window.__drives = () =>
				Array.from(document.querySelectorAll('[data-kind=drive-row]')).map((r) => ({
					mesh: r.querySelector('[aria-label=mesh]')?.value, channel: r.querySelector('[aria-label=channel]')?.value,
					fields: Array.from(r.querySelectorAll('[aria-label]')).map((f) => f.getAttribute('aria-label')),
					options: Array.from(r.querySelector('[aria-label=mesh]')?.options ?? []).map((o) => o.value)
				}));
			window.__button = (text) => {
				const b = Array.from(document.querySelectorAll('button')).find((x) => x.textContent.trim().startsWith(text));
				return b ? { active: b.classList.contains('active'), ...vpCenter(b) } : null;
			};
			window.__rotation = () => (window.__nxKind ? window.__nxKind.rotation() : null);
			window.__ready = () => !!document.querySelector('aside[aria-label=Kind]') && !!document.querySelector('.stage canvas');
		</script>
		<script src="./scene-editor.js"></script>
	</body>
</html>
