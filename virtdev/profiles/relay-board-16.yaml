maker: generic
model: 16 DI / 16 relay
version: 1
docs:
  - id: waveshare
    title: "Modbus POE ETH Relay 16CH, Waveshare wiki (the relay half's layout)"
    url: https://www.waveshare.com/wiki/Modbus_POE_ETH_Relay_16CH
protocol: modbus
modbus:
  unit-id: 1
points:
  - { name: "Relay{n}", type: BOOL, repeat: 16, table: coil, address: 0,  writable: true,
      desc: "Relay output {n} (FC 01/05/0F)", doc: "waveshare register table, coils 0x0000-0x000F" }
  - { name: "Input{n}", type: BOOL, repeat: 16, table: discrete, address: 0,
