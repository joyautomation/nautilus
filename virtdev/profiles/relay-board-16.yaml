notes: |
  A stand-in for a 16-in/16-out board whose exact model is not yet named: no
  public register map of such a board over Modbus TCP was found. Relays sit
  on coils 0-15 as on the Waveshare 16CH; inputs on discrete inputs 0-15 is
  the common convention, not a cited one. Replace with the real board's
  profile once it is known.
